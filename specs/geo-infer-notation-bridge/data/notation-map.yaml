# Notation-level mapping between fep_lean theorem proxies and the implemented
# GEO-INFER-ACT Active Inference surface.
#
# This file is documentation-level data: it records correspondence of symbols
# and constructs between the two repositories. It never claims that any
# GEO-INFER implementation is verified or proved by fep_lean, and no Lean
# proof claim is promoted by a notation row. Evidence planes stay distinct
# (see the GNN bridge charter, decision 4, and this slice's README).
#
# Entries are checked by specs/geo-infer-notation-bridge/check_geo_notation_bridge.py --check:
# every topic_id and symbol must exist in config/theorem_maturity.yaml, and
# every geo_anchor must match the strict
# `GEO-INFER-<MOD>/<repo-relative path>::<Symbol>` grammar.
schema_version: 1
entries:
- concept: variational free energy
  fep_lean:
    topic_id: fep-002
    symbol: fep002_vfe_ge_surprisal
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/free_energy.py::FreeEnergyCalculator
  correspondence: >-
    FreeEnergyCalculator.compute_categorical_free_energy computes F[q(s), o]
    as complexity (KL divergence from prior) minus accuracy and documents it
    as an upper bound on negative log evidence; fep-002 proves the same bound
    exactly for a surprisal-plus-KL variational free energy, with equality at
    the posterior. The correspondence is notational: the Lean theorem states
    the inequality; the Python class computes a numerical instance of it.
  reference: >-
    Friston (2010), "The free-energy principle: a unified brain theory?", Nature Reviews Neuroscience 11(7)
- concept: Fisher metric quadratic form on parameter tangents
  fep_lean:
    topic_id: fep-004
    symbol: fep004_fisherMetric_eq_zero_iff
  geo_anchor: GEO-INFER-MATH/src/geo_infer_math/core/information_theory/information_geometry.py::information_metric
  correspondence: >-
    information_metric evaluates the Fisher-metric line element
    ds^2 = sum_ij I_ij dtheta_i dtheta_j as sqrt(dtheta^T I dtheta), clamped
    nonnegative for a supplied Fisher matrix; fep-004 proves the finite
    diagonal Fisher metric is symmetric and positive semidefinite under
    nonnegative information weights, positive definite under strictly
    positive weights, and characterizes exactly when its tangent norm
    vanishes. Correspondence of the Fisher-metric quadratic form; the Python
    function evaluates a supplied matrix and derives no metric from a
    statistical family.
  reference: >-
    Amari (2016), "Information Geometry and Its Applications", Springer
- concept: deterministic selection of an expected-free-energy minimizer
  fep_lean:
    topic_id: fep-008
    symbol: fep008_exists_minG
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/runners/closed_loop.py::run_closed_loop
  correspondence: >-
    run_closed_loop drives the gnn-geo-infer/1 contract, whose pymdp step
    selects the action with the largest policy posterior over a finite,
    nonempty set of one-step policies; fep-008 proves that a real-valued
    objective attains a minimum on such a set and that all minimizers agree
    in value. Correspondence of the finite minimizer construct; habit
    weighting and tie-breaking order are outside the row.
  reference: >-
    Friston, FitzGerald, Rigoli, Schwartenbeck & Pezzulo (2017), "Active inference: a process theory", Neural Computation 29(1)
- concept: entropy-regularized policy cost
  fep_lean:
    topic_id: fep-012
    symbol: fep012_entropyRegularizedCost_le_expectedCost
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/policy_selection.py::PolicySelector
  correspondence: >-
    PolicySelector balances exploitation against exploration through a
    temperature parameter over expected free energy; fep-012 states the exact
    entropy-regularized inequality that at nonnegative temperature a
    temperature-weighted expected cost lowers by exactly the policy's entropy
    reward. The mapping is notation-level only.
  reference: >-
    Parr, Pezzulo & Friston (2022), Active Inference, MIT Press
- concept: risk as KL divergence of predicted outcomes from the preference law
  fep_lean:
    topic_id: fep-014
    symbol: fep014_kl_nonneg
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/efe_decomposition.py::one_step_policy_terms
  correspondence: >-
    one_step_policy_terms computes each one-step policy's risk as the finite
    KL divergence of its predicted outcome law from the preference law
    softmax(C), alongside ambiguity and pymdp 1.0.3's own score; fep-014
    proves Mathlib KL divergence nonnegative and zero exactly on equal finite
    measures. Correspondence of the KL risk construct only. The exact
    instance-level identity relating risk plus ambiguity to the pymdp score
    is proved separately in specs/cascadia-geo-act-proof, not by this row.
  reference: >-
    Da Costa, Parr, Sajid, Veselic, Neacsu & Friston (2020), "Active inference on discrete state-spaces: a synthesis", Journal of Mathematical Psychology 99
- concept: posterior reconstruction under belief updating
  fep_lean:
    topic_id: fep-017
    symbol: fep017_posterior_joint_reconstruction
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/belief_updating.py::BayesianBeliefUpdate
  correspondence: >-
    BayesianBeliefUpdate implements categorical belief updating from a
    likelihood and a prior; fep-017 proves that Mathlib's posterior Markov
    kernel composed with the predictive law reconstructs the swapped
    prior-likelihood joint law. Correspondence of the Bayesian update
    construct; no numerical-agreement claim is made.
  reference: >-
    Parr, Pezzulo & Friston (2022), Active Inference, MIT Press
- concept: Fisher-Rao distance between parameter points
  fep_lean:
    topic_id: fep-018
    symbol: fep018_fisherRaoDistance_eq_zero_iff
  geo_anchor: GEO-INFER-MATH/src/geo_infer_math/core/information_theory/information_geometry.py::geodesic_distance
  correspondence: >-
    geodesic_distance measures the Fisher-metric path length between two
    parameter points theta1 and theta2 by integrating the information_metric
    line element ds = sqrt(dtheta^T I dtheta) along the straight segment;
    fep-018 proves the closed-form Bernoulli Fisher-Rao coordinate distance
    is nonnegative, symmetric, separating on [0,1], and satisfies the
    triangle inequality. Correspondence of the Fisher-metric distance
    construct between parameter points; the Python function is a straight-
    line integration approximation (n_steps steps) and claims none of the
    metric axioms; the exact closed-form Bernoulli distance has no upstream
    implementation.
  reference: >-
    Amari & Nagaoka (2000), "Methods of Information Geometry", AMS/Oxford
- concept: expected free energy as pragmatic cost minus epistemic value
  fep_lean:
    topic_id: fep-021
    symbol: fep021_efe_epistemic_balance
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/policy_selection.py::PolicySelector
  correspondence: >-
    PolicySelector documents its objective as expected free energy balancing
    exploration (epistemic value) and exploitation (pragmatic value);
    fep-021 defines expected free energy exactly as pragmatic expected cost
    minus epistemic information value and states its monotonicity. The
    symbols correspond; the Python selection loop is not a Lean proof.
  reference: >-
    Parr & Friston (2018), "The anatomy of choice: active inference and decision-making", Neuropsychologia
- concept: row-normalized transition kernel under stationary probability current
  fep_lean:
    topic_id: fep-025
    symbol: fep025_transitionCurrent_stationary
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/markov_decision_process.py::MarkovDecisionProcess
  correspondence: >-
    MarkovDecisionProcess validates every per-action transition slice
    P[s, :, a] as finite, nonnegative, and summing to one; fep-025 takes
    exactly such row-normalized transition rows (its hrow hypothesis),
    together with a stationary real mass vector, and derives zero divergence
    of the probability current pi_i P_ij - pi_j P_ji at every state. The
    correspondence is limited to the row-normalized kernel: the Python class
    computes no stationary law and no probability current.
  reference: >-
    Schnakenberg (1976), "Network theory of microscopic and macroscopic behavior of master equation systems", Reviews of Modern Physics 48(4)
- concept: softmax policy weights
  fep_lean:
    topic_id: fep-028
    symbol: fep028_softmax_sum_univ
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/policy_selection.py::PolicySelector
  correspondence: >-
    PolicySelector turns policy scores into a normalized selection
    distribution via a temperature softmax; fep-028 proves that
    exponentiated policy scores on a nonempty support form a nonnegative
    weight vector summing to one. Notation-level correspondence of the
    softmax construct.
  reference: >-
    Parr, Pezzulo & Friston (2022), Active Inference, MIT Press
- concept: Gibbs preference law from log-preferences
  fep_lean:
    topic_id: fep-031
    symbol: fep031_gibbsProbability_sum_one
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/efe_decomposition.py::preference_law
  correspondence: >-
    preference_law maps GNN log-preferences C to softmax(C), the Gibbs law
    with energies -C at unit inverse temperature; fep-031 proves that
    positive exponential Gibbs weights normalize to a nonnegative mass
    function summing to one on a nonempty finite support. Correspondence of
    the normalization construct; the Python function evaluates floats and
    claims no exactness.
  reference: >-
    Parr, Pezzulo & Friston (2022), Active Inference, MIT Press
- concept: Fisher information as log-likelihood curvature
  fep_lean:
    topic_id: fep-038
    symbol: fep038_fisherInformation_eq
  geo_anchor: GEO-INFER-MATH/src/geo_infer_math/core/information_theory/information_geometry.py::fisher_information_matrix
  correspondence: >-
    fisher_information_matrix computes the Fisher information matrix as the
    negated second derivative of the log-likelihood by finite differences;
    fep-038 proves the differentiated Bernoulli family has zero expected
    score and Fisher information 1/(p(1-p)), with inverse-metric duality
    defining the natural gradient. Correspondence of the Fisher-information
    construct at the curvature-definition level; the Python routine computes
    the observed pointwise matrix numerically and implements neither the
    expected-score law nor the natural-gradient duality.
  reference: >-
    Amari (2016), "Information Geometry and Its Applications", Springer
- concept: Markov blanket factorization
  fep_lean:
    topic_id: fep-079
    symbol: fep079_blanketFactorization_iff_conditionalMutualInformation_zero
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/generative_model.py::MarkovBlanket
  correspondence: >-
    MarkovBlanket models the internal, sensory, and active partition of a
    generative model; fep-079 proves the conditional-mutual-information
    characterization of internal-external factorization on a finite
    conditional-blanket carrier. Correspondence of the blanket construct; the
    Python class carries structure, the Lean row carries the exact
    factorization criterion.
  reference: >-
    Friston (2013), "Life as we know it", Journal of the Royal Society Interface 10(86)
- concept: coupled subsystem blanket composition
  fep_lean:
    topic_id: fep-081
    symbol: fep081_coupledSubsystem_blanketComposition
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/generative_model.py::HierarchicalLevel
  correspondence: >-
    HierarchicalLevel composes coupled levels of a hierarchical generative
    model; fep-081 proves that two conditionally factorized subsystems retain
    zero paired-row mutual information under an arbitrarily coupled joint
    blanket law. Correspondence of the composition construct only.
  reference: >-
    Friston (2013), "Life as we know it", Journal of the Royal Society Interface 10(86)
- concept: generalized filtering correction step
  fep_lean:
    topic_id: fep-090
    symbol: fep090_finiteJet_generalizedFiltering_correctionEquation
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/variational_inference.py::VariationalInference
  correspondence: >-
    VariationalInference implements iterative variational updating of beliefs
    given a model and observations; fep-090 states the exact finite-jet
    generalized-filtering Euler step (current coordinate plus truncated shift
    minus the certified quadratic energy gradient) on generalized
    coordinates. Correspondence of the inference-step construct; no
    trajectory-agreement claim.
  reference: >-
    Friston, Stephan, Li & Daunizeau (2010), "Generalised filtering", Mathematical Biosciences 227(2)
- concept: policy-tree value recursion
  fep_lean:
    topic_id: fep-128
    symbol: fep128_policyTreeValue_node
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/active_inference.py::ActiveInferenceModel
  correspondence: >-
    ActiveInferenceModel steps perception and policy evaluation through an
    environment model; fep-128 states the exact recursion that a finite
    policy-tree node equals its stage cost plus the observation-law weighted
    values of observation-contingent continuations. Correspondence of the
    value-recursion construct; the simulator is not a proof.
  reference: >-
    Parr & Friston (2018), "The anatomy of choice: active inference and decision-making", Neuropsychologia
- concept: expected free energy as risk plus ambiguity
  fep_lean:
    topic_id: fep-133
    symbol: fep133_policyTree_efe_eq_risk_add_ambiguity
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/markov_decision_process.py::MarkovDecisionProcess
  correspondence: >-
    MarkovDecisionProcess carries the policy-evaluation environment used by
    the Act surface; fep-133 proves that the one-step full-support
    expected-free-energy identity (risk plus ambiguity) lifts through every
    branch of a finite policy tree. Correspondence of the decomposition;
    numerical agreement is owned by certificate comparisons, not notation.
  reference: >-
    Parr, Pezzulo & Friston (2022), Active Inference, MIT Press
- concept: Boltzmann control posterior over expected free energy
  fep_lean:
    topic_id: fep-156
    symbol: fep156_boltzmann_control_posterior_minimizes_efe
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/policy_selection.py::PolicySelector
  correspondence: >-
    PolicySelector.compose_policy_posterior forms q(pi) as the softmax of
    -gamma * G plus the log habit prior divided by prior_temperature; at
    prior_temperature 1 this is the Boltzmann control posterior proportional
    to prior(pi) * exp(-gamma * G(pi)). fep-156 proves that for fixed
    precision gamma > 0 and a strictly positive prior on a finite policy
    carrier this posterior is the unique minimizer of expected EFE plus
    gamma^-1 KL to the prior. Notation-level correspondence of the posterior
    construct; the Python method is not claimed to minimize anything.
  reference: >-
    Parr, Pezzulo & Friston (2022), Active Inference, MIT Press
- concept: perception update as forward filter
  fep_lean:
    topic_id: fep-157
    symbol: fep157_filteredBelief_eq_forwardFilter
  geo_anchor: GEO-INFER-ACT/src/geo_infer_act/core/markov_decision_process.py::MarkovDecisionProcess
  correspondence: >-
    MarkovDecisionProcess.update_belief multiplies a prior belief by the
    observation likelihood P(o|s) and renormalizes (Bayes' rule on a finite
    state space); fep-157 proves that the perception-action loop's filtered
    belief, under positive predictive evidence for the outcome, is exactly the
    identity-transition forward filter of the temporal-inference layer.
    Correspondence of the finite Bayes filtering step only; no
    numerical-agreement claim is made.
  reference: >-
    Parr, Pezzulo & Friston (2022), Active Inference, MIT Press
- concept: Bayes-odds evidence weight between models
  fep_lean:
    topic_id: fep-158
    symbol: fep158_reduction_posterior_odds
  geo_anchor: GEO-INFER-MATH/src/geo_infer_math/integration/bayes/model_selection.py::ModelSelection
  correspondence: >-
    ModelSelection.bayes_factor computes the log Bayes odds
    log B_12 = log p(D|M_1) - log p(D|M_2) and its exponential weight;
    fep-158's reduction Bayes-odds law expresses the reduced-model posterior
    as the full posterior multiplied by exactly such an evidence weight
    between the full and evidence-masked models. Correspondence is limited
    to the Bayes-odds evidence-weight term: the Python class performs
    generic model comparison from supplied log evidences; it implements no
    evidence masking, no free-energy monotonicity, and no posterior
    reconstruction.
  reference: >-
    Friston & Penny (2011), "Post hoc Bayesian model selection", NeuroImage 56(4)
