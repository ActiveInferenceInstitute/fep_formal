- id: fep-007
  title: Normalized Finite Sum-Product Message
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - Algebra.BigOperators.Group.Finset
  mathlib_status: real
  primary_theorem: fep007_normalizedMessage_sum_one
  supporting_theorems:
  - fep007_factorProduct_nonneg
  - fep007_message_agg_nonneg
  - fep007_message_agg_mono
  - fep007_zero_msg
  - fep007_messageNormalizer_pos
  - fep007_normalizedMessage_nonneg
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Strictly positive local factors and incoming messages over a nonempty finite neighbor support define a nonnegative
    normalized sum-product message with support mass exactly one. Assumption scope: Normalization requires a nonempty selected
    support and strict positivity of every factor and incoming message on it. The message is zero outside that support. This
    is one exact local update, not loopy-belief-propagation convergence or global marginal correctness. Semantic disposition:
    `formalized`.

    '
  assumption_review: Normalization requires a nonempty selected support and strict positivity of every factor and incoming
    message on it. The message is zero outside that support. This is one exact local update, not loopy-belief-propagation
    convergence or global marginal correctness.
  non_vacuity: Singleton and multi-neighbor supports produce positive normalizers; unequal factor-message products yield a
    genuinely nonuniform normalized message.
  acceptance_probe: native Lean compile of fep007_messageNormalizer_pos, fep007_normalizedMessage_nonneg, and fep007_normalizedMessage_sum_one.
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.Algebra.BigOperators.Field\nimport\
    \ Mathlib.Algebra.Order.BigOperators.Group.Finset\nimport Mathlib.Basic.Real.Basic\n\nnamespace FEP007\n\nopen Finset\n\
    \n-- [proof strategy: mul_nonneg / Finset.sum_nonneg for positivity; Finset.sum_le_sum for monotone updates]\n\nabbrev\
    \ Node := Fin 8\n\n/-- Belief propagation: local potential products stay nonnegative when factors are. -/\ntheorem fep007_factorProduct_nonneg\
    \ (ψ : Node → Node → ℝ) (i j : Node)\n    (hψ : 0 ≤ ψ i j) (hj : 0 ≤ ψ j i) : 0 ≤ ψ i j * ψ j i := by\n  exact mul_nonneg\
    \ hψ hj\n\n/-- Message aggregation: sum of factor-weighted messages stays nonneg. -/\ntheorem fep007_message_agg_nonneg\
    \ (ψ : Node → Node → ℝ) (msg : Node → ℝ)\n    (N : Finset Node) (i : Node)\n    (hψ : ∀ j, 0 ≤ ψ i j) (hm : ∀ j, 0 ≤ msg\
    \ j) :\n    0 ≤ ∑ j ∈ N, ψ i j * msg j :=\n  Finset.sum_nonneg fun j _ => mul_nonneg (hψ j) (hm j)\n\n/-- Monotonicity:\
    \ stronger messages → stronger aggregate. -/\ntheorem fep007_message_agg_mono (ψ : Node → Node → ℝ) (m₁ m₂ : Node → ℝ)\n\
    \    (N : Finset Node) (i : Node)\n    (hψ : ∀ j, 0 ≤ ψ i j) (h : ∀ j ∈ N, m₁ j ≤ m₂ j) :\n    ∑ j ∈ N, ψ i j * m₁ j ≤\
    \ ∑ j ∈ N, ψ i j * m₂ j :=\n  Finset.sum_le_sum fun j hj => mul_le_mul_of_nonneg_left (h j hj) (hψ j)\n\n/-- Zero messages\
    \ yield zero aggregate (absorbing behavior). -/\ntheorem fep007_zero_msg (ψ : Node → Node → ℝ) (N : Finset Node) (i :\
    \ Node) :\n    ∑ j ∈ N, ψ i j * (0 : ℝ) = 0 := by simp\n\n/-- Positive unnormalized sum-product weight sent from neighbor\
    \ `j` to node\n`i`. -/\ndef fep007_unnormalizedMessage\n    (ψ : Node → Node → ℝ) (incoming : Node → ℝ)\n    (i j : Node)\
    \ : ℝ :=\n  ψ i j * incoming j\n\n/-- Normalizing constant over a selected finite neighbor support. -/\ndef fep007_messageNormalizer\n\
    \    (ψ : Node → Node → ℝ) (incoming : Node → ℝ)\n    (neighbors : Finset Node) (i : Node) : ℝ :=\n  ∑ j ∈ neighbors,\
    \ fep007_unnormalizedMessage ψ incoming i j\n\n/-- A normalized finite belief-propagation message, extended by zero outside\n\
    the selected support. -/\nnoncomputable def fep007_normalizedMessage\n    (ψ : Node → Node → ℝ) (incoming : Node → ℝ)\n\
    \    (neighbors : Finset Node) (i j : Node) : ℝ :=\n  if j ∈ neighbors then\n    fep007_unnormalizedMessage ψ incoming\
    \ i j /\n      fep007_messageNormalizer ψ incoming neighbors i\n  else 0\n\n/-- Strictly positive factors and incoming\
    \ messages give a positive\nnormalizer on every nonempty support. -/\ntheorem fep007_messageNormalizer_pos\n    (ψ : Node\
    \ → Node → ℝ) (incoming : Node → ℝ)\n    (neighbors : Finset Node) (i : Node)\n    (hne : neighbors.Nonempty)\n    (hψ\
    \ : ∀ j ∈ neighbors, 0 < ψ i j)\n    (hincoming : ∀ j ∈ neighbors, 0 < incoming j) :\n    0 < fep007_messageNormalizer\
    \ ψ incoming neighbors i := by\n  exact Finset.sum_pos\n    (fun j hj => mul_pos (hψ j hj) (hincoming j hj)) hne\n\n/--\
    \ Normalized messages are nonnegative everywhere. -/\ntheorem fep007_normalizedMessage_nonneg\n    (ψ : Node → Node →\
    \ ℝ) (incoming : Node → ℝ)\n    (neighbors : Finset Node) (i j : Node)\n    (hne : neighbors.Nonempty)\n    (hψ : ∀ k\
    \ ∈ neighbors, 0 < ψ i k)\n    (hincoming : ∀ k ∈ neighbors, 0 < incoming k) :\n    0 ≤ fep007_normalizedMessage ψ incoming\
    \ neighbors i j := by\n  classical\n  by_cases hj : j ∈ neighbors\n  · rw [fep007_normalizedMessage, ite_eq_left hj]\n\
    \    exact div_nonneg\n      (mul_nonneg (hψ j hj).le (hincoming j hj).le)\n      (fep007_messageNormalizer_pos\n    \
    \    ψ incoming neighbors i hne hψ hincoming).le\n  · simp [fep007_normalizedMessage, hj]\n\n/-- A normalized message\
    \ has total mass one on its selected support. -/\ntheorem fep007_normalizedMessage_sum_one\n    (ψ : Node → Node → ℝ)\
    \ (incoming : Node → ℝ)\n    (neighbors : Finset Node) (i : Node)\n    (hne : neighbors.Nonempty)\n    (hψ : ∀ j ∈ neighbors,\
    \ 0 < ψ i j)\n    (hincoming : ∀ j ∈ neighbors, 0 < incoming j) :\n    ∑ j ∈ neighbors,\n      fep007_normalizedMessage\
    \ ψ incoming neighbors i j = 1 := by\n  classical\n  have hden : fep007_messageNormalizer ψ incoming neighbors i ≠ 0 :=\n\
    \    ne_of_gt (fep007_messageNormalizer_pos\n      ψ incoming neighbors i hne hψ hincoming)\n  calc\n    ∑ j ∈ neighbors,\n\
    \        fep007_normalizedMessage ψ incoming neighbors i j =\n        ∑ j ∈ neighbors,\n          fep007_unnormalizedMessage\
    \ ψ incoming i j /\n            fep007_messageNormalizer ψ incoming neighbors i := by\n      apply Finset.sum_congr rfl\n\
    \      intro j hj\n      simp [fep007_normalizedMessage, hj]\n    _ = fep007_messageNormalizer ψ incoming neighbors i\
    \ /\n        fep007_messageNormalizer ψ incoming neighbors i := by\n      rw [← Finset.sum_div]\n      rfl\n    _ = 1\
    \ := div_self hden\n\nend FEP007\n"
  latex_equations:
  - '\begin{aligned}

    &(\psi{} : \mathsf{Node} \Rightarrow \mathsf{Node} \Rightarrow \mathbb{R})\,(i\,j : \mathsf{Node})\,(h\psi{} : 0 \le \psi{}\,i\,j)\,(\mathsf{hj}
    : 0 \le \psi{}\,j\,i) \\

    &0 \le \psi{}\,i\,j \cdot \psi{}\,j\,i

    \end{aligned}'
  - '\begin{aligned}

    &(\psi{} : \mathsf{Node} \Rightarrow \mathsf{Node} \Rightarrow \mathbb{R})\,(\mathsf{msg} : \mathsf{Node} \Rightarrow
    \mathbb{R})\,(N : \mathsf{Finset}\,\mathsf{Node})\,(i : \mathsf{Node}) \\

    &(h\psi{} : \forall j, 0 \le \psi{}\,i\,j)\,(\mathsf{hm} : \forall j, 0 \le \mathsf{msg}\,j) \\

    &0 \le \sum j \in N, \psi{}\,i\,j \cdot \mathsf{msg}\,j

    \end{aligned}'
  - '\begin{aligned}

    &(\psi{} : \mathsf{Node} \Rightarrow \mathsf{Node} \Rightarrow \mathbb{R})\,(m_{1}\,m_{2} : \mathsf{Node} \Rightarrow
    \mathbb{R})\,(N : \mathsf{Finset}\,\mathsf{Node})\,(i : \mathsf{Node}) \\

    &(h\psi{} : \forall j, 0 \le \psi{}\,i\,j)\,(h : \forall j \in N, m_{1}\,j \le m_{2}\,j) \\

    &\sum j \in N, \psi{}\,i\,j \cdot m_{1}\,j \le \sum j \in N, \psi{}\,i\,j \cdot m_{2}\,j

    \end{aligned}'
  - '\begin{aligned}

    &(\psi{} : \mathsf{Node} \Rightarrow \mathsf{Node} \Rightarrow \mathbb{R})\,(N : \mathsf{Finset}\,\mathsf{Node})\,(i :
    \mathsf{Node}) \\

    &\sum j \in N, \psi{}\,i\,j \cdot (0 : \mathbb{R}) = 0

    \end{aligned}'
  - '\begin{aligned}

    &(\psi{} : \mathsf{Node} \Rightarrow \mathsf{Node} \Rightarrow \mathbb{R})\,(\mathsf{incoming} : \mathsf{Node} \Rightarrow
    \mathbb{R})\,(\mathsf{neighbors} : \mathsf{Finset}\,\mathsf{Node})\,(i : \mathsf{Node}) \\

    &(\mathsf{hne} : \mathsf{neighbors.Nonempty})\,(h\psi{} : \forall j \in \mathsf{neighbors}, 0 < \psi{}\,i\,j) \\

    &(\mathsf{hincoming} : \forall j \in \mathsf{neighbors}, 0 < \mathsf{incoming}\,j) \\

    &0 < \mathsf{fep007\_messageNormalizer}\,\psi{}\,\mathsf{incoming}\,\mathsf{neighbors}\,i

    \end{aligned}'
  - '\begin{aligned}

    &(\psi{} : \mathsf{Node} \Rightarrow \mathsf{Node} \Rightarrow \mathbb{R})\,(\mathsf{incoming} : \mathsf{Node} \Rightarrow
    \mathbb{R})\,(\mathsf{neighbors} : \mathsf{Finset}\,\mathsf{Node}) \\

    &(i\,j : \mathsf{Node})\,(\mathsf{hne} : \mathsf{neighbors.Nonempty})\,(h\psi{} : \forall k \in \mathsf{neighbors}, 0
    < \psi{}\,i\,k) \\

    &(\mathsf{hincoming} : \forall k \in \mathsf{neighbors}, 0 < \mathsf{incoming}\,k) \\

    &0 \le \mathsf{fep007\_normalizedMessage}\,\psi{}\,\mathsf{incoming}\,\mathsf{neighbors}\,i\,j

    \end{aligned}'
  - '\begin{aligned}

    &(\psi{} : \mathsf{Node} \Rightarrow \mathsf{Node} \Rightarrow \mathbb{R})\,(\mathsf{incoming} : \mathsf{Node} \Rightarrow
    \mathbb{R})\,(\mathsf{neighbors} : \mathsf{Finset}\,\mathsf{Node})\,(i : \mathsf{Node}) \\

    &(\mathsf{hne} : \mathsf{neighbors.Nonempty})\,(h\psi{} : \forall j \in \mathsf{neighbors}, 0 < \psi{}\,i\,j) \\

    &(\mathsf{hincoming} : \forall j \in \mathsf{neighbors}, 0 < \mathsf{incoming}\,j) \\

    &\sum j \in \mathsf{neighbors}, \mathsf{fep007\_normalizedMessage}\,\psi{}\,\mathsf{incoming}\,\mathsf{neighbors}\,i\,j
    = 1

    \end{aligned}'
- id: fep-008
  title: Finite Policy Objective Minimizer
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - Data.Finset.Basic
  - Order.Bounds.Basic
  mathlib_status: real
  primary_theorem: fep008_exists_minG
  supporting_theorems:
  - fep008_min_agrees_on_value
  - fep008_exists_maxG
  - fep008_min_is_lb
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A real-valued objective attains a minimum on a finite nonempty policy set. Assumption scope: Existence requires only
    a finite nonempty policy set and an explicit real-valued objective. The theorem does not claim uniqueness of the policy;
    it separately proves that all minimizers agree in value. Semantic disposition: `formalized`.

    '
  assumption_review: Existence requires only a finite nonempty policy set and an explicit real-valued objective. The theorem
    does not claim uniqueness of the policy; it separately proves that all minimizers agree in value.
  non_vacuity: A policy set with at least two policies and unequal objective values has a genuine selected minimizer; tied
    objectives exercise nonunique policies with equal minimum value.
  acceptance_probe: native Lean compile of fep008_exists_minG, fep008_min_agrees_on_value, and fep008_exists_maxG on finite
    nonempty policy sets.
  lean_sketch: "import Mathlib.Data.Finset.Basic\nimport Mathlib.Data.Finset.Max\nimport Mathlib.Basic.Real.Basic\nimport\
    \ Mathlib.Order.Bounds.Basic\n\nnamespace FEP008\n\nabbrev Policy := Fin 14\n\n/-- Discrete active inference: some policy\
    \ minimizes expected free energy on a finite set. -/\ntheorem fep008_exists_minG (policies : Finset Policy) (hne : policies.Nonempty)\
    \ (G : Policy → ℝ) :\n    ∃ p ∈ policies, ∀ p' ∈ policies, G p ≤ G p' :=\n  Finset.exists_min_image policies G hne\n\n\
    /-- Any two policy minimizers attain the same value (uniqueness of the minimum). -/\ntheorem fep008_min_agrees_on_value\
    \ (policies : Finset Policy) (_hne : policies.Nonempty) (G : Policy → ℝ)\n    (p p' : Policy) (hp : p ∈ policies) (hp'\
    \ : p' ∈ policies)\n    (hmin : ∀ p'' ∈ policies, G p ≤ G p'') (hmin' : ∀ p'' ∈ policies, G p' ≤ G p'') :\n    G p = G\
    \ p' :=\n  le_antisymm (hmin p' hp') (hmin' p hp)\n\n/-- Dual: some policy maximizes expected value on a finite nonempty\
    \ set. -/\ntheorem fep008_exists_maxG (policies : Finset Policy) (hne : policies.Nonempty) (G : Policy → ℝ) :\n    ∃ p\
    \ ∈ policies, ∀ p' ∈ policies, G p' ≤ G p :=\n  Finset.exists_max_image policies G hne\n\n/-- Minimum is ≤ any evaluation\
    \ in the policy set. -/\ntheorem fep008_min_is_lb (policies : Finset Policy) (G : Policy → ℝ)\n    (p : Policy) (_hp :\
    \ p ∈ policies)\n    (hmin : ∀ p' ∈ policies, G p ≤ G p') :\n    ∀ p' ∈ policies, G p ≤ G p' := hmin\n\nend FEP008\n"
  latex_equations:
  - '\begin{aligned}

    &(\mathsf{policies} : \mathsf{Finset}\,\mathsf{Policy})\,(\mathsf{hne} : \mathsf{policies.Nonempty})\,(G : \mathsf{Policy}
    \Rightarrow \mathbb{R}) \\

    &\exists p \in \mathsf{policies}, \forall p'' \in \mathsf{policies}, G\,p \le G\,p''

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{policies} : \mathsf{Finset}\,\mathsf{Policy})\,(_hne : \mathsf{policies.Nonempty})\,(G : \mathsf{Policy} \Rightarrow
    \mathbb{R}) \\

    &(p\,p'' : \mathsf{Policy})\,(\mathsf{hp} : p \in \mathsf{policies})\,(\mathsf{hp}^{\prime} : p'' \in \mathsf{policies})
    \\

    &(\mathsf{hmin} : \forall p'''' \in \mathsf{policies}, G\,p \le G\,p'''')\,(\mathsf{hmin}^{\prime} : \forall p'''' \in
    \mathsf{policies}, G\,p'' \le G\,p'''') \\

    &G\,p = G\,p''

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{policies} : \mathsf{Finset}\,\mathsf{Policy})\,(\mathsf{hne} : \mathsf{policies.Nonempty})\,(G : \mathsf{Policy}
    \Rightarrow \mathbb{R}) \\

    &\exists p \in \mathsf{policies}, \forall p'' \in \mathsf{policies}, G\,p'' \le G\,p

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{policies} : \mathsf{Finset}\,\mathsf{Policy})\,(G : \mathsf{Policy} \Rightarrow \mathbb{R})\,(p : \mathsf{Policy})\,(_hp
    : p \in \mathsf{policies}) \\

    &(\mathsf{hmin} : \forall p'' \in \mathsf{policies}, G\,p \le G\,p'') \\

    &\forall p'' \in \mathsf{policies}, G\,p \le G\,p''

    \end{aligned}'
- id: fep-009
  title: Conditional Independence Laws
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Probability.Independence.Conditional
  mathlib_status: real
  primary_theorem: fep009_condIndep_symm
  supporting_theorems:
  - fep009_condIndep_bot_right
  - fep009_joint_product_nonneg
  - fep009_likelihood_mono
  - fep009_map_nonneg
  - fep009_empty_zero
  - fep009_union_le
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Conditional independence of two σ-algebras given a third is symmetric under Mathlib''s conditional-expectation-kernel
    definition. Assumption scope: Conditional on a standard Borel measurable space, a finite measure, a conditioning σ-algebra
    below the ambient one, and the stated conditional-independence relation. The theorem is a law of conditional independence,
    not a learned Markov-blanket factorization. Semantic disposition: `formalized`.

    '
  assumption_review: Conditional on a standard Borel measurable space, a finite measure, a conditioning σ-algebra below the
    ambient one, and the stated conditional-independence relation. The theorem is a law of conditional independence, not a
    learned Markov-blanket factorization.
  non_vacuity: fep009_condIndep_bot_right proves that every σ-algebra is conditionally independent of the trivial σ-algebra,
    so the relation is inhabited.
  acceptance_probe: native Lean compile of fep009_condIndep_symm and fep009_condIndep_bot_right.
  lean_sketch: "import Mathlib.Probability.Independence.Conditional\n\nnamespace FEP009\n\nopen MeasureTheory ProbabilityTheory\n\
    \nvariable {Ω : Type*} [mΩ : MeasurableSpace Ω] [StandardBorelSpace Ω]\n\n/-- Conditional independence of two σ-algebras\
    \ is symmetric. Mathlib's\ndefinition is built from a conditional-expectation kernel for a finite measure. -/\ntheorem\
    \ fep009_condIndep_symm\n    (m' m₁ m₂ : MeasurableSpace Ω) (hm' : m' ≤ mΩ)\n    (μ : @Measure Ω mΩ) [IsFiniteMeasure\
    \ μ]\n    (h : CondIndep m' m₁ m₂ hm' μ) :\n    CondIndep m' m₂ m₁ hm' μ :=\n  h.symm\n\n/-- Conditional independence\
    \ is inhabited: any σ-algebra is conditionally\nindependent of the trivial σ-algebra. -/\ntheorem fep009_condIndep_bot_right\n\
    \    (m' m₁ : MeasurableSpace Ω) (hm' : m' ≤ mΩ)\n    (μ : @Measure Ω mΩ) [IsFiniteMeasure μ] :\n    CondIndep m' m₁ ⊥\
    \ hm' μ :=\n  condIndep_bot_right m₁\n\nvariable {α β : Type*} [MeasurableSpace α] [MeasurableSpace β]\n\n-- [proof strategy:\
    \ zero_le for ENNReal; measure_mono for likelihood ordering]\n\n/-- Generative model: joint mass factors as product of\
    \ marginals (independence). -/\ntheorem fep009_joint_product_nonneg (μ : Measure α) (ν : Measure β) (s : Set α) (t : Set\
    \ β) :\n    0 ≤ μ s * ν t :=\n  bot_le\n\n/-- Likelihood monotonicity: larger sets yield larger likelihoods. -/\ntheorem\
    \ fep009_likelihood_mono {μ : Measure α} {s t : Set α} (h : s ⊆ t) :\n    μ s ≤ μ t :=\n  measure_mono h\n\n/-- Marginalization\
    \ via measure.map preserves non-negativity. -/\ntheorem fep009_map_nonneg (μ : Measure α) {f : α → β} (_hf : Measurable\
    \ f) (s : Set β) :\n    0 ≤ μ.map f s :=\n  bot_le\n\n/-- Likelihood on empty event is zero. -/\ntheorem fep009_empty_zero\
    \ (μ : Measure α) : μ ∅ = 0 :=\n  measure_empty\n\n/-- Union bound on likelihoods (subadditivity of generative model mass).\
    \ -/\ntheorem fep009_union_le (μ : Measure α) (s t : Set α) :\n    μ (s ∪ t) ≤ μ s + μ t :=\n  measure_union_le s t\n\n\
    end FEP009\n"
