- id: fep-010
  title: Detailed Balance Implies Invariance
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Probability.Kernel.Invariance
  mathlib_status: real
  primary_theorem: fep010_reversible_invariant
  supporting_theorems:
  - fep010_identity_reversible
  - fep010_identity_invariant
  - fep010_invariant_def
  - fep010_invariant_comp
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A Markov kernel satisfying measure-theoretic detailed balance leaves its reference measure invariant. Assumption scope:
    Conditional on Mathlib''s IsMarkovKernel instance and IsReversible flow equality over all measurable set pairs. This proves
    stationarity, not a path-space fluctuation theorem or convergence to equilibrium. Semantic disposition: `formalized`.

    '
  assumption_review: Conditional on Mathlib's IsMarkovKernel instance and IsReversible flow equality over all measurable set
    pairs. This proves stationarity, not a path-space fluctuation theorem or convergence to equilibrium.
  non_vacuity: fep010_identity_reversible and fep010_identity_invariant provide a concrete reversible Markov-kernel witness
    for every measure.
  acceptance_probe: native Lean compile of reversible-implies-invariant plus the identity-kernel reversibility and invariance
    witnesses.
  lean_sketch: "import Mathlib.Probability.Kernel.Invariance\n\nnamespace FEP010\n\nopen MeasureTheory ProbabilityTheory\n\
    \nvariable {α : Type*} [MeasurableSpace α]\n\n/-- Detailed balance in Mathlib's measure-kernel sense implies stationarity:\n\
    a reversible Markov kernel leaves its reference measure invariant. -/\ntheorem fep010_reversible_invariant (κ : Kernel\
    \ α α) (π : Measure α)\n    [IsMarkovKernel κ] (hrev : Kernel.IsReversible κ π) :\n    Kernel.Invariant κ π :=\n  hrev.invariant\n\
    \n/-- The identity Markov kernel is a concrete reversible witness for every\nmeasure: flow through two measurable sets\
    \ is symmetric. -/\ntheorem fep010_identity_reversible (π : Measure α) :\n    Kernel.IsReversible (Kernel.id : Kernel\
    \ α α) π := by\n  intro A B hA hB\n  simp [Kernel.id_apply, hA, hB, Set.inter_comm]\n\n/-- The identity-kernel witness\
    \ leaves every measure invariant. -/\ntheorem fep010_identity_invariant (π : Measure α) :\n    Kernel.Invariant (Kernel.id\
    \ : Kernel α α) π :=\n  fep010_reversible_invariant Kernel.id π (fep010_identity_reversible π)\n\n/-- Invariance is exactly\
    \ preservation by measure-kernel bind. -/\ntheorem fep010_invariant_def (κ : Kernel α α) (π : Measure α)\n    (hinv :\
    \ Kernel.Invariant κ π) :\n    π.bind κ = π :=\n  hinv.def\n\n/-- Composition preserves a common invariant measure. -/\n\
    theorem fep010_invariant_comp (κ η : Kernel α α) (π : Measure α)\n    (hκ : Kernel.Invariant κ π) (hη : Kernel.Invariant\
    \ η π) :\n    Kernel.Invariant (κ ∘ₖ η) π :=\n  hκ.comp hη\n\nend FEP010\n"
