- id: fep-041
  title: Expected Information Gain via Measure KL
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - InformationTheory.KullbackLeibler.Basic
  mathlib_status: real
  primary_theorem: fep041_expectedInformationGain_zero
  supporting_theorems:
  - fep041_informationGain_nonneg
  - fep041_informationGain_eq_zero_iff
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Information gain is native measure-valued KL divergence: it is nonnegative, separates finite posterior and prior measures,
    and its predictive expectation vanishes when observations leave the posterior unchanged almost everywhere. Assumption
    scope: KL separation requires finite measures. The zero expected-information theorem requires a sigma-finite prior and
    almost-everywhere posterior equality; it does not claim that every informative experiment has strictly positive expected
    gain. Semantic disposition: `formalized`.

    '
  assumption_review: KL separation requires finite measures. The zero expected-information theorem requires a sigma-finite
    prior and almost-everywhere posterior equality; it does not claim that every informative experiment has strictly positive
    expected gain.
  non_vacuity: An observation-independent posterior equal to the prior yields zero gain, while any unequal finite posterior/prior
    pair has nonzero KL by separation.
  acceptance_probe: native Lean compile of fep041_informationGain_nonneg, fep041_informationGain_eq_zero_iff, and fep041_expectedInformationGain_zero.
  lean_sketch: "import Mathlib.InformationTheory.KullbackLeibler.Basic\nimport Mathlib.MeasureTheory.Integral.Lebesgue.Countable\n\
    \nnamespace FEP041\n\nopen MeasureTheory\nopen scoped ENNReal\n\nvariable {Obs State : Type*}\nvariable [MeasurableSpace\
    \ Obs] [MeasurableSpace State]\n\n/-- Information gain is Mathlib's measure-valued Kullback--Leibler divergence\nfrom\
    \ a posterior law to its prior law. -/\nnoncomputable def fep041_informationGain\n    (posterior prior : Measure State)\
    \ : ℝ≥0∞ :=\n  InformationTheory.klDiv posterior prior\n\n/-- Information gain is nonnegative because KL divergence is\
    \ extended\nnonnegative-real valued. -/\ntheorem fep041_informationGain_nonneg (posterior prior : Measure State) :\n \
    \   0 ≤ fep041_informationGain posterior prior :=\n  bot_le\n\n/-- For finite measures, zero information gain characterizes\
    \ equality of the\nposterior and prior laws. -/\ntheorem fep041_informationGain_eq_zero_iff\n    (posterior prior : Measure\
    \ State)\n    [IsFiniteMeasure posterior] [IsFiniteMeasure prior] :\n    fep041_informationGain posterior prior = 0 ↔\
    \ posterior = prior := by\n  exact InformationTheory.klDiv_eq_zero_iff\n\n/-- Expected information gain under a predictive\
    \ observation law. -/\nnoncomputable def fep041_expectedInformationGain\n    (predictive : Measure Obs)\n    (posterior\
    \ : Obs → Measure State)\n    (prior : Measure State) : ℝ≥0∞ :=\n  ∫⁻ observation,\n    fep041_informationGain (posterior\
    \ observation) prior ∂predictive\n\n/-- If observations leave the posterior equal to the prior almost everywhere,\nthen\
    \ expected information gain is exactly zero. -/\ntheorem fep041_expectedInformationGain_zero\n    (predictive : Measure\
    \ Obs)\n    (posterior : Obs → Measure State)\n    (prior : Measure State) [SigmaFinite prior]\n    (hposterior : ∀ᵐ observation\
    \ ∂predictive, posterior observation = prior) :\n    fep041_expectedInformationGain predictive posterior prior = 0 :=\
    \ by\n  rw [fep041_expectedInformationGain]\n  calc\n    (∫⁻ observation,\n        fep041_informationGain (posterior observation)\
    \ prior ∂predictive) =\n        ∫⁻ _observation, 0 ∂predictive := by\n          apply lintegral_congr_ae\n          filter_upwards\
    \ [hposterior] with observation hobservation\n          simp [fep041_informationGain, hobservation,\n            InformationTheory.klDiv_self]\n\
    \    _ = 0 := lintegral_zero\n\nend FEP041\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{Obs}\,\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathsf{Obs}]\,[\mathsf{MeasurableSpace}
    \mathsf{State}] \\

    &(\mathsf{posterior}\,\mathsf{prior} : \mathsf{Measure} \mathsf{State}) \\

    &0 \le \mathsf{fep041\_informationGain}\,\mathsf{posterior}\,\mathsf{prior}

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{Obs}\,\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathsf{Obs}]\,[\mathsf{MeasurableSpace}
    \mathsf{State}] \\

    &(\mathsf{posterior}\,\mathsf{prior} : \mathsf{Measure} \mathsf{State})\,[\mathsf{IsFiniteMeasure}\,\mathsf{posterior}]
    \\

    &[\mathsf{IsFiniteMeasure}\,\mathsf{prior}] \\

    &\mathsf{fep041\_informationGain}\,\mathsf{posterior}\,\mathsf{prior} = 0 \leftrightarrow \mathsf{posterior} = \mathsf{prior}

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{Obs}\,\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathsf{Obs}]\,[\mathsf{MeasurableSpace}
    \mathsf{State}] \\

    &(\mathsf{predictive} : \mathsf{Measure} \mathsf{Obs})\,(\mathsf{posterior} : \mathsf{Obs} \Rightarrow \mathsf{Measure}
    \mathsf{State}) \\

    &(\mathsf{prior} : \mathsf{Measure} \mathsf{State})\,[\mathsf{SigmaFinite}\,\mathsf{prior}]\,(\mathsf{hposterior} : \forall^{\mathrm{a.e.}}\,\mathsf{observation}
    \\

    &\,\mathrm{d}\,\mathsf{predictive}, \mathsf{posterior}\,\mathsf{observation} = \mathsf{prior}) \\

    &\mathsf{fep041\_expectedInformationGain}\,\mathsf{predictive}\,\mathsf{posterior}\,\mathsf{prior} = 0

    \end{aligned}'
- id: fep-042
  title: Bernoulli Sufficient-Statistic Factorization
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Data.List.Count
  mathlib_status: real
  primary_theorem: fep042_likelihood_eq_of_stat_eq
  supporting_theorems:
  - fep042_likelihood_factorizes
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The Bernoulli sequence likelihood factorizes exactly through success and failure counts, so samples with equal count
    statistics have identical likelihood for every parameter. Assumption scope: The theorem is finite-sample and algebraic
    over a Boolean observation list. Its probabilistic interpretation restricts p to [0,1]; no completeness, asymptotic efficiency,
    or non-Bernoulli family is claimed. Semantic disposition: `formalized`.

    '
  assumption_review: The theorem is finite-sample and algebraic over a Boolean observation list. Its probabilistic interpretation
    restricts p to [0,1]; no completeness, asymptotic efficiency, or non-Bernoulli family is claimed.
  non_vacuity: Distinct orderings such as [true,false] and [false,true] have the same statistic and likelihood, while samples
    with different success counts generally differ for interior p.
  acceptance_probe: native Lean compile of fep042_likelihood_factorizes and fep042_likelihood_eq_of_stat_eq on permuted Boolean
    samples.
  lean_sketch: "import Mathlib.Data.List.Count\nimport Mathlib.Tactic\n\nnamespace FEP042\n\n/-- Number of observed Bernoulli\
    \ successes. -/\ndef fep042_successCount (data : List Bool) : ℕ :=\n  data.count true\n\n/-- Number of observed Bernoulli\
    \ failures. -/\ndef fep042_failureCount (data : List Bool) : ℕ :=\n  data.count false\n\n/-- The two-count statistic used\
    \ by the Bernoulli likelihood factorization. -/\ndef fep042_sufficientStatistic (data : List Bool) : ℕ × ℕ :=\n  (fep042_successCount\
    \ data, fep042_failureCount data)\n\n/-- Bernoulli sequence likelihood, with `true` mass `p`. -/\ndef fep042_bernoulliLikelihood\
    \ (p : ℝ) : List Bool → ℝ\n  | [] => 1\n  | b :: data => (if b then p else 1 - p) * fep042_bernoulliLikelihood p data\n\
    \n/-- Fisher--Neyman factorization through success and failure counts. -/\ntheorem fep042_likelihood_factorizes (p : ℝ)\
    \ (data : List Bool) :\n    fep042_bernoulliLikelihood p data =\n      p ^ fep042_successCount data * (1 - p) ^ fep042_failureCount\
    \ data := by\n  induction data with\n  | nil => simp [fep042_bernoulliLikelihood, fep042_successCount, fep042_failureCount]\n\
    \  | cons b data ih =>\n      cases b <;>\n        simp [fep042_bernoulliLikelihood, fep042_successCount,\n          fep042_failureCount,\
    \ ih, pow_succ] <;>\n        ring\n\n/-- Equal sufficient statistics imply equal likelihoods for every parameter. -/\n\
    theorem fep042_likelihood_eq_of_stat_eq\n    (p : ℝ) (xs ys : List Bool)\n    (h : fep042_sufficientStatistic xs = fep042_sufficientStatistic\
    \ ys) :\n    fep042_bernoulliLikelihood p xs = fep042_bernoulliLikelihood p ys := by\n  have hs : fep042_successCount\
    \ xs = fep042_successCount ys :=\n    congrArg Prod.fst h\n  have hf : fep042_failureCount xs = fep042_failureCount ys\
    \ :=\n    congrArg Prod.snd h\n  rw [fep042_likelihood_factorizes, fep042_likelihood_factorizes, hs, hf]\n\nend FEP042\n"
  latex_equations:
  - '\begin{aligned}

    &(p : \mathbb{R})\,(\mathsf{data} : \mathsf{List}\,\mathsf{Bool}) \\

    &\mathsf{fep042\_bernoulliLikelihood}\,p\,\mathsf{data} = p ^ \mathsf{fep042\_successCount}\,\mathsf{data} \cdot (1 -
    p) ^ \mathsf{fep042\_failureCount} \\

    &\mathsf{data}

    \end{aligned}'
  - '\begin{aligned}

    &(p : \mathbb{R})\,(\mathsf{xs}\,\mathsf{ys} : \mathsf{List}\,\mathsf{Bool})\,(h : \mathsf{fep042\_sufficientStatistic}\,\mathsf{xs}
    \\

    &= \mathsf{fep042\_sufficientStatistic}\,\mathsf{ys}) \\

    &\mathsf{fep042\_bernoulliLikelihood}\,p\,\mathsf{xs} = \mathsf{fep042\_bernoulliLikelihood}\,p\,\mathsf{ys}

    \end{aligned}'
- id: fep-043
  title: Fermat Criticality and Quadratic Curvature
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - Analysis.Calculus.LocalExtr.Basic
  mathlib_status: real
  primary_theorem: fep043_quadratic_critical_iff
  supporting_theorems:
  - fep043_localMin_deriv_zero
  - fep043_quadratic_hasDerivAt
  - fep043_quadratic_unique_min
  - fep043_quadraticGradient_hasDerivAt
  - fep043_quadratic_hessian_pos
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Fermat''s theorem makes every local minimum critical; for an exact positive-curvature quadratic, the derivative is
    the stated gradient, the center is the unique critical point and global minimizer, and the scalar Hessian is strictly
    positive. Assumption scope: The general derivative-zero theorem uses Mathlib''s local-minimum notion. Uniqueness and positive
    second derivative are proved only for the explicit scalar quadratic with a>0, not inferred for arbitrary differentiable
    objectives. Semantic disposition: `formalized`.

    '
  assumption_review: The general derivative-zero theorem uses Mathlib's local-minimum notion. Uniqueness and positive second
    derivative are proved only for the explicit scalar quadratic with a>0, not inferred for arbitrary differentiable objectives.
  non_vacuity: Every positive a and noncenter x has nonzero gradient and strictly larger energy than the center, while the
    Hessian 2a is nonzero everywhere.
  acceptance_probe: native Lean compile of fep043_localMin_deriv_zero, fep043_quadratic_hasDerivAt, fep043_quadratic_unique_min,
    fep043_quadratic_critical_iff, and fep043_quadratic_hessian_pos.
  lean_sketch: "import Mathlib.Analysis.Calculus.Deriv.Mul\nimport Mathlib.Analysis.Calculus.Deriv.Pow\nimport Mathlib.Analysis.Calculus.LocalExtr.Basic\n\
    import Mathlib.Tactic\n\nnamespace FEP043\n\n/-- Fermat's theorem: the derivative vanishes at every local minimum. -/\n\
    theorem fep043_localMin_deriv_zero\n    {f : ℝ → ℝ} {x₀ : ℝ} (hmin : IsLocalMin f x₀) :\n    deriv f x₀ = 0 :=\n  hmin.deriv_eq_zero\n\
    \n/-- Exact scalar quadratic free-energy landscape. -/\ndef fep043_quadraticFreeEnergy (a x₀ c x : ℝ) : ℝ :=\n  a * (x\
    \ - x₀) ^ 2 + c\n\n/-- Its gradient field. -/\ndef fep043_quadraticGradient (a x₀ x : ℝ) : ℝ :=\n  2 * a * (x - x₀)\n\n\
    /-- Exact first derivative of the quadratic free energy. -/\ntheorem fep043_quadratic_hasDerivAt (a x₀ c x : ℝ) :\n  \
    \  HasDerivAt (fep043_quadraticFreeEnergy a x₀ c)\n      (fep043_quadraticGradient a x₀ x) x := by\n  convert (((hasDerivAt_id\
    \ x).sub_const x₀).pow 2).const_mul a |>.add_const c using 1\n  all_goals\n    first\n    | exact AddCommGroup.ext rfl\n\
    \    | exact Module.ext rfl\n    | rfl\n    | (simp [fep043_quadraticGradient] ; ring)\n\n/-- Positive curvature makes\
    \ the center the unique global minimizer. -/\ntheorem fep043_quadratic_unique_min\n    {a x₀ c x : ℝ} (ha : 0 < a) :\n\
    \    fep043_quadraticFreeEnergy a x₀ c x =\n        fep043_quadraticFreeEnergy a x₀ c x₀ ↔\n      x = x₀ := by\n  constructor\n\
    \  · intro h\n    have hcenter : fep043_quadraticFreeEnergy a x₀ c x₀ = c := by\n      simp [fep043_quadraticFreeEnergy]\n\
    \    rw [hcenter] at h\n    rw [fep043_quadraticFreeEnergy] at h\n    have hsquare : (x - x₀) ^ 2 = 0 := by nlinarith\n\
    \    nlinarith\n  · rintro rfl\n    rfl\n\n/-- For positive curvature, the unique critical point is the unique minimum.\
    \ -/\ntheorem fep043_quadratic_critical_iff\n    {a x₀ c x : ℝ} (ha : 0 < a) :\n    deriv (fep043_quadraticFreeEnergy\
    \ a x₀ c) x = 0 ↔ x = x₀ := by\n  rw [(fep043_quadratic_hasDerivAt a x₀ c x).deriv]\n  simp only [fep043_quadraticGradient]\n\
    \  constructor <;> intro h\n  · nlinarith\n  · rw [h, sub_self, mul_zero]\n\n/-- The gradient derivative is the constant\
    \ scalar Hessian `2a`. -/\ntheorem fep043_quadraticGradient_hasDerivAt (a x₀ x : ℝ) :\n    HasDerivAt (fep043_quadraticGradient\
    \ a x₀) (2 * a) x := by\n  convert ((hasDerivAt_id x).sub_const x₀).const_mul (2 * a) using 1\n  all_goals\n    first\n\
    \    | exact AddCommGroup.ext rfl\n    | exact Module.ext rfl\n    | rfl\n    | simp\n\n/-- Positive quadratic curvature\
    \ gives a strictly positive Hessian. -/\ntheorem fep043_quadratic_hessian_pos {a : ℝ} (ha : 0 < a) :\n    0 < 2 * a :=\
    \ by positivity\n\nend FEP043\n"
