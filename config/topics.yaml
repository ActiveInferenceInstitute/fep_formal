    \mathcal{X}]\,[\mathsf{MeasurableSpace} \mathcal{Y}] \\

    &(\kappa{} : \mathsf{Kernel}\,\Omega{}\,\mathcal{X})\,(\mu{} : \mathsf{Measure} \Omega{})\,[\mathsf{IsProbabilityMeasure}~\mu{}]\,[\mathsf{IsMarkovKernel}\,\kappa{}]
    \\

    &\mathsf{fep019\_priorPredictive}\,\kappa{}\,\mu{}\,\Omega = 1

