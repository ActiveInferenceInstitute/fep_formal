    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{step}\,\mathsf{center}\,x : \mathbb{R})\,(n : \mathbb{N}) \\

    &((\mathsf{fep032\_quadraticUpdate}\,\mathsf{step}\,\mathsf{center})^[n])\,x - \mathsf{center} = (1 - \mathsf{step}) ^
    n \\

    &\cdot (x - \mathsf{center})

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{step}\,\mathsf{center}\,x : \mathbb{R}\}\,(\mathsf{hstep0} : 0 \le \mathsf{step})\,(\mathsf{hstep2} : \mathsf{step}
    \le 2) \\

    &(\mathsf{fep032\_quadraticUpdate}\,\mathsf{step}\,\mathsf{center}\,x - \mathsf{center}) ^ 2 \le (x - \mathsf{center})
    ^ 2

    \end{aligned}'
  - '\begin{aligned}

