  lean_sketch: "import Mathlib.Basic.ENNReal.Inv\n\nnamespace FEP033\n\nopen scoped ENNReal\n\n/-- Transition-aware finite-horizon\
    \ value with stage cost, discount, and\nterminal cost. -/\nnoncomputable def fep033_value {State : Type*}\n    (discount\
    \ : ENNReal) (stageCost : State → ENNReal)\n    (step : State → State) (terminalCost : State → ENNReal) :\n    ℕ → State\
    \ → ENNReal\n  | 0, state => terminalCost state\n  | horizon + 1, state =>\n      stageCost state +\n        discount\
    \ * fep033_value discount stageCost step terminalCost horizon (step state)\n\n/-- Bellman recursion is the defining finite-horizon\
    \ transition law. -/\ntheorem fep033_bellman {State : Type*}\n    (discount : ENNReal) (stageCost : State → ENNReal)\n\
    \    (step : State → State) (terminalCost : State → ENNReal)\n    (horizon : ℕ) (state : State) :\n    fep033_value discount\
    \ stageCost step terminalCost (horizon + 1) state =\n      stageCost state + discount *\n        fep033_value discount\
    \ stageCost step terminalCost horizon (step state) :=\n  rfl\n\n/-- Pointwise larger stage and terminal costs produce\
    \ a larger value. -/\ntheorem fep033_value_mono {State : Type*}\n    (discount : ENNReal) {stage₁ stage₂ terminal₁ terminal₂\
    \ : State → ENNReal}\n    (step : State → State) (hstage : ∀ state, stage₁ state ≤ stage₂ state)\n    (hterminal : ∀ state,\
    \ terminal₁ state ≤ terminal₂ state)\n    (horizon : ℕ) (state : State) :\n    fep033_value discount stage₁ step terminal₁\
    \ horizon state ≤\n      fep033_value discount stage₂ step terminal₂ horizon state := by\n  induction horizon generalizing\
    \ state with\n  | zero => exact hterminal state\n  | succ horizon ih =>\n      exact add_le_add (hstage state)\n     \
    \   (mul_le_mul_right (ih (step state)) discount)\n\n/-- Zero stage and terminal costs yield zero value at every horizon.\
    \ -/\ntheorem fep033_zeroCost {State : Type*}\n    (discount : ENNReal) (step : State → State) (horizon : ℕ) (state :\
    \ State) :\n    fep033_value discount (fun _ => 0) step (fun _ => 0) horizon state = 0 := by\n  induction horizon generalizing\
    \ state with\n  | zero => rfl\n  | succ horizon ih => simp [fep033_value, ih]\n\n/-- At zero discount, every positive-horizon\
    \ value is exactly immediate cost. -/\ntheorem fep033_zeroDiscount {State : Type*}\n    (stageCost : State → ENNReal)\
    \ (step : State → State)\n    (terminalCost : State → ENNReal) (horizon : ℕ) (state : State) :\n    fep033_value 0 stageCost\
    \ step terminalCost (horizon + 1) state =\n      stageCost state := by\n  simp [fep033_value]\n\nend FEP033\n"
