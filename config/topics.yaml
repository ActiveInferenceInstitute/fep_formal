- id: fep-006
  title: Measurable Discrete-Time Flow
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - MeasureTheory.MeasurableSpace.Basic
  mathlib_status: real
  primary_theorem: fep006_iterateFlow_add
  supporting_theorems:
  - fep006_iterateFlow_measurable
  - fep006_iterateFlow_zero
  - fep006_iterateFlow_fixed
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Iteration of one measurable state update defines a measurable discrete-time flow with identity at time zero, an exact
    additive semigroup law, and persistence of fixed points. Assumption scope: Measurability of each time slice requires the
    one-step map to be measurable. The algebraic semigroup and fixed-point laws require no topology, invariant measure, differentiability,
    or continuous-time interpolation. Semantic disposition: `formalized`.

    '
  assumption_review: Measurability of each time slice requires the one-step map to be measurable. The algebraic semigroup
    and fixed-point laws require no topology, invariant measure, differentiability, or continuous-time interpolation.
  non_vacuity: Identity, constant, and nontrivial measurable maps instantiate the flow; the additive law constrains every
    pair of horizons rather than a single composition.
  acceptance_probe: native Lean compile of fep006_iterateFlow_measurable, fep006_iterateFlow_zero, fep006_iterateFlow_add,
    and fep006_iterateFlow_fixed.
  lean_sketch: "import Mathlib.Dynamics.FixedPoints.Basic\nimport Mathlib.MeasureTheory.MeasurableSpace.Basic\n\nnamespace\
    \ FEP006\n\nvariable {α : Type*}\n\n/-- The discrete-time flow generated by repeatedly applying one state update. -/\n\
    def fep006_iterateFlow (step : α → α) (time : ℕ) : α → α :=\n  step^[time]\n\n/-- Every time slice of a measurable discrete\
    \ flow is measurable. -/\ntheorem fep006_iterateFlow_measurable\n    [MeasurableSpace α] {step : α → α} (hstep : Measurable\
    \ step) (time : ℕ) :\n    Measurable (fep006_iterateFlow step time) := by\n  exact hstep.iterate time\n\n/-- The time-zero\
    \ flow is the identity. -/\ntheorem fep006_iterateFlow_zero (step : α → α) :\n    fep006_iterateFlow step 0 = id := by\n\
    \  rfl\n\n/-- Discrete flow obeys the exact additive semigroup law. -/\ntheorem fep006_iterateFlow_add (step : α → α)\
    \ (m n : ℕ) (state : α) :\n    fep006_iterateFlow step (m + n) state =\n      fep006_iterateFlow step m (fep006_iterateFlow\
    \ step n state) := by\n  exact Function.iterate_add_apply step m n state\n\n/-- A fixed point remains fixed at every discrete\
    \ time. -/\ntheorem fep006_iterateFlow_fixed\n    (step : α → α) {state : α} (hfixed : Function.IsFixedPt step state)\n\
    \    (time : ℕ) :\n    fep006_iterateFlow step time state = state := by\n  exact hfixed.iterate time\n\nend FEP006\n"
  latex_equations:
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\} \\

    &[\mathsf{MeasurableSpace}~\alpha{}]\,\{\mathsf{step} : \alpha{} \Rightarrow \alpha{}\}\,(\mathsf{hstep} : \mathsf{Measurable}\,\mathsf{step})\,(\mathsf{time}
    : \mathbb{N}) \\

    &\mathsf{Measurable}\,(\mathsf{fep006\_iterateFlow}\,\mathsf{step}\,\mathsf{time})

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\} \\

    &(\mathsf{step} : \alpha{} \Rightarrow \alpha{}) \\

    &\mathsf{fep006\_iterateFlow}\,\mathsf{step}\,0 = \mathsf{id}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\} \\

    &(\mathsf{step} : \alpha{} \Rightarrow \alpha{})\,(m\,n : \mathbb{N})\,(\mathsf{state} : \alpha{}) \\

    &\mathsf{fep006\_iterateFlow}\,\mathsf{step}\,(m + n)\,\mathsf{state} = \mathsf{fep006\_iterateFlow}\,\mathsf{step}\,m
    \\

    &(\mathsf{fep006\_iterateFlow}\,\mathsf{step}\,n\,\mathsf{state})

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\} \\

    &(\mathsf{step} : \alpha{} \Rightarrow \alpha{})\,\{\mathsf{state} : \alpha{}\}\,(\mathsf{hfixed} : \mathsf{Function.IsFixedPt}\,\mathsf{step}\,\mathsf{state})\,(\mathsf{time}
    : \mathbb{N}) \\

    &\mathsf{fep006\_iterateFlow}\,\mathsf{step}\,\mathsf{time}\,\mathsf{state} = \mathsf{state}

