  nl: 'A positive-precision scalar quadratic exponential is integrable and has the exact Gaussian normalizing integral sqrt(π/(precision/2)).
    Assumption scope: Precision is strictly positive for the scientific integrability result. This is the exact scalar quadratic
    case underlying Laplace approximation; no approximation-error or higher-dimensional determinant theorem is claimed. Semantic
    disposition: `formalized`.

