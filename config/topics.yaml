- id: fep-028
  title: Support-Aware Finite Softmax Policy
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - Data.Finset.Basic
  - Analysis.SpecialFunctions.Exp
  mathlib_status: real
  primary_theorem: fep028_softmax_sum_univ
  supporting_theorems:
  - fep028_softmax_nonneg
  - fep028_softmax_le_one
  - fep028_softmax_probs_sum_one
  - fep028_softmax_support
  - fep028_numerator_pos
  - fep028_denominator_pos
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Exponentiated policy scores on a nonempty selected support define a nonnegative full finite weight vector, vanish outside
    support, are pointwise at most one, and sum to one globally. Assumption scope: Only support nonemptiness is required;
    inverse temperature and costs may be arbitrary reals. This proves an exact stochastic policy law but not optimality, sampling
    behavior, or a temperature limit. Semantic disposition: `formalized`.

    '
  assumption_review: Only support nonemptiness is required; inverse temperature and costs may be arbitrary reals. This proves
    an exact stochastic policy law but not optimality, sampling behavior, or a temperature limit.
  non_vacuity: A two-policy support with unequal costs gives unequal positive weights, while excluded policies have exact
    zero mass and the full ten-policy vector remains normalized.
  acceptance_probe: native Lean compile of fep028_softmax_nonneg, fep028_softmax_le_one, fep028_softmax_support, fep028_softmax_probs_sum_one,
    and fep028_softmax_sum_univ.
  lean_sketch: "import Mathlib.Data.Finset.Basic\nimport Mathlib.Analysis.SpecialFunctions.Exp\n\nnamespace FEP028\n\nopen\
    \ Real Finset\n\n-- [proof strategy: Real.exp_pos + Finset.sum_pos + div identities for softmax normalization]\n\nabbrev\
    \ Policy := Fin 10\n\nnoncomputable def fep028_softmax (γ : ℝ) (G : Policy → ℝ) (policies : Finset Policy) (p : Policy)\
    \ :\n    ℝ :=\n  if p ∈ policies then\n    Real.exp (-γ * G p) / ∑ p' ∈ policies, Real.exp (-γ * G p')\n  else 0\n\n/--\
    \ Softmax probabilities are nonneg over nonempty policy sets. -/\ntheorem fep028_softmax_nonneg (γ : ℝ) (G : Policy →\
    \ ℝ) (policies : Finset Policy) (p : Policy)\n    (hne : policies.Nonempty) : 0 ≤ fep028_softmax γ G policies p := by\n\
    \  classical\n  have hsum : 0 < ∑ p' ∈ policies, Real.exp (-γ * G p') :=\n    Finset.sum_pos (fun _ _ => Real.exp_pos\
    \ _) hne\n  by_cases hp : p ∈ policies\n  · rw [fep028_softmax, ite_eq_left hp]\n    exact div_nonneg (Real.exp_nonneg\
    \ _) hsum.le\n  · simp [fep028_softmax, hp]\n\n/-- Every support-aware softmax weight is at most one. -/\ntheorem fep028_softmax_le_one\n\
    \    (γ : ℝ) (G : Policy → ℝ) (policies : Finset Policy) (p : Policy)\n    (hne : policies.Nonempty) :\n    fep028_softmax\
    \ γ G policies p ≤ 1 := by\n  classical\n  have hsum : 0 < ∑ p' ∈ policies, Real.exp (-γ * G p') :=\n    Finset.sum_pos\
    \ (fun _ _ => Real.exp_pos _) hne\n  by_cases hp : p ∈ policies\n  · rw [fep028_softmax, ite_eq_left hp]\n    apply (div_le_one\
    \ hsum).2\n    exact Finset.single_le_sum\n      (fun q _ => Real.exp_nonneg (-γ * G q)) hp\n  · simp [fep028_softmax,\
    \ hp]\n\n/-- Softmax probabilities over a nonempty finite policy set sum to one. -/\ntheorem fep028_softmax_probs_sum_one\
    \ (γ : ℝ) (G : Policy → ℝ) (policies : Finset Policy)\n    (hne : policies.Nonempty) :\n    ∑ p ∈ policies, fep028_softmax\
    \ γ G policies p = 1 := by\n  classical\n  have hden :\n      (∑ p' ∈ policies, Real.exp (-γ * G p')) ≠ 0 :=\n    ne_of_gt\
    \ (Finset.sum_pos (fun _ _ => Real.exp_pos _) hne)\n  calc\n    ∑ p ∈ policies, fep028_softmax γ G policies p =\n    \
    \    ∑ p ∈ policies,\n          Real.exp (-γ * G p) /\n            ∑ p' ∈ policies, Real.exp (-γ * G p') := by\n     \
    \ apply Finset.sum_congr rfl\n      intro p hp\n      simp [fep028_softmax, hp]\n    _ = 1 := by\n      simp_rw [div_eq_mul_inv]\n\
    \      rw [← Finset.sum_mul, mul_inv_cancel₀ hden]\n\n/-- Policies outside the declared support receive exactly zero probability.\
    \ -/\ntheorem fep028_softmax_support\n    (γ : ℝ) (G : Policy → ℝ) (policies : Finset Policy) {p : Policy}\n    (hp :\
    \ p ∉ policies) :\n    fep028_softmax γ G policies p = 0 := by\n  simp [fep028_softmax, hp]\n\n/-- The support-aware softmax\
    \ is a normalized weight vector on the complete\nfinite policy type. -/\ntheorem fep028_softmax_sum_univ\n    (γ : ℝ)\
    \ (G : Policy → ℝ) (policies : Finset Policy)\n    (hne : policies.Nonempty) :\n    ∑ p : Policy, fep028_softmax γ G policies\
    \ p = 1 := by\n  classical\n  have hsubset :\n      (∑ p ∈ policies, fep028_softmax γ G policies p) =\n        ∑ p : Policy,\
    \ fep028_softmax γ G policies p := by\n    apply Finset.sum_subset (Finset.subset_univ policies)\n    intro p _ hp\n \
    \   exact fep028_softmax_support γ G policies hp\n  rw [← hsubset]\n  exact fep028_softmax_probs_sum_one γ G policies\
    \ hne\n\n/-- Softmax numerator is strictly positive. -/\ntheorem fep028_numerator_pos (γ : ℝ) (G : Policy → ℝ) (p : Policy)\
    \ :\n    0 < Real.exp (-γ * G p) :=\n  Real.exp_pos _\n\n/-- Softmax denominator is strictly positive over a nonempty\
    \ set. -/\ntheorem fep028_denominator_pos (γ : ℝ) (G : Policy → ℝ) (policies : Finset Policy)\n    (hne : policies.Nonempty)\
    \ :\n    0 < ∑ p' ∈ policies, Real.exp (-γ * G p') :=\n  Finset.sum_pos (fun _ _ => Real.exp_pos _) hne\n\nend FEP028\n"
  latex_equations:
  - '\begin{aligned}

    &(\gamma{} : \mathbb{R})\,(G : \mathsf{Policy} \Rightarrow \mathbb{R})\,(\mathsf{policies} : \mathsf{Finset}\,\mathsf{Policy})\,(p
    : \mathsf{Policy}) \\

    &(\mathsf{hne} : \mathsf{policies.Nonempty}) \\

    &0 \le \mathsf{fep028\_softmax}\,\gamma{}\,G\,\mathsf{policies}\,p

    \end{aligned}'
  - '\begin{aligned}

