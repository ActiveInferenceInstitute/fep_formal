- id: fep-001
  title: Variational Free Energy Bound
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - InformationTheory.KullbackLeibler.Basic
  mathlib_status: real
  primary_theorem: fep001_variationalUpperBound_eq_iff
  supporting_theorems:
  - fep001_variationalUpperBound_ge
  - fep001_variationalGap_eq_zero_iff
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Surprisal plus Mathlib''s native measure KL upper-bounds surprisal; for finite measures and finite surprisal, equality
    holds exactly when the approximate and exact posterior laws coincide. Assumption scope: The inequality is unconditional
    in ENNReal. Gap separation requires finite measures, and bound equality additionally requires surprisal below infinity
    so additive cancellation is sound. Semantic disposition: `formalized`.

    '
  assumption_review: The inequality is unconditional in ENNReal. Gap separation requires finite measures, and bound equality
    additionally requires surprisal below infinity so additive cancellation is sound.
  non_vacuity: Matching finite posterior laws attain equality, while any unequal finite pair has a nonzero KL gap and hence
    a strict finite-surprisal remainder.
  acceptance_probe: native Lean compile of fep001_variationalUpperBound_ge, fep001_variationalGap_eq_zero_iff, and fep001_variationalUpperBound_eq_iff.
  lean_sketch: "import Mathlib.InformationTheory.KullbackLeibler.Basic\n\nnamespace FEP001\n\nvariable {α : Type*} [MeasurableSpace\
    \ α]\n\nopen MeasureTheory\nopen scoped ENNReal\n\n/-- Native variational gap between an approximate and exact posterior\
    \ law. -/\nnoncomputable def fep001_variationalGap\n    (approximation posterior : Measure α) : ENNReal :=\n  InformationTheory.klDiv\
    \ approximation posterior\n\n/-- Surprisal plus the native KL variational gap. -/\nnoncomputable def fep001_variationalUpperBound\n\
    \    (approximation posterior : Measure α) (surprisal : ENNReal) : ENNReal :=\n  surprisal + fep001_variationalGap approximation\
    \ posterior\n\n/-- The KL remainder makes the variational quantity an upper bound. -/\ntheorem fep001_variationalUpperBound_ge\n\
    \    (approximation posterior : Measure α) (surprisal : ENNReal) :\n    surprisal ≤\n      fep001_variationalUpperBound\
    \ approximation posterior surprisal := by\n  exact le_add_right (le_refl _)\n\n/-- For finite measures, the variational\
    \ gap vanishes exactly at the posterior. -/\ntheorem fep001_variationalGap_eq_zero_iff\n    (approximation posterior :\
    \ Measure α)\n    [IsFiniteMeasure approximation] [IsFiniteMeasure posterior] :\n    fep001_variationalGap approximation\
    \ posterior = 0 ↔\n      approximation = posterior := by\n  exact InformationTheory.klDiv_eq_zero_iff\n\n/-- At finite\
    \ surprisal, the variational bound is exact exactly when the\napproximation equals the posterior. -/\ntheorem fep001_variationalUpperBound_eq_iff\n\
    \    (approximation posterior : Measure α)\n    [IsFiniteMeasure approximation] [IsFiniteMeasure posterior]\n    {surprisal\
    \ : ENNReal} (hsurprisal : surprisal ≠ ∞) :\n    fep001_variationalUpperBound approximation posterior surprisal = surprisal\
    \ ↔\n      approximation = posterior := by\n  constructor\n  · intro hbound\n    have hadd : surprisal + fep001_variationalGap\
    \ approximation posterior =\n        surprisal + 0 := by\n      simpa [fep001_variationalUpperBound] using hbound\n  \
    \  have hgap : fep001_variationalGap approximation posterior = 0 :=\n      (ENNReal.add_right_inj hsurprisal).mp hadd\n\
    \    exact (fep001_variationalGap_eq_zero_iff approximation posterior).mp hgap\n  · intro hequal\n    subst posterior\n\
    \    simp [fep001_variationalUpperBound, fep001_variationalGap,\n      InformationTheory.klDiv_self]\n\nend FEP001\n"
  latex_equations:
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{approximation}\,\mathsf{posterior} : \mathsf{Measure}~\alpha{})\,(\mathsf{surprisal} : \mathbb{R}_{\ge 0}^{\infty})
    \\

    &\mathsf{surprisal} \le \mathsf{fep001\_variationalUpperBound}\,\mathsf{approximation}\,\mathsf{posterior}\,\mathsf{surprisal}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{approximation}\,\mathsf{posterior} : \mathsf{Measure}~\alpha{})\,[\mathsf{IsFiniteMeasure}\,\mathsf{approximation}]
    \\

    &[\mathsf{IsFiniteMeasure}\,\mathsf{posterior}] \\

    &\mathsf{fep001\_variationalGap}\,\mathsf{approximation}\,\mathsf{posterior} = 0 \leftrightarrow \mathsf{approximation}
    = \mathsf{posterior}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{approximation}\,\mathsf{posterior} : \mathsf{Measure}~\alpha{})\,[\mathsf{IsFiniteMeasure}\,\mathsf{approximation}]
    \\

    &[\mathsf{IsFiniteMeasure}\,\mathsf{posterior}]\,\{\mathsf{surprisal} : \mathbb{R}_{\ge 0}^{\infty}\}\,(\mathsf{hsurprisal}
    : \mathsf{surprisal} \ne \infty) \\

    &\mathsf{fep001\_variationalUpperBound}\,\mathsf{approximation}\,\mathsf{posterior}\,\mathsf{surprisal} = \mathsf{surprisal}
    \\

    &\leftrightarrow \mathsf{approximation} = \mathsf{posterior}

    \end{aligned}'
- id: fep-002
  title: Variational Evidence Bound via KL Divergence
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - InformationTheory.KullbackLeibler.Basic
  mathlib_status: real
  primary_theorem: fep002_vfe_ge_surprisal
  supporting_theorems:
  - fep002_prob_measure_univ
  - fep002_prob_compl
  - fep002_elbo_bound
  - fep002_vfe_exact_at_posterior
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Variational free energy, defined as surprisal plus Mathlib KL divergence, upper-bounds surprisal and is exact at the
    posterior. Assumption scope: The bound is unconditional over measures in a measurable space; exactness uses Mathlib''s
    SigmaFinite assumption for KL self-divergence. The codomain is ENNReal, so infinite divergences are represented without
    a finiteness side condition. Semantic disposition: `formalized`.

    '
  assumption_review: The bound is unconditional over measures in a measurable space; exactness uses Mathlib's SigmaFinite
    assumption for KL self-divergence. The codomain is ENNReal, so infinite divergences are represented without a finiteness
    side condition.
  non_vacuity: Any sigma-finite posterior supplies the equality witness q = posterior, while distinct measures can produce
    a nonzero or infinite KL remainder.
  acceptance_probe: native Lean compile of fep002_vfe_ge_surprisal and fep002_vfe_exact_at_posterior, using Mathlib's InformationTheory.klDiv
    rather than an assumed scalar.
  lean_sketch: "import Mathlib.InformationTheory.KullbackLeibler.Basic\nimport Mathlib.MeasureTheory.Measure.Typeclasses.Probability\n\
    \nnamespace FEP002\n\nvariable {α : Type*} [MeasurableSpace α]\n\nopen MeasureTheory\nopen scoped ENNReal\n\n-- [proof\
    \ strategy: IsProbabilityMeasure.measure_univ + measure_compl for complement; linarith for ELBO]\n/-- A probability measure\
    \ assigns unit total mass. -/\ntheorem fep002_prob_measure_univ (μ : Measure α) [IsProbabilityMeasure μ] :\n    μ Set.univ\
    \ = 1 :=\n  IsProbabilityMeasure.measure_univ\n\n/-- Complement: μ(sᶜ) = 1 - μ(s) for probability measures on measurable\
    \ sets. -/\ntheorem fep002_prob_compl (μ : Measure α) [IsProbabilityMeasure μ] {s : Set α}\n    (hs : MeasurableSet s)\
    \ (hfin : μ s ≠ ⊤) :\n    μ sᶜ = 1 - μ s := by\n  rw [measure_compl hs hfin, IsProbabilityMeasure.measure_univ]\n\n/--\
    \ A scalar ELBO decomposition: free energy ≤ log marginal likelihood when the\nKL remainder is nonnegative. -/\ntheorem\
    \ fep002_elbo_bound (logEvidence freeEnergy klDiv : ℝ)\n    (h_decomp : logEvidence = freeEnergy + klDiv)\n    (h_kl_nonneg\
    \ : 0 ≤ klDiv) :\n    freeEnergy ≤ logEvidence := by linarith\n\n/-- Variational free energy in Mathlib's native nonnegative\
    \ extended-real KL\ncodomain: surprisal plus the divergence from an approximate posterior to the\nexact posterior. -/\n\
    noncomputable def fep002_variationalFreeEnergy\n    (q posterior : Measure α) (surprisal : ENNReal) : ENNReal :=\n  surprisal\
    \ + InformationTheory.klDiv q posterior\n\n/-- The KL remainder makes variational free energy an upper bound on\nsurprisal.\
    \ -/\ntheorem fep002_vfe_ge_surprisal (q posterior : Measure α) (surprisal : ENNReal) :\n    surprisal ≤ fep002_variationalFreeEnergy\
    \ q posterior surprisal := by\n  simp only [fep002_variationalFreeEnergy]\n  exact le_add_right (le_refl surprisal)\n\n\
    /-- The variational bound is exact when the approximation is the posterior\nitself. -/\ntheorem fep002_vfe_exact_at_posterior\
    \ (posterior : Measure α)\n    [SigmaFinite posterior] (surprisal : ENNReal) :\n    fep002_variationalFreeEnergy posterior\
    \ posterior surprisal = surprisal := by\n  simp [fep002_variationalFreeEnergy, InformationTheory.klDiv_self]\n\nend FEP002\n"
  latex_equations:
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mu{} : \mathsf{Measure}~\alpha{})\,[\mathsf{IsProbabilityMeasure}~\mu{}] \\

    &\mu{}\,\Omega = 1

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mu{} : \mathsf{Measure}~\alpha{})\,[\mathsf{IsProbabilityMeasure}~\mu{}]\,\{s : \mathsf{Set}~\alpha{}\}\,(\mathsf{hs}
    : \mathsf{MeasurableSet} s) \\

    &(\mathsf{hfin} : \mu{}\,s \ne \top) \\

    &\mu{}\,s^{\mathrm{c}} = 1 - \mu{}\,s

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{logEvidence}\,\mathsf{freeEnergy}\,\mathsf{klDiv} : \mathbb{R})\,(\mathsf{h\_decomp} : \mathsf{logEvidence}
    = \mathsf{freeEnergy} + \mathsf{klDiv}) \\

    &(\mathsf{h\_kl\_nonneg} : 0 \le \mathsf{klDiv}) \\

    &\mathsf{freeEnergy} \le \mathsf{logEvidence}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(q\,\mathsf{posterior} : \mathsf{Measure}~\alpha{})\,(\mathsf{surprisal} : \mathbb{R}_{\ge 0}^{\infty}) \\

    &\mathsf{surprisal} \le \mathsf{fep002\_variationalFreeEnergy}\,q\,\mathsf{posterior}\,\mathsf{surprisal}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{posterior} : \mathsf{Measure}~\alpha{})\,[\mathsf{SigmaFinite}\,\mathsf{posterior}]\,(\mathsf{surprisal} : \mathbb{R}_{\ge
    0}^{\infty}) \\

    &\mathsf{fep002\_variationalFreeEnergy}\,\mathsf{posterior}\,\mathsf{posterior}\,\mathsf{surprisal} = \mathsf{surprisal}

    \end{aligned}'
- id: fep-003
  title: Discounted Pragmatic Cost
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - Data.ENNReal.Inv
  mathlib_status: real
  primary_theorem: fep003_pragmaticCost_succ
  supporting_theorems:
  - fep003_pragmaticCost_zero
  - fep003_pragmaticCost_mono
  - fep003_pragmaticCost_horizon_succ
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Finite-horizon pragmatic cost is the discounted ENNReal sum of stage costs; horizon extension exposes the exact terminal
    increment, costs are pointwise monotone, and horizon extension is monotone. Assumption scope: All costs and the discount
    live in ENNReal, so nonnegativity and infinity are represented directly. This is the pragmatic-cost input to EFE; epistemic
    value and its sign are owned by fep-021. Semantic disposition: `formalized`.

    '
  assumption_review: All costs and the discount live in ENNReal, so nonnegativity and infinity are represented directly. This
    is the pragmatic-cost input to EFE; epistemic value and its sign are owned by fep-021.
  non_vacuity: A positive stage cost at the newly exposed time adds the nonzero increment γ^T c_T; a zero horizon and pointwise-equal
    costs exercise the boundaries.
  acceptance_probe: native Lean compile of fep003_pragmaticCost_zero, fep003_pragmaticCost_succ, fep003_pragmaticCost_mono,
    and fep003_pragmaticCost_horizon_succ.
  lean_sketch: "import Mathlib.Algebra.Order.BigOperators.Group.Finset\nimport Mathlib.Basic.ENNReal.Inv\n\nnamespace FEP003\n\
    \nopen scoped ENNReal\n\n/-- Discounted pragmatic expected-cost input to the EFE convention. -/\nnoncomputable def fep003_pragmaticCost\n\
    \    (discount : ENNReal) (stageCost : ℕ → ENNReal) (horizon : ℕ) : ENNReal :=\n  ∑ t ∈ Finset.range horizon, discount\
    \ ^ t * stageCost t\n\n/-- A zero planning horizon has zero pragmatic cost. -/\ntheorem fep003_pragmaticCost_zero\n  \
    \  (discount : ENNReal) (stageCost : ℕ → ENNReal) :\n    fep003_pragmaticCost discount stageCost 0 = 0 := by\n  simp [fep003_pragmaticCost]\n\
    \n/-- Extending the horizon exposes the exact discounted terminal increment. -/\ntheorem fep003_pragmaticCost_succ\n \
    \   (discount : ENNReal) (stageCost : ℕ → ENNReal) (horizon : ℕ) :\n    fep003_pragmaticCost discount stageCost (horizon\
    \ + 1) =\n      fep003_pragmaticCost discount stageCost horizon +\n        discount ^ horizon * stageCost horizon := by\n\
    \  simp [fep003_pragmaticCost, Finset.sum_range_succ]\n\n/-- Pointwise larger stage costs produce larger pragmatic cost.\
    \ -/\ntheorem fep003_pragmaticCost_mono\n    (discount : ENNReal) {cost₁ cost₂ : ℕ → ENNReal}\n    (hcost : ∀ t, cost₁\
    \ t ≤ cost₂ t) (horizon : ℕ) :\n    fep003_pragmaticCost discount cost₁ horizon ≤\n      fep003_pragmaticCost discount\
    \ cost₂ horizon := by\n  exact Finset.sum_le_sum fun t _ => mul_le_mul_right (hcost t) _\n\n/-- Every additional nonnegative\
    \ stage weakly increases finite-horizon cost. -/\ntheorem fep003_pragmaticCost_horizon_succ\n    (discount : ENNReal)\
    \ (stageCost : ℕ → ENNReal) (horizon : ℕ) :\n    fep003_pragmaticCost discount stageCost horizon ≤\n      fep003_pragmaticCost\
    \ discount stageCost (horizon + 1) := by\n  rw [fep003_pragmaticCost_succ]\n  exact le_add_right (le_refl _)\n\nend FEP003\n"
  latex_equations:
  - '\begin{aligned}

    &(\mathsf{discount} : \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{stageCost} : \mathbb{N} \Rightarrow \mathbb{R}_{\ge 0}^{\infty})
    \\

    &\mathsf{fep003\_pragmaticCost}\,\mathsf{discount}\,\mathsf{stageCost}\,0 = 0

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{discount} : \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{stageCost} : \mathbb{N} \Rightarrow \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{horizon}
    : \mathbb{N}) \\

    &\mathsf{fep003\_pragmaticCost}\,\mathsf{discount}\,\mathsf{stageCost}\,(\mathsf{horizon} + 1) = \mathsf{fep003\_pragmaticCost}
    \\

    &\mathsf{discount}\,\mathsf{stageCost}\,\mathsf{horizon} + \mathsf{discount} ^ \mathsf{horizon} \cdot \mathsf{stageCost}\,\mathsf{horizon}

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{discount} : \mathbb{R}_{\ge 0}^{\infty})\,\{cost_{1}\,cost_{2} : \mathbb{N} \Rightarrow \mathbb{R}_{\ge 0}^{\infty}\}
    \\

    &(\mathsf{hcost} : \forall t, cost_{1}\,t \le cost_{2}\,t)\,(\mathsf{horizon} : \mathbb{N}) \\

    &\mathsf{fep003\_pragmaticCost}\,\mathsf{discount}\,cost_{1}\,\mathsf{horizon} \le \mathsf{fep003\_pragmaticCost}\,\mathsf{discount}
    \\

    &cost_{2}\,\mathsf{horizon}

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{discount} : \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{stageCost} : \mathbb{N} \Rightarrow \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{horizon}
    : \mathbb{N}) \\

    &\mathsf{fep003\_pragmaticCost}\,\mathsf{discount}\,\mathsf{stageCost}\,\mathsf{horizon} \le \mathsf{fep003\_pragmaticCost}\,\mathsf{discount}
    \\

    &\mathsf{stageCost}\,(\mathsf{horizon} + 1)

    \end{aligned}'
- id: fep-004
  title: Finite Diagonal Fisher Metric
  area: InfoGeometry
  family: core-information-geometry
  mathlib_modules:
  - Algebra.Order.BigOperators.Group.Finset
  mathlib_status: real
  primary_theorem: fep004_fisherMetric_eq_zero_iff
  supporting_theorems:
  - fep004_fisherMetric_symm
  - fep004_fisherMetric_nonneg
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A finite diagonal Fisher metric is symmetric and positive semidefinite under nonnegative information weights, and becomes
    positive definite under strictly positive weights. Assumption scope: The information weights are explicit inputs rather
    than derived from a statistical family in this row. Positive definiteness requires every coordinate weight to be strictly
    positive; fep-038 computes the one-dimensional Bernoulli weight and the composed theorem identifies that specialization.
    Semantic disposition: `formalized`.

    '
  assumption_review: The information weights are explicit inputs rather than derived from a statistical family in this row.
    Positive definiteness requires every coordinate weight to be strictly positive; fep-038 computes the one-dimensional Bernoulli
    weight and the composed theorem identifies that specialization.
  non_vacuity: Any strictly positive nonconstant weight vector and nonzero tangent has positive norm, while the zero-characterization
    excludes every nonzero coordinate direction.
  acceptance_probe: native Lean compile of fep004_fisherMetric_symm, fep004_fisherMetric_nonneg, fep004_fisherMetric_eq_zero_iff,
    and FEPComposed.fep004_bernoulliMetric_specialization.
  lean_sketch: "import Mathlib.Algebra.Order.BigOperators.Group.Finset\nimport Mathlib.Tactic\n\nnamespace FEP004\n\nopen\
    \ Finset\n\n/-- A finite diagonal Fisher metric with explicitly supplied information\nweights.  Statistical models such\
    \ as fep-038 compute these weights from\nexpected squared scores. -/\ndef fep004_fisherMetric {ι : Type*} [Fintype ι]\n\
    \    (information u v : ι → ℝ) : ℝ :=\n  ∑ i, information i * u i * v i\n\n/-- The finite Fisher metric is symmetric.\
    \ -/\ntheorem fep004_fisherMetric_symm {ι : Type*} [Fintype ι]\n    (information u v : ι → ℝ) :\n    fep004_fisherMetric\
    \ information u v =\n      fep004_fisherMetric information v u := by\n  apply Finset.sum_congr rfl\n  intro i _\n  ring\n\
    \n/-- Nonnegative information weights make every tangent self-pairing\nnonnegative. -/\ntheorem fep004_fisherMetric_nonneg\
    \ {ι : Type*} [Fintype ι]\n    (information v : ι → ℝ) (hinformation : ∀ i, 0 ≤ information i) :\n    0 ≤ fep004_fisherMetric\
    \ information v v := by\n  exact Finset.sum_nonneg fun i _ => by\n    simpa [mul_assoc] using\n      mul_nonneg (hinformation\
    \ i) (mul_self_nonneg (v i))\n\n/-- Strictly positive information weights make the metric positive definite:\nzero tangent\
    \ norm is equivalent to the zero tangent vector. -/\ntheorem fep004_fisherMetric_eq_zero_iff {ι : Type*} [Fintype ι]\n\
    \    (information v : ι → ℝ) (hinformation : ∀ i, 0 < information i) :\n    fep004_fisherMetric information v v = 0 ↔\
    \ ∀ i, v i = 0 := by\n  constructor\n  · intro hzero i\n    have hterm : information i * v i * v i = 0 :=\n      (Finset.sum_eq_zero_iff_of_nonneg\n\
    \        (fun j _ => by\n          simpa [mul_assoc] using\n            mul_nonneg (hinformation j).le (mul_self_nonneg\
    \ (v j)))).mp\n        hzero i (Finset.mem_univ i)\n    have hvv : v i * v i = 0 := by\n      apply (mul_eq_zero.mp (by\
    \ simpa [mul_assoc] using hterm)).resolve_left\n      exact ne_of_gt (hinformation i)\n    exact mul_self_eq_zero.mp hvv\n\
    \  · intro hv\n    simp [fep004_fisherMetric, hv]\n\nend FEP004\n"
  latex_equations:
  - '\begin{aligned}

    &\{\iota{} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\iota{}]\,(\mathsf{information}\,u\,v : \iota{} \Rightarrow \mathbb{R})
    \\

    &\mathsf{fep004\_fisherMetric}\,\mathsf{information}\,u\,v = \mathsf{fep004\_fisherMetric}\,\mathsf{information}\,v\,u

    \end{aligned}'
  - '\begin{aligned}

    &\{\iota{} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\iota{}]\,(\mathsf{information}\,v : \iota{} \Rightarrow \mathbb{R})
    \\

    &(\mathsf{hinformation} : \forall i, 0 \le \mathsf{information}\,i) \\

    &0 \le \mathsf{fep004\_fisherMetric}\,\mathsf{information}\,v\,v

    \end{aligned}'
  - '\begin{aligned}

    &\{\iota{} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\iota{}]\,(\mathsf{information}\,v : \iota{} \Rightarrow \mathbb{R})
    \\

    &(\mathsf{hinformation} : \forall i, 0 < \mathsf{information}\,i) \\

    &\mathsf{fep004\_fisherMetric}\,\mathsf{information}\,v\,v = 0 \leftrightarrow \forall i, v\,i = 0

    \end{aligned}'
- id: fep-005
  title: Four-Block State Partition
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Data.Finset.Basic
  mathlib_status: real
  primary_theorem: fep005_existsUnique_block
  supporting_theorems:
  - fep005_disjoint
  - fep005_total_cover
  - fep005_mem_iff
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A function-valued assignment partitions a 20-state finite space into four pairwise-disjoint blocks, and every state
    belongs to exactly one block. Assumption scope: Unconditional for any assignment Fin 20 → Fin 4. This establishes an exact
    finite partition only; it does not infer conditional independence or identify any block as a learned Markov blanket. Semantic
    disposition: `formalized`.

    '
  assumption_review: Unconditional for any assignment Fin 20 → Fin 4. This establishes an exact finite partition only; it
    does not infer conditional independence or identify any block as a learned Markov blanket.
  non_vacuity: Constant and nonconstant assignments both instantiate the partition, while unique membership rules out overlap
    for every state.
  acceptance_probe: native Lean compile of fep005_disjoint, fep005_mem_iff, and fep005_existsUnique_block, plus a concrete
    nonconstant assignment witness.
  lean_sketch: "import Mathlib.Data.Finset.Basic\nimport Mathlib.Data.Finset.Filter\nimport Mathlib.Data.Fintype.Basic\n\n\
    namespace FEP005\n\nopen Finset\n\nabbrev BlkPart := Fin 4  -- internal(0), sensory(1), active(2), active/external(3)\n\
    \n/-- Markov blanket partition: four components cover the full state space exactly. -/\ndef fep005_partitionCover (assign\
    \ : Fin 20 → BlkPart) (k : BlkPart) : Finset (Fin 20) :=\n  Finset.univ.filter (fun s => assign s = k)\n\n/-- The four\
    \ partition blocks are pairwise disjoint (functional determinism). -/\ntheorem fep005_disjoint (assign : Fin 20 → BlkPart)\
    \ (i j : BlkPart) (hij : i ≠ j) :\n    Disjoint (fep005_partitionCover assign i) (fep005_partitionCover assign j) := by\n\
    \  refine Finset.disjoint_left.mpr ?_\n  intro x hx hy\n  simp only [fep005_partitionCover, Finset.mem_filter, Finset.mem_univ,\
    \ true_and] at hx hy\n  exact hij ((Eq.symm hx).trans hy)\n\n/-- Every state belongs to exactly one partition block (totality\
    \ of assignment). -/\ntheorem fep005_total_cover (assign : Fin 20 → BlkPart) :\n    ∀ s : Fin 20, ∃ k : BlkPart, s ∈ fep005_partitionCover\
    \ assign k := by\n  intro s\n  refine ⟨assign s, Finset.mem_filter.mpr ⟨Finset.mem_univ s, rfl⟩⟩\n\n/-- Membership is\
    \ decidable: a state is in block k iff its assignment equals k. -/\ntheorem fep005_mem_iff (assign : Fin 20 → BlkPart)\
    \ (s : Fin 20) (k : BlkPart) :\n    s ∈ fep005_partitionCover assign k ↔ assign s = k := by\n  dsimp [fep005_partitionCover]\n\
    \  exact Iff.intro (fun h => (Finset.mem_filter.mp h).2)\n    fun hk => Finset.mem_filter.mpr ⟨Finset.mem_univ s, hk⟩\n\
    \n/-- Every state lies in one and only one block. -/\ntheorem fep005_existsUnique_block (assign : Fin 20 → BlkPart) (s\
    \ : Fin 20) :\n    ∃! k : BlkPart, s ∈ fep005_partitionCover assign k := by\n  refine ⟨assign s, (fep005_mem_iff assign\
    \ s (assign s)).2 rfl, ?_⟩\n  intro k hk\n  exact ((fep005_mem_iff assign s k).1 hk).symm\n\nend FEP005\n"
