  semantic_disposition: formalized
  nl: 'At positive evidence, posterior odds equal prior odds times the likelihood ratio, and a zero-prior hypothesis retains
    zero posterior mass. Assumption scope: Hypothesis and evidence carriers are finite. Total evidence, the reference prior
    mass, and the reference likelihood must be strictly positive before forming ordinary real odds. The zero-prior theorem
    marks lack of posterior support rather than permitting recovery by conditioning. Semantic disposition: `formalized`.

    '
  assumption_review: Hypothesis and evidence carriers are finite. Total evidence, the reference prior mass, and the reference
    likelihood must be strictly positive before forming ordinary real odds. The zero-prior theorem marks lack of posterior
    support rather than permitting recovery by conditioning.
  non_vacuity: Unequal positive likelihoods move the favored-to-reference odds multiplicatively, while a separate zero-prior
    hypothesis remains exactly absent from the posterior.
  acceptance_probe: native Lean compile of fep117_posteriorOdds_recursion and fep117_zero_prior_boundary with all denominator-support
    premises.
  lean_sketch: "import FepSketches.learning_theory\n\n/-! # Posterior-Odds Multiplicative Recursion -/\nnamespace FEP117\n\
    \nopen FEP\n\n/-- At positive evidence, posterior odds equal prior odds times the likelihood\nratio, provided the reference\
    \ hypothesis has positive prior and likelihood. -/\ntheorem fep117_posteriorOdds_recursion\n    {Hypothesis Evidence :\
    \ Type*} [Fintype Hypothesis] [Fintype Evidence]\n    (prior : FiniteLaw Hypothesis)\n    (likelihood : FiniteKernel Hypothesis\
    \ Evidence)\n    (evidence : Evidence)\n    (evidencePositive : 0 < likelihood.predictive prior evidence)\n    (favored\
    \ reference : Hypothesis)\n    (referencePriorPositive : 0 < prior reference)\n    (referenceLikelihoodPositive : 0 <\
    \ likelihood reference evidence) :\n    FEP.LearningTheory.posteriorOdds\n        prior likelihood evidence evidencePositive\
    \ favored reference =\n      (prior favored / prior reference) *\n        (likelihood favored evidence / likelihood reference\
    \ evidence) :=\n  FEP.LearningTheory.posteriorOdds_recursion\n    prior likelihood evidence evidencePositive favored reference\n\
    \    referencePriorPositive referenceLikelihoodPositive\n\n/-- A zero-prior hypothesis cannot be recovered by conditioning\
    \ on positive\nevidence. -/\ntheorem fep117_zero_prior_boundary\n    {Hypothesis Evidence : Type*} [Fintype Hypothesis]\
    \ [Fintype Evidence]\n    (prior : FiniteLaw Hypothesis)\n    (likelihood : FiniteKernel Hypothesis Evidence)\n    (evidence\
    \ : Evidence)\n    (evidencePositive : 0 < likelihood.predictive prior evidence)\n    (hypothesis : Hypothesis) (priorZero\
    \ : prior hypothesis = 0) :\n    likelihood.posterior prior evidence evidencePositive hypothesis = 0 :=\n  FEP.LearningTheory.posterior_zero_of_prior_zero\n\
    \    prior likelihood evidence evidencePositive hypothesis priorZero\n\nend FEP117\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{Hypothesis}\,\mathsf{Evidence} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{Hypothesis}]\,[\mathsf{Fintype}\,\mathsf{Evidence}]
    \\

