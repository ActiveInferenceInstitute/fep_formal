- id: fep-011
  title: Surprise and Self-Information
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - Analysis.SpecialFunctions.Log.Basic
  mathlib_status: real
  primary_theorem: fep011_surprise_eq_zero_iff
  supporting_theorems:
  - fep011_log_nonneg_on_ge_one
  - fep011_surprise_nonneg
  - fep011_surprise_additive
  - fep011_surprise_cert
  - fep011_surprise_mono
  - fep011_surprise_strictAnti
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Negative-log self-information is nonnegative on positive probabilities at most one, additive on positive products,
    strictly antitone, and zero exactly at certainty. Assumption scope: Positivity excludes the logarithmic boundary, and
    the probability interpretation additionally uses p≤1. Additivity is scalar and corresponds to product probabilities; no
    independence relation is inferred by the theorem. Semantic disposition: `formalized`.

    '
  assumption_review: Positivity excludes the logarithmic boundary, and the probability interpretation additionally uses p≤1.
    Additivity is scalar and corresponds to product probabilities; no independence relation is inferred by the theorem.
  non_vacuity: Every p in (0,1) has strictly positive surprise, p=1 is the unique zero, and two positive factors exercise
    the additive law.
  acceptance_probe: native Lean compile of fep011_surprise_nonneg, fep011_surprise_additive, fep011_surprise_eq_zero_iff,
    and fep011_surprise_strictAnti.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Log.Basic\n\nnamespace FEP011\n\nopen Real\n\n/-- Shannon self-information\
    \ (surprise) of a positive scalar probability. -/\nnoncomputable def fep011_surprise (probability : ℝ) : ℝ :=\n  -Real.log\
    \ probability\n\n/-- Self-information: log is nonnegative on ``[1, ∞)``. -/\ntheorem fep011_log_nonneg_on_ge_one {x :\
    \ ℝ} (hx : 1 ≤ x) : 0 ≤ Real.log x :=\n  Real.log_nonneg hx\n\n/-- Coding cost ``-log u`` is nonnegative for probabilities\
    \ ``u ∈ (0, 1]``. -/\ntheorem fep011_surprise_nonneg {u : ℝ} (hu : 0 < u) (hu1 : u ≤ 1) :\n    0 ≤ fep011_surprise u :=\n\
    \  neg_nonneg.mpr (Real.log_nonpos (le_of_lt hu) hu1)\n\n/-- Surprise is additive for independent observations: -log(ab)\
    \ = -log a + -log b. -/\ntheorem fep011_surprise_additive {a b : ℝ} (ha : 0 < a) (hb : 0 < b) :\n    fep011_surprise (a\
    \ * b) = fep011_surprise a + fep011_surprise b := by\n  simp only [fep011_surprise]\n  rw [Real.log_mul (ne_of_gt ha)\
    \ (ne_of_gt hb), neg_add]\n\n/-- Surprise of certain event (u = 1) is zero. -/\ntheorem fep011_surprise_cert : fep011_surprise\
    \ 1 = 0 := by\n  simp [fep011_surprise]\n\n/-- Surprise is monotone decreasing in probability: larger p → lower surprise.\
    \ -/\ntheorem fep011_surprise_mono {p q : ℝ} (hp : 0 < p) (h : p ≤ q) :\n    fep011_surprise q ≤ fep011_surprise p :=\n\
    \  neg_le_neg (Real.log_le_log hp h)\n\n/-- On positive probabilities, only a certain event has zero surprise. -/\ntheorem\
    \ fep011_surprise_eq_zero_iff {p : ℝ} (hp : 0 < p) :\n    fep011_surprise p = 0 ↔ p = 1 := by\n  constructor\n  · intro\
    \ hzero\n    exact Real.eq_one_of_pos_of_log_eq_zero hp (neg_eq_zero.mp hzero)\n  · rintro rfl\n    exact fep011_surprise_cert\n\
    \n/-- Surprise is strictly antitone on positive probabilities. -/\ntheorem fep011_surprise_strictAnti {p q : ℝ} (hp :\
    \ 0 < p) (hpq : p < q) :\n    fep011_surprise q < fep011_surprise p := by\n  exact neg_lt_neg (Real.log_lt_log hp hpq)\n\
    \nend FEP011\n"
