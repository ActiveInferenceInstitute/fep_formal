- id: fep-116
  title: Finite-Hypothesis PAC-Bayes Loss-Gap Bound
  area: FEP
  family: learning-concentration-and-model-evidence
  mathlib_modules:
  - Probability.Moments.SubGaussian
  - InformationTheory.KullbackLeibler.Basic
  mathlib_status: real
  primary_theorem: fep116_finitePACBayes_with_confidence
  supporting_theorems:
  - fep116_prior_support_nonzero
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'For any finite posterior, a Gibbs certificate whose potential is inverse temperature times the population-minus-empirical
    loss gap converts a certified log-MGF budget into an empirical-loss plus KL-complexity population-loss bound. Assumption
    scope: Hypotheses are finite; inverse temperature is positive; the Gibbs reference equals the prior and carries full support;
    confidence lies in (0,1); and the certificate log partition is bounded by log(confidence^-1). The theorem is deterministic
    conditional on this log-MGF premise and does not itself prove that the premise holds with high probability over data.
    Semantic disposition: `formalized`.

    '
  assumption_review: Hypotheses are finite; inverse temperature is positive; the Gibbs reference equals the prior and carries
    full support; confidence lies in (0,1); and the certificate log partition is bounded by log(confidence^-1). The theorem
    is deterministic conditional on this log-MGF premise and does not itself prove that the premise holds with high probability
    over data.
  non_vacuity: Unequal posterior and prior laws contribute a finite KL penalty, nonzero loss gaps enter through the certified
    potential, and smaller confidence increases the explicit log(confidence^-1) budget.
  acceptance_probe: native Lean compile of fep116_finitePACBayes_with_confidence and fep116_prior_support_nonzero with positive
    inverse temperature, reference identity, loss-gap potential identity, confidence interval, and log-MGF bound.
  lean_sketch: "import FepSketches.learning_theory\n\n/-! # Finite-Hypothesis PAC-Bayes Loss-Gap Bound -/\nnamespace FEP116\n\
    \nopen FEP MeasureTheory ProbabilityTheory\nopen scoped ENNReal MeasureTheory ProbabilityTheory\n\n/-- A finite posterior's\
    \ population loss is controlled by its empirical loss,\nfinite KL complexity, and a certified log-MGF budget. The Gibbs\
    \ potential is\nexplicitly the inverse-temperature-scaled loss gap. -/\ntheorem fep116_finitePACBayes_with_confidence\n\
    \    {Hypothesis : Type*} [Fintype Hypothesis]\n    (prior posterior : FiniteLaw Hypothesis)\n    (certificate : FEP.VariationalDuality.GibbsCertificate\
    \ Hypothesis)\n    (referenceIsPrior : certificate.reference = prior)\n    (empiricalLoss populationLoss : Hypothesis\
    \ → ℝ)\n    (inverseTemperature : ℝ)\n    (inverseTemperaturePositive : 0 < inverseTemperature)\n    (potentialIsLossGap\
    \ : ∀ hypothesis,\n      certificate.potential hypothesis = inverseTemperature *\n        (populationLoss hypothesis -\
    \ empiricalLoss hypothesis))\n    (confidence : ℝ)\n    (confidencePositive : 0 < confidence)\n    (confidenceBelowOne\
    \ : confidence < 1)\n    (logMGFBound : certificate.logPartition ≤ Real.log confidence⁻¹) :\n    FEP.VariationalDuality.expectation\
    \ posterior populationLoss ≤\n      FEP.VariationalDuality.expectation posterior empiricalLoss +\n        (FEP.FiniteInformation.finiteKL\
    \ posterior prior +\n          Real.log confidence⁻¹) / inverseTemperature :=\n  (FEP.LearningTheory.finitePACBayes_changeOfMeasure_with_confidence\n\
    \    prior posterior certificate referenceIsPrior empiricalLoss populationLoss\n    inverseTemperature inverseTemperaturePositive\
    \ potentialIsLossGap confidence\n    confidencePositive confidenceBelowOne logMGFBound).1\n\n/-- A full-support finite\
    \ prior has no zero-mass atom, matching the support\nboundary required by finite KL and Gibbs log-density terms. -/\n\
    theorem fep116_prior_support_nonzero\n    {Hypothesis : Type*} [Fintype Hypothesis]\n    (prior : FiniteLaw Hypothesis)\n\
    \    (priorPositive : ∀ hypothesis, 0 < prior hypothesis)\n    (hypothesis : Hypothesis) :\n    prior hypothesis ≠ 0 :=\n\
    \  ne_of_gt (priorPositive hypothesis)\n\nend FEP116\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{Hypothesis} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{Hypothesis}] \\

    &(\mathsf{prior}\,\mathsf{posterior} : \mathsf{FiniteLaw}\,\mathsf{Hypothesis})\,(\mathsf{certificate} : \\

    &\mathsf{FEP.VariationalDuality.GibbsCertificate}\,\mathsf{Hypothesis}) \\

    &(\mathsf{referenceIsPrior} : \mathsf{certificate.reference} = \mathsf{prior}) \\

    &(\mathsf{empiricalLoss}\,\mathsf{populationLoss} : \mathsf{Hypothesis} \Rightarrow \mathbb{R})\,(\mathsf{inverseTemperature}
    : \mathbb{R}) \\

    &(\mathsf{inverseTemperaturePositive} : 0 < \mathsf{inverseTemperature})\,(\mathsf{potentialIsLossGap} : \forall \\

    &\mathsf{hypothesis}, \mathsf{certificate.potential}\,\mathsf{hypothesis} = \mathsf{inverseTemperature} \\

    &\cdot (\mathsf{populationLoss}\,\mathsf{hypothesis} - \mathsf{empiricalLoss}\,\mathsf{hypothesis}))\,(\mathsf{confidence}
    : \mathbb{R}) \\

    &(\mathsf{confidencePositive} : 0 < \mathsf{confidence})\,(\mathsf{confidenceBelowOne} : \mathsf{confidence} < 1) \\

    &(\mathsf{logMGFBound} : \mathsf{certificate.logPartition} \le \mathsf{Real.log}\,\mathsf{confidence}^{-1}) \\

    &\mathsf{FEP.VariationalDuality.expectation}\,\mathsf{posterior}\,\mathsf{populationLoss} \\

    &\le \mathsf{FEP.VariationalDuality.expectation}\,\mathsf{posterior}\,\mathsf{empiricalLoss} \\

    &+ (\mathsf{FEP.FiniteInformation.finiteKL}\,\mathsf{posterior}\,\mathsf{prior} + \mathsf{Real.log}\,\mathsf{confidence}^{-1})
    \\

    &/ \mathsf{inverseTemperature}

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{Hypothesis} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{Hypothesis}]\,(\mathsf{prior} : \mathsf{FiniteLaw}\,\mathsf{Hypothesis})
    \\

    &(\mathsf{priorPositive} : \forall \mathsf{hypothesis}, 0 < \mathsf{prior}\,\mathsf{hypothesis})\,(\mathsf{hypothesis}
    : \mathsf{Hypothesis}) \\

    &\mathsf{prior}\,\mathsf{hypothesis} \ne 0

    \end{aligned}'
- id: fep-117
  title: Posterior-Odds Multiplicative Recursion
