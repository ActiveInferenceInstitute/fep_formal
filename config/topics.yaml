  - fep048_async_mono
  - fep048_halfUpdate_contracts
  - fep048_halfUpdate_unique_fixed_point
  - fep048_halfUpdate_iterates_converge
  - fep048_id_mono
  - fep048_add_mono
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Mathlib''s global ContractingWith contract gives a unique fixed point on ℝ, and iterations of the concrete halving
    update converge to zero. Assumption scope: ContractingWith packages a nonnegative Lipschitz coefficient strictly below
    one. Completeness and nonemptiness of ℝ discharge the Banach fixed-point assumptions; no claim is made for arbitrary noncontractive
    policy updates. Semantic disposition: `formalized`.

    '
  assumption_review: ContractingWith packages a nonnegative Lipschitz coefficient strictly below one. Completeness and nonemptiness
    of ℝ discharge the Banach fixed-point assumptions; no claim is made for arbitrary noncontractive policy updates.
  non_vacuity: The nonconstant update x ↦ x/2 is certified with coefficient 1/2, has zero as its unique fixed point, and has
    iterates converging to zero from every real start.
  acceptance_probe: native Lean compile of the native uniqueness wrapper, halving contraction, unique-zero, and iterate-convergence
    theorems.
  lean_sketch: "import Mathlib.Order.Monotone.Basic\nimport Mathlib.Topology.MetricSpace.Contracting\nimport Mathlib.Tactic\n\
    \nnamespace FEP048\n\nopen Topology\n\n-- [proof strategy: native Mathlib ContractingWith and fixed-point API]\n\n/--\
    \ Sync update: both components advance together, total is nonneg. -/\ntheorem fep048_sync_nonneg (a b : ℝ) (ha : 0 ≤ a)\
    \ (hb : 0 ≤ b) : 0 ≤ a + b :=\n  add_nonneg ha hb\n\n/-- Async update: sequential composition preserves monotonicity.\
    \ -/\ntheorem fep048_async_mono (f g : ℝ → ℝ) (hf : Monotone f) (hg : Monotone g) :\n    Monotone (g ∘ f) :=\n  hg.comp\
    \ hf\n\n/-- Mathlib's global contraction contract gives fixed-point uniqueness. -/\ntheorem fep048_contraction_unique\
    \ (f : ℝ → ℝ) (c : NNReal)\n    (hcontract : ContractingWith c f) (x y : ℝ)\n    (hfx : Function.IsFixedPt f x) (hfy :\
    \ Function.IsFixedPt f y) : x = y :=\n  hcontract.fixedPoint_unique' hfx hfy\n\n/-- A concrete nontrivial contraction\
    \ used as an executable witness. -/\nnoncomputable def fep048_halfUpdate (x : ℝ) : ℝ := x / 2\n\n/-- Halving contracts\
    \ distances by exactly one half. -/\ntheorem fep048_halfUpdate_contracts :\n    ContractingWith (1 / 2 : NNReal) fep048_halfUpdate\
    \ := by\n  refine ⟨by norm_num, LipschitzWith.of_dist_le_mul ?_⟩\n  intro a b\n  simp only [fep048_halfUpdate, Real.dist_eq]\n\
    \  rw [← sub_div, abs_div]\n  norm_num [div_eq_mul_inv]\n  rw [mul_comm]\n\n/-- The concrete halving contraction has zero\
    \ as its unique fixed point. -/\ntheorem fep048_halfUpdate_unique_fixed_point (x : ℝ)\n    (hx : Function.IsFixedPt fep048_halfUpdate\
    \ x) : x = 0 := by\n  exact fep048_halfUpdate_contracts.fixedPoint_unique' hx (by\n    change fep048_halfUpdate 0 = 0\n\
    \    norm_num [fep048_halfUpdate])\n\n/-- Iterating the halving update from any real initial state converges to zero.\
    \ -/\ntheorem fep048_halfUpdate_iterates_converge (x : ℝ) :\n    Filter.Tendsto (fun n ↦ fep048_halfUpdate^[n] x) Filter.atTop\
    \ (\U0001D4DD 0) := by\n  have hzero : Function.IsFixedPt fep048_halfUpdate 0 := by\n    change fep048_halfUpdate 0 =\
    \ 0\n    norm_num [fep048_halfUpdate]\n  have hfixed : ContractingWith.fixedPoint fep048_halfUpdate\n      fep048_halfUpdate_contracts\
    \ = 0 :=\n    (fep048_halfUpdate_contracts.fixedPoint_unique hzero).symm\n  rw [← hfixed]\n  exact fep048_halfUpdate_contracts.tendsto_iterate_fixedPoint\
    \ x\n\n/-- Identity update is monotone (trivial sync). -/\ntheorem fep048_id_mono : Monotone (id : ℝ → ℝ) := fun _ _ h\
    \ => h\n\n/-- Sum of monotone scalar updates is monotone. -/\ntheorem fep048_add_mono (f g : ℝ → ℝ) (hf : Monotone f)\
    \ (hg : Monotone g) :\n    Monotone (fun x => f x + g x) :=\n  fun _ _ h => add_le_add (hf h) (hg h)\n\nend FEP048\n"
  latex_equations:
  - '\begin{aligned}

    &(a\,b : \mathbb{R})\,(\mathsf{ha} : 0 \le a)\,(\mathsf{hb} : 0 \le b) \\

    &0 \le a + b

    \end{aligned}'
  - '\begin{aligned}

    &(f\,g : \mathbb{R} \Rightarrow \mathbb{R})\,(\mathsf{hf} : \mathsf{Monotone}\,f)\,(\mathsf{hg} : \mathsf{Monotone}\,g)
    \\

    &\mathsf{Monotone}\,(g \circ f)

    \end{aligned}'
  - '\begin{aligned}

    &(f : \mathbb{R} \Rightarrow \mathbb{R})\,(c : \mathbb{R}_{\ge 0})\,(\mathsf{hcontract} : \mathsf{ContractingWith}\,c\,f)\,(x\,y
    : \mathbb{R}) \\

    &(\mathsf{hfx} : \mathsf{Function.IsFixedPt}\,f\,x)\,(\mathsf{hfy} : \mathsf{Function.IsFixedPt}\,f\,y) \\

    &x = y

    \end{aligned}'
  - '\mathsf{ContractingWith}\,(1 / 2 : \mathbb{R}_{\ge 0})\,\mathsf{fep048\_halfUpdate}'
  - '\begin{aligned}

    &(x : \mathbb{R})\,(\mathsf{hx} : \mathsf{Function.IsFixedPt}\,\mathsf{fep048\_halfUpdate}\,x) \\

    &x = 0

    \end{aligned}'
  - '\begin{aligned}

    &(x : \mathbb{R}) \\

    &\mathsf{Filter.Tendsto}\,(\lambda\,n \mapsto \mathsf{fep048\_halfUpdate}^[n]\,x)\,\mathsf{Filter.atTop}\,(\mathcal{N}\,0)

    \end{aligned}'
  - '\mathsf{Monotone}\,(\mathsf{id} : \mathbb{R} \Rightarrow \mathbb{R})'
