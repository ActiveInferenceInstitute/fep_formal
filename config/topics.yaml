  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The scalar Bregman divergence generated by φ(x)=x² equals (x-y)², is nonnegative, and vanishes exactly when x=y. Assumption
    scope: Unconditional over real x and y for the explicit quadratic generator; no general differentiable convex function,
    projection theorem, or mirror-descent convergence is claimed. Semantic disposition: `formalized`.

    '
  assumption_review: Unconditional over real x and y for the explicit quadratic generator; no general differentiable convex
    function, projection theorem, or mirror-descent convergence is claimed.
  non_vacuity: At x=1 and y=0 the divergence equals 1; at x=y it equals 0.
  acceptance_probe: native Lean compile of the quadratic identity, nonnegativity, and zero-characterization theorems.
  lean_sketch: "import Mathlib.Analysis.Convex.Basic\nimport Mathlib.Tactic\n\nnamespace FEP029\n\n/-- Bregman divergence\
    \ prerequisite: convex functions satisfy the secant inequality. -/\ntheorem fep029_secant_ineq (a b t : ℝ) (ht0 : 0 ≤\
    \ t) (_ht1 : t ≤ 1) (hab : a ≤ b) :\n    (1 - t) * a + t * b ≥ a := by\n  nlinarith\n\n/-- Weighted midpoint lies between\
    \ endpoints (convex combination). -/\ntheorem fep029_convex_combo_bound (a b t : ℝ) (_ht0 : 0 ≤ t) (ht1 : t ≤ 1) (hab\
    \ : a ≤ b) :\n    (1 - t) * a + t * b ≤ b := by\n  nlinarith\n\n/-- Endpoints of convex combination: t = 0 gives a. -/\n\
    theorem fep029_combo_t_zero (a b : ℝ) : (1 - 0) * a + 0 * b = a := by ring\n\n/-- Endpoints of convex combination: t =\
    \ 1 gives b. -/\ntheorem fep029_combo_t_one (a b : ℝ) : (1 - 1) * a + 1 * b = b := by ring\n\n/-- The Bregman divergence\
    \ generated by φ(x) = x², whose derivative at y is 2y. -/\ndef fep029_quadraticBregman (x y : ℝ) : ℝ :=\n  x ^ 2 - y ^\
    \ 2 - (2 * y) * (x - y)\n\n/-- The quadratic Bregman divergence is exactly squared Euclidean distance. -/\ntheorem fep029_quadraticBregman_eq_sq\
    \ (x y : ℝ) :\n    fep029_quadraticBregman x y = (x - y) ^ 2 := by\n  simp [fep029_quadraticBregman]\n  ring\n\n/-- The\
    \ quadratic Bregman divergence is nonnegative. -/\ntheorem fep029_bregman_quadratic_nonneg (x y : ℝ) :\n    0 ≤ fep029_quadraticBregman\
    \ x y := by\n  rw [fep029_quadraticBregman_eq_sq]\n  exact sq_nonneg _\n\n/-- The quadratic Bregman divergence separates\
    \ points. -/\ntheorem fep029_quadraticBregman_eq_zero_iff (x y : ℝ) :\n    fep029_quadraticBregman x y = 0 ↔ x = y :=\
    \ by\n  rw [fep029_quadraticBregman_eq_sq, sq_eq_zero_iff, sub_eq_zero]\n\nend FEP029\n"
