    \n/-- An empirical absolute-error certificate transfers through add-one\nsmoothing with exact shrinkage and offset terms.\
    \ -/\ntheorem fep123_laplaceAbsoluteError_le\n    (successes sampleCount : ℕ) (target error : ℝ)\n    (sampleCountPositive\
