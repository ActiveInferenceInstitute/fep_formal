  - '\begin{aligned}

    &\{v : \mathbb{R}\}\,(\mathsf{hv} : 0 < v) \\

    &\mathsf{HasDerivAt}\,\mathsf{fep040\_gaussianEntropy}\,(1 / (2 \cdot v))\,v

