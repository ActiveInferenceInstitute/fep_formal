- id: fep-121
  title: Laplace-Smoothing Error Identity
  area: FEP
  family: finite-sample-risk-and-calibration
  mathlib_modules:
  - Algebra.Order.BigOperators.Group.Finset
  mathlib_status: real
  primary_theorem: fep121_laplaceError_identity
  supporting_theorems:
  - fep121_shrinkage_mem_unitInterval
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'For a positive finite sample, add-one smoothing decomposes forecast error into contracted empirical error plus an exact
    target-dependent offset. Assumption scope: The success count and sample count are natural numbers, sample count is positive,
    successes do not exceed it, and the target lies in the unit interval. The theorem is an algebraic identity, not a stochastic
    consistency or posterior-contraction result. Semantic disposition: `formalized`.

    '
  assumption_review: The success count and sample count are natural numbers, sample count is positive, successes do not exceed
    it, and the target lies in the unit interval. The theorem is an algebraic identity, not a stochastic consistency or posterior-contraction
    result.
  non_vacuity: The shrinkage coefficient lies in the unit interval and the separate boundary witness in fep-122 shows that
    the offset can be nonzero.
  acceptance_probe: warning-free native Lean compile of fep121_laplaceError_identity and fep121_shrinkage_mem_unitInterval
    with the positive-sample premises.
  lean_sketch: "import FepSketches.empirical_risk\n\n/-! # Laplace-Smoothing Error Identity -/\nnamespace FEP121\n\nopen FEP.EmpiricalRisk\n\
    \n/-- For a positive finite sample, add-one error is contracted empirical error\nplus the exact target-dependent offset.\
    \ -/\ntheorem fep121_laplaceError_identity\n    (successes sampleCount : ℕ) (target : ℝ)\n    (sampleCountPositive : 0\
    \ < sampleCount)\n    (successesAtMost : successes ≤ sampleCount)\n    (targetBounds : target ∈ Set.Icc (0 : ℝ) 1) :\n\
    \    laplaceEstimate successes sampleCount - target =\n      shrinkage sampleCount * (empiricalRate successes sampleCount\
    \ - target) +\n        laplaceBias sampleCount target := by\n  have _ := successesAtMost\n  have _ := targetBounds\n \
    \ exact laplaceError_identity successes sampleCount target sampleCountPositive\n\n/-- The contraction coefficient remains\
    \ in the closed unit interval. -/\ntheorem fep121_shrinkage_mem_unitInterval (sampleCount : ℕ) :\n    shrinkage sampleCount\
    \ ∈ Set.Icc (0 : ℝ) 1 :=\n  ⟨shrinkage_nonneg sampleCount, shrinkage_le_one sampleCount⟩\n\nend FEP121\n"
  latex_equations:
  - '\begin{aligned}

    &(\mathsf{successes}\,\mathsf{sampleCount} : \mathbb{N})\,(\mathsf{target} : \mathbb{R})\,(\mathsf{sampleCountPositive}
    : 0 < \mathsf{sampleCount}) \\

    &(\mathsf{successesAtMost} : \mathsf{successes} \le \mathsf{sampleCount}) \\

    &(\mathsf{targetBounds} : \mathsf{target} \in \mathsf{Set.Icc}\,(0 : \mathbb{R})\,1) \\

    &\mathsf{laplaceEstimate}\,\mathsf{successes}\,\mathsf{sampleCount} - \mathsf{target} = \mathsf{shrinkage}\,\mathsf{sampleCount}
    \\

    &\cdot (\mathsf{empiricalRate}\,\mathsf{successes}\,\mathsf{sampleCount} - \mathsf{target}) + \mathsf{laplaceBias}\,\mathsf{sampleCount}
    \\

    &\mathsf{target}

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{sampleCount} : \mathbb{N}) \\

    &\mathsf{shrinkage}\,\mathsf{sampleCount} \in \mathsf{Set.Icc}\,(0 : \mathbb{R})\,1

    \end{aligned}'
