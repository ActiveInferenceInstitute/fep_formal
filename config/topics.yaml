- id: fep-030
  title: Maximum Entropy Principle
  area: Thermodynamics
  family: core-thermodynamics
  mathlib_modules:
  - Analysis.SpecialFunctions.BinaryEntropy
  mathlib_status: real
  primary_theorem: fep030_binaryEntropy_max
  supporting_theorems:
  - fep030_binaryEntropy_eq_max_iff
  - fep030_uniform_nonneg
  - fep030_uniform_sum_one
  - fep030_log_card_nonneg
  - fep030_entropy_eq_log
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Binary Shannon entropy in nats is globally at most log 2, with equality exactly at probability one half. Assumption
    scope: The native Mathlib theorem is unconditional over real inputs because Real.binEntropy has a total extension; the
    scientific probability domain is [0,1]. This is the Bernoulli maximum-entropy principle, not the general constrained Jaynes
    problem. Semantic disposition: `formalized`.

    '
  assumption_review: The native Mathlib theorem is unconditional over real inputs because Real.binEntropy has a total extension;
    the scientific probability domain is [0,1]. This is the Bernoulli maximum-entropy principle, not the general constrained
    Jaynes problem.
  non_vacuity: The equality characterization proves attainment at p = 1/2 and strict loss at every other real input.
  acceptance_probe: native Lean compile of fep030_binaryEntropy_max and fep030_binaryEntropy_eq_max_iff, plus the retained
    finite-uniform entropy calculation.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.BinaryEntropy\nimport Mathlib.Algebra.BigOperators.Ring.Finset\n\
    import Mathlib.Basic.Real.Basic\nimport Mathlib.Tactic\n\nnamespace FEP030\n\nopen Real Finset\n\n-- [proof strategy:\
    \ native binary-entropy maximum plus explicit finite-uniform calculation]\n\n/-- Binary Shannon entropy (in nats) is globally\
    \ bounded above by log 2. -/\ntheorem fep030_binaryEntropy_max (p : ℝ) :\n    Real.binEntropy p ≤ Real.log 2 :=\n  Real.binEntropy_le_log_two\n\
    \n/-- The binary entropy maximum is attained uniquely at probability one half. -/\ntheorem fep030_binaryEntropy_eq_max_iff\
    \ (p : ℝ) :\n    Real.binEntropy p = Real.log 2 ↔ p = (2 : ℝ)⁻¹ :=\n  Real.binEntropy_eq_log_two\n\n/-- A uniform scalar\
    \ weight is nonnegative. -/\ntheorem fep030_uniform_nonneg (n : ℕ) (_hn : 0 < n) : 0 ≤ (1 : ℝ) / n :=\n  div_nonneg zero_le_one\
    \ (Nat.cast_nonneg' (n := n))\n\n/-- Uniform weights on a positive finite range sum to one. -/\ntheorem fep030_uniform_sum_one\
    \ (n : ℕ) (hn : 0 < n) :\n    ∑ _ ∈ Finset.range n, (1 : ℝ) / n = 1 := by\n  rw [Finset.sum_const, Finset.card_range,\
    \ nsmul_eq_mul]\n  have hn0 : (n : ℝ) ≠ 0 := Nat.cast_ne_zero.mpr (Nat.ne_of_gt hn)\n  field_simp [hn0]\n\n/-- The logarithm\
    \ of a positive natural cardinality is nonnegative. -/\ntheorem fep030_log_card_nonneg (n : ℕ) (hn : 1 ≤ n) : 0 ≤ Real.log\
    \ n := by\n  apply Real.log_nonneg\n  exact_mod_cast hn\n\n/-- The explicit uniform-weight entropy expression equals log\
    \ n; maximality is not proved. -/\ntheorem fep030_entropy_eq_log (n : ℕ) (hn : 0 < n) :\n    -∑ _ ∈ Finset.range n, (1\
    \ : ℝ) / n * Real.log ((1 : ℝ) / n)\n    = Real.log n := by\n  have hnR : (n : ℝ) ≠ 0 := Nat.cast_ne_zero.mpr (Nat.ne_of_gt\
    \ hn)\n  have hlog : Real.log ((1 : ℝ) / n) = - Real.log n := by\n    rw [Real.log_div (one_ne_zero' ℝ) hnR, Real.log_one,\
    \ zero_sub]\n  have hsum : ∑ _ ∈ Finset.range n, (1 : ℝ) / n * Real.log ((1 : ℝ) / n) = - Real.log n := by\n    calc\n\
    \      ∑ _ ∈ Finset.range n, (1 : ℝ) / n * Real.log ((1 : ℝ) / n)\n          = ∑ _ ∈ Finset.range n, (1 : ℝ) / n * (-\
    \ Real.log n) :=\n            Finset.sum_congr rfl fun _ _ => by rw [hlog]\n      _ = (∑ _ ∈ Finset.range n, (1 : ℝ) /\
    \ n) * (- Real.log n) := by rw [← Finset.sum_mul]\n      _ = 1 * (- Real.log n) := by rw [fep030_uniform_sum_one n hn]\n\
    \      _ = - Real.log n := by ring\n  rw [hsum, neg_neg]\n\nend FEP030\n"
  latex_equations:
