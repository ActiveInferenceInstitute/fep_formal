    \\

    &\mathsf{likelihoodBad}\,\mathsf{sampleCount} \le (\mathsf{priorBad} / \mathsf{priorGood}) \cdot \mathsf{Real.exp} \\

    &(-((\mathsf{sampleCount} : \mathbb{R}) \cdot \mathsf{likelihoodGap}))

