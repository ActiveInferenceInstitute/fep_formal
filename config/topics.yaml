    \times \beta{})\,\gamma{}) \\

    &(\mathsf{fep027\_hierarchicalJoint}\,\mu{}\,\kappa{} \mathbin{\otimes_{m}}\,\eta{}).\mathsf{map}\,\mathsf{MeasurableEquiv.prodAssoc}
