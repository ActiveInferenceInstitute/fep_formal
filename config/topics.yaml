    \    (empiricalErrorBound :\n      |empiricalRate successes sampleCount - target| ≤ error) :\n    |laplaceEstimate successes\
    \ sampleCount - target| ≤\n      shrinkage sampleCount * error + 1 / ((sampleCount : ℝ) + 2) := by\n  have _ := successesAtMost\n\
