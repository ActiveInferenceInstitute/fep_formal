  primary_theorem: fep118_posteriorGap_concentration
  supporting_theorems: []
  boundary_theorems:
  - fep118_twoHypothesis_witness
  semantic_disposition: formalized
  nl: 'A nonnegative per-observation likelihood gap yields an explicit exponential finite-sample upper bound on inferior two-hypothesis
    posterior weight. Assumption scope: Good prior and likelihood weights are strictly positive, bad weights and the gap are
    nonnegative, and bad likelihood is bounded by exp(-gap) times good likelihood. These are scalar two-hypothesis weights,
    not a theorem of consistency for an arbitrary normalized model class. Semantic disposition: `formalized`.

    '
  assumption_review: Good prior and likelihood weights are strictly positive, bad weights and the gap are nonnegative, and
    bad likelihood is bounded by exp(-gap) times good likelihood. These are scalar two-hypothesis weights, not a theorem of
    consistency for an arbitrary normalized model class.
  non_vacuity: Equal priors with likelihood ratio three to one give exact inferior posterior mass one tenth after two observations,
    so the posterior is positive yet genuinely concentrated.
  acceptance_probe: native Lean compile of fep118_posteriorGap_concentration and fep118_twoHypothesis_witness with the likelihood-gap
    inequality explicit.
  lean_sketch: "import FepSketches.learning_theory\n\n/-! # Exponential Posterior Concentration from a Likelihood Gap -/\n\
    namespace FEP118\n\n/-- A nonnegative per-observation likelihood gap gives an explicit exponential\nfinite-sample bound\
    \ on inferior posterior mass. -/\ntheorem fep118_posteriorGap_concentration\n    (priorGood priorBad likelihoodGood likelihoodBad\
    \ likelihoodGap : ℝ)\n    (sampleCount : ℕ)\n    (priorGoodPositive : 0 < priorGood)\n    (priorBadNonnegative : 0 ≤ priorBad)\n\
    \    (likelihoodGoodPositive : 0 < likelihoodGood)\n    (likelihoodBadNonnegative : 0 ≤ likelihoodBad)\n    (likelihoodGapNonnegative\
    \ : 0 ≤ likelihoodGap)\n    (gapBound :\n      likelihoodBad ≤ Real.exp (-likelihoodGap) * likelihoodGood) :\n    FEP.LearningTheory.twoHypothesisPosteriorBad\n\
    \        priorGood priorBad likelihoodGood likelihoodBad sampleCount ≤\n      (priorBad / priorGood) *\n        Real.exp\
    \ (-((sampleCount : ℝ) * likelihoodGap)) :=\n  FEP.LearningTheory.posteriorGap_concentration\n    priorGood priorBad likelihoodGood\
    \ likelihoodBad likelihoodGap sampleCount\n    priorGoodPositive priorBadNonnegative likelihoodGoodPositive\n    likelihoodBadNonnegative\
    \ likelihoodGapNonnegative gapBound\n\n/-- Equal priors and a `3:1` likelihood ratio give exact nonzero posterior bad\n\
    mass `1/10` after two observations. -/\ntheorem fep118_twoHypothesis_witness :\n    FEP.LearningTheory.twoHypothesisPosteriorBad\n\
    \      (1 / 2) (1 / 2) (3 / 4) (1 / 4) 2 = 1 / 10 :=\n  FEP.LearningTheory.twoHypothesis_posterior_witness\n\nend FEP118\n"
