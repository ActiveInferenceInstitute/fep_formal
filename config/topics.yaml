  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'For distinct positive inputs and strictly positive weights summing to one, the weighted average of logarithms is strictly
    below the logarithm of the weighted average. Assumption scope: Conditional on x,y > 0, x ≠ y, a,b > 0, and a+b=1. This
    is the exact two-point strict Jensen law; finite-family and measure-integral variants are not claimed. Semantic disposition:
    `formalized`.

    '
  assumption_review: Conditional on x,y > 0, x ≠ y, a,b > 0, and a+b=1. This is the exact two-point strict Jensen law; finite-family
    and measure-integral variants are not claimed.
  non_vacuity: Witnessed by x = 1, y = 2, and a = b = 1/2.
  acceptance_probe: native Lean compile of fep035_log_strictConcave and fep035_log_jensen_two_strict with an interior-weight
    witness.
  lean_sketch: "import Mathlib.Analysis.Convex.SpecificFunctions.Basic\n\nnamespace FEP035\n\nopen Real\n\n-- [proof strategy:\
    \ Mathlib strict concavity plus logarithm identities]\n\n/-- The real logarithm is strictly concave on the positive half-line.\
    \ -/\ntheorem fep035_log_strictConcave :\n    StrictConcaveOn ℝ (Set.Ioi 0) Real.log :=\n  strictConcaveOn_log_Ioi\n\n\
    /-- Strict two-point Jensen inequality for distinct positive inputs and\nstrictly positive weights summing to one. -/\n\
    theorem fep035_log_jensen_two_strict\n    {x y a b : ℝ} (hx : 0 < x) (hy : 0 < y) (hxy : x ≠ y)\n    (ha : 0 < a) (hb\
    \ : 0 < b) (hab : a + b = 1) :\n    a * Real.log x + b * Real.log y < Real.log (a * x + b * y) := by\n  simpa only [smul_eq_mul]\
    \ using\n    strictConcaveOn_log_Ioi.2 hx hy hxy ha hb hab\n\n/-- Logarithm turns products into sums (``log(ab)=log a+log\
    \ b``). -/\ntheorem fep035_log_mul {a b : ℝ} (ha : 0 < a) (hb : 0 < b) :\n    Real.log (a * b) = Real.log a + Real.log\
    \ b :=\n  Real.log_mul (ne_of_gt ha) (ne_of_gt hb)\n\n/-- Power rule for logarithms on ``(0,∞)``. -/\ntheorem fep035_log_pow\
    \ {a : ℝ} (_ha : 0 < a) (n : ℕ) : Real.log (a ^ n) = n * Real.log a :=\n  Real.log_pow a n\n\n/-- Jensen anchor: log(exp\
    \ x) = x (log-exp inverse). -/\ntheorem fep035_log_exp (x : ℝ) : Real.log (Real.exp x) = x :=\n  Real.log_exp x\n\n/--\
    \ Concavity anchor: log on (0,∞) is monotone. -/\ntheorem fep035_log_mono {a b : ℝ} (ha : 0 < a) (h : a ≤ b) :\n    Real.log\
    \ a ≤ Real.log b :=\n  Real.log_le_log ha h\n\n/-- log 1 = 0. -/\ntheorem fep035_log_one : Real.log (1 : ℝ) = 0 := Real.log_one\n\
    \nend FEP035\n"
