  semantic_disposition: formalized
  nl: 'The algebraic Bregman expression associated with supplied potential and gradient data obeys the exact three-point identity
    used by mirror descent. Assumption scope: The coordinate carrier is finite and potential and gradient are arbitrary supplied
    functions. The identity is algebraic and assumes neither convexity nor that the gradient is the derivative of the potential;
    those extra properties are required before interpreting every term as a nonnegative divergence or an algorithmic descent
    guarantee. Semantic disposition: `formalized`.

    '
  assumption_review: The coordinate carrier is finite and potential and gradient are arbitrary supplied functions. The identity
    is algebraic and assumes neither convexity nor that the gradient is the derivative of the potential; those extra properties
    are required before interpreting every term as a nonnegative divergence or an algorithmic descent guarantee.
  non_vacuity: Distinct left, middle, and right vectors with a nonconstant supplied gradient give nonzero pairing and divergence
    differences while retaining exact equality.
  acceptance_probe: native Lean compile of fep104_mirrorDescent_threePoint_identity for arbitrary finite-dimensional potential
    and gradient data.
  lean_sketch: "import FepSketches.geometric_optimization\n\nnamespace FEP104\n\nopen FEP.GeometricOptimization\n\nvariable\
    \ {d : ℕ}\n\n/-- The Bregman divergence generated by supplied potential and gradient data\nobeys the exact mirror-descent\
    \ three-point identity. -/\ntheorem fep104_mirrorDescent_threePoint_identity\n    (potential : (Fin d → ℝ) → ℝ)\n    (gradient\
    \ : (Fin d → ℝ) → Fin d → ℝ)\n    (left middle right : Fin d → ℝ) :\n    bregmanDivergence potential gradient left right\
    \ -\n        bregmanDivergence potential gradient left middle -\n        bregmanDivergence potential gradient middle right\
    \ =\n      coordinatePairing\n        (fun coordinate ↦\n          gradient middle coordinate - gradient right coordinate)\n\
    \        (fun coordinate ↦ left coordinate - middle coordinate) :=\n  mirrorDescent_threePoint_identity potential gradient\
    \ left middle right\n\nend FEP104\n"
  latex_equations:
  - '\begin{aligned}

    &\{d : \mathbb{N}\} \\

    &(\mathsf{potential} : (\mathsf{Fin}\,d \Rightarrow \mathbb{R}) \Rightarrow \mathbb{R})\,(\mathsf{gradient} : (\mathsf{Fin}\,d
    \Rightarrow \mathbb{R}) \Rightarrow \mathsf{Fin}\,d \Rightarrow \mathbb{R}) \\

    &(\mathsf{left}\,\mathsf{middle}\,\mathsf{right} : \mathsf{Fin}\,d \Rightarrow \mathbb{R}) \\

    &\mathsf{bregmanDivergence}\,\mathsf{potential}\,\mathsf{gradient}\,\mathsf{left}\,\mathsf{right} - \mathsf{bregmanDivergence}\,\mathsf{potential}
