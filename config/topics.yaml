  mathlib_status: real
  primary_theorem: fep108_collectiveVFE_additive
  supporting_theorems:
  - fep108_productCost_additive
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Variational free energy of independent product laws with additive cost is exactly the sum of the two agent-level free
    energies. Assumption scope: State carriers are finite, both reference factors have full support, actual and reference
    joint laws are products, and joint cost is additive. The result does not discard a dependence or interaction term for
    a coupled law or nonadditive cost. Semantic disposition: `formalized`.

    '
  assumption_review: State carriers are finite, both reference factors have full support, actual and reference joint laws
    are products, and joint cost is additive. The result does not discard a dependence or interaction term for a coupled law
    or nonadditive cost.
  non_vacuity: Unequal actual and reference factors with nonconstant component costs make both KL and expectation terms contribute,
    while the separate product-cost theorem isolates the expectation part of additivity.
  acceptance_probe: native Lean compile of fep108_collectiveVFE_additive and fep108_productCost_additive with both reference-support
    hypotheses.
  lean_sketch: "import FepSketches.collective_inference\n\n/-! # Additive Collective Variational Free Energy -/\nnamespace\
    \ FEP108\n\nopen FEP\n\nvariable {State₁ State₂ : Type*} [Fintype State₁] [Fintype State₂]\n\n/-- Product-law VFE is additive\
    \ under full-support reference factors and an\nadditive cost. -/\ntheorem fep108_collectiveVFE_additive\n    (actualLeft\
    \ referenceLeft : FiniteLaw State₁)\n    (actualRight referenceRight : FiniteLaw State₂)\n    (leftCost : State₁ → ℝ)\
    \ (rightCost : State₂ → ℝ)\n    (referenceLeftPositive : ∀ state, 0 < referenceLeft state)\n    (referenceRightPositive\
    \ : ∀ state, 0 < referenceRight state) :\n    FEP.CollectiveInference.collectiveVFE\n        actualLeft referenceLeft\
    \ actualRight referenceRight leftCost rightCost =\n      FEP.CollectiveInference.variationalFreeEnergy\n          actualLeft\
    \ referenceLeft leftCost +\n        FEP.CollectiveInference.variationalFreeEnergy\n          actualRight referenceRight\
    \ rightCost :=\n  FEP.CollectiveInference.collectiveVFE_additive\n    actualLeft referenceLeft actualRight referenceRight\
    \ leftCost rightCost\n    referenceLeftPositive referenceRightPositive\n\n/-- The expectation component has its own independent-product\
    \ certificate. -/\ntheorem fep108_productCost_additive\n    (left : FiniteLaw State₁) (right : FiniteLaw State₂)\n   \
    \ (leftCost : State₁ → ℝ) (rightCost : State₂ → ℝ) :\n    FEP.CollectiveInference.expectedCost (FiniteLaw.product left\
    \ right)\n        (fun state => leftCost state.1 + rightCost state.2) =\n      FEP.CollectiveInference.expectedCost left\
    \ leftCost +\n        FEP.CollectiveInference.expectedCost right rightCost :=\n  FEP.CollectiveInference.productExpectedCost_additive\n\
    \    left right leftCost rightCost\n\nend FEP108\n"
  latex_equations:
  - '\begin{aligned}

    &\{State_{1}\,State_{2} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,State_{1}]\,[\mathsf{Fintype}\,State_{2}] \\

    &(\mathsf{actualLeft}\,\mathsf{referenceLeft} : \mathsf{FiniteLaw}\,State_{1}) \\

    &(\mathsf{actualRight}\,\mathsf{referenceRight} : \mathsf{FiniteLaw}\,State_{2})\,(\mathsf{leftCost} : State_{1} \Rightarrow
    \mathbb{R}) \\

    &(\mathsf{rightCost} : State_{2} \Rightarrow \mathbb{R})\,(\mathsf{referenceLeftPositive} : \forall \mathsf{state}, 0
    < \mathsf{referenceLeft} \\

    &\mathsf{state})\,(\mathsf{referenceRightPositive} : \forall \mathsf{state}, 0 < \mathsf{referenceRight}\,\mathsf{state})
    \\

    &\mathsf{FEP.CollectiveInference.collectiveVFE}\,\mathsf{actualLeft}\,\mathsf{referenceLeft}\,\mathsf{actualRight} \\

    &\mathsf{referenceRight}\,\mathsf{leftCost}\,\mathsf{rightCost} \\

    &= \mathsf{FEP.CollectiveInference.variationalFreeEnergy}\,\mathsf{actualLeft}\,\mathsf{referenceLeft} \\

    &\mathsf{leftCost} + \mathsf{FEP.CollectiveInference.variationalFreeEnergy}\,\mathsf{actualRight} \\

    &\mathsf{referenceRight}\,\mathsf{rightCost}

    \end{aligned}'
  - '\begin{aligned}

    &\{State_{1}\,State_{2} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,State_{1}]\,[\mathsf{Fintype}\,State_{2}] \\

    &(\mathsf{left} : \mathsf{FiniteLaw}\,State_{1})\,(\mathsf{right} : \mathsf{FiniteLaw}\,State_{2})\,(\mathsf{leftCost}
    : State_{1} \Rightarrow \mathbb{R}) \\

    &(\mathsf{rightCost} : State_{2} \Rightarrow \mathbb{R}) \\

    &\mathsf{FEP.CollectiveInference.expectedCost}\,(\mathsf{FiniteLaw.product}\,\mathsf{left}\,\mathsf{right}) \\

    &(\lambda\,\mathsf{state} \mapsto \mathsf{leftCost}\,\mathsf{state}.1 + \mathsf{rightCost}\,\mathsf{state}.2) \\

    &= \mathsf{FEP.CollectiveInference.expectedCost}\,\mathsf{left}\,\mathsf{leftCost} \\

    &+ \mathsf{FEP.CollectiveInference.expectedCost}\,\mathsf{right}\,\mathsf{rightCost}

    \end{aligned}'
- id: fep-109
