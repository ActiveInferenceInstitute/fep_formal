  nl: 'A finite forward path law is reconstructed pointwise from its supported reverse-aligned law and likelihood ratio, while
    both path laws normalize and path reversal is involutive. Assumption scope: The path carrier is finite and reverse-aligned
    mass must be strictly positive for the ratio reconstruction. FinitePathProtocol stores normalized laws and an involution;
    it does not derive reversal or reverse dynamics from a microscopic process. Semantic disposition: `formalized`.

    '
  assumption_review: The path carrier is finite and reverse-aligned mass must be strictly positive for the ratio reconstruction.
    FinitePathProtocol stores normalized laws and an involution; it does not derive reversal or reverse dynamics from a microscopic
    process.
  non_vacuity: Unequal full-support forward and reverse-aligned laws yield nonunit path ratios, while an involution with a
    two-path swap exercises a genuine reversal.
  acceptance_probe: native Lean compile of fep093_forward_reverse_pathLaw_ratio, fep093_pathLaws_normalized, and fep093_pathReversal_involutive.
  lean_sketch: "import FepSketches.path_thermodynamics\n\nnamespace FEP093\n\nopen FEP FEP.PathThermodynamics Finset\nopen\
    \ scoped BigOperators\n\nvariable {Path : Type*} [Fintype Path]\n\n/-- The supported forward/reverse likelihood ratio\
    \ reconstructs forward path\nmass, while both finite path laws remain normalized. -/\ntheorem fep093_forward_reverse_pathLaw_ratio\n\
    \    (protocol : FinitePathProtocol Path)\n    (hReverse : ∀ path, 0 < protocol.reverseAligned path) (path : Path) :\n\
    \    pathRatio protocol path * protocol.reverseAligned path =\n      protocol.forward path :=\n  pathRatio_mul_reverse\
    \ protocol hReverse path\n\n/-- Forward and reverse path-law normalization is structural. -/\ntheorem fep093_pathLaws_normalized\n\
    \    (protocol : FinitePathProtocol Path) :\n    (∑ path, protocol.forward path = 1) ∧\n      ∑ path, protocol.reverseAligned\
    \ path = 1 :=\n  pathLaw_normalization protocol\n\n/-- The recorded path reversal is involutive. -/\ntheorem fep093_pathReversal_involutive\n\
    \    (protocol : FinitePathProtocol Path) (path : Path) :\n    protocol.reversal (protocol.reversal path) = path :=\n\
    \  reverse_reverse protocol path\n\nend FEP093\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{Path} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{Path}] \\

    &(\mathsf{protocol} : \mathsf{FinitePathProtocol}\,\mathsf{Path}) \\

    &(\mathsf{hReverse} : \forall \mathsf{path}, 0 < \mathsf{protocol.reverseAligned}\,\mathsf{path})\,(\mathsf{path} : \mathsf{Path})
