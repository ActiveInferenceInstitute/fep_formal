    : \mathsf{Policy}) \\

    &(\mathsf{hne} : \mathsf{policies.Nonempty}) \\

    &\mathsf{fep028\_softmax}\,\gamma{}\,G\,\mathsf{policies}\,p \le 1

    \end{aligned}'
  - '\begin{aligned}

    &(\gamma{} : \mathbb{R})\,(G : \mathsf{Policy} \Rightarrow \mathbb{R})\,(\mathsf{policies} : \mathsf{Finset}\,\mathsf{Policy})\,(\mathsf{hne}
    : \mathsf{policies.Nonempty}) \\

    &\sum p \in \mathsf{policies}, \mathsf{fep028\_softmax}\,\gamma{}\,G\,\mathsf{policies}\,p = 1

    \end{aligned}'
  - '\begin{aligned}

    &(\gamma{} : \mathbb{R})\,(G : \mathsf{Policy} \Rightarrow \mathbb{R})\,(\mathsf{policies} : \mathsf{Finset}\,\mathsf{Policy})\,\{p
    : \mathsf{Policy}\} \\

    &(\mathsf{hp} : p \notin \mathsf{policies}) \\

    &\mathsf{fep028\_softmax}\,\gamma{}\,G\,\mathsf{policies}\,p = 0

    \end{aligned}'
  - '\begin{aligned}

