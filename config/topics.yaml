  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The maintained consensus coupling quarters atomwise quadratic disagreement potential and decreases it strictly whenever
    the two input masses differ at that atom. Assumption scope: State is finite and the potential is the exact scalar square
    of the two-agent atomwise gap under the fixed consensus operator. Strictness requires explicit separation; the theorem
    does not cover a general coupled free-energy functional or nonlinear multiagent dynamics. Semantic disposition: `formalized`.

    '
