  semantic_disposition: formalized
  nl: 'A pointwise variational integrand built from measurable energy, approximate log density, and generative log density
    is measurable and remains so under measurable reparameterization and baseline shifts. Assumption scope: All three real-valued
    ingredients and any reparameterization are assumed measurable. Measurability does not imply integrability, finite expectation,
    or existence of an optimizer, none of which is claimed. Semantic disposition: `formalized`.

    '
  assumption_review: All three real-valued ingredients and any reparameterization are assumed measurable. Measurability does
    not imply integrability, finite expectation, or existence of an optimizer, none of which is claimed.
  non_vacuity: Nonconstant measurable coordinate functions instantiate all three terms, and a nonidentity measurable reparameterization
    exercises the composition theorem.
  acceptance_probe: native Lean compile of fep015_variationalIntegrand_measurable, fep015_variationalIntegrand_comp_measurable,
    and fep015_variationalIntegrand_add_const_measurable.
  lean_sketch: "import Mathlib.MeasureTheory.Constructions.BorelSpace.Basic\n\nnamespace FEP015\n\nvariable {α : Type*} [MeasurableSpace\
    \ α]\n\n/-- Pointwise variational-free-energy integrand: energy plus approximate\nlog-density minus generative log-density.\
    \ -/\ndef fep015_variationalIntegrand\n    (energy logApproximation logGenerative : α → ℝ) (state : α) : ℝ :=\n  energy\
    \ state + logApproximation state - logGenerative state\n\n/-- Measurability of all three scientific ingredients is sufficient\
    \ for\nmeasurability of the complete variational integrand. -/\ntheorem fep015_variationalIntegrand_measurable\n    {energy\
    \ logApproximation logGenerative : α → ℝ}\n    (henergy : Measurable energy)\n    (happroximation : Measurable logApproximation)\n\
    \    (hgenerative : Measurable logGenerative) :\n    Measurable\n      (fep015_variationalIntegrand energy logApproximation\
    \ logGenerative) := by\n  exact (henergy.add happroximation).sub hgenerative\n\n/-- Reparameterizing a measurable variational\
    \ integrand by a measurable state\nmap preserves measurability. -/\ntheorem fep015_variationalIntegrand_comp_measurable\n\
    \    {β : Type*} [MeasurableSpace β]\n    {energy logApproximation logGenerative : α → ℝ}\n    {reparameterize : β → α}\n\
    \    (henergy : Measurable energy)\n    (happroximation : Measurable logApproximation)\n    (hgenerative : Measurable\
    \ logGenerative)\n    (hreparameterize : Measurable reparameterize) :\n    Measurable\n      (fep015_variationalIntegrand\
    \ energy logApproximation logGenerative ∘\n        reparameterize) :=\n  (fep015_variationalIntegrand_measurable\n   \
    \ henergy happroximation hgenerative).comp hreparameterize\n\n/-- Adding a measurable scalar baseline preserves variational-integrand\n\
    measurability. -/\ntheorem fep015_variationalIntegrand_add_const_measurable\n    {energy logApproximation logGenerative\
    \ : α → ℝ}\n    (henergy : Measurable energy)\n    (happroximation : Measurable logApproximation)\n    (hgenerative :\
    \ Measurable logGenerative) (baseline : ℝ) :\n    Measurable (fun state =>\n      fep015_variationalIntegrand energy logApproximation\
    \ logGenerative state +\n        baseline) :=\n  (fep015_variationalIntegrand_measurable\n    henergy happroximation hgenerative).add\
    \ measurable_const\n\nend FEP015\n"
