  nl: 'Mathlib''s posterior is a Markov kernel whose composition with the predictive law reconstructs the swapped prior-likelihood
    joint law; for a Markov likelihood it also recovers the prior. Assumption scope: Conditional on standard-Borel and nonempty
    latent structure plus finite prior and likelihood kernel. The Radon--Nikodym Bayes formula additionally uses countability
    of the latent space and standard-Borel observation structure. This is a regular posterior-kernel theorem, not a claim
    about learned or approximate posteriors. Semantic disposition: `formalized`.

    '
  assumption_review: Conditional on standard-Borel and nonempty latent structure plus finite prior and likelihood kernel.
    The Radon--Nikodym Bayes formula additionally uses countability of the latent space and standard-Borel observation structure.
    This is a regular posterior-kernel theorem, not a claim about learned or approximate posteriors.
  non_vacuity: Every posterior fibre has mass one, and the identity Markov kernel supplies a concrete prior-recovery witness;
    non-deterministic finite kernels exercise a nontrivial reconstructed joint law.
  acceptance_probe: native Lean compile of fep017_posterior_mass_one, fep017_posterior_joint_reconstruction, fep017_posterior_recovers_prior,
    and fep017_posterior_bayes_density.
  lean_sketch: "import Mathlib.Probability.Kernel.Posterior\n\nnamespace FEP017\n\nopen MeasureTheory ProbabilityTheory\n\
    open scoped ENNReal ProbabilityTheory\n\nvariable {Ω \U0001D4E7 : Type*} [MeasurableSpace Ω] [MeasurableSpace \U0001D4E7\
    ]\n\n/-- The native posterior kernel of a likelihood kernel with respect to a prior. -/\nnoncomputable def fep017_posterior\n\
    \    (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace Ω] [Nonempty Ω]\n    [IsFiniteMeasure μ] [IsFiniteKernel\
    \ κ] :\n    Kernel \U0001D4E7 Ω :=\n  ProbabilityTheory.posterior κ μ\n\n/-- Every posterior fibre is a probability measure.\
    \ -/\ntheorem fep017_posterior_mass_one\n    (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace Ω] [Nonempty\
    \ Ω]\n    [IsFiniteMeasure μ] [IsFiniteKernel κ]\n    (x : \U0001D4E7) :\n    fep017_posterior κ μ x Set.univ = 1 := by\n\
    \  change (ProbabilityTheory.posterior κ μ x) Set.univ = 1\n  exact measure_univ\n\n/-- Posterior reconstruction: predictive\
    \ mass followed by the posterior\nrecovers the swapped prior-likelihood joint law. -/\ntheorem fep017_posterior_joint_reconstruction\n\
    \    (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace Ω] [Nonempty Ω]\n    [IsFiniteMeasure μ] [IsFiniteKernel\
    \ κ] :\n    (κ ∘ₘ μ) ⊗ₘ fep017_posterior κ μ = (μ ⊗ₘ κ).map Prod.swap := by\n  exact ProbabilityTheory.compProd_posterior_eq_map_swap\n\
    \n/-- Applying a Markov likelihood and then its posterior recovers the prior. -/\ntheorem fep017_posterior_recovers_prior\n\
    \    (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace Ω] [Nonempty Ω]\n    [IsFiniteMeasure μ] [IsMarkovKernel\
    \ κ] :\n    fep017_posterior κ μ ∘ₘ κ ∘ₘ μ = μ := by\n  exact ProbabilityTheory.posterior_comp_self\n\n/-- On a countable\
    \ latent space, the posterior is the prior weighted by the\nRadon--Nikodym likelihood ratio, almost everywhere under the\
    \ predictive law. -/\ntheorem fep017_posterior_bayes_density\n    [Countable Ω] [StandardBorelSpace Ω] [Nonempty Ω]\n\
    \    [StandardBorelSpace \U0001D4E7] [Nonempty \U0001D4E7]\n    (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω) [IsFiniteMeasure\
    \ μ] [IsFiniteKernel κ] :\n    ∀ᵐ x ∂(κ ∘ₘ μ),\n      fep017_posterior κ μ x =\n        μ.withDensity (fun ω ↦ (κ ω).rnDeriv\
    \ (κ ∘ₘ μ) x) := by\n  exact ProbabilityTheory.posterior_eq_withDensity_of_countable κ μ\n\nend FEP017\n"
