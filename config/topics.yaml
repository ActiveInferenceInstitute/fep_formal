  assumption_review: The sampling measure is a probability measure, the alphabet is finite with decidable equality, sample
    count is nonzero, and every symbol has the supplied probability bound. No independence or concentration rate is inferred
    beyond those per-symbol premises.
  non_vacuity: A multi-symbol alphabet and positive sample count make the union contain genuinely distinct two-sided normalized-count
    deviation events.
  acceptance_probe: native Lean compile of fep115_simultaneous_frequency_bound and fep115_frequencyDeviationEvent_membership
    with the exact finite-count event.
  lean_sketch: "import FepSketches.learning_theory\n\n/-! # Simultaneous Finite-Alphabet Frequency Bound -/\nnamespace FEP115\n\
    \nopen MeasureTheory ProbabilityTheory\nopen scoped ENNReal MeasureTheory ProbabilityTheory\n\n/-- A finite union bound\
    \ lifts per-symbol empirical-frequency guarantees to a\nsimultaneous alphabet-wide guarantee. -/\ntheorem fep115_simultaneous_frequency_bound\n\
    \    {Ω Alphabet : Type*} [MeasurableSpace Ω]\n    [Fintype Alphabet] [DecidableEq Alphabet]\n    (μ : Measure Ω) [IsProbabilityMeasure\
    \ μ]\n    {sampleCount : ℕ} [NeZero sampleCount]\n    (sample : Ω → Fin sampleCount → Alphabet)\n    (target : Alphabet\
    \ → ℝ) (deviation perSymbolFailure : ℝ)\n    (perSymbolBound : ∀ symbol,\n      μ.real\n          (FEP.LearningTheory.frequencyDeviationEvent\n\
    \            sample target deviation symbol) ≤ perSymbolFailure) :\n    μ.real (⋃ symbol,\n        FEP.LearningTheory.frequencyDeviationEvent\n\
    \          sample target deviation symbol) ≤\n      Fintype.card Alphabet * perSymbolFailure :=\n  FEP.LearningTheory.simultaneous_frequency_bound\n\
    \    μ sample target deviation perSymbolFailure perSymbolBound\n\n/-- The event is the actual two-sided deviation of a\
    \ normalized finite count,\nnot an abstract placeholder event. -/\ntheorem fep115_frequencyDeviationEvent_membership\n\
    \    {Ω Alphabet : Type*} [Fintype Alphabet] [DecidableEq Alphabet]\n    {sampleCount : ℕ} [NeZero sampleCount]\n    (sample\
    \ : Ω → Fin sampleCount → Alphabet)\n    (target : Alphabet → ℝ) (deviation : ℝ)\n    (symbol : Alphabet) (outcome : Ω)\
    \ :\n    outcome ∈ FEP.LearningTheory.frequencyDeviationEvent\n        sample target deviation symbol ↔\n      deviation\
    \ ≤\n        |FEP.LearningTheory.empiricalFrequency\n            (sample outcome) symbol - target symbol| :=\n  Iff.rfl\n\
    \nend FEP115\n"
