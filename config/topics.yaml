- id: fep-027
  title: Hierarchical Kernel Factorization
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Probability.Kernel.Composition.MeasureComp
  mathlib_status: real
  primary_theorem: fep027_hierarchical_assoc
  supporting_theorems:
  - fep027_hierarchical_mass_one
  - fep027_hierarchical_fst
  - fep027_hierarchical_snd
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A parent measure and child kernel form a normalized hierarchical joint whose marginals recover the parent and prior
    predictive, and whose three-level factorization is associative up to product reassociation. Assumption scope: Joint normalization
    requires a probability parent and Markov child; first- and second-marginal identities require the stated finite-kernel
    classes. The associativity theorem is exact for Mathlib composition products and does not impose causal identifiability.
    Semantic disposition: `formalized`.

    '
  assumption_review: Joint normalization requires a probability parent and Markov child; first- and second-marginal identities
    require the stated finite-kernel classes. The associativity theorem is exact for Mathlib composition products and does
    not impose causal identifiability.
  non_vacuity: A non-Dirac finite parent and state-dependent non-deterministic Markov child give a dependent normalized joint
    with distinct parent and predictive marginals; a third kernel exercises nontrivial reassociation.
  acceptance_probe: native Lean compile of fep027_hierarchical_mass_one, fep027_hierarchical_fst, fep027_hierarchical_snd,
    and fep027_hierarchical_assoc.
  lean_sketch: "import Mathlib.Probability.Kernel.Composition.MeasureComp\n\nnamespace FEP027\n\nopen MeasureTheory ProbabilityTheory\n\
    open scoped ENNReal\n\nvariable {α β γ : Type*}\nvariable [MeasurableSpace α] [MeasurableSpace β] [MeasurableSpace γ]\n\
    \n/-- A normalized hierarchical joint is the native composition product of a\nparent law and a child kernel. -/\nnoncomputable\
    \ def fep027_hierarchicalJoint\n    (μ : Measure α) (κ : Kernel α β) : Measure (α × β) :=\n  μ ⊗ₘ κ\n\n/-- Probability\
    \ parents and Markov children yield a probability joint law. -/\ntheorem fep027_hierarchical_mass_one\n    (μ : Measure\
    \ α) (κ : Kernel α β)\n    [IsProbabilityMeasure μ] [IsMarkovKernel κ] :\n    fep027_hierarchicalJoint μ κ Set.univ =\
    \ 1 := by\n  change (μ ⊗ₘ κ) Set.univ = 1\n  exact measure_univ\n\n/-- The first marginal of the hierarchical joint recovers\
    \ the parent law. -/\ntheorem fep027_hierarchical_fst\n    (μ : Measure α) (κ : Kernel α β) [SFinite μ] [IsMarkovKernel\
    \ κ] :\n    (fep027_hierarchicalJoint μ κ).fst = μ := by\n  exact Measure.fst_compProd μ κ\n\n/-- The second marginal\
    \ is the prior-predictive measure-kernel composition. -/\ntheorem fep027_hierarchical_snd\n    (μ : Measure α) (κ : Kernel\
    \ α β) [SFinite μ] [IsSFiniteKernel κ] :\n    (fep027_hierarchicalJoint μ κ).snd = κ ∘ₘ μ := by\n  exact Measure.snd_compProd\
    \ μ κ\n\n/-- Three-level hierarchical factorization is associative up to the canonical\nmeasurable equivalence between\
    \ product bracketings. -/\ntheorem fep027_hierarchical_assoc\n    (μ : Measure α) (κ : Kernel α β) (η : Kernel (α × β)\
    \ γ) :\n    (fep027_hierarchicalJoint μ κ ⊗ₘ η).map MeasurableEquiv.prodAssoc =\n      fep027_hierarchicalJoint μ (κ ⊗ₖ\
    \ η) := by\n  exact Measure.compProd_assoc'\n\nend FEP027\n"
  latex_equations:
  - '\begin{aligned}

    &\{\alpha{}\,\beta{}\,\gamma{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}]\,[\mathsf{MeasurableSpace} \beta{}]\,[\mathsf{MeasurableSpace}
    \gamma{}] \\

    &(\mu{} : \mathsf{Measure}~\alpha{})\,(\kappa{} : \mathsf{Kernel}\,\alpha{}\,\beta{})\,[\mathsf{IsProbabilityMeasure}~\mu{}]\,[\mathsf{IsMarkovKernel}\,\kappa{}]
    \\

    &\mathsf{fep027\_hierarchicalJoint}\,\mu{}\,\kappa{}\,\Omega = 1

    \end{aligned}'
  - '\begin{aligned}

