    while deterministic or zero-probability channel rows are deliberately outside this statement.
  acceptance_probe: native Lean compile of fep063_finiteChannel_klDataProcessing and fep063_referencePredictive_fullSupport
    with all three support certificates.
  lean_sketch: "import FepSketches.variational_duality\n\nnamespace FEP063\n\nopen FEP FEP.FiniteInformation FEP.VariationalDuality\n\
    \nvariable {Input Output : Type*}\n  [Fintype Input] [Fintype Output] [Nonempty Input]\n\n/-- Passing two full-support\
    \ laws through the same strictly positive finite\nchannel cannot increase KL divergence. -/\ntheorem fep063_finiteChannel_klDataProcessing\n\
    \    (actual reference : FiniteLaw Input)\n    (channel : FiniteKernel Input Output)\n    (hactual : ∀ input, 0 < actual\
    \ input)\n    (hreference : ∀ input, 0 < reference input)\n    (hchannel : ∀ input output, 0 < channel input output) :\n\
    \    finiteKL (channel.predictive actual) (channel.predictive reference) ≤\n      finiteKL actual reference :=\n  finiteChannel_dataProcessing\
    \ actual reference channel\n    hactual hreference hchannel\n\n/-- The same support assumptions make every reference predictive\
    \ atom\npositive, pinning the logarithmic boundary used by the proof. -/\ntheorem fep063_referencePredictive_fullSupport\n\
    \    (reference : FiniteLaw Input)\n    (channel : FiniteKernel Input Output)\n    (hreference : ∀ input, 0 < reference\
    \ input)\n    (hchannel : ∀ input output, 0 < channel input output)\n    (output : Output) :\n    0 < channel.predictive\
