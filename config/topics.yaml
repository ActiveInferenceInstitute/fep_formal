- id: fep-018
  title: Bernoulli Fisher–Rao Coordinate Distance
  area: InfoGeometry
  family: core-information-geometry
  mathlib_modules:
  - Analysis.SpecialFunctions.Trigonometric.Inverse
  mathlib_status: real
  primary_theorem: fep018_fisherRaoDistance_eq_zero_iff
  supporting_theorems:
  - fep018_fisherRaoDistance_nonneg
  - fep018_fisherRaoDistance_symm
  - fep018_fisherRaoDistance_triangle
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The Bernoulli Fisher--Rao coordinate distance is nonnegative, symmetric, separating on the probability interval, and
    satisfies the triangle inequality. Assumption scope: Separation is restricted to Bernoulli parameters in [0,1], where
    square root and arcsine are injective. This is the closed-form one-dimensional Fisher--Rao distance, not a general geodesic-existence
    theorem for arbitrary statistical manifolds. Semantic disposition: `formalized`.

    '
  assumption_review: Separation is restricted to Bernoulli parameters in [0,1], where square root and arcsine are injective.
    This is the closed-form one-dimensional Fisher--Rao distance, not a general geodesic-existence theorem for arbitrary statistical
    manifolds.
  non_vacuity: The endpoint parameters p = 0 and q = 1 have distinct coordinates, while every equal pair has zero distance.
  acceptance_probe: native Lean compile of fep018_fisherRaoDistance_nonneg, fep018_fisherRaoDistance_symm, fep018_fisherRaoDistance_triangle,
    and fep018_fisherRaoDistance_eq_zero_iff.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Trigonometric.Inverse\nimport Mathlib.Analysis.Real.Sqrt\nimport\
    \ Mathlib.Tactic\n\nnamespace FEP018\n\n/-- Variance-stabilizing Fisher--Rao coordinate for the Bernoulli family. -/\n\
    noncomputable def fep018_fisherCoordinate (p : ℝ) : ℝ :=\n  2 * Real.arcsin (Real.sqrt p)\n\n/-- Closed-form coordinate\
    \ distance on the Bernoulli probability interval. -/\nnoncomputable def fep018_fisherRaoDistance (p q : ℝ) : ℝ :=\n  |fep018_fisherCoordinate\
    \ p - fep018_fisherCoordinate q|\n\n/-- Fisher--Rao coordinate distance is nonnegative. -/\ntheorem fep018_fisherRaoDistance_nonneg\
    \ (p q : ℝ) :\n    0 ≤ fep018_fisherRaoDistance p q :=\n  abs_nonneg _\n\n/-- Fisher--Rao coordinate distance is symmetric.\
    \ -/\ntheorem fep018_fisherRaoDistance_symm (p q : ℝ) :\n    fep018_fisherRaoDistance p q = fep018_fisherRaoDistance q\
    \ p := by\n  exact abs_sub_comm _ _\n\n/-- The coordinate distance satisfies the triangle inequality. -/\ntheorem fep018_fisherRaoDistance_triangle\
    \ (p q r : ℝ) :\n    fep018_fisherRaoDistance p r ≤\n      fep018_fisherRaoDistance p q + fep018_fisherRaoDistance q r\
    \ := by\n  calc\n    |fep018_fisherCoordinate p - fep018_fisherCoordinate r| =\n        |(fep018_fisherCoordinate p -\
    \ fep018_fisherCoordinate q) +\n          (fep018_fisherCoordinate q - fep018_fisherCoordinate r)| := by\n           \
    \ congr 1\n            ring\n    _ ≤ |fep018_fisherCoordinate p - fep018_fisherCoordinate q| +\n          |fep018_fisherCoordinate\
    \ q - fep018_fisherCoordinate r| :=\n      abs_add_le _ _\n\n/-- On the probability interval, zero Fisher--Rao distance\
    \ characterizes\nequality of Bernoulli parameters. -/\ntheorem fep018_fisherRaoDistance_eq_zero_iff\n    {p q : ℝ} (hp\
    \ : p ∈ Set.Icc (0 : ℝ) 1) (hq : q ∈ Set.Icc (0 : ℝ) 1) :\n    fep018_fisherRaoDistance p q = 0 ↔ p = q := by\n  constructor\n\
    \  · intro h\n    have hcoord : fep018_fisherCoordinate p = fep018_fisherCoordinate q :=\n      sub_eq_zero.mp (abs_eq_zero.mp\
    \ h)\n    have harcsin : Real.arcsin (Real.sqrt p) = Real.arcsin (Real.sqrt q) := by\n      simp only [fep018_fisherCoordinate]\
    \ at hcoord\n      linarith\n    have hsqrt : Real.sqrt p = Real.sqrt q :=\n      (Real.arcsin_inj\n        (by linarith\
    \ [Real.sqrt_nonneg p]) (Real.sqrt_le_one.mpr hp.2)\n        (by linarith [Real.sqrt_nonneg q]) (Real.sqrt_le_one.mpr\
    \ hq.2)).mp harcsin\n    exact (Real.sqrt_inj hp.1 hq.1).mp hsqrt\n  · rintro rfl\n    simp [fep018_fisherRaoDistance]\n\
    \nend FEP018\n"
  latex_equations:
  - '\begin{aligned}

    &(p\,q : \mathbb{R}) \\

    &0 \le \mathsf{fep018\_fisherRaoDistance}\,p\,q

    \end{aligned}'
  - '\begin{aligned}

    &(p\,q : \mathbb{R}) \\

    &\mathsf{fep018\_fisherRaoDistance}\,p\,q = \mathsf{fep018\_fisherRaoDistance}\,q\,p

    \end{aligned}'
  - '\begin{aligned}

    &(p\,q\,r : \mathbb{R}) \\

    &\mathsf{fep018\_fisherRaoDistance}\,p\,r \le \mathsf{fep018\_fisherRaoDistance}\,p\,q \\

    &+ \mathsf{fep018\_fisherRaoDistance}\,q\,r

    \end{aligned}'
  - '\begin{aligned}

    &\{p\,q : \mathbb{R}\}\,(\mathsf{hp} : p \in \mathsf{Set.Icc}\,(0 : \mathbb{R})\,1)\,(\mathsf{hq} : q \in \mathsf{Set.Icc}\,(0
    : \mathbb{R})\,1) \\

    &\mathsf{fep018\_fisherRaoDistance}\,p\,q = 0 \leftrightarrow p = q

    \end{aligned}'
- id: fep-019
  title: Prior-Predictive Kernel Composition
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Probability.Kernel.Composition.MeasureComp
  mathlib_status: real
  primary_theorem: fep019_priorPredictive_assoc
  supporting_theorems:
  - fep019_priorPredictive_mass
  - fep019_priorPredictive_mass_one
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The native prior-predictive law preserves total mass for a Markov likelihood and sequential prediction equals measure
    composition by the composed kernels. Assumption scope: Mass preservation requires a Markov likelihood; probability mass
    one additionally requires a probability prior. The associativity law is structural measure-kernel composition and does
    not assert model calibration or identifiability. Semantic disposition: `formalized`.

    '
  assumption_review: Mass preservation requires a Markov likelihood; probability mass one additionally requires a probability
    prior. The associativity law is structural measure-kernel composition and does not assert model calibration or identifiability.
  non_vacuity: A probability prior and non-deterministic finite Markov likelihood yield a normalized non-Dirac predictive
    law; a second kernel exercises genuine sequential composition.
  acceptance_probe: native Lean compile of fep019_priorPredictive_mass, fep019_priorPredictive_mass_one, and fep019_priorPredictive_assoc.
  lean_sketch: "import Mathlib.Probability.Kernel.Composition.MeasureComp\n\nnamespace FEP019\n\nopen MeasureTheory ProbabilityTheory\n\
    open scoped ENNReal\n\nvariable {Ω \U0001D4E7 \U0001D4E8 : Type*}\nvariable [MeasurableSpace Ω] [MeasurableSpace \U0001D4E7\
    ] [MeasurableSpace \U0001D4E8]\n\n/-- The prior-predictive law is native measure-kernel composition. -/\nnoncomputable\
    \ def fep019_priorPredictive\n    (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω) : Measure \U0001D4E7 :=\n  κ ∘ₘ μ\n\n/-- A\
    \ Markov likelihood preserves total prior mass in the predictive law. -/\ntheorem fep019_priorPredictive_mass\n    (κ\
    \ : Kernel Ω \U0001D4E7) (μ : Measure Ω) [IsMarkovKernel κ] :\n    fep019_priorPredictive κ μ Set.univ = μ Set.univ :=\
    \ by\n  exact Measure.comp_apply_univ\n\n/-- A probability prior and Markov likelihood produce a probability predictive\
    \ law. -/\ntheorem fep019_priorPredictive_mass_one\n    (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [IsProbabilityMeasure\
    \ μ] [IsMarkovKernel κ] :\n    fep019_priorPredictive κ μ Set.univ = 1 := by\n  change (κ ∘ₘ μ) Set.univ = 1\n  exact\
    \ measure_univ\n\n/-- Sequential prediction agrees with composition of the two kernels. -/\ntheorem fep019_priorPredictive_assoc\n\
    \    (κ : Kernel Ω \U0001D4E7) (η : Kernel \U0001D4E7 \U0001D4E8) (μ : Measure Ω) :\n    η ∘ₘ fep019_priorPredictive κ\
    \ μ =\n      fep019_priorPredictive (η ∘ₖ κ) μ := by\n  exact Measure.comp_assoc\n\nend FEP019\n"
