- id: fep-037
  title: Two-State Correlation–Response Law
  area: Thermodynamics
  family: core-thermodynamics
  mathlib_modules:
  - Analysis.SpecificLimits.Normed
  mathlib_status: real
  primary_theorem: fep037_response_eq
  supporting_theorems:
  - fep037_autocorrelation_recurrence
  - fep037_autocorrelation_tendsto_zero
  - fep037_response_nonneg
  - fep037_response_tendsto_zero
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'For the symmetric two-state relaxation eigenvalue 1-2α, stationary autocorrelation obeys an exact recurrence and decays
    for 0<α<1; the discrete fluctuation--response kernel equals 2βα variance times the same geometric mode and also decays.
    Assumption scope: Response is defined as inverse temperature times the one-step autocorrelation loss. Nonnegativity additionally
    restricts α≤1/2 and nonnegative inverse temperature and variance. This is an exact discrete two-state response law, not
    a microscopic Kubo derivation for general dynamics. Semantic disposition: `formalized`.

    '
  assumption_review: Response is defined as inverse temperature times the one-step autocorrelation loss. Nonnegativity additionally
    restricts α≤1/2 and nonnegative inverse temperature and variance. This is an exact discrete two-state response law, not
    a microscopic Kubo derivation for general dynamics.
  non_vacuity: For α=1/4, positive β, and nonzero variance, lag-zero response is positive and both correlation and response
    decay geometrically by 1/2.
  acceptance_probe: native Lean compile of fep037_autocorrelation_recurrence, fep037_autocorrelation_tendsto_zero, fep037_response_eq,
    fep037_response_nonneg, and fep037_response_tendsto_zero.
  lean_sketch: "import Mathlib.Analysis.SpecificLimits.Normed\nimport Mathlib.Tactic\n\nnamespace FEP037\n\n/-- Relaxation\
    \ eigenvalue of the symmetric two-state Markov transition. -/\ndef fep037_relaxation (α : ℝ) : ℝ := 1 - 2 * α\n\n/-- Stationary\
    \ autocorrelation at lag `n` with equilibrium variance `variance`. -/\ndef fep037_autocorrelation (α variance : ℝ) (n\
    \ : ℕ) : ℝ :=\n  variance * fep037_relaxation α ^ n\n\n/-- The autocorrelation obeys the Markov relaxation recurrence.\
    \ -/\ntheorem fep037_autocorrelation_recurrence (α variance : ℝ) (n : ℕ) :\n    fep037_autocorrelation α variance (n +\
    \ 1) =\n      fep037_relaxation α * fep037_autocorrelation α variance n := by\n  simp only [fep037_autocorrelation, pow_succ]\n\
    \  ring\n\n/-- For a strictly interior switching probability, equilibrium correlations\ndecay to zero. -/\ntheorem fep037_autocorrelation_tendsto_zero\n\
    \    {α : ℝ} (hα0 : 0 < α) (hα1 : α < 1) (variance : ℝ) :\n    Filter.Tendsto (fep037_autocorrelation α variance)\n  \
    \    Filter.atTop (nhds 0) := by\n  have habs : |fep037_relaxation α| < 1 := by\n    rw [fep037_relaxation, abs_lt]\n\
    \    constructor <;> linarith\n  have hpow : Filter.Tendsto (fun n : ℕ => fep037_relaxation α ^ n)\n      Filter.atTop\
    \ (nhds 0) :=\n    tendsto_pow_atTop_nhds_zero_of_abs_lt_one habs\n  change Filter.Tendsto (fun n : ℕ => variance * fep037_relaxation\
    \ α ^ n)\n    Filter.atTop (nhds 0)\n  simpa only [mul_zero] using hpow.const_mul variance\n\n/-- Discrete fluctuation--response\
    \ law: inverse temperature times the\none-step loss of stationary autocorrelation. -/\ndef fep037_response (β α variance\
    \ : ℝ) (n : ℕ) : ℝ :=\n  β * (fep037_autocorrelation α variance n -\n    fep037_autocorrelation α variance (n + 1))\n\n\
    /-- Closed form of the discrete response kernel. -/\ntheorem fep037_response_eq (β α variance : ℝ) (n : ℕ) :\n    fep037_response\
    \ β α variance n =\n      2 * β * α * variance * fep037_relaxation α ^ n := by\n  rw [fep037_response, fep037_autocorrelation_recurrence]\n\
    \  simp only [fep037_autocorrelation, fep037_relaxation]\n  ring\n\n/-- For nonnegative inverse temperature and variance,\
    \ and switching no faster\nthan one half, the response kernel is nonnegative. -/\ntheorem fep037_response_nonneg\n   \
    \ {β α variance : ℝ} (hβ : 0 ≤ β) (hα0 : 0 ≤ α) (hαhalf : α ≤ 1 / 2)\n    (hvariance : 0 ≤ variance) (n : ℕ) :\n    0\
    \ ≤ fep037_response β α variance n := by\n  rw [fep037_response_eq]\n  have hrelax : 0 ≤ fep037_relaxation α := by\n \
    \   rw [fep037_relaxation]\n    linarith\n  positivity\n\n/-- The discrete response also relaxes to zero. -/\ntheorem\
    \ fep037_response_tendsto_zero\n    {α : ℝ} (hα0 : 0 < α) (hα1 : α < 1) (β variance : ℝ) :\n    Filter.Tendsto (fun n\
    \ => fep037_response β α variance n)\n      Filter.atTop (nhds 0) := by\n  have habs : |fep037_relaxation α| < 1 := by\n\
    \    rw [fep037_relaxation, abs_lt]\n    constructor <;> linarith\n  have hpow : Filter.Tendsto (fun n : ℕ => fep037_relaxation\
    \ α ^ n)\n      Filter.atTop (nhds 0) :=\n    tendsto_pow_atTop_nhds_zero_of_abs_lt_one habs\n  simpa only [fep037_response_eq,\
    \ mul_zero] using\n    hpow.const_mul (2 * β * α * variance)\n\nend FEP037\n"
  latex_equations:
  - '\begin{aligned}

    &(\alpha{}\,\mathsf{variance} : \mathbb{R})\,(n : \mathbb{N}) \\

    &\mathsf{fep037\_autocorrelation}\,\alpha{}\,\mathsf{variance}\,(n + 1) = \mathsf{fep037\_relaxation}\,\alpha{} \\

    &\cdot \mathsf{fep037\_autocorrelation}\,\alpha{}\,\mathsf{variance}\,n

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathbb{R}\}\,(h\alpha{}0 : 0 < \alpha{})\,(h\alpha{}1 : \alpha{} < 1)\,(\mathsf{variance} : \mathbb{R})
    \\

    &\mathsf{Filter.Tendsto}\,(\mathsf{fep037\_autocorrelation}\,\alpha{}\,\mathsf{variance})\,\mathsf{Filter.atTop}\,(\mathsf{nhds}\,0)

    \end{aligned}'
  - '\begin{aligned}

    &(\beta{}\,\alpha{}\,\mathsf{variance} : \mathbb{R})\,(n : \mathbb{N}) \\

    &\mathsf{fep037\_response}\,\beta{}\,\alpha{}\,\mathsf{variance}\,n = 2 \cdot \beta{} \cdot \alpha{} \cdot \mathsf{variance}
    \cdot \mathsf{fep037\_relaxation}\,\alpha{} ^ n

    \end{aligned}'
  - '\begin{aligned}

    &\{\beta{}\,\alpha{}\,\mathsf{variance} : \mathbb{R}\}\,(h\beta{} : 0 \le \beta{})\,(h\alpha{}0 : 0 \le \alpha{})\,(h\alpha{}half
    : \alpha{} \le 1 / 2) \\

    &(\mathsf{hvariance} : 0 \le \mathsf{variance})\,(n : \mathbb{N}) \\

    &0 \le \mathsf{fep037\_response}\,\beta{}\,\alpha{}\,\mathsf{variance}\,n

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathbb{R}\}\,(h\alpha{}0 : 0 < \alpha{})\,(h\alpha{}1 : \alpha{} < 1)\,(\beta{}\,\mathsf{variance} : \mathbb{R})
    \\

    &\mathsf{Filter.Tendsto}\,(\lambda\,n \mapsto \mathsf{fep037\_response}\,\beta{}\,\alpha{}\,\mathsf{variance}\,n)\,\mathsf{Filter.atTop}\,(\mathsf{nhds}\,0)

    \end{aligned}'
- id: fep-038
  title: Bernoulli Fisher Information and Natural Gradient
  area: InfoGeometry
  family: core-information-geometry
  mathlib_modules:
  - Analysis.Calculus.Deriv.Basic
  mathlib_status: real
  primary_theorem: fep038_fisherInformation_eq
  supporting_theorems:
  - fep038_bernoulliMass_hasDerivAt
  - fep038_bernoulliMass_sum_one
  - fep038_expectedScore_zero
  - fep038_fisherMetric_pos
  - fep038_naturalGradient_duality
  - fep038_fisherMetric_coordinate
  - fep038_fisherMetric_pullback
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The differentiated Bernoulli family has zero expected score and Fisher information 1/(p(1-p)); its inverse metric defines
    a dual natural gradient and is the pullback of the Euclidean metric along the Fisher--Rao coordinate. Assumption scope:
    Metric positivity, inverse-metric duality, and the coordinate law require an interior Bernoulli parameter 0 < p < 1. This
    is a complete one-dimensional Bernoulli information geometry, not a general finite- or infinite-dimensional statistical
    manifold. Semantic disposition: `formalized`.

    '
  assumption_review: Metric positivity, inverse-metric duality, and the coordinate law require an interior Bernoulli parameter
    0 < p < 1. This is a complete one-dimensional Bernoulli information geometry, not a general finite- or infinite-dimensional
    statistical manifold.
  non_vacuity: At p = 1/2 the Fisher information is 4, every nonzero tangent has positive metric norm, and the natural-gradient
    map rescales nonzero covectors by 1/4.
  acceptance_probe: native Lean compile of fep038_bernoulliMass_hasDerivAt, fep038_expectedScore_zero, fep038_fisherInformation_eq,
    fep038_fisherMetric_pos, fep038_naturalGradient_duality, and fep038_fisherMetric_coordinate.
  lean_sketch: "import Mathlib.Analysis.Calculus.Deriv.Add\nimport Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport\
    \ Mathlib.Data.Bool.Basic\nimport Mathlib.Analysis.Real.Sqrt\nimport Mathlib.Tactic\n\nnamespace FEP038\n\n/-- Bernoulli\
    \ probability mass with success parameter `p`. -/\ndef fep038_bernoulliMass (p : ℝ) : Bool → ℝ\n  | false => 1 - p\n \
    \ | true => p\n\n/-- Pointwise parameter derivative of the Bernoulli mass. -/\ndef fep038_bernoulliMassDeriv : Bool →\
    \ ℝ\n  | false => -1\n  | true => 1\n\n/-- The Bernoulli family is differentiable in its scalar parameter. -/\ntheorem\
    \ fep038_bernoulliMass_hasDerivAt (p : ℝ) (b : Bool) :\n    HasDerivAt (fun q => fep038_bernoulliMass q b)\n      (fep038_bernoulliMassDeriv\
    \ b) p := by\n  cases b\n  · convert (hasDerivAt_const p (1 : ℝ)).sub (hasDerivAt_id p) using 1\n    all_goals\n     \
    \ first\n      | exact AddCommGroup.ext rfl\n      | exact Module.ext rfl\n      | rfl\n      | norm_num [fep038_bernoulliMass,\
    \ fep038_bernoulliMassDeriv]\n  · convert hasDerivAt_id p using 1\n    all_goals rfl\n\n/-- Bernoulli masses are normalized\
    \ for every scalar parameter. Their\nprobabilistic interpretation additionally restricts `p` to `[0,1]`. -/\ntheorem fep038_bernoulliMass_sum_one\
    \ (p : ℝ) :\n    ∑ b : Bool, fep038_bernoulliMass p b = 1 := by\n  simp [fep038_bernoulliMass]\n\n/-- Bernoulli score\
    \ `∂ₚ log Pₚ(b)`, represented as `(∂ₚ Pₚ(b)) / Pₚ(b)`. -/\nnoncomputable def fep038_score (p : ℝ) (b : Bool) : ℝ :=\n\
    \  fep038_bernoulliMassDeriv b / fep038_bernoulliMass p b\n\n/-- At an interior parameter the expected Bernoulli score\
    \ vanishes. -/\ntheorem fep038_expectedScore_zero {p : ℝ} (hp0 : 0 < p) (hp1 : p < 1) :\n    ∑ b : Bool, fep038_bernoulliMass\
    \ p b * fep038_score p b = 0 := by\n  have hp : p ≠ 0 := ne_of_gt hp0\n  have h1p : 1 - p ≠ 0 := ne_of_gt (sub_pos.mpr\
    \ hp1)\n  simp [fep038_bernoulliMass, fep038_score, fep038_bernoulliMassDeriv, hp]\n  field_simp [h1p]\n  ring\n\n/--\
    \ Fisher information is the expected squared score. -/\nnoncomputable def fep038_fisherInformation (p : ℝ) : ℝ :=\n  ∑\
    \ b : Bool,\n    fep038_bernoulliMass p b * fep038_score p b ^ 2\n\n/-- The Bernoulli Fisher information is `1 / (p(1-p))`\
    \ in the interior. -/\ntheorem fep038_fisherInformation_eq {p : ℝ} (hp0 : 0 < p) (hp1 : p < 1) :\n    fep038_fisherInformation\
    \ p = 1 / (p * (1 - p)) := by\n  have hp : p ≠ 0 := ne_of_gt hp0\n  have h1p : 1 - p ≠ 0 := ne_of_gt (sub_pos.mpr hp1)\n\
    \  simp [fep038_fisherInformation, fep038_bernoulliMass, fep038_score,\n    fep038_bernoulliMassDeriv]\n  field_simp [hp,\
    \ h1p]\n  ring\n\n/-- The one-dimensional Fisher metric applied to tangent coordinates. -/\nnoncomputable def fep038_fisherMetric\
    \ (p v w : ℝ) : ℝ :=\n  fep038_fisherInformation p * v * w\n\n/-- The Bernoulli Fisher metric is positive definite in\
    \ the interior. -/\ntheorem fep038_fisherMetric_pos {p v : ℝ} (hp0 : 0 < p) (hp1 : p < 1)\n    (hv : v ≠ 0) :\n    0 <\
    \ fep038_fisherMetric p v v := by\n  rw [fep038_fisherMetric, fep038_fisherInformation_eq hp0 hp1]\n  have hden : 0 <\
    \ p * (1 - p) := mul_pos hp0 (sub_pos.mpr hp1)\n  have hmetric : 0 < (1 / (p * (1 - p))) * (v * v) :=\n    mul_pos (one_div_pos.mpr\
    \ hden) (mul_self_pos.mpr hv)\n  nlinarith\n\n/-- Inverse-metric natural gradient for the Bernoulli parameter. -/\ndef\
    \ fep038_naturalGradient (p gradient : ℝ) : ℝ :=\n  p * (1 - p) * gradient\n\n/-- Applying the Fisher metric to its natural\
    \ gradient recovers the covector. -/\ntheorem fep038_naturalGradient_duality {p gradient : ℝ}\n    (hp0 : 0 < p) (hp1\
    \ : p < 1) :\n    fep038_fisherInformation p * fep038_naturalGradient p gradient = gradient := by\n  rw [fep038_fisherInformation_eq\
    \ hp0 hp1]\n  have hp : p ≠ 0 := ne_of_gt hp0\n  have h1p : 1 - p ≠ 0 := ne_of_gt (sub_pos.mpr hp1)\n  simp only [fep038_naturalGradient]\n\
    \  field_simp [hp, h1p]\n\n/-- Jacobian of the Bernoulli Fisher--Rao variance-stabilizing coordinate. -/\nnoncomputable\
    \ def fep038_coordinateJacobian (p : ℝ) : ℝ :=\n  1 / Real.sqrt (p * (1 - p))\n\n/-- The Fisher information is the square\
    \ of the Fisher--Rao coordinate\nJacobian, i.e. the metric is the pullback of the Euclidean metric. -/\ntheorem fep038_fisherMetric_coordinate\
    \ {p : ℝ} (hp0 : 0 < p) (hp1 : p < 1) :\n    fep038_coordinateJacobian p ^ 2 = fep038_fisherInformation p := by\n  rw\
    \ [fep038_fisherInformation_eq hp0 hp1]\n  have hprod : 0 ≤ p * (1 - p) := (mul_pos hp0 (sub_pos.mpr hp1)).le\n  simp\
    \ [fep038_coordinateJacobian, Real.sq_sqrt hprod]\n\n/-- Tangent-vector form of the coordinate pullback law. -/\ntheorem\
    \ fep038_fisherMetric_pullback {p v w : ℝ}\n    (hp0 : 0 < p) (hp1 : p < 1) :\n    fep038_fisherMetric p v w =\n     \
    \ (fep038_coordinateJacobian p * v) *\n        (fep038_coordinateJacobian p * w) := by\n  rw [fep038_fisherMetric]\n \
    \ have hcoord := fep038_fisherMetric_coordinate hp0 hp1\n  rw [← hcoord]\n  ring\n\nend FEP038\n"
  latex_equations:
  - '\begin{aligned}

    &(p : \mathbb{R})\,(b : \mathsf{Bool}) \\

    &\mathsf{HasDerivAt}\,(\lambda\,q \mapsto \mathsf{fep038\_bernoulliMass}\,q\,b)\,(\mathsf{fep038\_bernoulliMassDeriv}\,b)\,p

    \end{aligned}'
  - '\begin{aligned}

    &(p : \mathbb{R}) \\

    &\sum b : \mathsf{Bool}, \mathsf{fep038\_bernoulliMass}\,p\,b = 1

    \end{aligned}'
  - '\begin{aligned}

    &\{p : \mathbb{R}\}\,(\mathsf{hp0} : 0 < p)\,(\mathsf{hp1} : p < 1) \\

    &\sum b : \mathsf{Bool}, \mathsf{fep038\_bernoulliMass}\,p\,b \cdot \mathsf{fep038\_score}\,p\,b = 0

    \end{aligned}'
  - '\begin{aligned}

    &\{p : \mathbb{R}\}\,(\mathsf{hp0} : 0 < p)\,(\mathsf{hp1} : p < 1) \\

    &\mathsf{fep038\_fisherInformation}\,p = 1 / (p \cdot (1 - p))

    \end{aligned}'
  - '\begin{aligned}

    &\{p\,v : \mathbb{R}\}\,(\mathsf{hp0} : 0 < p)\,(\mathsf{hp1} : p < 1)\,(\mathsf{hv} : v \ne 0) \\

    &0 < \mathsf{fep038\_fisherMetric}\,p\,v\,v

    \end{aligned}'
  - '\begin{aligned}

    &\{p\,\mathsf{gradient} : \mathbb{R}\}\,(\mathsf{hp0} : 0 < p)\,(\mathsf{hp1} : p < 1) \\

    &\mathsf{fep038\_fisherInformation}\,p \cdot \mathsf{fep038\_naturalGradient}\,p\,\mathsf{gradient} = \mathsf{gradient}

    \end{aligned}'
  - '\begin{aligned}

    &\{p : \mathbb{R}\}\,(\mathsf{hp0} : 0 < p)\,(\mathsf{hp1} : p < 1) \\

    &\mathsf{fep038\_coordinateJacobian}\,p ^ 2 = \mathsf{fep038\_fisherInformation}\,p

    \end{aligned}'
  - '\begin{aligned}

    &\{p\,v\,w : \mathbb{R}\}\,(\mathsf{hp0} : 0 < p)\,(\mathsf{hp1} : p < 1) \\

    &\mathsf{fep038\_fisherMetric}\,p\,v\,w = (\mathsf{fep038\_coordinateJacobian}\,p \cdot v) \\

    &\cdot (\mathsf{fep038\_coordinateJacobian}\,p \cdot w)

    \end{aligned}'
- id: fep-039
  title: Four-Block Additive Free Energy
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - Algebra.BigOperators.Group.Finset
  mathlib_status: real
  primary_theorem: fep039_global_eq_zero_iff
  supporting_theorems:
  - fep039_global_nonneg
  - fep039_global_mono
  - fep039_global_zero
  - fep039_global_add
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Four local free-energy contributions aggregate additively and monotonically; under local nonnegativity, their global
    sum vanishes exactly when every local term vanishes. Assumption scope: Additivity is unconditional over four real components.
    Zero separation requires each local term to be nonnegative. The composed partition theorem ties those four components
    to fep-005''s exact state blocks. Semantic disposition: `formalized`.

    '
  assumption_review: Additivity is unconditional over four real components. Zero separation requires each local term to be
    nonnegative. The composed partition theorem ties those four components to fep-005's exact state blocks.
  non_vacuity: A single positive local contribution makes the global quantity positive, while independent nonzero contributions
    exercise exact additivity.
  acceptance_probe: native Lean compile of fep039_global_nonneg, fep039_global_mono, fep039_global_add, fep039_global_eq_zero_iff,
    and FEPComposed.fep039_partitionEnergy_conservation.
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.Algebra.Order.BigOperators.Group.Finset\n\
    import Mathlib.Basic.Real.Basic\n\nnamespace FEP039\n\nopen Finset\n\n-- [proof strategy: Finset.sum_nonneg + sum_le_sum\
    \ + sum_const for global-vs-local FE]\n\n/-- Global free energy: ∑ local contributions over a partition. -/\ndef fep039_global_fe\
    \ (local_fe : Fin 4 → ℝ) : ℝ :=\n  ∑ i : Fin 4, local_fe i\n\n/-- Global FE is nonneg when all local contributions are\
    \ nonneg. -/\ntheorem fep039_global_nonneg (local_fe : Fin 4 → ℝ) (h : ∀ i, 0 ≤ local_fe i) :\n    0 ≤ fep039_global_fe\
    \ local_fe :=\n  Finset.sum_nonneg fun i _ => h i\n\n/-- Global FE monotone: improving one local term improves the global.\
