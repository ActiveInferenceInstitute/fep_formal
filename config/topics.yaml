  supporting_theorems:
  - fep111_consensus_total_mass_two
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The specified doubly stochastic two-agent consensus update conserves combined mass at every state and therefore preserves
    total combined mass two. Assumption scope: The state carrier is finite and both inputs are normalized FiniteLaw values.
    Conservation is for the maintained two-agent mixing operator; it does not establish consensus, stationarity, or conservation
    for arbitrary interaction matrices. Semantic disposition: `formalized`.

    '
  assumption_review: The state carrier is finite and both inputs are normalized FiniteLaw values. Conservation is for the
    maintained two-agent mixing operator; it does not establish consensus, stationarity, or conservation for arbitrary interaction
    matrices.
  non_vacuity: Unequal input laws redistribute statewise mass between agents while the exact pointwise sum remains fixed and
    the two output laws each remain normalized.
  acceptance_probe: native Lean compile of fep111_consensus_pointwise_mass_conserved and fep111_consensus_total_mass_two for
    arbitrary finite input laws.
  lean_sketch: "import FepSketches.collective_inference\n\n/-! # Consensus Mass Conservation -/\nnamespace FEP111\n\nopen\
    \ FEP Finset\nopen scoped BigOperators\n\nvariable {State : Type*} [Fintype State]\n\n/-- The doubly stochastic two-agent\
    \ update conserves combined mass at every\nstate. -/\ntheorem fep111_consensus_pointwise_mass_conserved\n    (left right\
    \ : FiniteLaw State) (state : State) :\n    FEP.CollectiveInference.consensusLeft left right state +\n        FEP.CollectiveInference.consensusRight\
    \ left right state =\n      left state + right state :=\n  FEP.CollectiveInference.consensusMass_conserved left right\
    \ state\n\n/-- Consequently, the two normalized post-update laws have total combined\nmass two. -/\ntheorem fep111_consensus_total_mass_two\n\
    \    (left right : FiniteLaw State) :\n    (∑ state, FEP.CollectiveInference.consensusLeft left right state) +\n     \
    \   ∑ state, FEP.CollectiveInference.consensusRight left right state = 2 := by\n  rw [(FEP.CollectiveInference.consensusLeft\
    \ left right).sum_one,\n    (FEP.CollectiveInference.consensusRight left right).sum_one]\n  norm_num\n\nend FEP111\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{State}] \\

    &(\mathsf{left}\,\mathsf{right} : \mathsf{FiniteLaw}\,\mathsf{State})\,(\mathsf{state} : \mathsf{State}) \\

    &\mathsf{FEP.CollectiveInference.consensusLeft}\,\mathsf{left}\,\mathsf{right}\,\mathsf{state} \\

    &+ \mathsf{FEP.CollectiveInference.consensusRight}\,\mathsf{left}\,\mathsf{right}\,\mathsf{state} = \mathsf{left}\,\mathsf{state}
