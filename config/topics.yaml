    \\

    &(\tau{} : \mathsf{Kernel}\,\Omega{}\,\Omega{})\,(\kappa{} : \mathsf{Kernel}\,\Omega{}\,\mathcal{X})\,(\mu{} : \mathsf{Measure}
    \Omega{})\,[\mathsf{StandardBorelSpace}\,\Omega{}] \\

    &[\mathsf{Nonempty}\,\Omega{}]\,[\mathsf{IsFiniteMeasure}\,\mu{}]\,[\mathsf{IsFiniteKernel}\,\tau{}]\,[\mathsf{IsMarkovKernel}\,\kappa{}]
    \\

    &\mathsf{fep034\_filter}\,\tau{}\,\kappa{}\,\mu{} \mathbin{\circ_{m}}\,\kappa{} \mathbin{\circ_{m}}\,\mathsf{fep034\_predictivePrior}\,\tau{}\,\mu{}
