  semantic_disposition: formalized
  nl: 'Iterating the maintained strictly stochastic two-agent update halves each atomwise belief gap and drives pointwise
    disagreement to zero. Assumption scope: State is finite and consensus uses the fixed one-quarter/three-quarter mixing
    matrix encoded by consensusLeft and consensusRight. Convergence is pointwise for two agents; no arbitrary network topology,
    time-varying weights, or rate in a global probability metric is claimed. Semantic disposition: `formalized`.

    '
  assumption_review: State is finite and consensus uses the fixed one-quarter/three-quarter mixing matrix encoded by consensusLeft
    and consensusRight. Convergence is pointwise for two agents; no arbitrary network topology, time-varying weights, or rate
    in a global probability metric is claimed.
  non_vacuity: Opposite Boolean point masses begin with unit gap, retain positive gap one half after one update, and satisfy
    a strict decrease rather than a zero-gap tautology.
  acceptance_probe: native Lean compile of fep112_consensus_converges, fep112_consensus_half_contraction, and fep112_bool_nonzero_strict_witness.
  lean_sketch: "import FepSketches.collective_inference\n\n/-! # Contractive Belief-Consensus Convergence -/\nnamespace FEP112\n\
    \nopen FEP Filter\n\nvariable {State : Type*} [Fintype State]\n\n/-- The strictly stochastic consensus matrix contracts\
    \ every atomwise gap by\nexactly one half. -/\ntheorem fep112_consensus_half_contraction\n    (left right : FiniteLaw\
    \ State) (state : State) :\n    FEP.CollectiveInference.beliefGap\n        (FEP.CollectiveInference.consensusLeft left\
    \ right)\n        (FEP.CollectiveInference.consensusRight left right) state =\n      (1 / 2 : ℝ) *\n        FEP.CollectiveInference.beliefGap\
    \ left right state :=\n  FEP.CollectiveInference.consensus_gap_contracts left right state\n\n/-- Iterated consensus converges\
    \ pointwise to zero disagreement. -/\ntheorem fep112_consensus_converges\n    (left right : FiniteLaw State) (state :\
    \ State) :\n    Tendsto\n      (fun iterations =>\n        FEP.CollectiveInference.beliefGap\n          (FEP.CollectiveInference.consensusIterate\n\
    \            (left, right) iterations).1\n          (FEP.CollectiveInference.consensusIterate\n            (left, right)\
    \ iterations).2 state)\n      atTop (nhds 0) :=\n  FEP.CollectiveInference.consensus_gap_tendsto_zero left right state\n\
    \n/-- The contraction is not a zero-gap tautology: opposite Boolean point masses\nretain positive disagreement after one\
    \ step and contract strictly. -/\ntheorem fep112_bool_nonzero_strict_witness :\n    FEP.CollectiveInference.beliefGap\n\
    \        (FiniteLaw.pointMass true) (FiniteLaw.pointMass false) true = 1 ∧\n      FEP.CollectiveInference.beliefGap\n\
    \          (FEP.CollectiveInference.consensusLeft\n            (FiniteLaw.pointMass true) (FiniteLaw.pointMass false))\n\
    \          (FEP.CollectiveInference.consensusRight\n            (FiniteLaw.pointMass true) (FiniteLaw.pointMass false))\
    \ true = 1 / 2 ∧\n      0 < FEP.CollectiveInference.beliefGap\n          (FEP.CollectiveInference.consensusLeft\n    \
    \        (FiniteLaw.pointMass true) (FiniteLaw.pointMass false))\n          (FEP.CollectiveInference.consensusRight\n\
    \            (FiniteLaw.pointMass true) (FiniteLaw.pointMass false)) true ∧\n      FEP.CollectiveInference.beliefGap\n\
    \          (FEP.CollectiveInference.consensusLeft\n            (FiniteLaw.pointMass true) (FiniteLaw.pointMass false))\n\
    \          (FEP.CollectiveInference.consensusRight\n            (FiniteLaw.pointMass true) (FiniteLaw.pointMass false))\
    \ true <\n        FEP.CollectiveInference.beliefGap\n          (FiniteLaw.pointMass true) (FiniteLaw.pointMass false)\
    \ true :=\n  FEP.CollectiveInference.boolConsensus_nonzero_strict_witness\n\nend FEP112\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{State}] \\

    &(\mathsf{left}\,\mathsf{right} : \mathsf{FiniteLaw}\,\mathsf{State})\,(\mathsf{state} : \mathsf{State}) \\

    &\mathsf{FEP.CollectiveInference.beliefGap} \\

    &(\mathsf{FEP.CollectiveInference.consensusLeft}\,\mathsf{left}\,\mathsf{right}) \\

    &(\mathsf{FEP.CollectiveInference.consensusRight}\,\mathsf{left}\,\mathsf{right})\,\mathsf{state} = (1 / 2 : \mathbb{R})
    \\

    &\cdot \mathsf{FEP.CollectiveInference.beliefGap}\,\mathsf{left}\,\mathsf{right}\,\mathsf{state}

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{State}] \\

    &(\mathsf{left}\,\mathsf{right} : \mathsf{FiniteLaw}\,\mathsf{State})\,(\mathsf{state} : \mathsf{State}) \\

