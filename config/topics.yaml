    '
  assumption_review: The decomposition assumes every reference-prior and reference-kernel atom is strictly positive so all
    logarithmic rewrites are sound. Conditional KL nonnegativity is proved for the project's totalized finite divergence,
    but no zero-reference extended-real interpretation is claimed.
