- id: fep-020
  title: Two-State Markov Relaxation
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Analysis.SpecificLimits.Normed
  mathlib_status: real
  primary_theorem: fep020_tendsto_uniform
  supporting_theorems:
  - fep020_transition_nonneg
  - fep020_transition_sum_one
  - fep020_evolve_affine
  - fep020_uniform_stationary
  - fep020_deviation_step
  - fep020_iterate_deviation
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A normalized symmetric two-state transition has the uniform stationary law; its exact n-step deviation is (1-2α)^n
    times the initial deviation and converges to zero for 0 < α < 1. Assumption scope: Transition nonnegativity uses α in
    [0,1], while convergence uses the strict interior so |1-2α| < 1. This is an exact finite-state Markov relaxation model,
    not a discretized Langevin diffusion. Semantic disposition: `formalized`.

    '
  assumption_review: Transition nonnegativity uses α in [0,1], while convergence uses the strict interior so |1-2α| < 1. This
    is an exact finite-state Markov relaxation model, not a discretized Langevin diffusion.
  non_vacuity: For α = 1/4 and any nonstationary initial mass, deviations contract geometrically by 1/2 at every step; at
    α = 1 the chain instead alternates and the strict-interior convergence premise excludes it.
  acceptance_probe: native Lean compile of fep020_transition_nonneg, fep020_transition_sum_one, fep020_uniform_stationary,
    fep020_iterate_deviation, and fep020_tendsto_uniform.
  lean_sketch: "import Mathlib.Analysis.SpecificLimits.Normed\nimport Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport\
    \ Mathlib.Data.Bool.Basic\nimport Mathlib.Tactic\n\nnamespace FEP020\n\n/-- Symmetric two-state Markov transition with\
    \ switching probability `α`. -/\ndef fep020_transition (α : ℝ) : Bool → Bool → ℝ\n  | false, false => 1 - α\n  | false,\
    \ true => α\n  | true, false => α\n  | true, true => 1 - α\n\n/-- The transition entries are nonnegative when `α` is a\
    \ probability. -/\ntheorem fep020_transition_nonneg\n    {α : ℝ} (hα0 : 0 ≤ α) (hα1 : α ≤ 1) (source target : Bool) :\n\
    \    0 ≤ fep020_transition α source target := by\n  cases source <;> cases target <;> simp [fep020_transition] <;> linarith\n\
    \n/-- Every transition row sums to one. -/\ntheorem fep020_transition_sum_one (α : ℝ) (source : Bool) :\n    ∑ target\
    \ : Bool, fep020_transition α source target = 1 := by\n  cases source <;> simp [fep020_transition]\n\n/-- Evolution of\
    \ the probability of state `true` under the transition law. -/\ndef fep020_evolve (α p : ℝ) : ℝ :=\n  (1 - p) * fep020_transition\
    \ α false true +\n    p * fep020_transition α true true\n\n/-- The two-state master equation is an affine relaxation map.\
    \ -/\ntheorem fep020_evolve_affine (α p : ℝ) :\n    fep020_evolve α p = α + (1 - 2 * α) * p := by\n  simp [fep020_evolve,\
    \ fep020_transition]\n  ring\n\n/-- The uniform law is stationary under the symmetric transition. -/\ntheorem fep020_uniform_stationary\
    \ (α : ℝ) :\n    fep020_evolve α (1 / 2 : ℝ) = 1 / 2 := by\n  rw [fep020_evolve_affine]\n  ring\n\n/-- One transition\
    \ scales deviation from equilibrium by `1 - 2α`. -/\ntheorem fep020_deviation_step (α p : ℝ) :\n    fep020_evolve α p\
    \ - 1 / 2 = (1 - 2 * α) * (p - 1 / 2) := by\n  rw [fep020_evolve_affine]\n  ring\n\n/-- Exact deviation after `n` Markov\
    \ steps. -/\ntheorem fep020_iterate_deviation (α p : ℝ) (n : ℕ) :\n    ((fep020_evolve α)^[n]) p - 1 / 2 =\n      (1 -\
    \ 2 * α) ^ n * (p - 1 / 2) := by\n  induction n with\n  | zero => simp\n  | succ n ih =>\n      rw [Function.iterate_succ_apply']\n\
    \      rw [fep020_deviation_step, ih, pow_succ]\n      ring\n\n/-- With a strictly interior switching probability, every\
    \ initial mass\nconverges to the stationary uniform law. -/\ntheorem fep020_tendsto_uniform\n    {α : ℝ} (hα0 : 0 < α)\
    \ (hα1 : α < 1) (p : ℝ) :\n    Filter.Tendsto (fun n => ((fep020_evolve α)^[n]) p)\n      Filter.atTop (nhds (1 / 2 :\
    \ ℝ)) := by\n  have habs : |1 - 2 * α| < 1 := by\n    rw [abs_lt]\n    constructor <;> linarith\n  have hpow : Filter.Tendsto\
    \ (fun n : ℕ => (1 - 2 * α) ^ n)\n      Filter.atTop (nhds 0) :=\n    tendsto_pow_atTop_nhds_zero_of_abs_lt_one habs\n\
    \  have hdev : Filter.Tendsto\n      (fun n : ℕ => ((fep020_evolve α)^[n]) p - 1 / 2)\n      Filter.atTop (nhds 0) :=\
    \ by\n    simpa only [fep020_iterate_deviation, zero_mul] using\n      hpow.mul_const (p - 1 / 2)\n  simpa only [sub_add_cancel,\
    \ zero_add] using hdev.add_const (1 / 2 : ℝ)\n\nend FEP020\n"
  latex_equations:
  - '\begin{aligned}

    &\{\alpha{} : \mathbb{R}\}\,(h\alpha{}0 : 0 \le \alpha{})\,(h\alpha{}1 : \alpha{} \le 1)\,(\mathsf{source}\,\mathsf{target}
    : \mathsf{Bool}) \\

    &0 \le \mathsf{fep020\_transition}\,\alpha{}\,\mathsf{source}\,\mathsf{target}

    \end{aligned}'
  - '\begin{aligned}

    &(\alpha{} : \mathbb{R})\,(\mathsf{source} : \mathsf{Bool}) \\

    &\sum \mathsf{target} : \mathsf{Bool}, \mathsf{fep020\_transition}\,\alpha{}\,\mathsf{source}\,\mathsf{target} = 1

    \end{aligned}'
  - '\begin{aligned}

    &(\alpha{}\,p : \mathbb{R}) \\

    &\mathsf{fep020\_evolve}\,\alpha{}\,p = \alpha{} + (1 - 2 \cdot \alpha{}) \cdot p

    \end{aligned}'
  - '\begin{aligned}

    &(\alpha{} : \mathbb{R}) \\

    &\mathsf{fep020\_evolve}\,\alpha{}\,(1 / 2 : \mathbb{R}) = 1 / 2

    \end{aligned}'
  - '\begin{aligned}

    &(\alpha{}\,p : \mathbb{R}) \\

    &\mathsf{fep020\_evolve}\,\alpha{}\,p - 1 / 2 = (1 - 2 \cdot \alpha{}) \cdot (p - 1 / 2)

    \end{aligned}'
  - '\begin{aligned}

    &(\alpha{}\,p : \mathbb{R})\,(n : \mathbb{N}) \\

    &((\mathsf{fep020\_evolve}\,\alpha{})^[n])\,p - 1 / 2 = (1 - 2 \cdot \alpha{}) ^ n \cdot (p - 1 / 2)

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathbb{R}\}\,(h\alpha{}0 : 0 < \alpha{})\,(h\alpha{}1 : \alpha{} < 1)\,(p : \mathbb{R}) \\

    &\mathsf{Filter.Tendsto}\,(\lambda\,n \mapsto ((\mathsf{fep020\_evolve}\,\alpha{})^[n])\,p)\,\mathsf{Filter.atTop} \\

    &(\mathsf{nhds}\,(1 / 2 : \mathbb{R}))

    \end{aligned}'
- id: fep-021
  title: EFE Epistemic–Pragmatic Balance
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - Data.ENNReal.Inv
  mathlib_status: real
  primary_theorem: fep021_efe_epistemic_balance
  supporting_theorems:
  - fep021_efe_nonneg
  - fep021_efe_mono_pragmatic
  - fep021_efe_antitone_epistemic
  - fep021_efe_eq_zero_iff
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Expected free energy is pragmatic expected cost minus epistemic information value in ENNReal; under epistemic value
    at most cost, adding information back reconstructs cost, while EFE is monotone in cost and antitone in information. Assumption
    scope: The truncated subtraction convention makes EFE nonnegative and requires an explicit epistemic≤pragmatic premise
    for exact reconstruction. It does not assert the alternative risk-plus-ambiguity identity without a generative-model derivation.
    Semantic disposition: `formalized`.

    '
  assumption_review: The truncated subtraction convention makes EFE nonnegative and requires an explicit epistemic≤pragmatic
    premise for exact reconstruction. It does not assert the alternative risk-plus-ambiguity identity without a generative-model
    derivation.
  non_vacuity: Strictly positive pragmatic cost with zero information yields positive EFE, equal cost and information yields
    zero, and intermediate information lowers EFE without changing sign.
  acceptance_probe: native Lean compile of fep021_efe_epistemic_balance, fep021_efe_mono_pragmatic, fep021_efe_antitone_epistemic,
    and fep021_efe_eq_zero_iff.
  lean_sketch: "import Mathlib.Basic.ENNReal.Inv\n\nnamespace FEP021\n\nopen scoped ENNReal\n\n/-- Expected free energy convention:\
    \ pragmatic expected cost minus epistemic\ninformation value, truncated at zero in the extended nonnegative reals. -/\n\
    noncomputable def fep021_expectedFreeEnergy\n    (pragmaticCost epistemicValue : ENNReal) : ENNReal :=\n  pragmaticCost\
    \ - epistemicValue\n\n/-- Expected free energy is nonnegative in its native codomain. -/\ntheorem fep021_efe_nonneg (pragmaticCost\
    \ epistemicValue : ENNReal) :\n    0 ≤ fep021_expectedFreeEnergy pragmaticCost epistemicValue :=\n  bot_le\n\n/-- When\
    \ information value does not exceed pragmatic cost, adding it back\nexactly reconstructs that cost. This fixes the epistemic\
    \ sign convention. -/\ntheorem fep021_efe_epistemic_balance\n    {pragmaticCost epistemicValue : ENNReal}\n    (hvalue\
    \ : epistemicValue ≤ pragmaticCost) :\n    fep021_expectedFreeEnergy pragmaticCost epistemicValue + epistemicValue =\n\
    \      pragmaticCost := by\n  exact tsub_add_cancel_of_le hvalue\n\n/-- Higher pragmatic cost cannot reduce EFE at fixed\
    \ information value. -/\ntheorem fep021_efe_mono_pragmatic\n    {pragmatic₁ pragmatic₂ epistemicValue : ENNReal}\n   \
    \ (hpragmatic : pragmatic₁ ≤ pragmatic₂) :\n    fep021_expectedFreeEnergy pragmatic₁ epistemicValue ≤\n      fep021_expectedFreeEnergy\
    \ pragmatic₂ epistemicValue :=\n  tsub_le_tsub_right hpragmatic epistemicValue\n\n/-- Higher epistemic value cannot increase\
    \ EFE at fixed pragmatic cost. -/\ntheorem fep021_efe_antitone_epistemic\n    {pragmaticCost epistemic₁ epistemic₂ : ENNReal}\n\
    \    (hepistemic : epistemic₁ ≤ epistemic₂) :\n    fep021_expectedFreeEnergy pragmaticCost epistemic₂ ≤\n      fep021_expectedFreeEnergy\
    \ pragmaticCost epistemic₁ :=\n  tsub_le_tsub_left hepistemic pragmaticCost\n\n/-- Truncated EFE is zero exactly when\
    \ information value covers pragmatic cost. -/\ntheorem fep021_efe_eq_zero_iff\n    (pragmaticCost epistemicValue : ENNReal)\
    \ :\n    fep021_expectedFreeEnergy pragmaticCost epistemicValue = 0 ↔\n      pragmaticCost ≤ epistemicValue := by\n  exact\
    \ tsub_eq_zero_iff_le\n\nend FEP021\n"
