  - fep034_filter_mass_one
  - fep034_filter_recovers_prediction
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A transition-composed predictive prior and native observation posterior reconstruct the swapped predicted-state/observation
    joint law, with probability mass one in every posterior fibre. Assumption scope: Conditional on standard-Borel nonempty
    latent structure, a finite prior, and finite transition and observation kernels; prediction preserves total mass when
    the transition is Markov, and posterior recovery additionally requires a Markov observation kernel. This is a one-step
    exact filter, not a convergence or learned-state theorem. Semantic disposition: `formalized`.

    '
  assumption_review: Conditional on standard-Borel nonempty latent structure, a finite prior, and finite transition and observation
    kernels; prediction preserves total mass when the transition is Markov, and posterior recovery additionally requires a
    Markov observation kernel. This is a one-step exact filter, not a convergence or learned-state theorem.
  non_vacuity: A nonidentity finite Markov transition followed by a noisy observation kernel yields a nontrivial predictive
    prior and posterior; each posterior fibre has mass one rather than merely nonnegative unnormalized weight.
  acceptance_probe: native Lean compile of fep034_predictive_mass, fep034_filter_mass_one, fep034_filter_joint_reconstruction,
    and fep034_filter_recovers_prediction.
  lean_sketch: "import Mathlib.Probability.Kernel.Posterior\n\nnamespace FEP034\n\nopen MeasureTheory ProbabilityTheory\n\
    open scoped ENNReal ProbabilityTheory\n\nvariable {Ω \U0001D4E7 : Type*} [MeasurableSpace Ω] [MeasurableSpace \U0001D4E7\
    ]\n\n/-- The one-step predictive prior obtained by composing a transition kernel\nwith the previous latent-state law.\
    \ -/\nnoncomputable def fep034_predictivePrior\n    (τ : Kernel Ω Ω) (μ : Measure Ω) : Measure Ω :=\n  τ ∘ₘ μ\n\n/-- A\
    \ Markov transition preserves total prior mass. -/\ntheorem fep034_predictive_mass\n    (τ : Kernel Ω Ω) (μ : Measure\
    \ Ω) [IsMarkovKernel τ] :\n    fep034_predictivePrior τ μ Set.univ = μ Set.univ := by\n  exact Measure.comp_apply_univ\n\
    \n/-- The normalized filtering kernel is the posterior of the observation\nkernel with respect to the transition-predicted\
    \ prior. -/\nnoncomputable def fep034_filter\n    (τ : Kernel Ω Ω) (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace\
    \ Ω] [Nonempty Ω]\n    [IsFiniteMeasure μ] [IsFiniteKernel τ] [IsFiniteKernel κ] : Kernel \U0001D4E7 Ω :=\n  ProbabilityTheory.posterior\
    \ κ (τ ∘ₘ μ)\n\n/-- Every observation-indexed filtering posterior has total mass one. -/\ntheorem fep034_filter_mass_one\n\
    \    (τ : Kernel Ω Ω) (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace Ω] [Nonempty Ω]\n    [IsFiniteMeasure\
    \ μ] [IsFiniteKernel τ] [IsFiniteKernel κ] (x : \U0001D4E7) :\n    fep034_filter τ κ μ x Set.univ = 1 := by\n  change\
    \ (ProbabilityTheory.posterior κ (τ ∘ₘ μ) x) Set.univ = 1\n  exact measure_univ\n\n/-- The predictive observation law\
    \ and filtering posterior reconstruct the\nswapped predicted-state/observation joint law. -/\ntheorem fep034_filter_joint_reconstruction\n\
    \    (τ : Kernel Ω Ω) (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace Ω] [Nonempty Ω]\n    [IsFiniteMeasure\
    \ μ] [IsFiniteKernel τ] [IsFiniteKernel κ] :\n    (κ ∘ₘ fep034_predictivePrior τ μ) ⊗ₘ fep034_filter τ κ μ =\n      (fep034_predictivePrior\
    \ τ μ ⊗ₘ κ).map Prod.swap := by\n  change\n    (κ ∘ₘ (τ ∘ₘ μ)) ⊗ₘ ProbabilityTheory.posterior κ (τ ∘ₘ μ) =\n      ((τ\
    \ ∘ₘ μ) ⊗ₘ κ).map Prod.swap\n  exact ProbabilityTheory.compProd_posterior_eq_map_swap\n\n/-- With a Markov observation\
    \ kernel, conditioning after prediction recovers\nthe transition-predicted prior. -/\ntheorem fep034_filter_recovers_prediction\n\
    \    (τ : Kernel Ω Ω) (κ : Kernel Ω \U0001D4E7) (μ : Measure Ω)\n    [StandardBorelSpace Ω] [Nonempty Ω]\n    [IsFiniteMeasure\
    \ μ] [IsFiniteKernel τ] [IsMarkovKernel κ] :\n    fep034_filter τ κ μ ∘ₘ κ ∘ₘ fep034_predictivePrior τ μ =\n      fep034_predictivePrior\
    \ τ μ := by\n  change\n    ProbabilityTheory.posterior κ (τ ∘ₘ μ) ∘ₘ κ ∘ₘ (τ ∘ₘ μ) =\n      τ ∘ₘ μ\n  exact ProbabilityTheory.posterior_comp_self\n\
    \nend FEP034\n"
  latex_equations:
  - '\begin{aligned}

    &\{\Omega{}\,\mathcal{X} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \Omega{}]\,[\mathsf{MeasurableSpace} \mathcal{X}]
