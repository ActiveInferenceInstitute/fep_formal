  nl: 'Mathlib KL divergence is nonnegative, vanishes exactly on equal finite measures, and obeys the composition-product
    chain rule for Markov kernels. Assumption scope: Self-divergence uses SigmaFinite; zero-characterization and the chain
    rule use finite measures; the chain rule additionally requires Markov kernels. The pin separately exposes native measure-KL
    data processing under a Markov kernel as InformationTheory.klDiv_comp_right_le; fep-014 does not include that theorem
    in its maintained theorem surface. Semantic disposition: `formalized`.

    '
  assumption_review: Self-divergence uses SigmaFinite; zero-characterization and the chain rule use finite measures; the chain
    rule additionally requires Markov kernels. The pin separately exposes native measure-KL data processing under a Markov
    kernel as InformationTheory.klDiv_comp_right_le; fep-014 does not include that theorem in its maintained theorem surface.
  non_vacuity: Equal finite measures witness zero KL, unequal finite measures exercise the zero-characterization, and distinct
    Markov kernels give a nontrivial conditional term in the chain rule.
  acceptance_probe: native Lean compile of fep014_kl_nonneg, fep014_kl_self, fep014_kl_eq_zero_iff, and fep014_kl_chain_rule
    against Mathlib.InformationTheory.KullbackLeibler.ChainRule.
  lean_sketch: "import Mathlib.InformationTheory.KullbackLeibler.ChainRule\n\nnamespace FEP014\n\nvariable {α : Type*} [MeasurableSpace\
    \ α]\n\nopen MeasureTheory ProbabilityTheory\nopen scoped ENNReal\n\n/-- KL divergence is nonnegative in its native extended-real\
    \ codomain. -/\ntheorem fep014_kl_nonneg (μ ν : Measure α) :\n    0 ≤ InformationTheory.klDiv μ ν :=\n  bot_le\n\n/--\
    \ KL divergence of a sigma-finite measure from itself is zero. -/\ntheorem fep014_kl_self (μ : Measure α) [SigmaFinite\
    \ μ] :\n    InformationTheory.klDiv μ μ = 0 :=\n  InformationTheory.klDiv_self μ\n\n/-- For finite measures, zero KL divergence\
    \ characterizes equality. -/\ntheorem fep014_kl_eq_zero_iff (μ ν : Measure α)\n    [IsFiniteMeasure μ] [IsFiniteMeasure\
    \ ν] :\n    InformationTheory.klDiv μ ν = 0 ↔ μ = ν :=\n  InformationTheory.klDiv_eq_zero_iff\n\nvariable {β : Type*}\
    \ [MeasurableSpace β]\n\n/-- Mathlib's composition-product chain rule for KL divergence. -/\ntheorem fep014_kl_chain_rule\
    \ (μ ν : Measure α) (κ η : Kernel α β)\n    [IsFiniteMeasure μ] [IsFiniteMeasure ν]\n    [IsMarkovKernel κ] [IsMarkovKernel\
    \ η] :\n    InformationTheory.klDiv (μ ⊗ₘ κ) (ν ⊗ₘ η) =\n      InformationTheory.klDiv μ ν +\n        InformationTheory.klDiv\
    \ (μ ⊗ₘ κ) (μ ⊗ₘ η) :=\n  InformationTheory.klDiv_compProd_eq_add μ ν κ η\n\nend FEP014\n"
