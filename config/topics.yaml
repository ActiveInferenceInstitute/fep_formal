  assumption_review: The theorem assumes both component lower bounds rather than deriving a dual function or proving primal
    or dual optimizer existence. The multiplier is nonnegative, and the zero-multiplier theorem identifies the exact rate-only
    boundary.
  non_vacuity: Positive multipliers make both certified components contribute, while setting the multiplier to zero reduces
    the Lagrangian exactly to mutual information.
