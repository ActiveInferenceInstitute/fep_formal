- id: fep-044
  title: Bernoulli Squared Hellinger Divergence
  area: InfoGeometry
  family: core-information-geometry
  mathlib_modules:
  - Data.Real.Sqrt
  mathlib_status: real
  primary_theorem: fep044_hellingerSq_eq_zero_iff
  supporting_theorems:
  - fep044_hellingerSq_nonneg
  - fep044_hellingerSq_symm
  - fep044_hellingerSq_complement
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The squared Hellinger divergence between Bernoulli laws is nonnegative, symmetric, invariant under success/failure
    relabeling, and separates parameters on [0,1]. Assumption scope: Nonnegativity and symmetry are unconditional for the
    real-valued formula; the probability-divergence interpretation and separation theorem restrict both parameters to [0,1].
    This is the Hellinger member of the alpha-divergence family, not a theorem for every alpha. Semantic disposition: `formalized`.

    '
  assumption_review: Nonnegativity and symmetry are unconditional for the real-valued formula; the probability-divergence
    interpretation and separation theorem restrict both parameters to [0,1]. This is the Hellinger member of the alpha-divergence
    family, not a theorem for every alpha.
  non_vacuity: Equal Bernoulli parameters have zero divergence, while the endpoint laws p = 0 and q = 1 are separated.
  acceptance_probe: native Lean compile of fep044_hellingerSq_nonneg, fep044_hellingerSq_symm, fep044_hellingerSq_eq_zero_iff,
    and fep044_hellingerSq_complement.
  lean_sketch: "import Mathlib.Analysis.Real.Sqrt\nimport Mathlib.Tactic\n\nnamespace FEP044\n\n/-- Squared Hellinger divergence\
    \ between Bernoulli laws, including the\nconventional factor `1/2`. -/\nnoncomputable def fep044_hellingerSq (p q : ℝ)\
    \ : ℝ :=\n  ((Real.sqrt p - Real.sqrt q) ^ 2 +\n      (Real.sqrt (1 - p) - Real.sqrt (1 - q)) ^ 2) / 2\n\n/-- Squared\
    \ Hellinger divergence is nonnegative. -/\ntheorem fep044_hellingerSq_nonneg (p q : ℝ) :\n    0 ≤ fep044_hellingerSq p\
    \ q := by\n  unfold fep044_hellingerSq\n  positivity\n\n/-- Squared Hellinger divergence is symmetric. -/\ntheorem fep044_hellingerSq_symm\
    \ (p q : ℝ) :\n    fep044_hellingerSq p q = fep044_hellingerSq q p := by\n  unfold fep044_hellingerSq\n  ring\n\n/-- On\
    \ the probability interval, zero squared Hellinger divergence\ncharacterizes equality of Bernoulli parameters. -/\ntheorem\
    \ fep044_hellingerSq_eq_zero_iff\n    {p q : ℝ} (hp : p ∈ Set.Icc (0 : ℝ) 1) (hq : q ∈ Set.Icc (0 : ℝ) 1) :\n    fep044_hellingerSq\
    \ p q = 0 ↔ p = q := by\n  constructor\n  · intro hzero\n    rw [fep044_hellingerSq] at hzero\n    have hfirst_sq : (Real.sqrt\
    \ p - Real.sqrt q) ^ 2 = 0 := by\n      nlinarith [sq_nonneg (Real.sqrt (1 - p) - Real.sqrt (1 - q))]\n    have hfirst\
    \ : Real.sqrt p - Real.sqrt q = 0 := by\n      nlinarith\n    have hsqrt : Real.sqrt p = Real.sqrt q := sub_eq_zero.mp\
    \ hfirst\n    exact (Real.sqrt_inj hp.1 hq.1).mp hsqrt\n  · rintro rfl\n    simp [fep044_hellingerSq]\n\n/-- Relabeling\
    \ Bernoulli success and failure leaves Hellinger divergence\nunchanged. -/\ntheorem fep044_hellingerSq_complement (p q\
    \ : ℝ) :\n    fep044_hellingerSq (1 - p) (1 - q) = fep044_hellingerSq p q := by\n  unfold fep044_hellingerSq\n  congr\
    \ 1\n  ring_nf\n\nend FEP044\n"
  latex_equations:
  - '\begin{aligned}

    &(p\,q : \mathbb{R}) \\

    &0 \le \mathsf{fep044\_hellingerSq}\,p\,q

    \end{aligned}'
  - '\begin{aligned}

    &(p\,q : \mathbb{R}) \\

    &\mathsf{fep044\_hellingerSq}\,p\,q = \mathsf{fep044\_hellingerSq}\,q\,p

    \end{aligned}'
  - '\begin{aligned}

    &\{p\,q : \mathbb{R}\}\,(\mathsf{hp} : p \in \mathsf{Set.Icc}\,(0 : \mathbb{R})\,1)\,(\mathsf{hq} : q \in \mathsf{Set.Icc}\,(0
    : \mathbb{R})\,1) \\

    &\mathsf{fep044\_hellingerSq}\,p\,q = 0 \leftrightarrow p = q

    \end{aligned}'
  - '\begin{aligned}

    &(p\,q : \mathbb{R}) \\

    &\mathsf{fep044\_hellingerSq}\,(1 - p)\,(1 - q) = \mathsf{fep044\_hellingerSq}\,p\,q

    \end{aligned}'
- id: fep-045
  title: Finite Bernoulli Conjugate Closure
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Algebra.BigOperators.Group.Finset
  mathlib_status: real
  primary_theorem: fep045_bernoulli_posterior_closed
  supporting_theorems:
  - fep045_evidence_pos
  - fep045_posteriorParameter_mem_unit
  - fep045_posterior_mass_one
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'For a nonzero evidence normalizer, likelihood-times-Bernoulli-prior mass normalizes pointwise to another Bernoulli
    law at the Bayes-updated parameter. Assumption scope: Closure is exact for a binary latent hypothesis and binary evidence
    likelihood. Interior prior and positive likelihood assumptions prove positive evidence and keep the updated parameter
    in [0,1]. This is a finite Bernoulli conjugate family, not Beta-density conjugacy. Semantic disposition: `formalized`.

    '
  assumption_review: Closure is exact for a binary latent hypothesis and binary evidence likelihood. Interior prior and positive
    likelihood assumptions prove positive evidence and keep the updated parameter in [0,1]. This is a finite Bernoulli conjugate
    family, not Beta-density conjugacy.
  non_vacuity: Unequal positive likelihoods move an interior prior parameter while posterior mass still sums to one; equal
    likelihoods leave the prior parameter unchanged algebraically.
  acceptance_probe: native Lean compile of fep045_evidence_pos, fep045_posteriorParameter_mem_unit, fep045_bernoulli_posterior_closed,
    and fep045_posterior_mass_one.
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.Tactic\n\nnamespace FEP045\n\n/-- Bernoulli\
    \ mass function with `true` parameter `p`. -/\ndef fep045_bernoulliMass (p : ℝ) : Bool → ℝ\n  | false => 1 - p\n  | true\
    \ => p\n\n/-- Binary evidence likelihood, indexed by the latent Boolean hypothesis. -/\ndef fep045_binaryLikelihood (l₀\
    \ l₁ : ℝ) : Bool → ℝ\n  | false => l₀\n  | true => l₁\n\n/-- Evidence normalizer for a Bernoulli prior and binary likelihood.\
    \ -/\ndef fep045_evidence (p l₀ l₁ : ℝ) : ℝ :=\n  p * l₁ + (1 - p) * l₀\n\n/-- Updated Bernoulli parameter after observing\
    \ the binary evidence. -/\nnoncomputable def fep045_posteriorParameter (p l₀ l₁ : ℝ) : ℝ :=\n  p * l₁ / fep045_evidence\
    \ p l₀ l₁\n\n/-- Interior priors and positive likelihoods have positive evidence. -/\ntheorem fep045_evidence_pos\n  \
    \  {p l₀ l₁ : ℝ} (hp₀ : 0 < p) (hp₁ : p < 1)\n    (hl₀ : 0 < l₀) (hl₁ : 0 < l₁) :\n    0 < fep045_evidence p l₀ l₁ :=\
    \ by\n  exact add_pos (mul_pos hp₀ hl₁) (mul_pos (sub_pos.mpr hp₁) hl₀)\n\n/-- The updated Bernoulli parameter remains\
    \ in the unit interval. -/\ntheorem fep045_posteriorParameter_mem_unit\n    {p l₀ l₁ : ℝ} (hp₀ : 0 < p) (hp₁ : p < 1)\n\
    \    (hl₀ : 0 < l₀) (hl₁ : 0 < l₁) :\n    0 ≤ fep045_posteriorParameter p l₀ l₁ ∧\n      fep045_posteriorParameter p l₀\
    \ l₁ ≤ 1 := by\n  have hZ : 0 < fep045_evidence p l₀ l₁ :=\n    fep045_evidence_pos hp₀ hp₁ hl₀ hl₁\n  constructor\n \
    \ · exact div_nonneg (mul_nonneg hp₀.le hl₁.le) hZ.le\n  · apply (div_le_one hZ).2\n    simp only [fep045_evidence]\n\
    \    exact le_add_of_nonneg_right (mul_nonneg (sub_nonneg.mpr hp₁.le) hl₀.le)\n\n/-- Pointwise Bayes closure: normalized\
    \ likelihood-times-prior mass is exactly\nthe Bernoulli family at the updated parameter. -/\ntheorem fep045_bernoulli_posterior_closed\n\
    \    {p l₀ l₁ : ℝ} (hZ : fep045_evidence p l₀ l₁ ≠ 0) (b : Bool) :\n    fep045_bernoulliMass (fep045_posteriorParameter\
    \ p l₀ l₁) b =\n      fep045_bernoulliMass p b * fep045_binaryLikelihood l₀ l₁ b /\n        fep045_evidence p l₀ l₁ :=\
    \ by\n  cases b\n  · simp only [fep045_bernoulliMass, fep045_binaryLikelihood,\n      fep045_posteriorParameter]\n   \
    \ field_simp [fep045_evidence]\n    simp only [fep045_evidence]\n    ring\n  · simp [fep045_bernoulliMass, fep045_binaryLikelihood,\n\
    \      fep045_posteriorParameter]\n\n/-- The conjugate posterior Bernoulli mass function remains normalized. -/\ntheorem\
    \ fep045_posterior_mass_one (p l₀ l₁ : ℝ) :\n    ∑ b : Bool, fep045_bernoulliMass (fep045_posteriorParameter p l₀ l₁)\
    \ b = 1 := by\n  simp [fep045_bernoulliMass]\n\nend FEP045\n"
  latex_equations:
  - '\begin{aligned}

    &\{p\,l_{0}\,l_{1} : \mathbb{R}\}\,(hp_{0} : 0 < p)\,(hp_{1} : p < 1)\,(hl_{0} : 0 < l_{0})\,(hl_{1} : 0 < l_{1}) \\

    &0 < \mathsf{fep045\_evidence}\,p\,l_{0}\,l_{1}

    \end{aligned}'
  - '\begin{aligned}

    &\{p\,l_{0}\,l_{1} : \mathbb{R}\}\,(hp_{0} : 0 < p)\,(hp_{1} : p < 1)\,(hl_{0} : 0 < l_{0})\,(hl_{1} : 0 < l_{1}) \\

    &0 \le \mathsf{fep045\_posteriorParameter}\,p\,l_{0}\,l_{1} \wedge \mathsf{fep045\_posteriorParameter}\,p\,l_{0}\,l_{1}
    \le 1

    \end{aligned}'
  - '\begin{aligned}

    &\{p\,l_{0}\,l_{1} : \mathbb{R}\}\,(\mathsf{hZ} : \mathsf{fep045\_evidence}\,p\,l_{0}\,l_{1} \ne 0)\,(b : \mathsf{Bool})
    \\

    &\mathsf{fep045\_bernoulliMass}\,(\mathsf{fep045\_posteriorParameter}\,p\,l_{0}\,l_{1})\,b \\

    &= \mathsf{fep045\_bernoulliMass}\,p\,b \cdot \mathsf{fep045\_binaryLikelihood}\,l_{0}\,l_{1}\,b / \mathsf{fep045\_evidence}\,p
    \\

    &l_{0}\,l_{1}

    \end{aligned}'
  - '\begin{aligned}

    &(p\,l_{0}\,l_{1} : \mathbb{R}) \\

    &\sum b : \mathsf{Bool}, \mathsf{fep045\_bernoulliMass}\,(\mathsf{fep045\_posteriorParameter}\,p\,l_{0}\,l_{1})\,b = 1

    \end{aligned}'
- id: fep-046
  title: Finite Stick-Breaking Mass Conservation
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Algebra.BigOperators.Ring.List
  mathlib_status: real
  primary_theorem: fep046_mass_conservation
  supporting_theorems:
  - fep046_remainder_nonneg
  - fep046_remainder_le_one
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'For every finite stick-breaking sequence, allocated weights plus residual mass equal exactly one; unit-interval breaks
    keep the residual in [0,1]. Assumption scope: Mass conservation is a purely algebraic identity with no bounds. Residual
    nonnegativity and the unit upper bound require every break fraction in [0,1]. No infinite-series exhaustion or random-process
    law is claimed. Semantic disposition: `formalized`.

    '
  assumption_review: Mass conservation is a purely algebraic identity with no bounds. Residual nonnegativity and the unit
    upper bound require every break fraction in [0,1]. No infinite-series exhaustion or random-process law is claimed.
  non_vacuity: Multiple unequal interior breaks allocate several positive weights and a positive remainder, while a break
    of one exhausts all subsequent residual mass.
  acceptance_probe: native Lean compile of fep046_mass_conservation, fep046_remainder_nonneg, and fep046_remainder_le_one
    on empty, singleton, and multi-break lists.
  lean_sketch: "import Mathlib.Algebra.BigOperators.Ring.List\nimport Mathlib.Tactic\n\nnamespace FEP046\n\n/-- Finite stick-breaking\
    \ weights.  The head receives fraction `v`; all later\nweights are scaled by the retained fraction `1-v`. -/\ndef fep046_stickWeights\
    \ : List ℝ → List ℝ\n  | [] => []\n  | v :: breaks =>\n      v :: (fep046_stickWeights breaks).map (fun weight => (1 -\
    \ v) * weight)\n\n/-- Mass remaining after every listed break. -/\ndef fep046_remainder : List ℝ → ℝ\n  | [] => 1\n  |\
    \ v :: breaks => (1 - v) * fep046_remainder breaks\n\n/-- Allocated weights plus residual mass equal exactly one after\
    \ any finite\nsequence of breaks.  This algebraic conservation law needs no inequalities. -/\ntheorem fep046_mass_conservation\
    \ (breaks : List ℝ) :\n    (fep046_stickWeights breaks).sum + fep046_remainder breaks = 1 := by\n  induction breaks with\n\
    \  | nil => simp [fep046_stickWeights, fep046_remainder]\n  | cons v breaks ih =>\n      have hscaled :\n          ((fep046_stickWeights\
    \ breaks).map\n            (fun weight => (1 - v) * weight)).sum =\n            (1 - v) * (fep046_stickWeights breaks).sum\
    \ := by\n        simpa using\n          (List.sum_map_mul_left\n            (l := fep046_stickWeights breaks)\n      \
    \      (f := id) (r := 1 - v))\n      simp only [fep046_stickWeights, fep046_remainder, List.sum_cons]\n      rw [hscaled]\n\
    \      calc\n        v + (1 - v) * (fep046_stickWeights breaks).sum +\n            (1 - v) * fep046_remainder breaks =\n\
    \            v + (1 - v) *\n              ((fep046_stickWeights breaks).sum +\n                fep046_remainder breaks)\
    \ := by ring\n        _ = v + (1 - v) * 1 := by rw [ih]\n        _ = 1 := by ring\n\n/-- Unit-interval break fractions\
    \ leave nonnegative residual mass. -/\ntheorem fep046_remainder_nonneg (breaks : List ℝ)\n    (hbreaks : ∀ v ∈ breaks,\
    \ v ∈ Set.Icc (0 : ℝ) 1) :\n    0 ≤ fep046_remainder breaks := by\n  induction breaks with\n  | nil => simp [fep046_remainder]\n\
    \  | cons v breaks ih =>\n      rw [fep046_remainder]\n      exact mul_nonneg (sub_nonneg.mpr (hbreaks v (by simp)).2)\n\
    \        (ih (fun w hw => hbreaks w (by simp [hw])))\n\n/-- The residual mass never exceeds one for unit-interval breaks.\
    \ -/\ntheorem fep046_remainder_le_one (breaks : List ℝ)\n    (hbreaks : ∀ v ∈ breaks, v ∈ Set.Icc (0 : ℝ) 1) :\n    fep046_remainder\
    \ breaks ≤ 1 := by\n  induction breaks with\n  | nil => simp [fep046_remainder]\n  | cons v breaks ih =>\n      rw [fep046_remainder]\n\
    \      have hv := hbreaks v (by simp)\n      have htail : ∀ w ∈ breaks, w ∈ Set.Icc (0 : ℝ) 1 :=\n        fun w hw =>\
    \ hbreaks w (by simp [hw])\n      have hrem0 := fep046_remainder_nonneg breaks htail\n      have hrem1 := ih htail\n \
    \     nlinarith [mul_nonneg hv.1 hrem0]\n\nend FEP046\n"
  latex_equations:
  - '\begin{aligned}

    &(\mathsf{breaks} : \mathsf{List}\,\mathbb{R}) \\

    &(\mathsf{fep046\_stickWeights}\,\mathsf{breaks}).\mathsf{sum} + \mathsf{fep046\_remainder}\,\mathsf{breaks} = 1

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{breaks} : \mathsf{List}\,\mathbb{R})\,(\mathsf{hbreaks} : \forall v \in \mathsf{breaks}, v \in \mathsf{Set.Icc}\,(0
    : \mathbb{R})\,1) \\

    &0 \le \mathsf{fep046\_remainder}\,\mathsf{breaks}

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{breaks} : \mathsf{List}\,\mathbb{R})\,(\mathsf{hbreaks} : \forall v \in \mathsf{breaks}, v \in \mathsf{Set.Icc}\,(0
    : \mathbb{R})\,1) \\

    &\mathsf{fep046\_remainder}\,\mathsf{breaks} \le 1

    \end{aligned}'
- id: fep-047
  title: Compositional Finite Sum-Product Propagation
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - Data.Matrix.Mul
  mathlib_status: real
  primary_theorem: fep047_forward_compose
  supporting_theorems:
  - fep047_forward_nonneg
  - fep047_forward_mono
  - fep047_zero_in
  - fep047_identity
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Finite sum-product forward propagation is matrix--vector multiplication: it preserves nonnegativity and order under
    nonnegative factors, has zero and identity laws, and composes exactly by matrix multiplication. Assumption scope: Nonnegativity
    and monotonicity require entrywise nonnegative factors and inputs. Identity and composition are unconditional algebraic
    laws. The row proves exact finite propagation, not normalization or loopy fixed-point convergence. Semantic disposition:
    `formalized`.

    '
  assumption_review: Nonnegativity and monotonicity require entrywise nonnegative factors and inputs. Identity and composition
    are unconditional algebraic laws. The row proves exact finite propagation, not normalization or loopy fixed-point convergence.
  non_vacuity: Nonidentity dense matrices and nonconstant incoming vectors exercise genuine cross-state aggregation; two distinct
    factors exercise nontrivial composed propagation.
  acceptance_probe: native Lean compile of fep047_forward_nonneg, fep047_forward_mono, fep047_zero_in, fep047_identity, and
    fep047_forward_compose using Mathlib Matrix.mulVec_mulVec.
  lean_sketch: "import Mathlib.Data.Matrix.Mul\nimport Mathlib.Basic.Real.Basic\n\nnamespace FEP047\n\nopen Finset\n\nabbrev\
    \ State := Fin 7\nabbrev Factor := Matrix State State ℝ\n\n/-- A full finite sum-product forward pass is matrix--vector\
    \ multiplication. -/\ndef fep047_forward (factor : Factor) (incoming : State → ℝ) : State → ℝ :=\n  Matrix.mulVec factor\
    \ incoming\n\n/-- Forward message is nonneg when factors and incoming messages are nonneg. -/\ntheorem fep047_forward_nonneg\n\
    \    (factor : Factor) (incoming : State → ℝ)\n    (hfactor : ∀ x y, 0 ≤ factor x y)\n    (hincoming : ∀ y, 0 ≤ incoming\
    \ y) (x : State) :\n    0 ≤ fep047_forward factor incoming x := by\n  simp only [fep047_forward, Matrix.mulVec, dotProduct]\n\
    \  exact Finset.sum_nonneg fun y _ =>\n    mul_nonneg (hfactor x y) (hincoming y)\n\n/-- Message-passing monotonicity:\
    \ larger incoming messages → larger output. -/\ntheorem fep047_forward_mono\n    (factor : Factor) (incoming₁ incoming₂\
    \ : State → ℝ)\n    (hfactor : ∀ x y, 0 ≤ factor x y)\n    (hincoming : ∀ y, incoming₁ y ≤ incoming₂ y) (x : State) :\n\
    \    fep047_forward factor incoming₁ x ≤\n      fep047_forward factor incoming₂ x := by\n  simp only [fep047_forward,\
    \ Matrix.mulVec, dotProduct]\n  exact Finset.sum_le_sum fun y _ =>\n    mul_le_mul_of_nonneg_left (hincoming y) (hfactor\
    \ x y)\n\n/-- Zero incoming messages → zero forward output. -/\ntheorem fep047_zero_in (factor : Factor) :\n    fep047_forward\
    \ factor (fun _ => 0) = 0 := by\n  ext x\n  change (∑ y : State, factor x y * 0) = (0 : ℝ)\n  simp\n\n/-- Identity factor\
    \ leaves every incoming message unchanged. -/\ntheorem fep047_identity (incoming : State → ℝ) :\n    fep047_forward (1\
    \ : Factor) incoming = incoming := by\n  exact Matrix.one_mulVec incoming\n\n/-- Two consecutive sum-product passes are\
