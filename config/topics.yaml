- id: fep-026
  title: Negative-Log Prior Complexity
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - Analysis.SpecialFunctions.Log.Basic
  mathlib_status: real
  primary_theorem: fep026_priorComplexity_eq_zero_iff
  supporting_theorems:
  - fep026_log_monotone
  - fep026_log_div
  - fep026_complexity_increases
  - fep026_complexity_zero_at_one
  - fep026_complexity_additive
  - fep026_priorComplexity_strictAnti
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Negative-log prior complexity is additive on positive product densities, strictly antitone, and zero exactly at unit
    density. Assumption scope: The input is a positive scalar prior-density value, not a normalized prior measure. Product
    additivity is exact; measure-valued relative complexity is owned by fep-014 and fep-024. Semantic disposition: `formalized`.

    '
  assumption_review: The input is a positive scalar prior-density value, not a normalized prior measure. Product additivity
    is exact; measure-valued relative complexity is owned by fep-014 and fep-024.
  non_vacuity: Every density in (0,1) has positive complexity, unit density is the unique positive zero, and unequal positive
    values exercise strict antitonicity.
  acceptance_probe: native Lean compile of fep026_complexity_additive, fep026_priorComplexity_eq_zero_iff, fep026_priorComplexity_strictAnti,
    and FEPComposed.fep026_priorComplexity_is_fep011_surprise.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Log.Basic\n\nnamespace FEP026\n\nopen Real\n\n/-- Negative-log prior\
    \ complexity of a positive prior density value. -/\nnoncomputable def fep026_priorComplexity (priorDensity : ℝ) : ℝ :=\n\
    \  -Real.log priorDensity\n\n/-- Complexity penalties via log: log is monotone on positive reals. -/\ntheorem fep026_log_monotone\
    \ {a b : ℝ} (ha : 0 < a) (hab : a ≤ b) :\n    Real.log a ≤ Real.log b :=\n  Real.log_le_log ha hab\n\n/-- Quotient rule\
    \ for real logarithms (``log(a/b) = log a - log b``). -/\ntheorem fep026_log_div {a b : ℝ} (ha : 0 < a) (hb : 0 < b) :\n\
    \    Real.log (a / b) = Real.log a - Real.log b :=\n  Real.log_div ha.ne' hb.ne'\n\n/-- Complexity penalty: -log p(θ)\
    \ increases as the prior p(θ) decreases toward zero. -/\ntheorem fep026_complexity_increases {p q : ℝ} (hp : 0 < p) (_hq\
    \ : 0 < q) (h : p ≤ q) :\n    fep026_priorComplexity q ≤ fep026_priorComplexity p :=\n  neg_le_neg (Real.log_le_log hp\
    \ h)\n\n/-- Complexity at prior equal to 1 is zero. -/\ntheorem fep026_complexity_zero_at_one : fep026_priorComplexity\
    \ 1 = 0 := by\n  simp [fep026_priorComplexity]\n\n/-- Complexity of product is sum of complexities. -/\ntheorem fep026_complexity_additive\
    \ {a b : ℝ} (ha : 0 < a) (hb : 0 < b) :\n    fep026_priorComplexity (a * b) =\n      fep026_priorComplexity a + fep026_priorComplexity\
    \ b := by\n  simp only [fep026_priorComplexity]\n  rw [Real.log_mul ha.ne' hb.ne', neg_add]\n\n/-- For positive prior\
    \ density, zero complexity occurs exactly at unit\ndensity. -/\ntheorem fep026_priorComplexity_eq_zero_iff {p : ℝ} (hp\
    \ : 0 < p) :\n    fep026_priorComplexity p = 0 ↔ p = 1 := by\n  constructor\n  · intro hzero\n    apply Real.eq_one_of_pos_of_log_eq_zero\
    \ hp\n    exact neg_eq_zero.mp (by simpa [fep026_priorComplexity] using hzero)\n  · rintro rfl\n    exact fep026_complexity_zero_at_one\n\
    \n/-- Negative-log complexity strictly decreases as positive prior density\nincreases. -/\ntheorem fep026_priorComplexity_strictAnti\n\
    \    {p q : ℝ} (hp : 0 < p) (hpq : p < q) :\n    fep026_priorComplexity q < fep026_priorComplexity p := by\n  exact neg_lt_neg\
    \ (Real.log_lt_log hp hpq)\n\nend FEP026\n"
