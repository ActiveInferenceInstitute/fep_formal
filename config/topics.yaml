  assumption_review: Precision is strictly positive for the scientific integrability result. This is the exact scalar quadratic
    case underlying Laplace approximation; no approximation-error or higher-dimensional determinant theorem is claimed.
  non_vacuity: At precision two the kernel is exp(−x²) with normalizer sqrt(π), and every positive precision gives a nonconstant
    integrable density kernel.
