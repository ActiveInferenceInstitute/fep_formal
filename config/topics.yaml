    &(\sum \mathsf{state}, \mathsf{FEP.CollectiveInference.consensusLeft}\,\mathsf{left}\,\mathsf{right}\,\mathsf{state})
    + \sum \mathsf{state}, \\

    &\mathsf{FEP.CollectiveInference.consensusRight}\,\mathsf{left}\,\mathsf{right}\,\mathsf{state} = 2

