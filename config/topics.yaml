  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Positive exponential Gibbs weights normalize to a nonnegative mass function summing to one on any nonempty finite support.
    Assumption scope: Conditional only on a nonempty selected support; β and energies are arbitrary reals. The row does not
    derive Gibbs weights from maximum entropy or bundle the result as a measure. Semantic disposition: `formalized`.

    '
  assumption_review: Conditional only on a nonempty selected support; β and energies are arbitrary reals. The row does not
    derive Gibbs weights from maximum entropy or bundle the result as a measure.
  non_vacuity: A singleton support has normalized mass one, while two unequal energies produce distinct positive normalized
    weights.
  acceptance_probe: native Lean compile of partition positivity, pointwise nonnegativity, and support normalization.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Exp\n\nnamespace FEP031\n\n/-- Boltzmann weight exp(-βE) is strictly\
    \ positive. -/\ntheorem fep031_gibbs_weight_pos (β E : ℝ) : 0 < Real.exp (-β * E) :=\n  Real.exp_pos _\n\n/-- Gibbs weight\
    \ monotonicity: lower energy → higher weight at positive temperature (β > 0). -/\ntheorem fep031_gibbs_mono (β E₁ E₂ :\
    \ ℝ) (hβ : 0 < β) (hE : E₁ ≤ E₂) :\n    Real.exp (-β * E₂) ≤ Real.exp (-β * E₁) :=\n  Real.exp_le_exp.mpr (by nlinarith\
    \ [mul_le_mul_of_nonneg_left hE (le_of_lt hβ)])\n\n/-- Partition function is strictly positive over any nonempty finite\
    \ state space. -/\ntheorem fep031_partition_pos (β : ℝ) (n : ℕ) (E : Fin n → ℝ)\n    (S : Finset (Fin n)) (hS : S.Nonempty)\
    \ :\n    0 < ∑ i ∈ S, Real.exp (-β * E i) :=\n  Finset.sum_pos (fun _ _ => Real.exp_pos _) hS\n\n/-- Gibbs probability\
    \ on a selected finite support, normalized by its partition sum. -/\nnoncomputable def fep031_gibbsProbability (β : ℝ)\
    \ (n : ℕ) (E : Fin n → ℝ)\n    (S : Finset (Fin n)) (i : Fin n) : ℝ :=\n  Real.exp (-β * E i) / ∑ j ∈ S, Real.exp (-β\
    \ * E j)\n\n/-- Each normalized Gibbs probability is nonnegative on nonempty support. -/\ntheorem fep031_gibbsProbability_nonneg\
    \ (β : ℝ) (n : ℕ) (E : Fin n → ℝ)\n    (S : Finset (Fin n)) (hS : S.Nonempty) (i : Fin n) :\n    0 ≤ fep031_gibbsProbability\
    \ β n E S i :=\n  div_nonneg (le_of_lt (Real.exp_pos _))\n    (le_of_lt (fep031_partition_pos β n E S hS))\n\n/-- Normalized\
    \ Gibbs probabilities sum to one on their selected support. -/\ntheorem fep031_gibbsProbability_sum_one (β : ℝ) (n : ℕ)\
    \ (E : Fin n → ℝ)\n    (S : Finset (Fin n)) (hS : S.Nonempty) :\n    ∑ i ∈ S, fep031_gibbsProbability β n E S i = 1 :=\
    \ by\n  have hden : (∑ j ∈ S, Real.exp (-β * E j)) ≠ 0 :=\n    ne_of_gt (fep031_partition_pos β n E S hS)\n  simp_rw [fep031_gibbsProbability,\
    \ div_eq_mul_inv]\n  rw [← Finset.sum_mul, mul_inv_cancel₀ hden]\n\nend FEP031\n"
