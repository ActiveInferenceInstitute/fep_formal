  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A finite independent family with certified sub-Gaussian moment-generating functions satisfies the explicit exponential
    upper-tail bound for its summed empirical-mean event. Assumption scope: Observables are indexed by Fin sampleCount, are
    independent under the supplied measure, and each has a nonnegative sub-Gaussian proxy variance. Deviation is nonnegative.
    The theorem neither assumes IID data nor asserts an asymptotic law; a positive sample count is needed for the usual empirical-mean
    interpretation even though real division is totalized at zero. Semantic disposition: `formalized`.

    '
  assumption_review: Observables are indexed by Fin sampleCount, are independent under the supplied measure, and each has
    a nonnegative sub-Gaussian proxy variance. Deviation is nonnegative. The theorem neither assumes IID data nor asserts
    an asymptotic law; a positive sample count is needed for the usual empirical-mean interpretation even though real division
    is totalized at zero.
  non_vacuity: Multiple independent nonconstant centered observables with positive proxy variances give a nontrivial exponentially
    decaying bound as deviation grows.
  acceptance_probe: native Lean compile of fep114_subGaussian_empiricalMean_tail and fep114_empiricalMean_definition with
    independence, MGF, and deviation premises.
  lean_sketch: "import FepSketches.learning_theory\n\n/-! # Sub-Gaussian Empirical-Mean Tail Bound -/\nnamespace FEP114\n\n\
    open MeasureTheory ProbabilityTheory\nopen scoped BigOperators ENNReal MeasureTheory NNReal ProbabilityTheory\n\n/-- Independent\
    \ sub-Gaussian observations obey the finite-sample upper-tail\nbound for the empirical-mean event. -/\ntheorem fep114_subGaussian_empiricalMean_tail\n\
    \    {Ω : Type*} [MeasurableSpace Ω]\n    (μ : Measure Ω) {sampleCount : ℕ}\n    (observables : Fin sampleCount → Ω →\
    \ ℝ)\n    (independent : iIndepFun observables μ)\n    (proxyVariance : Fin sampleCount → ℝ≥0)\n    (subGaussian : ∀ index,\n\
    \      HasSubgaussianMGF (observables index) (proxyVariance index) μ)\n    {deviation : ℝ} (deviationNonnegative : 0 ≤\
    \ deviation) :\n    μ.real {outcome |\n        (sampleCount : ℝ) * deviation ≤\n          ∑ index, observables index outcome}\
    \ ≤\n      Real.exp\n        (-((sampleCount : ℝ) * deviation) ^ 2 /\n          (2 * ∑ index, proxyVariance index)) :=\n\
    \  FEP.LearningTheory.subGaussian_empiricalMean_tail\n    μ observables independent proxyVariance subGaussian deviationNonnegative\n\
    \n/-- The theorem fixes the finite sample through `Fin sampleCount`; no\nasymptotic limit or IID premise is inferred beyond\
    \ the stated independence. -/\ntheorem fep114_empiricalMean_definition\n    {Ω : Type*} {sampleCount : ℕ}\n    (observables\
    \ : Fin sampleCount → Ω → ℝ) (outcome : Ω) :\n    FEP.LearningTheory.empiricalMean observables outcome =\n      (∑ index,\
    \ observables index outcome) / sampleCount :=\n  rfl\n\nend FEP114\n"
  latex_equations:
  - '\begin{aligned}

    &\{\Omega{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \Omega{}]\,(\mu{} : \mathsf{Measure} \Omega{})\,\{\mathsf{sampleCount}
    : \mathbb{N}\} \\

    &(\mathsf{observables} : \mathsf{Fin}\,\mathsf{sampleCount} \Rightarrow \Omega{} \Rightarrow \mathbb{R})\,(\mathsf{independent}
    : \mathsf{iIndepFun}\,\mathsf{observables}\,\mu{}) \\

    &(\mathsf{proxyVariance} : \mathsf{Fin}\,\mathsf{sampleCount} \Rightarrow \mathbb{R}\ge0)\,(\mathsf{subGaussian} : \forall
    \mathsf{index}, \\

    &\mathsf{HasSubgaussianMGF}\,(\mathsf{observables}\,\mathsf{index})\,(\mathsf{proxyVariance}\,\mathsf{index})\,\mu{})\,\{\mathsf{deviation}
    : \mathbb{R}\} \\

    &(\mathsf{deviationNonnegative} : 0 \le \mathsf{deviation}) \\

    &\mu{}.\mathsf{real}\,\{\mathsf{outcome} | (\mathsf{sampleCount} : \mathbb{R}) \cdot \mathsf{deviation} \le \sum \mathsf{index},
    \mathsf{observables}\,\mathsf{index} \\

    &\mathsf{outcome}\} \le \mathsf{Real.exp}\,(-((\mathsf{sampleCount} : \mathbb{R}) \cdot \mathsf{deviation}) ^ 2 / (2 \cdot
    \sum \mathsf{index}, \\

    &\mathsf{proxyVariance}\,\mathsf{index}))

    \end{aligned}'
  - '\begin{aligned}

    &\{\Omega{} : \mathsf{Type}^{*}\}\,\{\mathsf{sampleCount} : \mathbb{N}\}\,(\mathsf{observables} : \mathsf{Fin}\,\mathsf{sampleCount}
    \Rightarrow \Omega{} \Rightarrow \mathbb{R}) \\

    &(\mathsf{outcome} : \Omega{}) \\

    &\mathsf{FEP.LearningTheory.empiricalMean}\,\mathsf{observables}\,\mathsf{outcome} \\

    &= (\sum \mathsf{index}, \mathsf{observables}\,\mathsf{index}\,\mathsf{outcome}) / \mathsf{sampleCount}

    \end{aligned}'
- id: fep-115
