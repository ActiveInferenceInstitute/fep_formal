  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Mathlib''s real Gaussian law is normalized with its stated mean and variance; the one-dimensional closed-form entropy
    is strictly variance-monotone, differentiable with derivative 1/(2v), and under v=κT has derivative 1/(2T) and heat capacity
    1/2. Assumption scope: The native probability, mean, and variance theorems include the zero-variance Dirac boundary. Entropy
    monotonicity and derivatives require positive variance, and the thermal relation requires κ,T>0. The closed-form entropy
    is specified directly rather than rederived here as an integral of negative log density. Semantic disposition: `formalized`.

    '
  assumption_review: The native probability, mean, and variance theorems include the zero-variance Dirac boundary. Entropy
    monotonicity and derivatives require positive variance, and the thermal relation requires κ,T>0. The closed-form entropy
    is specified directly rather than rederived here as an integral of negative log density.
  non_vacuity: For unit scale and positive temperature, the Gaussian law is nondegenerate, its entropy response is nonzero,
    and the dimensionless heat capacity is exactly 1/2.
  acceptance_probe: native Lean compile of fep040_gaussian_mass_one, fep040_gaussian_mean, fep040_gaussian_variance, fep040_gaussianEntropy_hasDerivAt,
    fep040_thermalEntropy_hasDerivAt, and fep040_heatCapacity_eq_half.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Log.Deriv\nimport Mathlib.Probability.Distributions.Gaussian.Real\n\
    import Mathlib.Tactic\n\nnamespace FEP040\n\nopen MeasureTheory ProbabilityTheory\n\n/-- Mathlib's normalized real Gaussian\
    \ law. -/\nnoncomputable def fep040_gaussianLaw (mean : ℝ) (variance : NNReal) : Measure ℝ :=\n  ProbabilityTheory.gaussianReal\
    \ mean variance\n\n/-- Every Gaussian law, including the zero-variance Dirac boundary, has mass one. -/\ntheorem fep040_gaussian_mass_one\
    \ (mean : ℝ) (variance : NNReal) :\n    fep040_gaussianLaw mean variance Set.univ = 1 := by\n  change ProbabilityTheory.gaussianReal\
    \ mean variance Set.univ = 1\n  exact measure_univ\n\n/-- The native Gaussian's expectation is its mean parameter. -/\n\
    theorem fep040_gaussian_mean (mean : ℝ) (variance : NNReal) :\n    ∫ x, x ∂fep040_gaussianLaw mean variance = mean :=\
    \ by\n  change ∫ x, x ∂ProbabilityTheory.gaussianReal mean variance = mean\n  exact ProbabilityTheory.integral_id_gaussianReal\n\
    \n/-- The native Gaussian's variance is its variance parameter. -/\ntheorem fep040_gaussian_variance (mean : ℝ) (variance\
    \ : NNReal) :\n    ProbabilityTheory.variance id (fep040_gaussianLaw mean variance) = variance := by\n  change ProbabilityTheory.variance\
    \ id\n    (ProbabilityTheory.gaussianReal mean variance) = variance\n  exact ProbabilityTheory.variance_id_gaussianReal\n\
    \n/-- Closed-form differential entropy of a one-dimensional Gaussian with\npositive variance `v`. -/\nnoncomputable def\
    \ fep040_gaussianEntropy (v : ℝ) : ℝ :=\n  (1 / 2 : ℝ) * Real.log (2 * Real.pi * Real.exp 1 * v)\n\n/-- Gaussian entropy\
    \ is strictly increasing with positive variance. -/\ntheorem fep040_gaussianEntropy_strictMono\n    {v₁ v₂ : ℝ} (hv₁ :\
    \ 0 < v₁) (hv : v₁ < v₂) :\n    fep040_gaussianEntropy v₁ < fep040_gaussianEntropy v₂ := by\n  unfold fep040_gaussianEntropy\n\
    \  have hconstant : 0 < 2 * Real.pi * Real.exp 1 := by positivity\n  gcongr\n\n/-- The entropy derivative with respect\
    \ to variance is `1/(2v)`. -/\ntheorem fep040_gaussianEntropy_hasDerivAt\n    {v : ℝ} (hv : 0 < v) :\n    HasDerivAt fep040_gaussianEntropy\
    \ (1 / (2 * v)) v := by\n  let constant : ℝ := 2 * Real.pi * Real.exp 1\n  have hconstant : constant ≠ 0 := by\n    dsimp\
    \ [constant]\n    positivity\n  have hargument : constant * v ≠ 0 := mul_ne_zero hconstant (ne_of_gt hv)\n  have hlog\
    \ : HasDerivAt (fun x => Real.log (constant * x))\n      (constant / (constant * v)) v := by\n    simpa using ((hasDerivAt_id\
    \ v).const_mul constant).log hargument\n  have hscaled := hlog.const_mul (1 / 2 : ℝ)\n  have hcoefficient :\n      (1\
    \ / 2 : ℝ) * (constant / (constant * v)) = 1 / (2 * v) := by\n    field_simp [hconstant, ne_of_gt hv]\n  rw [← hcoefficient]\n\
    \  convert hscaled using 1\n  all_goals\n    first\n    | exact AddCommGroup.ext rfl\n    | exact Module.ext rfl\n   \
    \ | rfl\n\n/-- Thermal variance scale `κT`. -/\ndef fep040_thermalVariance (κ T : ℝ) : ℝ := κ * T\n\n/-- Gaussian entropy\
    \ as a function of absolute temperature. -/\nnoncomputable def fep040_thermalEntropy (κ T : ℝ) : ℝ :=\n  fep040_gaussianEntropy\
    \ (fep040_thermalVariance κ T)\n\n/-- For positive scale and temperature, thermal entropy has derivative `1/(2T)`. -/\n\
    theorem fep040_thermalEntropy_hasDerivAt\n    {κ T : ℝ} (hκ : 0 < κ) (hT : 0 < T) :\n    HasDerivAt (fep040_thermalEntropy\
    \ κ) (1 / (2 * T)) T := by\n  have hvariance : 0 < fep040_thermalVariance κ T :=\n    mul_pos hκ hT\n  have houter :=\
    \ fep040_gaussianEntropy_hasDerivAt hvariance\n  have hinner : HasDerivAt (fep040_thermalVariance κ) κ T := by\n    convert\
    \ (hasDerivAt_id T).const_mul κ using 1\n    all_goals\n      first\n      | exact AddCommGroup.ext rfl\n      | exact\
    \ Module.ext rfl\n      | rfl\n      | simp\n  have hcomp := houter.comp T hinner\n  have hcoefficient :\n      (1 / (2\
    \ * fep040_thermalVariance κ T)) * κ = 1 / (2 * T) := by\n    simp only [fep040_thermalVariance]\n    field_simp [ne_of_gt\
    \ hκ, ne_of_gt hT]\n  rw [← hcoefficient]\n  convert hcomp using 1\n  all_goals\n    first\n    | exact AddCommGroup.ext\
    \ rfl\n    | exact Module.ext rfl\n    | rfl\n\n/-- Dimensionless constant-volume heat capacity `T ∂H/∂T`. -/\nnoncomputable\
    \ def fep040_heatCapacity (T : ℝ) : ℝ :=\n  T * (1 / (2 * T))\n\n/-- The one-dimensional Gaussian thermal model has heat\
    \ capacity `1/2`. -/\ntheorem fep040_heatCapacity_eq_half {T : ℝ} (hT : 0 < T) :\n    fep040_heatCapacity T = 1 / 2 :=\
    \ by\n  unfold fep040_heatCapacity\n  field_simp [ne_of_gt hT]\n\nend FEP040\n"
