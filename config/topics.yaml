  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Expected free energy of product predictive and preference laws with additive ambiguity equals the sum of independent
    agent-level expected free energies. Assumption scope: Both finite preference factors have full support, predictive and
    preference joint laws are products, and ambiguity is coordinate-additive. No additivity is claimed for statistically coupled
    agents, shared outcomes, or a nonseparable ambiguity functional. Semantic disposition: `formalized`.

    '
  assumption_review: Both finite preference factors have full support, predictive and preference joint laws are products,
    and ambiguity is coordinate-additive. No additivity is claimed for statistically coupled agents, shared outcomes, or a
    nonseparable ambiguity functional.
  non_vacuity: Distinct predictive and preference factors yield nonzero risk terms, while nonconstant ambiguity functions
    make both component expectations contribute to the collective value.
  acceptance_probe: native Lean compile of fep109_independentEFE_additive and fep109_additiveAmbiguity_expectation with preference
    support explicit.
  lean_sketch: "import FepSketches.collective_inference\n\n/-! # Independent-Agent Expected-Free-Energy Additivity -/\nnamespace\
    \ FEP109\n\nopen FEP\n\nvariable {State₁ State₂ : Type*} [Fintype State₁] [Fintype State₂]\n\n/-- EFE additivity follows\
    \ from product predictive and preference laws,\nadditive ambiguity, and full-support preferences. -/\ntheorem fep109_independentEFE_additive\n\
    \    (predictiveLeft preferenceLeft : FiniteLaw State₁)\n    (predictiveRight preferenceRight : FiniteLaw State₂)\n  \
    \  (ambiguityLeft : State₁ → ℝ) (ambiguityRight : State₂ → ℝ)\n    (preferenceLeftPositive : ∀ state, 0 < preferenceLeft\
    \ state)\n    (preferenceRightPositive : ∀ state, 0 < preferenceRight state) :\n    FEP.CollectiveInference.independentCollectiveEFE\n\
    \        predictiveLeft preferenceLeft predictiveRight preferenceRight\n        ambiguityLeft ambiguityRight =\n     \
    \ FEP.CollectiveInference.expectedFreeEnergy\n          predictiveLeft preferenceLeft ambiguityLeft +\n        FEP.CollectiveInference.expectedFreeEnergy\n\
    \          predictiveRight preferenceRight ambiguityRight :=\n  FEP.CollectiveInference.independentEFE_additive\n    predictiveLeft\
    \ preferenceLeft predictiveRight preferenceRight\n    ambiguityLeft ambiguityRight preferenceLeftPositive preferenceRightPositive\n\
    \n/-- Without the product construction, only the component expectation identity\nis available; no dependence term is silently\
    \ discarded. -/\ntheorem fep109_additiveAmbiguity_expectation\n    (left : FiniteLaw State₁) (right : FiniteLaw State₂)\n\
    \    (ambiguityLeft : State₁ → ℝ) (ambiguityRight : State₂ → ℝ) :\n    FEP.CollectiveInference.expectedCost (FiniteLaw.product\
    \ left right)\n        (fun state => ambiguityLeft state.1 + ambiguityRight state.2) =\n      FEP.CollectiveInference.expectedCost\
    \ left ambiguityLeft +\n        FEP.CollectiveInference.expectedCost right ambiguityRight :=\n  FEP.CollectiveInference.productExpectedCost_additive\n\
    \    left right ambiguityLeft ambiguityRight\n\nend FEP109\n"
  latex_equations:
  - '\begin{aligned}

    &\{State_{1}\,State_{2} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,State_{1}]\,[\mathsf{Fintype}\,State_{2}] \\

    &(\mathsf{predictiveLeft}\,\mathsf{preferenceLeft} : \mathsf{FiniteLaw}\,State_{1}) \\

    &(\mathsf{predictiveRight}\,\mathsf{preferenceRight} : \mathsf{FiniteLaw}\,State_{2}) \\

    &(\mathsf{ambiguityLeft} : State_{1} \Rightarrow \mathbb{R})\,(\mathsf{ambiguityRight} : State_{2} \Rightarrow \mathbb{R})
    \\

    &(\mathsf{preferenceLeftPositive} : \forall \mathsf{state}, 0 < \mathsf{preferenceLeft}\,\mathsf{state}) \\

    &(\mathsf{preferenceRightPositive} : \forall \mathsf{state}, 0 < \mathsf{preferenceRight}\,\mathsf{state}) \\

    &\mathsf{FEP.CollectiveInference.independentCollectiveEFE}\,\mathsf{predictiveLeft}\,\mathsf{preferenceLeft} \\

    &\mathsf{predictiveRight}\,\mathsf{preferenceRight}\,\mathsf{ambiguityLeft}\,\mathsf{ambiguityRight} \\

    &= \mathsf{FEP.CollectiveInference.expectedFreeEnergy}\,\mathsf{predictiveLeft}\,\mathsf{preferenceLeft} \\

    &\mathsf{ambiguityLeft} + \mathsf{FEP.CollectiveInference.expectedFreeEnergy}\,\mathsf{predictiveRight} \\

    &\mathsf{preferenceRight}\,\mathsf{ambiguityRight}

    \end{aligned}'
  - '\begin{aligned}

    &\{State_{1}\,State_{2} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,State_{1}]\,[\mathsf{Fintype}\,State_{2}] \\

    &(\mathsf{left} : \mathsf{FiniteLaw}\,State_{1})\,(\mathsf{right} : \mathsf{FiniteLaw}\,State_{2}) \\

    &(\mathsf{ambiguityLeft} : State_{1} \Rightarrow \mathbb{R})\,(\mathsf{ambiguityRight} : State_{2} \Rightarrow \mathbb{R})
    \\

    &\mathsf{FEP.CollectiveInference.expectedCost}\,(\mathsf{FiniteLaw.product}\,\mathsf{left}\,\mathsf{right}) \\

    &(\lambda\,\mathsf{state} \mapsto \mathsf{ambiguityLeft}\,\mathsf{state}.1 + \mathsf{ambiguityRight}\,\mathsf{state}.2)
    \\

