  nl: 'A finite policy-tree node equals its stage cost plus the observation-law weighted values of observation-contingent
    continuation trees. Assumption scope: Belief, action, and observation carriers are finite and the horizon is a natural-number
    depth. Observation laws and deterministic belief updates are supplied by the model; no infinite-horizon or continuous-belief
    claim is made. Semantic disposition: `formalized`.

    '
  assumption_review: Belief, action, and observation carriers are finite and the horizon is a natural-number depth. Observation
    laws and deterministic belief updates are supplied by the model; no infinite-horizon or continuous-belief claim is made.
  non_vacuity: A successor node can choose different continuation trees after different observations, whereas the depth-zero
    carrier has exactly zero value.
  acceptance_probe: warning-free native Lean compile of fep128_policyTreeValue_node and fep128_policyTreeValue_leaf.
  lean_sketch: "import FepSketches.policy_tree\n\n/-! # Observation-Contingent Policy-Tree Recursion -/\nnamespace FEP128\n\
    \nopen FEP.PolicyTrees\n\n/-- A node chooses one action and then follows the continuation indexed by the\nrealized observation.\
    \ -/\ntheorem fep128_policyTreeValue_node\n    {Belief Action Observation : Type*}\n    [Fintype Belief] [Fintype Action]\
    \ [Fintype Observation]\n    (model : PolicyTreeModel Belief Action Observation)\n    {depth : ℕ} (action : Action)\n\
    \    (continuation : Observation → PolicyTree Action Observation depth)\n    (belief : Belief) :\n    policyTreeValue\
    \ (depth := depth + 1) model (action, continuation) belief =\n      model.stageCost depth belief action +\n        ∑ observation,\n\
    \          model.observationLaw belief action observation *\n            policyTreeValue model (continuation observation)\n\
    \              (model.update belief action observation) :=\n  policyTreeValue_node model action continuation belief\n\n\
    /-- The depth-zero carrier has no action node and therefore zero value. -/\ntheorem fep128_policyTreeValue_leaf\n    {Belief\
    \ Action Observation : Type*}\n    [Fintype Belief] [Fintype Action] [Fintype Observation]\n    (model : PolicyTreeModel\
    \ Belief Action Observation) (belief : Belief) :\n    policyTreeValue (depth := 0) model\n        (PUnit.unit : PolicyTree\
    \ Action Observation 0) belief = 0 :=\n  rfl\n\nend FEP128\n"
