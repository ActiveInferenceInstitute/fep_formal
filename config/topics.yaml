    \ g := by\n  simp [fep039_global_fe, Finset.sum_add_distrib]\n\n/-- For nonnegative local energies, global free energy\
    \ vanishes exactly when\nevery local contribution vanishes. -/\ntheorem fep039_global_eq_zero_iff (local_fe : Fin 4 →\
    \ ℝ)\n    (hnonneg : ∀ i, 0 ≤ local_fe i) :\n    fep039_global_fe local_fe = 0 ↔ ∀ i, local_fe i = 0 := by\n  constructor\n\
    \  · intro hzero i\n    exact (Finset.sum_eq_zero_iff_of_nonneg\n      (fun j _ => hnonneg j)).mp hzero i (Finset.mem_univ\
    \ i)\n  · intro hlocal\n    simp [fep039_global_fe, hlocal]\n\nend FEP039\n"
