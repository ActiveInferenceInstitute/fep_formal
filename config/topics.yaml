- id: fep-049
  title: Linear Constitutive Entropy Production
  area: Thermodynamics
  family: core-thermodynamics
  mathlib_modules:
  - Algebra.Order.BigOperators.Group.Finset
  mathlib_status: real
  primary_theorem: fep049_entropyProduction_eq_zero_iff
  supporting_theorems:
  - fep049_flux_force_identity
  - fep049_entropyProduction_nonneg
  - fep049_edgeProduction_nonneg
  - fep049_edgeProduction_eq_zero_iff
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Under Jᵢ=LᵢXᵢ, the flux--force pairing is a nonnegative quadratic form that separates equilibrium for Lᵢ>0. Independently,
    positive forward/reverse edge fluxes have production (f-r)log(f/r)≥0, with equality exactly at detailed balance. Assumption
    scope: The finite constitutive law is diagonal and assumes nonnegative conductances. The edge theorem assumes strictly
    positive bidirectional fluxes so affinity is finite. Cross-coupled Onsager matrices and microscopic derivations remain
    outside the claim. Semantic disposition: `formalized`.

    '
  assumption_review: The finite constitutive law is diagonal and assumes nonnegative conductances. The edge theorem assumes
    strictly positive bidirectional fluxes so affinity is finite. Cross-coupled Onsager matrices and microscopic derivations
    remain outside the claim.
  non_vacuity: Any nonzero force under positive conductance produces positive quadratic entropy; unequal positive directed
    fluxes produce positive edge entropy, while equality of fluxes is the exact zero-production boundary.
  acceptance_probe: native Lean compile of fep049_flux_force_identity, fep049_entropyProduction_nonneg, fep049_entropyProduction_eq_zero_iff,
    fep049_edgeProduction_nonneg, and fep049_edgeProduction_eq_zero_iff.
  lean_sketch: "import Mathlib.Algebra.Order.BigOperators.Group.Finset\nimport Mathlib.Analysis.SpecialFunctions.Log.Basic\n\
    import Mathlib.Tactic\n\nnamespace FEP049\n\nopen Finset\n\n/-- Diagonal linear constitutive law `Jᵢ = Lᵢ Xᵢ`. -/\ndef\
    \ fep049_linearFlux {ι : Type*}\n    (conductance force : ι → ℝ) (i : ι) : ℝ :=\n  conductance i * force i\n\n/-- Entropy\
    \ production generated by diagonal conductances and forces. -/\ndef fep049_entropyProduction {ι : Type*} [Fintype ι]\n\
    \    (conductance force : ι → ℝ) : ℝ :=\n  ∑ i, conductance i * force i ^ 2\n\n/-- The flux--force pairing is exactly\
    \ the entropy-production quadratic form. -/\ntheorem fep049_flux_force_identity {ι : Type*} [Fintype ι]\n    (conductance\
    \ force : ι → ℝ) :\n    (∑ i, force i * fep049_linearFlux conductance force i) =\n      fep049_entropyProduction conductance\
    \ force := by\n  apply Finset.sum_congr rfl\n  intro i _\n  simp only [fep049_linearFlux]\n  ring\n\n/-- Nonnegative conductances\
    \ imply nonnegative entropy production. -/\ntheorem fep049_entropyProduction_nonneg {ι : Type*} [Fintype ι]\n    (conductance\
    \ force : ι → ℝ)\n    (hconductance : ∀ i, 0 ≤ conductance i) :\n    0 ≤ fep049_entropyProduction conductance force :=\
    \ by\n  exact Finset.sum_nonneg fun i _ =>\n    mul_nonneg (hconductance i) (sq_nonneg (force i))\n\n/-- With strictly\
    \ positive conductances, entropy production vanishes exactly\nat thermodynamic equilibrium (all forces zero). -/\ntheorem\
    \ fep049_entropyProduction_eq_zero_iff {ι : Type*} [Fintype ι]\n    (conductance force : ι → ℝ)\n    (hconductance : ∀\
    \ i, 0 < conductance i) :\n    fep049_entropyProduction conductance force = 0 ↔\n      ∀ i, force i = 0 := by\n  constructor\n\
    \  · intro hzero i\n    have hterm : conductance i * force i ^ 2 = 0 :=\n      (Finset.sum_eq_zero_iff_of_nonneg\n   \
    \     (fun j _ => mul_nonneg (hconductance j).le (sq_nonneg (force j)))).mp\n        hzero i (Finset.mem_univ i)\n   \
    \ have hsquare : force i ^ 2 = 0 :=\n      (mul_eq_zero.mp hterm).resolve_left (ne_of_gt (hconductance i))\n    nlinarith\n\
    \  · intro hforce\n    simp [fep049_entropyProduction, hforce]\n\n/-- Thermodynamic affinity of a directed edge from positive\
    \ forward and\nreverse stationary fluxes. -/\nnoncomputable def fep049_edgeAffinity (forward reverse : ℝ) : ℝ :=\n  Real.log\
    \ (forward / reverse)\n\n/-- Edge entropy production is current times affinity. -/\nnoncomputable def fep049_edgeProduction\
    \ (forward reverse : ℝ) : ℝ :=\n  (forward - reverse) * fep049_edgeAffinity forward reverse\n\n/-- Positive bidirectional\
    \ fluxes produce nonnegative edge entropy. -/\ntheorem fep049_edgeProduction_nonneg\n    {forward reverse : ℝ} (hforward\
    \ : 0 < forward) (hreverse : 0 < reverse) :\n    0 ≤ fep049_edgeProduction forward reverse := by\n  rw [fep049_edgeProduction,\
    \ fep049_edgeAffinity,\n    Real.log_div hforward.ne' hreverse.ne']\n  rcases le_total reverse forward with h | h\n  ·\
    \ exact mul_nonneg (sub_nonneg.mpr h)\n      (sub_nonneg.mpr (Real.log_le_log hreverse h))\n  · exact mul_nonneg_of_nonpos_of_nonpos\
    \ (sub_nonpos.mpr h)\n      (sub_nonpos.mpr (Real.log_le_log hforward h))\n\n/-- Under positive bidirectional fluxes,\
    \ zero edge production is equivalent\nto detailed balance on that edge. -/\ntheorem fep049_edgeProduction_eq_zero_iff\n\
    \    {forward reverse : ℝ} (hforward : 0 < forward) (hreverse : 0 < reverse) :\n    fep049_edgeProduction forward reverse\
    \ = 0 ↔ forward = reverse := by\n  constructor\n  · intro hzero\n    rcases mul_eq_zero.mp hzero with hcurrent | haffinity\n\
    \    · exact sub_eq_zero.mp hcurrent\n    · have hratio : forward / reverse = 1 :=\n        Real.eq_one_of_pos_of_log_eq_zero\
    \ (div_pos hforward hreverse) haffinity\n      have hmul : forward = 1 * reverse :=\n        (div_eq_iff hreverse.ne').mp\
    \ hratio\n      simpa using hmul\n  · rintro rfl\n    simp [fep049_edgeProduction]\n\nend FEP049\n"
  latex_equations:
  - '\begin{aligned}

    &\{\iota{} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\iota{}]\,(\mathsf{conductance}\,\mathsf{force} : \iota{} \Rightarrow
    \mathbb{R}) \\

    &(\sum i, \mathsf{force}\,i \cdot \mathsf{fep049\_linearFlux}\,\mathsf{conductance}\,\mathsf{force}\,i) \\

    &= \mathsf{fep049\_entropyProduction}\,\mathsf{conductance}\,\mathsf{force}

    \end{aligned}'
  - '\begin{aligned}

    &\{\iota{} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\iota{}]\,(\mathsf{conductance}\,\mathsf{force} : \iota{} \Rightarrow
    \mathbb{R}) \\

    &(\mathsf{hconductance} : \forall i, 0 \le \mathsf{conductance}\,i) \\

    &0 \le \mathsf{fep049\_entropyProduction}\,\mathsf{conductance}\,\mathsf{force}

    \end{aligned}'
  - '\begin{aligned}

    &\{\iota{} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\iota{}]\,(\mathsf{conductance}\,\mathsf{force} : \iota{} \Rightarrow
    \mathbb{R}) \\

    &(\mathsf{hconductance} : \forall i, 0 < \mathsf{conductance}\,i) \\

    &\mathsf{fep049\_entropyProduction}\,\mathsf{conductance}\,\mathsf{force} = 0 \leftrightarrow \forall i, \mathsf{force}\,i
    = 0

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{forward}\,\mathsf{reverse} : \mathbb{R}\}\,(\mathsf{hforward} : 0 < \mathsf{forward})\,(\mathsf{hreverse} :
    0 < \mathsf{reverse}) \\

    &0 \le \mathsf{fep049\_edgeProduction}\,\mathsf{forward}\,\mathsf{reverse}

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{forward}\,\mathsf{reverse} : \mathbb{R}\}\,(\mathsf{hforward} : 0 < \mathsf{forward})\,(\mathsf{hreverse} :
    0 < \mathsf{reverse}) \\

    &\mathsf{fep049\_edgeProduction}\,\mathsf{forward}\,\mathsf{reverse} = 0 \leftrightarrow \mathsf{forward} = \mathsf{reverse}

    \end{aligned}'
- id: fep-050
  title: Logical Erasure and the Landauer Bound
  area: Thermodynamics
  family: core-thermodynamics
  mathlib_modules:
  - Analysis.SpecialFunctions.BinaryEntropy
  mathlib_status: real
  primary_theorem: fep050_landauer_work_bound
  supporting_theorems:
  - fep050_erasure_not_injective
  - fep050_erasureEntropyLoss_eq
  - fep050_landauer_heat_bound
  - fep050_landauerBound_pos
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A noninjective reset maps an unbiased bit to a pure state and loses exactly kB log 2 entropy; nonnegative total entropy
    at positive temperature derives the corresponding heat bound, and work above heat derives the work bound. Assumption scope:
    The derivation explicitly assumes the second-law total-entropy inequality, positive environmental temperature, and work
    at least as large as dissipated heat. It does not model a microscopic Hamiltonian or finite-time erasure protocol. Semantic
    disposition: `formalized`.

    '
  assumption_review: The derivation explicitly assumes the second-law total-entropy inequality, positive environmental temperature,
    and work at least as large as dissipated heat. It does not model a microscopic Hamiltonian or finite-time erasure protocol.
  non_vacuity: The reset identifies true and false, the unbiased-to-pure entropy change is exactly nonzero for kB > 0, and
    equality in the environmental balance saturates the Landauer threshold.
  acceptance_probe: native Lean compile of fep050_erasure_not_injective, fep050_erasureEntropyLoss_eq, fep050_landauer_heat_bound,
    fep050_landauer_work_bound, and fep050_landauerBound_pos.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.BinaryEntropy\nimport Mathlib.Tactic\n\nnamespace FEP050\n\n/-- Logical\
    \ reset of a binary memory to `false`. -/\ndef fep050_erasure (_bit : Bool) : Bool := false\n\n/-- Reset is logically\
    \ irreversible because it is not injective. -/\ntheorem fep050_erasure_not_injective :\n    ¬Function.Injective fep050_erasure\
    \ := by\n  intro hinjective\n  have hfalse_true : false = true := hinjective (by rfl)\n  simp at hfalse_true\n\n/-- Thermodynamic\
    \ bit entropy in nats with Boltzmann constant `kB`. -/\nnoncomputable def fep050_bitEntropy (kB p : ℝ) : ℝ :=\n  kB *\
    \ Real.binEntropy p\n\n/-- Entropy lost when an unbiased bit is reset to a pure state. -/\nnoncomputable def fep050_erasureEntropyLoss\
    \ (kB : ℝ) : ℝ :=\n  fep050_bitEntropy kB (2 : ℝ)⁻¹ - fep050_bitEntropy kB 0\n\n/-- Resetting an unbiased bit loses exactly\
    \ `kB log 2` entropy. -/\ntheorem fep050_erasureEntropyLoss_eq (kB : ℝ) :\n    fep050_erasureEntropyLoss kB = kB * Real.log\
    \ 2 := by\n  simp [fep050_erasureEntropyLoss, fep050_bitEntropy]\n\n/-- Environmental entropy gain from heat `Q` delivered\
    \ at temperature `T`. -/\nnoncomputable def fep050_environmentEntropyChange (Q T : ℝ) : ℝ := Q / T\n\n/-- Total entropy\
    \ change for one-bit erasure. -/\nnoncomputable def fep050_totalEntropyChange (Q T kB : ℝ) : ℝ :=\n  fep050_environmentEntropyChange\
    \ Q T - fep050_erasureEntropyLoss kB\n\n/-- Landauer threshold `kB T log 2`. -/\nnoncomputable def fep050_landauerBound\
    \ (kB T : ℝ) : ℝ :=\n  kB * T * Real.log 2\n\n/-- The second-law entropy balance derives the Landauer heat bound; the\n\
    threshold inequality is a conclusion rather than an input. -/\ntheorem fep050_landauer_heat_bound\n    {Q T kB : ℝ} (hT\
    \ : 0 < T)\n    (hsecondLaw : 0 ≤ fep050_totalEntropyChange Q T kB) :\n    fep050_landauerBound kB T ≤ Q := by\n  have\
    \ hratio : kB * Real.log 2 ≤ Q / T := by\n    rw [fep050_totalEntropyChange, fep050_environmentEntropyChange,\n      fep050_erasureEntropyLoss_eq]\
    \ at hsecondLaw\n    exact sub_nonneg.mp hsecondLaw\n  have hheat : (kB * Real.log 2) * T ≤ Q :=\n    (le_div_iff₀ hT).mp\
    \ hratio\n  rw [fep050_landauerBound]\n  nlinarith\n\n/-- If supplied work dominates dissipated heat, the heat bound yields\
    \ the\nLandauer work bound. -/\ntheorem fep050_landauer_work_bound\n    {W Q T kB : ℝ} (hT : 0 < T)\n    (hsecondLaw :\
    \ 0 ≤ fep050_totalEntropyChange Q T kB)\n    (hworkHeat : Q ≤ W) :\n    fep050_landauerBound kB T ≤ W :=\n  (fep050_landauer_heat_bound\
    \ hT hsecondLaw).trans hworkHeat\n\n/-- The Landauer threshold is positive for positive `kB` and temperature. -/\ntheorem\
    \ fep050_landauerBound_pos\n    {kB T : ℝ} (hkB : 0 < kB) (hT : 0 < T) :\n    0 < fep050_landauerBound kB T := by\n  exact\
    \ mul_pos (mul_pos hkB hT)\n    (Real.log_pos (by norm_num : (1 : ℝ) < 2))\n\nend FEP050\n"
  latex_equations:
  - \neg{}\mathsf{Function.Injective}\,\mathsf{fep050\_erasure}
  - '\begin{aligned}

    &(\mathsf{kB} : \mathbb{R}) \\

    &\mathsf{fep050\_erasureEntropyLoss}\,\mathsf{kB} = \mathsf{kB} \cdot \mathsf{Real.log}\,2

    \end{aligned}'
  - '\begin{aligned}

    &\{Q\,T\,\mathsf{kB} : \mathbb{R}\}\,(\mathsf{hT} : 0 < T)\,(\mathsf{hsecondLaw} : 0 \le \mathsf{fep050\_totalEntropyChange}\,Q\,T\,\mathsf{kB})
    \\

    &\mathsf{fep050\_landauerBound}\,\mathsf{kB}\,T \le Q

    \end{aligned}'
  - '\begin{aligned}

    &\{W\,Q\,T\,\mathsf{kB} : \mathbb{R}\}\,(\mathsf{hT} : 0 < T)\,(\mathsf{hsecondLaw} : 0 \le \mathsf{fep050\_totalEntropyChange}\,Q\,T\,\mathsf{kB})
    \\

    &(\mathsf{hworkHeat} : Q \le W) \\

    &\mathsf{fep050\_landauerBound}\,\mathsf{kB}\,T \le W

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{kB}\,T : \mathbb{R}\}\,(\mathsf{hkB} : 0 < \mathsf{kB})\,(\mathsf{hT} : 0 < T) \\

    &0 < \mathsf{fep050\_landauerBound}\,\mathsf{kB}\,T

    \end{aligned}'
- id: fep-051
  title: Likelihood-Ratio Reconstruction under Absolute Continuity
  area: BayesianMechanics
  family: measure-bayesian-inversion
  mathlib_modules:
  - Probability.Kernel.Posterior
  mathlib_status: real
  primary_theorem: fep051_likelihoodRatio_reconstruction
  supporting_theorems: []
  boundary_theorems:
  - fep051_reconstruction_iff_absoluteContinuous
  semantic_disposition: formalized
  nl: 'A native Radon–Nikodym derivative reconstructs a target measure from its reference exactly when the target is absolutely
    continuous with respect to that reference. Assumption scope: Both results require a measurable carrier and a HaveLebesgueDecomposition
    instance. The forward reconstruction additionally assumes target ≪ reference; the equivalence proves that this is the
    exact support condition and does not erase a singular component. Semantic disposition: `formalized`.

    '
  assumption_review: Both results require a measurable carrier and a HaveLebesgueDecomposition instance. The forward reconstruction
    additionally assumes target ≪ reference; the equivalence proves that this is the exact support condition and does not
    erase a singular component.
  non_vacuity: Taking target equal to reference supplies a reconstructible case, while any target with a nonzero singular
    component lies on the theorem's explicit failure boundary.
  acceptance_probe: native Lean compile of fep051_likelihoodRatio_reconstruction and fep051_reconstruction_iff_absoluteContinuous
    with the absolute-continuity premise visible.
  lean_sketch: "import FepSketches.measure_bayes\n\nnamespace FEP051\n\nopen MeasureTheory\n\nvariable {Ω : Type*} [MeasurableSpace\
    \ Ω]\n\n/-- Absolute continuity is sufficient for reconstruction by the native\nRadon--Nikodym likelihood ratio. -/\n\
    theorem fep051_likelihoodRatio_reconstruction\n    (target reference : Measure Ω)\n    [target.HaveLebesgueDecomposition\
    \ reference]\n    (h_ac : target ≪ reference) :\n    reference.withDensity (target.rnDeriv reference) = target :=\n  FEP.MeasureBayes.likelihoodRatio_reconstruction\
    \ target reference h_ac\n\n/-- The same equality characterizes absolute continuity, exposing the exact\nfailure boundary\
