  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The unit-weight finite product-of-experts pool is the normalized pointwise product of two laws and has total mass one
    whenever its normalizer is positive. Assumption scope: The state carrier is finite and the pointwise-product normalizer
    must be strictly positive. Disjoint supports are excluded. This unit-weight product uses exponents one, not the one-half
    exponents of an equal-weight logarithmic pool, and no externally Bayesian pooling property is claimed. Semantic disposition:
    `formalized`.

    '
  assumption_review: The state carrier is finite and the pointwise-product normalizer must be strictly positive. Disjoint
    supports are excluded. This unit-weight product uses exponents one, not the one-half exponents of an equal-weight logarithmic
    pool, and no externally Bayesian pooling property is claimed.
  non_vacuity: Two distinct overlapping laws produce a pooled distribution different from either input; the positive-overlap
    premise visibly excludes the disjoint point mass boundary.
  acceptance_probe: native Lean compile of fep110_unitWeightProductOfExpertsPool_normalized and fep110_unitWeightProductOfExpertsPool_mass
    with a strictly positive pointwise-product normalizer.
  lean_sketch: "import FepSketches.collective_inference\n\n/-! # Unit-Weight Product-of-Experts Pool Normalization -/\nnamespace\
    \ FEP110\n\nopen FEP Finset\nopen scoped BigOperators\n\nvariable {State : Type*} [Fintype State]\n\n/-- A positive pointwise-product\
    \ normalizer yields a normalized unit-weight\nproduct-of-experts pool. -/\ntheorem fep110_unitWeightProductOfExpertsPool_normalized\n\
    \    (left right : FiniteLaw State)\n    (normalizerPositive :\n      0 < FEP.CollectiveInference.productOfExpertsNormalizer\
    \ left right) :\n    ∑ state,\n        FEP.CollectiveInference.unitWeightProductOfExpertsPool\n          left right normalizerPositive\
    \ state = 1 :=\n  FEP.CollectiveInference.unitWeightProductOfExpertsPool_sum_one\n    left right normalizerPositive\n\n\
    /-- The pool mass is exactly the normalized pointwise product. It is a\nunit-weight product of experts, not a half-exponent\
    \ logarithmic pool. -/\ntheorem fep110_unitWeightProductOfExpertsPool_mass\n    (left right : FiniteLaw State)\n    (normalizerPositive\
    \ :\n      0 < FEP.CollectiveInference.productOfExpertsNormalizer left right)\n    (state : State) :\n    FEP.CollectiveInference.unitWeightProductOfExpertsPool\n\
    \        left right normalizerPositive state =\n      left state * right state /\n        FEP.CollectiveInference.productOfExpertsNormalizer\
    \ left right :=\n  rfl\n\nend FEP110\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{State}] \\

    &(\mathsf{left}\,\mathsf{right} : \mathsf{FiniteLaw}\,\mathsf{State})\,(\mathsf{normalizerPositive} : 0 \\

    &< \mathsf{FEP.CollectiveInference.productOfExpertsNormalizer}\,\mathsf{left}\,\mathsf{right}) \\

    &\sum \mathsf{state}, \mathsf{FEP.CollectiveInference.unitWeightProductOfExpertsPool}\,\mathsf{left}\,\mathsf{right} \\

    &\mathsf{normalizerPositive}\,\mathsf{state} = 1

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{State} : \mathsf{Type}^{*}\}\,[\mathsf{Fintype}\,\mathsf{State}] \\

    &(\mathsf{left}\,\mathsf{right} : \mathsf{FiniteLaw}\,\mathsf{State})\,(\mathsf{normalizerPositive} : 0 \\

    &< \mathsf{FEP.CollectiveInference.productOfExpertsNormalizer}\,\mathsf{left}\,\mathsf{right})\,(\mathsf{state} : \mathsf{State})
    \\

    &\mathsf{FEP.CollectiveInference.unitWeightProductOfExpertsPool}\,\mathsf{left}\,\mathsf{right} \\

    &\mathsf{normalizerPositive}\,\mathsf{state} = \mathsf{left}\,\mathsf{state} \cdot \mathsf{right}\,\mathsf{state} \\

    &/ \mathsf{FEP.CollectiveInference.productOfExpertsNormalizer}\,\mathsf{left}\,\mathsf{right}

