    \\

    &\{\mathsf{sampleCount} : \mathbb{N}\}\,[\mathsf{NeZero}\,\mathsf{sampleCount}]\,(\mathsf{sample} : \Omega{} \Rightarrow
    \mathsf{Fin}\,\mathsf{sampleCount} \Rightarrow \mathsf{Alphabet}) \\

    &(\mathsf{target} : \mathsf{Alphabet} \Rightarrow \mathbb{R})\,(\mathsf{deviation}\,\mathsf{perSymbolFailure} : \mathbb{R})\,(\mathsf{perSymbolBound}
    : \forall \\

    &\mathsf{symbol}, \mu{}.\mathsf{real}\,(\mathsf{FEP.LearningTheory.frequencyDeviationEvent}\,\mathsf{sample}\,\mathsf{target}
