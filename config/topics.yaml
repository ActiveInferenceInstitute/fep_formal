  nl: 'Passing two finite full-support laws through the same strictly positive finite channel cannot increase their finite
    KL divergence. Assumption scope: Input is nonempty, both input laws have strict support, and every channel atom is strictly
    positive; these conditions force reference-predictive support and avoid the project''s totalized-log boundary. This is
    stronger support than the most general measure-theoretic data-processing theorem. Semantic disposition: `conditional_proxy`.

