  boundary_theorems:
  - fep120_zero_evidence_boundary
  semantic_disposition: formalized
  nl: 'Explicitly factorized evidence ratios multiply, and sequential model-odds updates equal one update using product evidence.
    Assumption scope: Both reference evidence factors must be nonzero for multiplicativity in the real field. Evidence factorization
    is supplied algebraically and does not establish probabilistic independence. At a zero denominator, totalized real division
    returns zero rather than an infinite Bayes factor. Semantic disposition: `formalized`.

    '
  assumption_review: Both reference evidence factors must be nonzero for multiplicativity in the real field. Evidence factorization
    is supplied algebraically and does not establish probabilistic independence. At a zero denominator, totalized real division
    returns zero rather than an infinite Bayes factor.
  non_vacuity: Evidence three quarters versus one quarter maps unit prior odds to three, and the separate zero-reference theorem
    pins the exact unsupported comparison boundary.
  acceptance_probe: native Lean compile of fep120_bayesFactor_multiplicative_update, fep120_twoHypothesis_evidence_witness,
    and fep120_zero_evidence_boundary.
  lean_sketch: "import FepSketches.learning_theory\n\n/-! # Bayes-Factor Multiplicativity and Model-Evidence Update -/\nnamespace\
    \ FEP120\n\n/-- Explicitly factorized evidence terms multiply, and sequential\nposterior-odds updates agree with one update\
    \ using product evidence. -/\ntheorem fep120_bayesFactor_multiplicative_update\n    (priorOdds firstFavored firstReference\
    \ secondFavored secondReference : ℝ)\n    (firstReferenceNonzero : firstReference ≠ 0)\n    (secondReferenceNonzero :\
    \ secondReference ≠ 0) :\n    FEP.LearningTheory.bayesFactor\n        (firstFavored * secondFavored) (firstReference *\
    \ secondReference) =\n        FEP.LearningTheory.bayesFactor firstFavored firstReference *\n          FEP.LearningTheory.bayesFactor\
    \ secondFavored secondReference ∧\n      FEP.LearningTheory.updatedModelOdds priorOdds\n          (firstFavored * secondFavored)\
    \ (firstReference * secondReference) =\n        FEP.LearningTheory.updatedModelOdds\n          (FEP.LearningTheory.updatedModelOdds\n\
    \            priorOdds firstFavored firstReference)\n          secondFavored secondReference :=\n  FEP.LearningTheory.bayesFactor_multiplicative\n\
    \    priorOdds firstFavored firstReference secondFavored secondReference\n    firstReferenceNonzero secondReferenceNonzero\n\
    \n/-- A concrete two-model evidence ratio updates unit prior odds to three. -/\ntheorem fep120_twoHypothesis_evidence_witness\
    \ :\n    FEP.LearningTheory.bayesFactor (3 / 4) (1 / 4) = 3 ∧\n      FEP.LearningTheory.updatedModelOdds 1 (3 / 4) (1\
    \ / 4) = 3 :=\n  FEP.LearningTheory.bayesFactor_twoHypothesis_witness\n\n/-- At zero reference evidence, real division\
    \ returns zero rather than an\nextended infinite Bayes factor; supported comparisons require nonzero\nreference evidence.\
    \ -/\ntheorem fep120_zero_evidence_boundary (favored : ℝ) :\n    FEP.LearningTheory.bayesFactor favored 0 = 0 :=\n  FEP.LearningTheory.bayesFactor_zero_denominator_boundary\
    \ favored\n\nend FEP120\n"
  latex_equations:
  - '\begin{aligned}

    &(\mathsf{priorOdds}\,\mathsf{firstFavored}\,\mathsf{firstReference}\,\mathsf{secondFavored}\,\mathsf{secondReference}
    : \mathbb{R}) \\

    &(\mathsf{firstReferenceNonzero} : \mathsf{firstReference} \ne 0) \\

    &(\mathsf{secondReferenceNonzero} : \mathsf{secondReference} \ne 0) \\

    &\mathsf{FEP.LearningTheory.bayesFactor}\,(\mathsf{firstFavored} \cdot \mathsf{secondFavored}) \\

    &(\mathsf{firstReference} \cdot \mathsf{secondReference}) = \mathsf{FEP.LearningTheory.bayesFactor}\,\mathsf{firstFavored}
    \\

    &\mathsf{firstReference} \cdot \mathsf{FEP.LearningTheory.bayesFactor}\,\mathsf{secondFavored}\,\mathsf{secondReference}
    \\

    &\wedge \mathsf{FEP.LearningTheory.updatedModelOdds}\,\mathsf{priorOdds}\,(\mathsf{firstFavored} \cdot \mathsf{secondFavored})
    \\

    &(\mathsf{firstReference} \cdot \mathsf{secondReference}) = \mathsf{FEP.LearningTheory.updatedModelOdds} \\

    &(\mathsf{FEP.LearningTheory.updatedModelOdds}\,\mathsf{priorOdds}\,\mathsf{firstFavored}\,\mathsf{firstReference}) \\

    &\mathsf{secondFavored}\,\mathsf{secondReference}

    \end{aligned}'
  - '\begin{aligned}

    &\mathsf{FEP.LearningTheory.bayesFactor}\,(3 / 4)\,(1 / 4) = 3 \\

    &\wedge \mathsf{FEP.LearningTheory.updatedModelOdds}\,1\,(3 / 4)\,(1 / 4) = 3

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{favored} : \mathbb{R}) \\

    &\mathsf{FEP.LearningTheory.bayesFactor}\,\mathsf{favored}\,0 = 0

