- id: fep-012
  title: Finite Policy Shannon Entropy Regularization
  area: FEP
  family: core-free-energy
  mathlib_modules:
  - Analysis.SpecialFunctions.Exp
  mathlib_status: real
  primary_theorem: fep012_entropyRegularizedCost_le_expectedCost
  supporting_theorems:
  - fep012_policyEntropy_nonneg
  - fep012_policyEntropy_pointMass
  - fep012_entropyRegularizedCost_zeroTemperature
  - fep012_gibbsPartition_nonneg
  - fep012_gibbsPartition_pos
  - fep012_gibbs_mono
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Finite Shannon policy entropy is nonnegative on unit-interval weights, vanishes for point policies, and at nonnegative
    temperature lowers expected cost by exactly its entropy reward. Assumption scope: Entropy nonnegativity only requires
    each weight in [0,1]; normalization is supplied separately by a policy law such as fep-028 softmax. The theorem compares
    objectives and does not claim that softmax is the unique optimizer. Semantic disposition: `formalized`.

    '
  assumption_review: Entropy nonnegativity only requires each weight in [0,1]; normalization is supplied separately by a policy
    law such as fep-028 softmax. The theorem compares objectives and does not claim that softmax is the unique optimizer.
  non_vacuity: A point mass has zero entropy while a multi-policy interior law has positive terms; positive temperature yields
    a nonzero objective correction whenever entropy is positive.
  acceptance_probe: native Lean compile of fep012_policyEntropy_nonneg, fep012_policyEntropy_pointMass, fep012_entropyRegularizedCost_le_expectedCost,
    and FEPComposed.fep012_softmax_entropyRegularizedCost_le.
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Exp\nimport Mathlib.Analysis.SpecialFunctions.Log.Basic\nimport Mathlib.Algebra.BigOperators.Group.Finset.Basic\n\
    import Mathlib.Algebra.Order.BigOperators.Group.Finset\n\nnamespace FEP012\n\nopen Real Finset\n\n-- [proof strategy:\
    \ Real.exp_nonneg / exp_pos combined with Finset.sum_nonneg / sum_pos]\n\nabbrev Policy := Fin 10\n\n/-- Shannon entropy\
    \ of a finite policy-weight vector.  The probability-simplex\nassumptions are stated by the theorems that use it. -/\n\
    noncomputable def fep012_policyEntropy (q : Policy → ℝ) : ℝ :=\n  ∑ p, q p * (-Real.log (q p))\n\n/-- Expected policy\
    \ cost under finite weights. -/\ndef fep012_expectedCost (q cost : Policy → ℝ) : ℝ :=\n  ∑ p, q p * cost p\n\n/-- Entropy-regularized\
    \ policy objective, with temperature `τ`. -/\nnoncomputable def fep012_entropyRegularizedCost\n    (q cost : Policy →\
    \ ℝ) (τ : ℝ) : ℝ :=\n  fep012_expectedCost q cost - τ * fep012_policyEntropy q\n\n/-- Policy entropy is nonnegative for\
    \ weights in the unit interval. -/\ntheorem fep012_policyEntropy_nonneg (q : Policy → ℝ)\n    (hq : ∀ p, q p ∈ Set.Icc\
    \ (0 : ℝ) 1) :\n    0 ≤ fep012_policyEntropy q := by\n  exact Finset.sum_nonneg fun p _ =>\n    mul_nonneg (hq p).1\n\
    \      (neg_nonneg.mpr (Real.log_nonpos (hq p).1 (hq p).2))\n\n/-- A deterministic point policy has zero Shannon entropy.\
    \ -/\ntheorem fep012_policyEntropy_pointMass (chosen : Policy) :\n    fep012_policyEntropy (fun p => if p = chosen then\
    \ 1 else 0) = 0 := by\n  classical\n  simp [fep012_policyEntropy]\n\n/-- Nonnegative entropy temperature can only lower\
    \ the regularized objective\nrelative to the unregularized expected cost. -/\ntheorem fep012_entropyRegularizedCost_le_expectedCost\n\
    \    (q cost : Policy → ℝ) (τ : ℝ)\n    (hτ : 0 ≤ τ) (hq : ∀ p, q p ∈ Set.Icc (0 : ℝ) 1) :\n    fep012_entropyRegularizedCost\
    \ q cost τ ≤ fep012_expectedCost q cost := by\n  exact sub_le_self _ (mul_nonneg hτ (fep012_policyEntropy_nonneg q hq))\n\
    \n/-- At zero temperature entropy regularization vanishes exactly. -/\ntheorem fep012_entropyRegularizedCost_zeroTemperature\n\
    \    (q cost : Policy → ℝ) :\n    fep012_entropyRegularizedCost q cost 0 = fep012_expectedCost q cost := by\n  simp [fep012_entropyRegularizedCost]\n\
    \n/-- Gibbs partition sum ``∑ exp(-G)`` is nonnegative (Boltzmann weights). -/\ntheorem fep012_gibbsPartition_nonneg (G\
    \ : Policy → ℝ) (s : Finset Policy) :\n    0 ≤ ∑ p ∈ s, Real.exp (-G p) :=\n  Finset.sum_nonneg fun _ _ => Real.exp_nonneg\
    \ _\n\n/-- Gibbs partition sum is strictly positive when policy set is nonempty. -/\ntheorem fep012_gibbsPartition_pos\
    \ (G : Policy → ℝ) (s : Finset Policy) (hne : s.Nonempty) :\n    0 < ∑ p ∈ s, Real.exp (-G p) :=\n  Finset.sum_pos (fun\
    \ _ _ => Real.exp_pos _) hne\n\n/-- Monotonicity: lower cost → larger Boltzmann weight at temperature β = 1. -/\ntheorem\
    \ fep012_gibbs_mono (G₁ G₂ : Policy) (G : Policy → ℝ) (h : G G₁ ≤ G G₂) :\n    Real.exp (-G G₂) ≤ Real.exp (-G G₁) :=\n\
    \  Real.exp_le_exp.mpr (by linarith)\n\nend FEP012\n"
