    \gamma{}] \\

    &(\mu{} : \mathsf{Measure}~\alpha{})\,(\kappa{} : \mathsf{Kernel}\,\alpha{}\,\beta{})\,[\mathsf{SFinite}\,\mu{}]\,[\mathsf{IsSFiniteKernel}\,\kappa{}]
    \\

    &(\mathsf{fep027\_hierarchicalJoint}\,\mu{}\,\kappa{}).\mathsf{snd} = \kappa{} \mathbin{\circ_{m}}\,\mu{}

