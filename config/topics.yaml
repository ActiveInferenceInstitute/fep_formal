  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Gradient descent on the centered scalar quadratic has an exact n-step iterate, nonincreasing energy for step sizes
    in [0,2], and converges globally to the center for steps in (0,2). Assumption scope: The closed form is unconditional.
    Energy descent uses 0≤η≤2 and convergence uses the strict stability interval 0<η<2. This is an exact quadratic model,
    not a theorem for arbitrary smooth or convex objectives. Semantic disposition: `formalized`.

    '
  assumption_review: The closed form is unconditional. Energy descent uses 0≤η≤2 and convergence uses the strict stability
    interval 0<η<2. This is an exact quadratic model, not a theorem for arbitrary smooth or convex objectives.
  non_vacuity: At η=1/2 every displacement halves, producing nontrivial geometric convergence; η=1 reaches the center in one
    step and the endpoints expose the non-strict boundary.
  acceptance_probe: native Lean compile of fep032_quadraticUpdate_deviation, fep032_quadraticUpdate_iterate, fep032_quadraticEnergy_descent,
    fep032_quadraticUpdate_tendsto, and FEPComposed.fep032_update_is_fep043_gradientStep.
  lean_sketch: "import Mathlib.Analysis.SpecificLimits.Normed\nimport Mathlib.Tactic\n\nnamespace FEP032\n\n/-- Gradient-descent\
    \ update for the centered quadratic energy\n`(x - center)² / 2`. -/\ndef fep032_quadraticUpdate (step center x : ℝ) :\
    \ ℝ :=\n  x - step * (x - center)\n\n/-- One descent step scales displacement from the minimizer exactly. -/\ntheorem\
    \ fep032_quadraticUpdate_deviation (step center x : ℝ) :\n    fep032_quadraticUpdate step center x - center =\n      (1\
    \ - step) * (x - center) := by\n  simp only [fep032_quadraticUpdate]\n  ring\n\n/-- The minimizer is a fixed point for\
    \ every step size. -/\ntheorem fep032_quadraticUpdate_fixed (step center : ℝ) :\n    fep032_quadraticUpdate step center\
    \ center = center := by\n  simp [fep032_quadraticUpdate]\n\n/-- Closed form for every finite gradient-descent iterate.\
    \ -/\ntheorem fep032_quadraticUpdate_iterate (step center x : ℝ) (n : ℕ) :\n    ((fep032_quadraticUpdate step center)^[n])\
    \ x - center =\n      (1 - step) ^ n * (x - center) := by\n  induction n with\n  | zero => simp\n  | succ n ih =>\n  \
    \    rw [Function.iterate_succ_apply']\n      rw [fep032_quadraticUpdate_deviation, ih, pow_succ]\n      ring\n\n/-- Step\
    \ sizes in `[0,2]` cannot increase the centered quadratic energy. -/\ntheorem fep032_quadraticEnergy_descent\n    {step\
    \ center x : ℝ} (hstep0 : 0 ≤ step) (hstep2 : step ≤ 2) :\n    (fep032_quadraticUpdate step center x - center) ^ 2 ≤\n\
    \      (x - center) ^ 2 := by\n  rw [fep032_quadraticUpdate_deviation]\n  have hfactor : (1 - step) ^ 2 ≤ 1 := by nlinarith\n\
    \  have hscaled :=\n    mul_le_mul_of_nonneg_right hfactor (sq_nonneg (x - center))\n  nlinarith\n\n/-- Every strictly\
    \ stable step size converges to the unique quadratic\nminimizer from every initial state. -/\ntheorem fep032_quadraticUpdate_tendsto\n\
    \    {step : ℝ} (hstep0 : 0 < step) (hstep2 : step < 2)\n    (center x : ℝ) :\n    Filter.Tendsto\n      (fun n => ((fep032_quadraticUpdate\
    \ step center)^[n]) x)\n      Filter.atTop (nhds center) := by\n  have habs : |1 - step| < 1 := by\n    rw [abs_lt]\n\
    \    constructor <;> linarith\n  have hpow : Filter.Tendsto (fun n : ℕ => (1 - step) ^ n)\n      Filter.atTop (nhds 0)\
    \ :=\n    tendsto_pow_atTop_nhds_zero_of_abs_lt_one habs\n  have hdeviation : Filter.Tendsto\n      (fun n : ℕ =>\n  \
    \      ((fep032_quadraticUpdate step center)^[n]) x - center)\n      Filter.atTop (nhds 0) := by\n    simpa only [fep032_quadraticUpdate_iterate,\
    \ zero_mul] using\n      hpow.mul_const (x - center)\n  simpa only [sub_add_cancel, zero_add] using hdeviation.add_const\
    \ center\n\nend FEP032\n"
