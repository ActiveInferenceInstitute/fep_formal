    open scoped Matrix\n\nvariable {Outcome : Type*} [Fintype Outcome]\nvariable {d k : ℕ}\n\n/-- Fisher pullback along a\
    \ composite finite Jacobian equals successive\npullback through the two coordinate maps. -/\ntheorem fep101_fisherPullback_reparameterization\n\
