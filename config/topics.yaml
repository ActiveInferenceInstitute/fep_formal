- id: fep-022
  title: Posterior-Predictive Kernel and Brier Properness
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Probability.Kernel.Composition.MeasureComp
  mathlib_status: real
  primary_theorem: fep022_brier_eq_optimum_iff
  supporting_theorems:
  - fep022_posteriorPredictive_mass_one
  - fep022_brier_decomposition
  - fep022_predictive_brier_decomposition
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Markov posterior and likelihood kernels compose into normalized posterior-predictive fibres, and expected Bernoulli
    Brier loss is uniquely minimized by the true event probability. Assumption scope: Kernel normalization requires both components
    to be Markov. Brier properness is an exact real-algebra identity whose probabilistic interpretation restricts true and
    forecast masses to [0,1]. It is a proper one-event discrepancy, not an empirical calibration-frequency theorem. Semantic
    disposition: `formalized`.

    '
  assumption_review: Kernel normalization requires both components to be Markov. Brier properness is an exact real-algebra
    identity whose probabilistic interpretation restricts true and forecast masses to [0,1]. It is a proper one-event discrepancy,
    not an empirical calibration-frequency theorem.
  non_vacuity: Non-deterministic posterior and likelihood kernels produce nontrivial predictive true-event mass; every forecast
    q distinct from p incurs the strictly positive squared regret (q-p)^2.
  acceptance_probe: native Lean compile of fep022_posteriorPredictive_mass_one, fep022_brier_decomposition, fep022_brier_eq_optimum_iff,
    and fep022_predictive_brier_decomposition.
  lean_sketch: "import Mathlib.Probability.Kernel.Composition.MeasureComp\nimport Mathlib.Tactic\n\nnamespace FEP022\n\nopen\
    \ MeasureTheory ProbabilityTheory\nopen scoped ENNReal\n\nvariable {\U0001D4D2 Ω \U0001D4E7 : Type*}\nvariable [MeasurableSpace\
    \ \U0001D4D2] [MeasurableSpace Ω] [MeasurableSpace \U0001D4E7]\n\n/-- A posterior-predictive kernel composes a context-indexed\
    \ posterior with a\nlatent-state likelihood kernel. -/\nnoncomputable def fep022_posteriorPredictive\n    (posterior :\
    \ Kernel \U0001D4D2 Ω) (likelihood : Kernel Ω \U0001D4E7) : Kernel \U0001D4D2 \U0001D4E7 :=\n  likelihood ∘ₖ posterior\n\
    \n/-- Markov posterior and likelihood kernels yield normalized predictive fibres. -/\ntheorem fep022_posteriorPredictive_mass_one\n\
    \    (posterior : Kernel \U0001D4D2 Ω) (likelihood : Kernel Ω \U0001D4E7)\n    [IsMarkovKernel posterior] [IsMarkovKernel\
    \ likelihood] (c : \U0001D4D2) :\n    fep022_posteriorPredictive posterior likelihood c Set.univ = 1 := by\n  change (likelihood\
    \ ∘ₖ posterior) c Set.univ = 1\n  exact measure_univ\n\n/-- Expected Bernoulli Brier loss at true mass `p` and forecast\
    \ `q`. -/\ndef fep022_brierScore (p q : ℝ) : ℝ :=\n  p * (1 - q) ^ 2 + (1 - p) * q ^ 2\n\n/-- Brier loss is Bayes uncertainty\
    \ plus squared forecast error. -/\ntheorem fep022_brier_decomposition (p q : ℝ) :\n    fep022_brierScore p q = p * (1\
    \ - p) + (q - p) ^ 2 := by\n  simp only [fep022_brierScore]\n  ring\n\n/-- Expected Brier loss is minimized uniquely by\
    \ reporting the true mass. -/\ntheorem fep022_brier_eq_optimum_iff (p q : ℝ) :\n    fep022_brierScore p q = p * (1 - p)\
    \ ↔ q = p := by\n  rw [fep022_brier_decomposition]\n  constructor\n  · intro h\n    nlinarith [sq_nonneg (q - p)]\n  ·\
    \ rintro rfl\n    ring\n\n/-- Extract the predictive probability assigned to `true` by a binary model. -/\nnoncomputable\
    \ def fep022_predictiveTrueMass\n    (posterior : Kernel \U0001D4D2 Ω) (likelihood : Kernel Ω Bool) (c : \U0001D4D2) :\
    \ ℝ :=\n  (fep022_posteriorPredictive posterior likelihood c {true}).toReal\n\n/-- The predictive Brier score inherits\
    \ the exact proper-score decomposition. -/\ntheorem fep022_predictive_brier_decomposition\n    (posterior : Kernel \U0001D4D2\
    \ Ω) (likelihood : Kernel Ω Bool) (c : \U0001D4D2) (p : ℝ) :\n    fep022_brierScore p (fep022_predictiveTrueMass posterior\
    \ likelihood c) =\n      p * (1 - p) +\n        (fep022_predictiveTrueMass posterior likelihood c - p) ^ 2 := by\n  exact\
    \ fep022_brier_decomposition _ _\n\nend FEP022\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathcal{C}\,\Omega{}\,\mathcal{X} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathcal{C}]\,[\mathsf{MeasurableSpace}
    \Omega{}]\,[\mathsf{MeasurableSpace} \mathcal{X}] \\

    &(\mathsf{posterior} : \mathsf{Kernel}\,\mathcal{C}\,\Omega{})\,(\mathsf{likelihood} : \mathsf{Kernel}\,\Omega{}\,\mathcal{X})\,[\mathsf{IsMarkovKernel}\,\mathsf{posterior}]
    \\

    &[\mathsf{IsMarkovKernel}\,\mathsf{likelihood}]\,(c : \mathcal{C}) \\

    &\mathsf{fep022\_posteriorPredictive}\,\mathsf{posterior}\,\mathsf{likelihood}\,c\,\Omega = 1

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathcal{C}\,\Omega{}\,\mathcal{X} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathcal{C}]\,[\mathsf{MeasurableSpace}
    \Omega{}]\,[\mathsf{MeasurableSpace} \mathcal{X}] \\

    &(p\,q : \mathbb{R}) \\

    &\mathsf{fep022\_brierScore}\,p\,q = p \cdot (1 - p) + (q - p) ^ 2

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathcal{C}\,\Omega{}\,\mathcal{X} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathcal{C}]\,[\mathsf{MeasurableSpace}
    \Omega{}]\,[\mathsf{MeasurableSpace} \mathcal{X}] \\

    &(p\,q : \mathbb{R}) \\

    &\mathsf{fep022\_brierScore}\,p\,q = p \cdot (1 - p) \leftrightarrow q = p

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathcal{C}\,\Omega{}\,\mathcal{X} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathcal{C}]\,[\mathsf{MeasurableSpace}
    \Omega{}]\,[\mathsf{MeasurableSpace} \mathcal{X}] \\

    &(\mathsf{posterior} : \mathsf{Kernel}\,\mathcal{C}\,\Omega{})\,(\mathsf{likelihood} : \mathsf{Kernel}\,\Omega{}\,\mathsf{Bool})\,(c
    : \mathcal{C})\,(p : \mathbb{R}) \\

    &\mathsf{fep022\_brierScore}\,p\,(\mathsf{fep022\_predictiveTrueMass}\,\mathsf{posterior}\,\mathsf{likelihood}\,c) = p
    \\

    &\cdot (1 - p) + (\mathsf{fep022\_predictiveTrueMass}\,\mathsf{posterior}\,\mathsf{likelihood}\,c - p) ^ 2

    \end{aligned}'
- id: fep-023
  title: Policy-Indexed Reachable Laws
  area: ActiveInference
  family: core-active-inference
  mathlib_modules:
  - MeasureTheory.Measure.MeasureSpace
  mathlib_status: real
  primary_theorem: fep023_reachable_normalized
  supporting_theorems:
  - fep023_policy_reachable
  - fep023_reachable_mono
  - fep023_reachable_empty
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'The distributional affordance set is the image of available policies under their outcome-law map; policy-set inclusion
    is monotone and normalization of every policy law transfers to every reachable law. Assumption scope: Reachability is
    policy-indexed one-step image semantics. Normalization is an explicit premise on available policy laws; no controllability,
    multi-step support closure, or topology on the law space is claimed. Semantic disposition: `formalized`.

    '
  assumption_review: Reachability is policy-indexed one-step image semantics. Normalization is an explicit premise on available
    policy laws; no controllability, multi-step support closure, or topology on the law space is claimed.
  non_vacuity: Distinct policies may induce distinct normalized measures, while an empty policy set yields no reachable law
    and a singleton set yields its single law.
  acceptance_probe: native Lean compile of fep023_policy_reachable, fep023_reachable_mono, fep023_reachable_normalized, and
    fep023_reachable_empty.
  lean_sketch: "import Mathlib.MeasureTheory.Measure.Typeclasses.Probability\n\nnamespace FEP023\n\nopen MeasureTheory\n\n\
    variable {Policy Outcome : Type*} [MeasurableSpace Outcome]\n\n/-- Distributional affordance set: outcome laws induced\
    \ by available policies. -/\ndef fep023_reachableLaws\n    (policies : Set Policy) (law : Policy → Measure Outcome) :\n\
    \    Set (Measure Outcome) :=\n  law '' policies\n\n/-- Every available policy induces a reachable outcome law. -/\ntheorem\
    \ fep023_policy_reachable\n    (policies : Set Policy) (law : Policy → Measure Outcome)\n    {policy : Policy} (hpolicy\
    \ : policy ∈ policies) :\n    law policy ∈ fep023_reachableLaws policies law :=\n  ⟨policy, hpolicy, rfl⟩\n\n/-- Expanding\
    \ the policy set can only enlarge the reachable-law set. -/\ntheorem fep023_reachable_mono\n    {policies₁ policies₂ :\
    \ Set Policy} (law : Policy → Measure Outcome)\n    (hpolicies : policies₁ ⊆ policies₂) :\n    fep023_reachableLaws policies₁\
    \ law ⊆\n      fep023_reachableLaws policies₂ law := by\n  rintro _ ⟨policy, hpolicy, rfl⟩\n  exact ⟨policy, hpolicies\
    \ hpolicy, rfl⟩\n\n/-- If each policy law is normalized, every reachable law is normalized. -/\ntheorem fep023_reachable_normalized\n\
    \    (policies : Set Policy) (law : Policy → Measure Outcome)\n    (hlaw : ∀ policy ∈ policies, law policy Set.univ =\
    \ 1)\n    {μ : Measure Outcome} (hμ : μ ∈ fep023_reachableLaws policies law) :\n    μ Set.univ = 1 := by\n  rcases hμ\
    \ with ⟨policy, hpolicy, rfl⟩\n  exact hlaw policy hpolicy\n\n/-- No policy means no reachable law. -/\ntheorem fep023_reachable_empty\
    \ (law : Policy → Measure Outcome) :\n    fep023_reachableLaws (∅ : Set Policy) law = ∅ := by\n  simp [fep023_reachableLaws]\n\
    \nend FEP023\n"
  latex_equations:
  - '\begin{aligned}

    &\{\mathsf{Policy}\,\mathsf{Outcome} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathsf{Outcome}] \\

    &(\mathsf{policies} : \mathsf{Set}~\mathsf{Policy})\,(\mathsf{law} : \mathsf{Policy} \Rightarrow \mathsf{Measure} \mathsf{Outcome})\,\{\mathsf{policy}
    : \mathsf{Policy}\} \\

    &(\mathsf{hpolicy} : \mathsf{policy} \in \mathsf{policies}) \\

    &\mathsf{law}\,\mathsf{policy} \in \mathsf{fep023\_reachableLaws}\,\mathsf{policies}\,\mathsf{law}

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{Policy}\,\mathsf{Outcome} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathsf{Outcome}] \\

    &\{policies_{1}\,policies_{2} : \mathsf{Set}~\mathsf{Policy}\}\,(\mathsf{law} : \mathsf{Policy} \Rightarrow \mathsf{Measure}
    \mathsf{Outcome}) \\

    &(\mathsf{hpolicies} : policies_{1} \subseteq policies_{2}) \\

    &\mathsf{fep023\_reachableLaws}\,policies_{1}\,\mathsf{law} \subseteq \mathsf{fep023\_reachableLaws}\,policies_{2}\,\mathsf{law}

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{Policy}\,\mathsf{Outcome} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathsf{Outcome}] \\

    &(\mathsf{policies} : \mathsf{Set}~\mathsf{Policy})\,(\mathsf{law} : \mathsf{Policy} \Rightarrow \mathsf{Measure} \mathsf{Outcome})
    \\

    &(\mathsf{hlaw} : \forall \mathsf{policy} \in \mathsf{policies}, \mathsf{law}\,\mathsf{policy}\,\Omega = 1)\,\{\mu{} :
    \mathsf{Measure} \mathsf{Outcome}\} \\

    &(h\mu{} : \mu{} \in \mathsf{fep023\_reachableLaws}\,\mathsf{policies}\,\mathsf{law}) \\

    &\mu{}\,\Omega = 1

    \end{aligned}'
  - '\begin{aligned}

    &\{\mathsf{Policy}\,\mathsf{Outcome} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace} \mathsf{Outcome}] \\

    &(\mathsf{law} : \mathsf{Policy} \Rightarrow \mathsf{Measure} \mathsf{Outcome}) \\

    &\mathsf{fep023\_reachableLaws}\,(\varnothing : \mathsf{Set}~\mathsf{Policy})\,\mathsf{law} = \varnothing

    \end{aligned}'
- id: fep-024
  title: KL Regularization in Objectives
  area: InfoGeometry
  family: core-information-geometry
  mathlib_modules:
  - InformationTheory.KullbackLeibler.Basic
  mathlib_status: real
  primary_theorem: fep024_klRegularizedObjective_exact
  supporting_theorems:
  - fep024_klRegularizedObjective_ge
  - fep024_klRegularizedObjective_zeroWeight
  - fep024_klRegularizedObjective_monoWeight
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'An ENNReal objective regularized by a nonnegative weight times native measure KL upper-bounds its base, is monotone
    in weight, recovers the base at zero weight, and is exact when approximation equals a sigma-finite prior. Assumption scope:
    The codomain explicitly admits infinite objectives and KL values. Exactness at the prior uses sigma-finiteness; no differentiability
    or optimizer-existence claim is made. Semantic disposition: `formalized`.

    '
  assumption_review: The codomain explicitly admits infinite objectives and KL values. Exactness at the prior uses sigma-finiteness;
    no differentiability or optimizer-existence claim is made.
  non_vacuity: Positive weight and unequal finite laws contribute a nonzero regularizer, while zero weight and matching laws
    independently exercise both exactness mechanisms.
  acceptance_probe: native Lean compile of fep024_klRegularizedObjective_ge, fep024_klRegularizedObjective_zeroWeight, fep024_klRegularizedObjective_monoWeight,
    and fep024_klRegularizedObjective_exact.
  lean_sketch: "import Mathlib.InformationTheory.KullbackLeibler.Basic\n\nnamespace FEP024\n\nopen MeasureTheory\nopen scoped\
    \ ENNReal\n\nvariable {α : Type*} [MeasurableSpace α]\n\n/-- Base objective plus a weighted native measure-valued KL regularizer.\
    \ -/\nnoncomputable def fep024_klRegularizedObjective\n    (base weight : ENNReal) (approximation prior : Measure α) :\
    \ ENNReal :=\n  base + weight * InformationTheory.klDiv approximation prior\n\n/-- A KL-regularized objective upper-bounds\
    \ its base objective. -/\ntheorem fep024_klRegularizedObjective_ge\n    (base weight : ENNReal) (approximation prior :\
    \ Measure α) :\n    base ≤ fep024_klRegularizedObjective base weight approximation prior := by\n  exact le_add_right (le_refl\
    \ _)\n\n/-- Zero regularization weight recovers the base objective exactly. -/\ntheorem fep024_klRegularizedObjective_zeroWeight\n\
    \    (base : ENNReal) (approximation prior : Measure α) :\n    fep024_klRegularizedObjective base 0 approximation prior\
    \ = base := by\n  simp [fep024_klRegularizedObjective]\n\n/-- The regularized objective is monotone in its nonnegative\
    \ weight. -/\ntheorem fep024_klRegularizedObjective_monoWeight\n    (base : ENNReal) {weight₁ weight₂ : ENNReal}\n   \
    \ (hweight : weight₁ ≤ weight₂) (approximation prior : Measure α) :\n    fep024_klRegularizedObjective base weight₁ approximation\
    \ prior ≤\n      fep024_klRegularizedObjective base weight₂ approximation prior := by\n  simpa [fep024_klRegularizedObjective,\
    \ mul_comm, add_comm] using\n    add_le_add_left\n      (mul_le_mul_right hweight (InformationTheory.klDiv approximation\
    \ prior)) base\n\n/-- Matching a sigma-finite prior removes the KL regularizer. -/\ntheorem fep024_klRegularizedObjective_exact\n\
    \    (base weight : ENNReal) (prior : Measure α) [SigmaFinite prior] :\n    fep024_klRegularizedObjective base weight\
    \ prior prior = base := by\n  simp [fep024_klRegularizedObjective, InformationTheory.klDiv_self]\n\nend FEP024\n"
  latex_equations:
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{base}\,\mathsf{weight} : \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{approximation}\,\mathsf{prior} : \mathsf{Measure}~\alpha{})
    \\

    &\mathsf{base} \le \mathsf{fep024\_klRegularizedObjective}\,\mathsf{base}\,\mathsf{weight}\,\mathsf{approximation}\,\mathsf{prior}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{base} : \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{approximation}\,\mathsf{prior} : \mathsf{Measure}~\alpha{}) \\

    &\mathsf{fep024\_klRegularizedObjective}\,\mathsf{base}\,0\,\mathsf{approximation}\,\mathsf{prior} = \mathsf{base}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{base} : \mathbb{R}_{\ge 0}^{\infty})\,\{weight_{1}\,weight_{2} : \mathbb{R}_{\ge 0}^{\infty}\}\,(\mathsf{hweight}
    : weight_{1} \le weight_{2}) \\

    &(\mathsf{approximation}\,\mathsf{prior} : \mathsf{Measure}~\alpha{}) \\

    &\mathsf{fep024\_klRegularizedObjective}\,\mathsf{base}\,weight_{1}\,\mathsf{approximation}\,\mathsf{prior} \\

    &\le \mathsf{fep024\_klRegularizedObjective}\,\mathsf{base}\,weight_{2}\,\mathsf{approximation}\,\mathsf{prior}

    \end{aligned}'
  - '\begin{aligned}

    &\{\alpha{} : \mathsf{Type}^{*}\}\,[\mathsf{MeasurableSpace}~\alpha{}] \\

    &(\mathsf{base}\,\mathsf{weight} : \mathbb{R}_{\ge 0}^{\infty})\,(\mathsf{prior} : \mathsf{Measure}~\alpha{})\,[\mathsf{SigmaFinite}\,\mathsf{prior}]
    \\

    &\mathsf{fep024\_klRegularizedObjective}\,\mathsf{base}\,\mathsf{weight}\,\mathsf{prior}\,\mathsf{prior} = \mathsf{base}

    \end{aligned}'
- id: fep-025
  title: Conserved Nonequilibrium Probability Currents
  area: Thermodynamics
  family: core-thermodynamics
  mathlib_modules:
  - LinearAlgebra.Matrix.Notation
  mathlib_status: real
  primary_theorem: fep025_cycleCurrent_stationary
  supporting_theorems:
  - fep025_probabilityCurrent_antisymm
  - fep025_probabilityCurrent_diag_zero
  - fep025_total_divergence_zero
  - fep025_transitionCurrent_stationary
  - fep025_cycleTransition_row
  - fep025_cycleStationary_invariant
  - fep025_cycleCurrent_nonzero
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'For flux πᵢPᵢⱼ, forward-minus-reverse current is antisymmetric; row normalization plus π-stationarity derives zero
    divergence. A directed three-state transition with uniform stationary law has a nonzero divergence-free current. Assumption
    scope: The general stationarity theorem explicitly requires normalized transition rows and a stationary real mass vector.
    The concrete witness is a finite deterministic cycle; no continuous-state NESS existence or thermodynamic force law is
    inferred here. Semantic disposition: `formalized`.

    '
  assumption_review: The general stationarity theorem explicitly requires normalized transition rows and a stationary real
    mass vector. The concrete witness is a finite deterministic cycle; no continuous-state NESS existence or thermodynamic
    force law is inferred here.
  non_vacuity: The clockwise three-state transition is nonidentity, preserves the uniform law, has current 1/3 on edge 0→1,
    and nevertheless has zero divergence at every state.
  acceptance_probe: native Lean compile of fep025_transitionCurrent_stationary, fep025_cycleTransition_row, fep025_cycleStationary_invariant,
    fep025_cycleCurrent_stationary, and fep025_cycleCurrent_nonzero.
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.LinearAlgebra.Matrix.Notation\nimport\
    \ Mathlib.Tactic\n\nnamespace FEP025\n\nopen Finset\n\n/-- Net probability current is forward flow minus reverse flow.\
    \ -/\ndef fep025_probabilityCurrent {n : ℕ}\n    (flow : Matrix (Fin n) (Fin n) ℝ) : Matrix (Fin n) (Fin n) ℝ :=\n  fun\
    \ i j => flow i j - flow j i\n\n/-- Probability current is antisymmetric under edge reversal. -/\ntheorem fep025_probabilityCurrent_antisymm\
    \ {n : ℕ}\n    (flow : Matrix (Fin n) (Fin n) ℝ) (i j : Fin n) :\n    fep025_probabilityCurrent flow i j =\n      -fep025_probabilityCurrent\
    \ flow j i := by\n  simp only [fep025_probabilityCurrent]\n  ring\n\n/-- A probability current has no diagonal self-current.\
    \ -/\ntheorem fep025_probabilityCurrent_diag_zero {n : ℕ}\n    (flow : Matrix (Fin n) (Fin n) ℝ) (i : Fin n) :\n    fep025_probabilityCurrent\
    \ flow i i = 0 := by\n  simp [fep025_probabilityCurrent]\n\n/-- Net current leaving a state. Stationarity is zero divergence\
    \ at each state. -/\ndef fep025_divergence {n : ℕ}\n    (current : Matrix (Fin n) (Fin n) ℝ) (i : Fin n) : ℝ :=\n  ∑ j,\
    \ current i j\n\n/-- Antisymmetry conserves total probability: divergences sum to zero. -/\ntheorem fep025_total_divergence_zero\
    \ {n : ℕ}\n    (current : Matrix (Fin n) (Fin n) ℝ)\n    (hcurrent : ∀ i j, current i j = -current j i) :\n    ∑ i, fep025_divergence\
    \ current i = 0 := by\n  have hneg : (∑ i, ∑ j, current i j) = -(∑ i, ∑ j, current i j) := by\n    calc\n      (∑ i, ∑\
    \ j, current i j) = ∑ j, ∑ i, current i j :=\n        Finset.sum_comm\n      _ = ∑ j, ∑ i, -current j i := by\n      \
    \  apply Finset.sum_congr rfl\n        intro j _\n        apply Finset.sum_congr rfl\n        intro i _\n        exact\
    \ hcurrent i j\n      _ = -(∑ j, ∑ i, current j i) := by simp\n      _ = -(∑ i, ∑ j, current i j) := rfl\n  simp only\
    \ [fep025_divergence]\n  linarith\n\n/-- Current induced by a distribution and transition matrix. -/\ndef fep025_transitionCurrent\
    \ {n : ℕ}\n    (stationary : Fin n → ℝ) (transition : Matrix (Fin n) (Fin n) ℝ) :\n    Matrix (Fin n) (Fin n) ℝ :=\n \
    \ fep025_probabilityCurrent (fun i j => stationary i * transition i j)\n\n/-- Row normalization and distribution stationarity\
    \ imply zero current\ndivergence at every state. -/\ntheorem fep025_transitionCurrent_stationary {n : ℕ}\n    (stationary\
    \ : Fin n → ℝ) (transition : Matrix (Fin n) (Fin n) ℝ)\n    (hrow : ∀ i, ∑ j, transition i j = 1)\n    (hstationary :\
    \ ∀ j, ∑ i, stationary i * transition i j = stationary j)\n    (i : Fin n) :\n    fep025_divergence (fep025_transitionCurrent\
    \ stationary transition) i = 0 := by\n  simp only [fep025_divergence, fep025_transitionCurrent,\n    fep025_probabilityCurrent,\
    \ Finset.sum_sub_distrib, ← Finset.mul_sum]\n  rw [hrow i, mul_one, hstationary i, sub_self]\n\n/-- Uniform stationary\
    \ law for a directed three-state cycle. -/\nnoncomputable def fep025_cycleStationary : Fin 3 → ℝ := ![1 / 3, 1 / 3, 1\
    \ / 3]\n\n/-- Deterministic clockwise transition on three states. -/\ndef fep025_cycleTransition : Matrix (Fin 3) (Fin\
    \ 3) ℝ :=\n  !![0, 1, 0; 0, 0, 1; 1, 0, 0]\n\n/-- The probability current generated by the stationary cycle model. -/\n\
    noncomputable def fep025_cycleCurrent : Matrix (Fin 3) (Fin 3) ℝ :=\n  fep025_transitionCurrent fep025_cycleStationary\
    \ fep025_cycleTransition\n\ntheorem fep025_cycleTransition_row (i : Fin 3) :\n    ∑ j, fep025_cycleTransition i j = 1\
    \ := by\n  fin_cases i <;> norm_num [fep025_cycleTransition, Fin.sum_univ_succ]\n\ntheorem fep025_cycleStationary_invariant\
    \ (j : Fin 3) :\n    ∑ i, fep025_cycleStationary i * fep025_cycleTransition i j =\n      fep025_cycleStationary j := by\n\
    \  fin_cases j <;> norm_num [fep025_cycleStationary, fep025_cycleTransition,\n    Fin.sum_univ_succ]\n\n/-- The three-cycle\
    \ current is divergence-free at every state. -/\ntheorem fep025_cycleCurrent_stationary (i : Fin 3) :\n    fep025_divergence\
    \ fep025_cycleCurrent i = 0 := by\n  exact fep025_transitionCurrent_stationary fep025_cycleStationary\n    fep025_cycleTransition\
    \ fep025_cycleTransition_row\n    fep025_cycleStationary_invariant i\n\n/-- Stationarity does not force detailed balance:\
    \ the cycle current is nonzero. -/\ntheorem fep025_cycleCurrent_nonzero : fep025_cycleCurrent 0 1 ≠ 0 := by\n  norm_num\
    \ [fep025_cycleCurrent, fep025_transitionCurrent,\n    fep025_probabilityCurrent, fep025_cycleStationary, fep025_cycleTransition]\n\
    \nend FEP025\n"
