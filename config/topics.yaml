- id: fep-036
  title: Laplace-Smoothed Empirical Bernoulli Prior
  area: BayesianMechanics
  family: core-bayesian-mechanics
  mathlib_modules:
  - Probability.ProbabilityMassFunction.Binomial
  mathlib_status: real
  primary_theorem: fep036_smoothedRate_tendsto_of_empiricalRate
  supporting_theorems:
  - fep036_binomialModel_apply
  - fep036_smoothedRate_pos
  - fep036_smoothedRate_lt_one
  - fep036_smoothedRate_mem_Ioo
  - fep036_empiricalPrior_mem_Ioo
  - fep036_smoothedRate_mono
  - fep036_smoothedRate_eq_shrunkEmpirical
  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'A Mathlib finite binomial sampling law supplies admissible success counts; Laplace smoothing maps every outcome to
    an interior Bernoulli prior, is monotone in successes, and preserves the limit of any convergent empirical-frequency sequence.
    Assumption scope: The finite sampling law requires p in [0,1]. Interiority uses the intrinsic count bound, and consistency
    transfer explicitly assumes convergence of the raw empirical frequency. The row does not prove the binomial law of large
    numbers, a finite-sample risk bound, or marginal-likelihood hyperparameter optimality. Semantic disposition: `formalized`.

    '
  assumption_review: The finite sampling law requires p in [0,1]. Interiority uses the intrinsic count bound, and consistency
    transfer explicitly assumes convergence of the raw empirical frequency. The row does not prove the binomial law of large
    numbers, a finite-sample risk bound, or marginal-likelihood hyperparameter optimality.
  non_vacuity: Every count in Fin (n+1) is admitted by the estimator; zero successes in zero trials gives 1/2, nontrivial
    counts vary within (0,1), and the shrinkage factor tends to one while the pseudocount offset tends to zero.
  acceptance_probe: native Lean compile of fep036_binomialModel_apply, fep036_empiricalPrior_mem_Ioo, fep036_smoothedRate_mono,
    fep036_smoothedRate_eq_shrunkEmpirical, and fep036_smoothedRate_tendsto_of_empiricalRate, plus composed posterior closure.
  lean_sketch: "import Mathlib.Analysis.SpecificLimits.Basic\nimport Mathlib.Data.Nat.Cast.Field\nimport Mathlib.Probability.Distributions.Binomial\n\
    import Mathlib.Tactic\n\nnamespace FEP036\n\n/-- Laplace-smoothed empirical success rate from `successes` of `trials`.\
    \ -/\nnoncomputable def fep036_smoothedRate (successes trials : ℕ) : ℝ :=\n  ((successes + 1 : ℕ) : ℝ) / ((trials + 2\
    \ : ℕ) : ℝ)\n\n/-- Convert a bounded nonnegative parameter into Mathlib's unit interval. -/\nnoncomputable def fep036_unitInterval\n\
    \    (p : NNReal) (hp : p ≤ 1) : unitInterval :=\n  ⟨p, p.2, by exact_mod_cast hp⟩\n\n/-- Binomial sampling measure for\
    \ a cohort success count. -/\nnoncomputable def fep036_binomialModel\n    (p : NNReal) (hp : p ≤ 1) (trials : ℕ) : MeasureTheory.Measure\
    \ ℕ :=\n  ProbabilityTheory.binomial trials (fep036_unitInterval p hp)\n\n/-- Data-dependent Bernoulli prior obtained\
    \ from one admissible cohort count. -/\nnoncomputable def fep036_empiricalPrior\n    (trials : ℕ) (sample : Fin (trials\
    \ + 1)) : ℝ :=\n  fep036_smoothedRate sample trials\n\n/-- The project sampling law is exactly Mathlib's binomial measure.\
    \ -/\ntheorem fep036_binomialModel_apply (p : NNReal) (hp : p ≤ 1) (trials : ℕ)\n    (sample : ℕ) :\n    (fep036_binomialModel\
    \ p hp trials).real {sample} =\n      (trials.choose sample : ℝ) * (p : ℝ) ^ sample *\n        (1 - (p : ℝ)) ^ (trials\
    \ - sample) := by\n  simpa [fep036_binomialModel, fep036_unitInterval] using\n    ProbabilityTheory.binomial_real_singleton\
    \ trials sample\n      (fep036_unitInterval p hp)\n\n/-- Laplace smoothing makes the empirical prior parameter strictly\
    \ positive. -/\ntheorem fep036_smoothedRate_pos (successes trials : ℕ) :\n    0 < fep036_smoothedRate successes trials\
    \ := by\n  simp only [fep036_smoothedRate]\n  positivity\n\n/-- A valid success count yields a smoothed parameter strictly\
    \ below one. -/\ntheorem fep036_smoothedRate_lt_one\n    {successes trials : ℕ} (h : successes ≤ trials) :\n    fep036_smoothedRate\
    \ successes trials < 1 := by\n  have hden : (0 : ℝ) < (trials + 2 : ℕ) := by positivity\n  apply (div_lt_one hden).2\n\
    \  exact_mod_cast (show successes + 1 < trials + 2 by omega)\n\n/-- The smoothed empirical prior lies in the interior\
    \ probability interval. -/\ntheorem fep036_smoothedRate_mem_Ioo\n    {successes trials : ℕ} (h : successes ≤ trials) :\n\
    \    fep036_smoothedRate successes trials ∈ Set.Ioo (0 : ℝ) 1 :=\n  ⟨fep036_smoothedRate_pos successes trials,\n    fep036_smoothedRate_lt_one\
    \ h⟩\n\n/-- Every possible binomial cohort outcome produces an interior prior. -/\ntheorem fep036_empiricalPrior_mem_Ioo\n\
    \    (trials : ℕ) (sample : Fin (trials + 1)) :\n    fep036_empiricalPrior trials sample ∈ Set.Ioo (0 : ℝ) 1 := by\n \
    \ apply fep036_smoothedRate_mem_Ioo\n  exact Nat.le_of_lt_succ sample.isLt\n\n/-- At fixed trial count, the smoothed empirical\
    \ rate is monotone in successes. -/\ntheorem fep036_smoothedRate_mono\n    {s₁ s₂ trials : ℕ} (h : s₁ ≤ s₂) :\n    fep036_smoothedRate\
    \ s₁ trials ≤ fep036_smoothedRate s₂ trials := by\n  simp only [fep036_smoothedRate]\n  gcongr\n\n/-- Laplace smoothing\
    \ is the raw empirical rate multiplied by a shrinkage\nfactor, plus a vanishing pseudocount offset. -/\ntheorem fep036_smoothedRate_eq_shrunkEmpirical\n\
    \    {successes trials : ℕ} (htrials : 0 < trials) :\n    fep036_smoothedRate successes trials =\n      ((successes :\
    \ ℝ) / trials) * ((trials : ℝ) / (trials + 2)) +\n        1 / ((trials : ℝ) + 2) := by\n  have hn : (trials : ℝ) ≠ 0 :=\n\
    \    Nat.cast_ne_zero.mpr (Nat.ne_of_gt htrials)\n  simp only [fep036_smoothedRate, Nat.cast_add, Nat.cast_one, Nat.cast_ofNat]\n\
    \  field_simp [hn]\n\n/-- Any consistent empirical-frequency sequence remains consistent after\nLaplace smoothing.  The\
    \ sampling-law convergence premise is explicit. -/\ntheorem fep036_smoothedRate_tendsto_of_empiricalRate\n    (successes\
    \ : ℕ → ℕ) (p : ℝ)\n    (hraw : Filter.Tendsto (fun n : ℕ => (successes n : ℝ) / n)\n      Filter.atTop (nhds p)) :\n\
    \    Filter.Tendsto (fun n : ℕ => fep036_smoothedRate (successes n) n)\n      Filter.atTop (nhds p) := by\n  have hshrink\
    \ : Filter.Tendsto (fun n : ℕ => (n : ℝ) / (n + 2))\n      Filter.atTop (nhds 1) :=\n    tendsto_natCast_div_add_atTop\
    \ (2 : ℝ)\n  have hoffset : Filter.Tendsto (fun n : ℕ => (1 : ℝ) / ((n : ℝ) + 2))\n      Filter.atTop (nhds 0) := by\n\
    \    simpa [add_comm, div_eq_mul_inv] using\n      (tendsto_add_mul_div_add_mul_atTop_nhds\n        (1 : ℝ) 2 0 (d :=\
    \ 1) one_ne_zero)\n  have hcombined := (hraw.mul hshrink).add hoffset\n  have hcombined' : Filter.Tendsto\n      (fun\
    \ n : ℕ => ((successes n : ℝ) / n) * ((n : ℝ) / (n + 2)) +\n        1 / ((n : ℝ) + 2)) Filter.atTop (nhds p) := by\n \
    \   simpa using hcombined\n  refine hcombined'.congr' ?_\n  filter_upwards [Filter.eventually_atTop.2 ⟨1, fun _ hn =>\
    \ hn⟩] with n hn\n  exact\n    (fep036_smoothedRate_eq_shrunkEmpirical (Nat.zero_lt_of_lt hn)).symm\n\nend FEP036\n"
