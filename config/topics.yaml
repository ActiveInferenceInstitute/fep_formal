  nl: 'Increasing nonnegative precision cannot decrease a fixed scalar prediction-error energy, and scaling precision scales
    its exact gradient by the same factor. Assumption scope: Energy monotonicity assumes a nonnegative lower precision and
    an ordered upper precision. Gradient scaling is algebraic for arbitrary real scale, including negative values, but only
    nonnegative precision retains an energy weighting interpretation. Semantic disposition: `formalized`.

    '
  assumption_review: Energy monotonicity assumes a nonnegative lower precision and an ordered upper precision. Gradient scaling
    is algebraic for arbitrary real scale, including negative values, but only nonnegative precision retains an energy weighting
    interpretation.
  non_vacuity: Doubling precision from one to two at a unit prediction error exactly doubles the energy and makes the inequality
    strict.
