  boundary_theorems: []
  semantic_disposition: formalized
  nl: 'Finite Bayesian-mixture evidence dominates every nonnegative component contribution, so mixture log loss is at most
    selected-component log loss plus its exact negative-log-prior penalty. Assumption scope: Hypotheses are finite, all component
    likelihood weights are nonnegative, and the selected prior and likelihood weights are strictly positive before logarithms
    are compared. No sequential regret sum, stochastic calibration, or asymptotic optimality is claimed. Semantic disposition:
    `formalized`.

    '
  assumption_review: Hypotheses are finite, all component likelihood weights are nonnegative, and the selected prior and likelihood
    weights are strictly positive before logarithms are compared. No sequential regret sum, stochastic calibration, or asymptotic
    optimality is claimed.
  non_vacuity: A positive selected component contributes strictly to mixture evidence, and a prior below one produces a positive
    finite complexity penalty rather than a vacuous zero term.
  acceptance_probe: native Lean compile of fep119_mixtureLogLoss_regret and fep119_mixtureEvidence_lower_bound with selected-component
    support.
  lean_sketch: "import FepSketches.learning_theory\n\n/-! # Bayesian-Mixture Log-Loss Regret Bound -/\nnamespace FEP119\n\n\
    open FEP\n\nvariable {Hypothesis : Type*} [Fintype Hypothesis]\n\n/-- Mixture evidence dominates every nonnegative component\
    \ contribution. -/\ntheorem fep119_mixtureEvidence_lower_bound\n    (prior : FiniteLaw Hypothesis) (likelihood : Hypothesis\
    \ → ℝ)\n    (likelihoodNonnegative : ∀ hypothesis, 0 ≤ likelihood hypothesis)\n    (selected : Hypothesis) :\n    prior\
    \ selected * likelihood selected ≤\n      FEP.LearningTheory.mixtureEvidence prior likelihood :=\n  FEP.LearningTheory.mixtureEvidence_lower_bound\n\
    \    prior likelihood likelihoodNonnegative selected\n\n/-- The selected model pays at most its own log loss plus the\
    \ exact finite\nprior penalty. -/\ntheorem fep119_mixtureLogLoss_regret\n    (prior : FiniteLaw Hypothesis) (likelihood\
    \ : Hypothesis → ℝ)\n    (likelihoodNonnegative : ∀ hypothesis, 0 ≤ likelihood hypothesis)\n    (selected : Hypothesis)\n\
    \    (priorPositive : 0 < prior selected)\n    (likelihoodPositive : 0 < likelihood selected) :\n    -Real.log (FEP.LearningTheory.mixtureEvidence\
    \ prior likelihood) ≤\n      -Real.log (likelihood selected) - Real.log (prior selected) :=\n  FEP.LearningTheory.mixtureLogLoss_regret\n\
    \    prior likelihood likelihoodNonnegative selected\n    priorPositive likelihoodPositive\n\nend FEP119\n"
