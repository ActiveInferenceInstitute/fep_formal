    &(\tau{} : \mathsf{Kernel}\,\Omega{}\,\Omega{})\,(\kappa{} : \mathsf{Kernel}\,\Omega{}\,\mathcal{X})\,(\mu{} : \mathsf{Measure}
    \Omega{})\,[\mathsf{StandardBorelSpace}\,\Omega{}] \\

    &[\mathsf{Nonempty}\,\Omega{}]\,[\mathsf{IsFiniteMeasure}\,\mu{}]\,[\mathsf{IsFiniteKernel}\,\tau{}]\,[\mathsf{IsFiniteKernel}\,\kappa{}]\,(x
    : \mathcal{X}) \\

    &\mathsf{fep034\_filter}\,\tau{}\,\kappa{}\,\mu{}\,x\,\Omega = 1

