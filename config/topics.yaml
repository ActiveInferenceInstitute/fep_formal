    &(\mathsf{likelihoodGoodPositive} : 0 < \mathsf{likelihoodGood}) \\

    &(\mathsf{likelihoodBadNonnegative} : 0 \le \mathsf{likelihoodBad}) \\

    &(\mathsf{likelihoodGapNonnegative} : 0 \le \mathsf{likelihoodGap})\,(\mathsf{gapBound} : \mathsf{likelihoodBad} \\

    &\le \mathsf{Real.exp}\,(-\mathsf{likelihoodGap}) \cdot \mathsf{likelihoodGood}) \\

