    fixed consensus operator. Strictness requires explicit separation; the theorem does not cover a general coupled free-energy
    functional or nonlinear multiagent dynamics.
  non_vacuity: Any state at which the two laws assign unequal mass has positive initial potential and a strictly smaller positive
    quarter-potential after one update.
  acceptance_probe: native Lean compile of fep113_coupledPotential_strict_descent and fep113_coupledPotential_contracts with
    the separated-atom premise.
  lean_sketch: "import FepSketches.collective_inference\n\n/-! # Coupled-Agent Potential Descent -/\nnamespace FEP113\n\n\
    open FEP\n\nvariable {State : Type*} [Fintype State]\n\n/-- The specified consensus coupling quarters the atomwise quadratic\n\
    disagreement potential. -/\ntheorem fep113_coupledPotential_contracts\n    (left right : FiniteLaw State) (state : State)\
    \ :\n    FEP.CollectiveInference.coupledPotential\n        (FEP.CollectiveInference.consensusLeft left right)\n      \
    \  (FEP.CollectiveInference.consensusRight left right) state =\n      (1 / 4 : ℝ) *\n        FEP.CollectiveInference.coupledPotential\
    \ left right state :=\n  FEP.CollectiveInference.coupledPotential_contracts left right state\n\n/-- Nonzero disagreement\
    \ makes the potential descent strict. -/\ntheorem fep113_coupledPotential_strict_descent\n    (left right : FiniteLaw\
    \ State) (state : State)\n    (separated : left state ≠ right state) :\n    FEP.CollectiveInference.coupledPotential\n\
    \        (FEP.CollectiveInference.consensusLeft left right)\n        (FEP.CollectiveInference.consensusRight left right)\
    \ state <\n      FEP.CollectiveInference.coupledPotential left right state :=\n  FEP.CollectiveInference.coupledPotential_strict_descent\n\
    \    left right state separated\n\nend FEP113\n"
