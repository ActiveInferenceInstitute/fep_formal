    \ :=\n  Finset.sum_le_sum fun i _ => h i\n\n/-- Zero local FE everywhere → zero global FE. -/\ntheorem fep039_global_zero\
    \ : fep039_global_fe (fun _ => 0) = 0 := by\n  simp [fep039_global_fe]\n\n/-- Global FE additive in pointwise sums. -/\n\
