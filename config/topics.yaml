    \ (hS : HasDerivAt S S' T)\n    (hfirstLaw : U' = T * S') :\n    HasDerivAt (fun t => fep013_helmholtz (U t) t (S t))\
    \ (-S T) T := by\n  convert fep013_helmholtz_hasDerivAt hU hS using 1\n  rw [hfirstLaw]\n  ring\n\nend FEP013\n"
