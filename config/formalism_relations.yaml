      - fep_fep134.FEP134.fep134_feedback_continuation_changes
  - id: cap-collective-consensus-invariants
    title: Finite collective inference and consensus invariants
    description: Explicit finite product-agent laws prove joint normalization, VFE and EFE additivity under independence, normalized unit-weight product-of-experts pooling, consensus-mass conservation, strict stochastic contraction and convergence with a nonzero Boolean witness, and descent of a coupled quadratic potential. No theorem attributes emergent agency or consciousness to the collective.
    status: satisfied
    evidence:
