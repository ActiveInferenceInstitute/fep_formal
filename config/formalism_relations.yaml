schema_version: 2

# Maintained scientific relations. Shared Mathlib imports are generated
# separately and must never be promoted into these edges automatically.
# `formal` records a derivation or identification. `formal_pairing` records a
# checked theorem containing both endpoint laws without asserting implication.
capabilities:
  - id: cap-active-inference-generative-model
    title: Policy-conditioned active-inference model
    description: One normalized finite carrier owns policy-conditioned state prediction, outcome generation, exact posterior state, preferences, pragmatic cost, epistemic value, and expected free energy.
    status: satisfied
    evidence:
      - FEP.ActiveInference.expectedFreeEnergy_eq_risk_add_ambiguity
      - FEP.ActiveInference.posteriorState_mul_evidence
      - FEP.ActiveInference.predictedJoint_fstMarginal_mass
  - id: cap-causal-intervention-invariants
    title: Finite causal-blanket and intervention invariants
    description: Finite normalized carriers prove blanket factorization equivalent to zero conditional mutual information, intervention-kernel normalization, non-descendant invariance in the stated four-node model, a correlated non-factorizing witness, and an explicit zero-evidence boundary. These results do not assert a measure-theoretic do-calculus or causal identification beyond the encoded finite graph.
    status: satisfied
    evidence:
      - FEP.CausalDynamics.conditionalMutualInformation_eq_zero_iff_factorizes
      - FEP.CausalDynamics.interventionKernel_sum_one
      - FEP.CausalDynamics.localMarkov_zeroEvidence_boundary
      - FEP.CausalDynamics.nonDescendant_intervention_invariant
      - fep_fep081.FEP081.fep081_correlatedBlanket_nonvacuity
      - fep_fep083.FEP083.fep083_fourNode_descendantChange_nonDescendantPreservation
      - fep_fep085.FEP085.fep085_zeroEvidence_boundary
  - id: cap-closed-loop-policy-trees
    title: Finite closed-loop policy trees
    description: Depth-indexed finite policy trees admit exact observation-contingent value recursion, backward-induction minima, attaining optimal trees, value-preserving open-loop embeddings, and a full-support recursive EFE decomposition. A two-stage Boolean witness has observation-dependent continuation actions, value zero, and a strict one-half advantage over every fixed continuation; no infinite-horizon or continuous-belief optimality is claimed.
    status: satisfied
    evidence:
      - FEP.PolicyTrees.boolFeedbackTree_strictlyBetter
      - FEP.PolicyTrees.exists_optimalPolicyTree
      - FEP.PolicyTrees.openLoopEmbedding_value
      - FEP.PolicyTrees.optimalTree_le_openLoop
