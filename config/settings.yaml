# Runtime configuration for the standalone fep_lean verifier.

project:
  name: fep_lean
  version: "1.2.0"
  description: "FEP / Active Inference / Bayesian Mechanics Lean4 catalogue"

gauss:
  home: ~/.gauss
  # default_model is a pin_audit requirement, not a runtime default: it must
  # equal hermes.model or `docs/pin_audit.py` fails the audit.
  default_model: "moonshotai/kimi-k2.6"
  # Dead keys removed 2026-09-21 (unread by any code or test): gauss.source,
  # gauss.verify_lean, gauss.log_level, output.report_dir.

output:
  root: output

hermes:
  enabled: true
  model: "moonshotai/kimi-k2.6"
  fallback_models:
    - "moonshotai/kimi-k2-thinking"
    - "poolside/laguna-s-2.1:free"
    - "cohere/north-mini-code:free"
    - "z-ai/glm-5.2:free"
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "openrouter/free"
  max_tokens: 16384
  timeout_s: 150
  reasoning_max_tokens: 65536
  reasoning_timeout_s: 300
  cache_ttl_hours: 24
