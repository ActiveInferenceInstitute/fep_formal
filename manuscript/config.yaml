# FEP Lean Project Configuration
# Free Energy Principle / Active Inference / Bayesian Mechanics — Lean4 Formalization
# Static metadata for the local manuscript renderer. Runtime numbers live in
# manuscript_vars.yaml and are generated by output.manuscript.

paper:

  title: "Towards Lean 4 Formalization of the Free Energy Principle"
  subtitle: "AI-Driven Theorem Sketching and Verification for Active Inference and Bayesian Mechanics"
  version: "1.6.0"
  date: "2026-10-07"
  # The template's title-page cover slot points at the published graphical
  # abstract, so the cover page and the Graphical Abstract section carry one
  # artifact. The alt text is a literal: a config token would reach the cover
  # verbatim.
  cover:

    image: "output/figures/graphical-abstract.png"
    alt: >-
      Graphical abstract: maintained GNN-typed authoring inputs join into a
      168-topic, 22-family catalog, compile under pinned Lean 4 and Mathlib
      into a source-digest-bound claim-ready native evidence receipt, and feed
      a fail-closed manuscript projection; a dashed optional full mode adds
      Hermes and OpenGauss evidence behind its own validated receipt.

# The canonical cover author is projected from CITATION.cff during rendering.

publication:

  # Manuscript version DOI, reserved in its existing scholarly concept.
  doi: "10.5281/zenodo.23220027"
  journal: "Active Inference Journal"
  volume: ""
  pages: ""
  graphical_abstract:

    path: "manuscript/assets/graphical-abstract.png"
    media_type: "image/png"
    width_px: 1536
    height_px: 1024
    sha256: "68b7819e8c799348b9d958cee41c5c4fdb5b716690749e0e586ef0e90086a904"
    alt_text: >-
      Graphical abstract: the fep_lean verification pipeline. Maintained
      GNN-typed authoring inputs join by stable topic ID into a 168-topic,
      22-family catalog with reviewed semantic dispositions; a pinned Lean 4
      and Mathlib compile of FepSketches with zero warnings and zero sorry
      binds a source-digest-bound, claim-ready native evidence receipt; a
      dashed optional full mode adds Hermes and OpenGauss evidence behind its
      own independently validated receipt; a fail-closed manuscript projection
      consumes both. A green build proves a sketch compiles and never promotes
      a reviewed semantic disposition.

keywords:

  - "free energy principle"
  - "active inference"
  - "bayesian mechanics"
  - "lean 4"
  - "formal verification"
  - "theorem proving"
  - "mathlib4"
  - "reproducible research"
  - "interactive theorem proving"
  - "variational inference"
  - "information geometry"
  - "LLM-ITP integration"
  - "execution-integrity pipeline"
  - "continuous-time Markov chains"
  - "measure theory formalization"

metadata:

  license: "CC-BY-4.0"
  language: "en"
  documentclass: "extarticle"
  fontsize: "9pt"

# The publication is the combined manuscript; slide decks are optional derivatives.
render:

  formats:

    pdf: true
    slides: false
