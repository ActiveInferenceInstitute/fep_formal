<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1226" viewBox="0 0 1600 1226" role="img" aria-labelledby="atlas-title atlas-description">
<title id="atlas-title">Formalism composition atlas summary</title>
<desc id="atlas-description">Five broad areas summarize canonical topic families and semantic dispositions. Authored relation counts are reported separately from formal-module code dependencies. Counts describe canonical source coverage. Compilation evidence and full external-run evidence are separate receipt contracts. Deterministic numerical witnesses are explanatory non-proof evidence. They can expose finite sign, normalization, support, rank, identity, and contraction errors; they are neither Lean proof receipts nor empirical validation of the Free Energy Principle.</desc>
