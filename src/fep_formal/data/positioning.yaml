      exact-label singular geometry, bounded prior density and message memory differ from
      noisy Gaussian filtering or unrestricted recognition maps.
  - id: openai-math-221-diluted-pressure-limit
    title: The Mézard–Parisi formula for diluted spin glasses
    source_url: https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/The-Mezard-Parisi-formula-for-diluted-spin-glasses-September-23-2026/build/sections/model.tex
    source_path: preprints/The-Mezard-Parisi-formula-for-diluted-spin-glasses-September-23-2026/build/sections/model.tex
    source_sha256: 8794914e5e7dbe802de6ee006c5e398bdae2790be27898054e5ac4c20ec18487
    status: reviewed_source_statement_uncompiled
    statement: 'Diluted pressure limit: for fixed even arity p>=2 and alpha>0 in the stated
      independent Poisson-diluted Ising model, first-moment integrability and Panchenko-Talagrand
      factorization/positivity imply lim_N N^-1 E log Z_N = inf_{r>=0} Phi_r over finite hierarchy
      depths and trial laws.'
    carriers:
    - Finite Ising spin configurations
