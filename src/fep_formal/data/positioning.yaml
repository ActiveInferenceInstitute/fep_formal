      Density smoothness and strictly positive Hessian curvature are not premises. The upstream
      catalogue review is unchecked; no solution compilation or Comparator execution was performed
      here.
    rationale: Relates native entropy and Dirichlet energy to transport distance; an FEP descent
      statement needs a matching diffusion generator, density ratio, support convention and
      functional-inequality constant before borrowing this route.
  - id: openai-math-140-gaussian-replica-block
    title: Posterior replicas and conditional information in Gaussian regression
    source_url: https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/Posterior-replicas-and-conditional-information-in-Gaussian-regression-September-27-2026/build/sections/00-introduction.tex
    source_path: preprints/Posterior-replicas-and-conditional-information-in-Gaussian-regression-September-27-2026/build/sections/00-introduction.tex
    source_sha256: b892d5e4eb9498a44f3838c5dff684c91b9c5f509d26c4ac70959bbbe5c57d5d
    status: reviewed_source_statement_uncompiled
    statement: 'Gaussian replica block bound: for large d, k=m=2 floor(d/16), t=m+1 and ell=4k,
      a spherical prior p=f sigma_d with 0<=f<=L and a finite message W from k exact Gaussian
      labels satisfies I(S;W|B,BS)<=H(W)/t+C d+C log(2+log L), for an independent ell-row
      Gaussian matrix B.'
    carriers:
    - Unit sphere in R^d
    - Bounded Borel prior density relative to uniform surface law
    - Exact linear observations and finite message kernels
    hypotheses:
    - Large d and probability density 0<=f<=L<infinity
    - Independent standard Gaussian A and B
    - W drawn from a measurable data kernel, conditionally independent of S given (A,AS)
