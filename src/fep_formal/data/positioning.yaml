    title: A dimension-free logarithmic Sobolev inequality for subgaussian log-concave measures
    source_url: https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/A-dimension-free-logarithmic-Sobolev-inequality-for-subgaussian-log-concave-measures-September-23-2026/build/sections/01-introduction.tex
    source_path: preprints/A-dimension-free-logarithmic-Sobolev-inequality-for-subgaussian-log-concave-measures-September-23-2026/build/sections/01-introduction.tex
    source_sha256: 6b737533c3be85eed78ccee2cc3503eb812ac746cac2a55147cb5d4f0b4324f4
    status: reviewed_source_statement_uncompiled
    statement: 'Dimension-free LSI: for every centered log-concave probability density on
      R^n, n>=1, whose every unit linear marginal satisfies E exp(<X,theta>^2/a^2)<=2, an
      absolute C gives Ent_mu(f^2)<=C a^2 integral|Df|^2 dmu for all compactly supported smooth
      f.'
    carriers:
    - Euclidean R^n
    - Lebesgue-density probability law
    - Smooth compactly supported real test functions
    hypotheses:
    - n>=1; a>0
    - Centered log-concave density
    - Uniform linear subgaussian exponential-moment bound
    features:
    - domain:analysis
