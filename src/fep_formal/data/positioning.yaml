  - id: carrier:finite-discrete
    axis_kind: carrier
    definition: A selected law, chain, message, policy or map has a finite discrete carrier;
      this is not inferred from finite storage of a continuous object.
  - id: carrier:finite-dimensional-real
    axis_kind: carrier
    definition: The selected statement uses actual real scalar/vector/matrix data. This coordinate
      alone does not imply a smooth manifold or identifiable parameters.
  - id: carrier:general-measurable
    axis_kind: carrier
    definition: Native sigma-algebras, measures, kernels or Borel laws are explicit objects
      in the selected contract, possibly together with finite carriers.
  - id: carrier:euclidean-space
    axis_kind: carrier
    definition: An ambient Euclidean geometric carrier is explicitly used in the selected
      result, beyond real-valued scalar arithmetic.
  - id: carrier:function-space
    axis_kind: carrier
    definition: The selected result quantifies over functions, trial laws, controls, or an
      infinite-dimensional normed carrier; no common Banach structure is implied.
  - id: carrier:metric-space
    axis_kind: carrier
    definition: A declared metric/norm topology is part of the selected contract, with its
      own distance; this is not the MDS feature-space metric.
  - id: carrier:graph
    axis_kind: carrier
    definition: A finite graph, node/edge carrier or graph-realization state is explicit;
      graphical conditional independence alone is insufficient.
  - id: carrier:path-space
    axis_kind: carrier
    definition: Path laws, time-indexed protocols or progressively measurable controls are
      explicit; this does not identify a common physical path carrier.
  - id: hypothesis:normalization
    axis_kind: hypothesis
    definition: A normalized law/kernel or a normalization condition/conclusion is explicit
      in the selected statement. It is not asserted to be a premise of every family theorem.
  - id: hypothesis:full-support
    axis_kind: hypothesis
    definition: Strictly positive mass/density on the stated whole law carrier is explicit.
      Local selected support and positive evidence at one event do not suffice.
  - id: hypothesis:regularity
    axis_kind: hypothesis
    definition: An explicit measurable, continuous, differentiable, completeness or analytic
      parameter regularity condition occurs; those distinct notions are not interchangeable.
  - id: hypothesis:convexity
    axis_kind: hypothesis
    definition: Convex body, log-concavity or convex-potential curvature is explicit in the
      selected contract; no shared uniform convexity hypothesis is inferred.
  - id: hypothesis:compactness
    axis_kind: hypothesis
    definition: A compact carrier/feasible set or its compactness-based attainment argument
      is explicit. Finite-dimensionality alone does not suffice.
  - id: hypothesis:independence
    axis_kind: hypothesis
    definition: Independence, product-law structure or reversible conditional-factorization
      inputs occur explicitly. This does not identify empirical or causal independence.
  - id: hypothesis:finite-horizon
    axis_kind: hypothesis
    definition: A fixed finite time/horizon or finite-time bound is part of the selected contract.
      It does not assert an infinite-horizon or stopping-time result.
  - id: hypothesis:asymptotic-limit
    axis_kind: hypothesis
    definition: A convergence or dimension/system-size limit is a stated target or regime.
      Despite this coordinate group name it is not a logical hypothesis by itself.
