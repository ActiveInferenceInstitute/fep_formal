[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fep_lean"
version = "1.2.0"
description = "FEP Lean4 catalogue, OpenGauss-oriented session model, manuscript artifacts"
readme = "README.md"
authors = [
    { name = "Daniel Ari Friedman", email = "daniel@activeinference.institute" },
]
license = "CC-BY-4.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.5.0",
    "pytest-httpserver>=1.0.8",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.15.0",
]

[project.scripts]
fep-lean = "fep_lean.cli:main"

[project.urls]
Repository = "https://github.com/ActiveInferenceInstitute/fep_lean"
Changelog = "https://github.com/ActiveInferenceInstitute/fep_lean/blob/main/CHANGELOG.md"
"Concept DOI" = "https://doi.org/10.5281/zenodo.19699233"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fep_lean*"]

[tool.setuptools.package-data]
fep_lean = ["data/*.yaml", "formal/*.lean", "formal/compositions/*.lean"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "serial_lean: Lean/lake workspace tests; do not run in parallel with other lean-heavy files (see tests/AGENTS.md)",
]
timeout = 900
timeout_method = "thread"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::pytest.PytestWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
# Figure generation uses ProcessPoolExecutor (spawn); trace worker processes.
# Branch coverage: see docs/coverage-branch.md.
concurrency = ["multiprocessing"]

[tool.coverage.report]
# Line coverage ~91%; combined line+branch ~89.6% with current Hermes/network branches.
fail_under = 89

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff.lint]
# Pinned rule set — keeps the gate stable across ruff versions. Extend
# deliberately: every rule added here must pass clean on the full surface
# (src, tests, scripts, docs).
extend-select = [
    "F",     # pyflakes (incl. F401/F811 fixed in the 2026-08-18 pass)
    "I",     # isort (import sorting; I001 fixed 2026-08-18)
    "UP",    # pyupgrade (incl. UP035/UP037 fixed 2026-08-18)
    "SIM",   # flake8-simplify (incl. SIM105/SIM201 fixed 2026-08-18)
]
ignore = [
    "RUF001",  # Ambiguous unicode chars in strings — intentional Lean math notation
    "RUF003",  # Ambiguous unicode chars in comments — same as RUF001
    "BLE001",  # Blind-except — intentional fail-closed design: pipeline stages,
               # environment checks, and Hermes error handling must survive any
               # exception to produce a structured result rather than crash.
    "EXE001",  # Shebang-not-executable — scripts are imported, not directly execed.
]
