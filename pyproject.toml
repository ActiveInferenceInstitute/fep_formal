[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = "==0.13.0"

[project]
name = "fep-formal"
version = "2.1.0"
description = "FEP Lean4 catalog, OpenGauss-oriented session model, manuscript artifacts"
readme = "README.md"
authors = [
    { name = "Daniel Ari Friedman", email = "daniel@activeinference.institute" },
]
license = "CC-BY-4.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "defusedxml>=0.7.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.5.0",
    "pytest-httpserver>=1.0.8",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.15.0",
]

[project.scripts]
fep-formal = "fep_formal.cli:main"
fep-lean = "fep_formal.cli:legacy_main"

[project.urls]
Repository = "https://github.com/ActiveInferenceInstitute/fep_formal"
Changelog = "https://github.com/ActiveInferenceInstitute/fep_formal/blob/main/CHANGELOG.md"
"Concept DOI" = "https://doi.org/10.5281/zenodo.19699233"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fep_formal*", "fep_lean"]

[tool.setuptools.package-data]
fep_formal = ["data/*.yaml", "formal/*.lean", "formal/compositions/*.lean"]
fep_lean = ["**/*.pyi", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "serial_lean: Lean/lake workspace tests; do not run in parallel with other lean-heavy files (see tests/AGENTS.md)",
]
timeout = 900
timeout_method = "thread"

[tool.coverage.run]
source = ["src"]
# Figure generation uses matplotlib (Agg backend); trace worker processes.
# Branch coverage: see docs/coverage-branch.md.
concurrency = ["multiprocessing"]

[tool.coverage.report]
# Aggregate line coverage only; branch arcs are not enabled or gated here.
# docs/coverage-floors.json owns additional measured package line floors.
fail_under = 89

[tool.mypy]
# Evidence validation uses .python-version; wheel runtime compatibility remains
# covered separately by the declared Python 3.10+ distribution matrix.
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff]
# Preserve the package's syntax floor while typing the validator at Python 3.14.
target-version = "py310"
# specs/AGENTS.md owns these historical records and generated/pinned inputs.
# Lint every other active spec; never rewrite retained evidence to satisfy lint.
extend-exclude = [
    "specs/done/**",
    "specs/**/evidence/**",
    "specs/**/gnn_output*/**",
    "specs/**/gnn-input/**",
    "specs/**/fixtures/**",
]

[tool.ruff.lint]
# Keep the locked Ruff defaults and existing extensions. Qualification binds
# the effective rules to uv.lock; every active Python owner is in lint scope.
extend-select = [
    "F",     # pyflakes (incl. F401/F811 fixed in the 2026-08-18 pass)
    "I",     # isort (import sorting; I001 fixed 2026-08-18)
    "UP",    # pyupgrade (incl. UP035/UP037 fixed 2026-08-18)
    "SIM",   # flake8-simplify (incl. SIM105/SIM201 fixed 2026-08-18)
    "PLR0915", # statement complexity; source-line spans have a separate ratchet
]
ignore = [
    "RUF001",  # Ambiguous unicode chars in strings — intentional Lean math notation
    "RUF003",  # Ambiguous unicode chars in comments — same as RUF001
    "BLE001",  # Blind-except — intentional fail-closed design: pipeline stages,
               # environment checks, and Hermes error handling must survive any
               # exception to produce a structured result rather than crash.
    "EXE001",  # Shebang-not-executable — scripts are imported, not directly execed.
]

# A statement is not a source line. Keep a 100-statement ceiling for active
# Python and separately enforce the issue's 200-line limit in the seven
# refactored owners. Existing exceptions below are bounded by function name
# and statement count in test_check_inventory.py; new or larger exceptions fail.
[tool.ruff.lint.pylint]
max-statements = 100

[tool.ruff.lint.per-file-ignores]
"specs/h3-reference-study/bundle_study.py" = ["PLR0915"]
"specs/h3-reference-study/export_native.py" = ["PLR0915"]
"src/fep_formal/catalogue/latex.py" = ["PLR0915"]
"src/fep_formal/output/evidence.py" = ["PLR0915"]
"src/fep_formal/output/release_bundle/_acceptance.py" = ["PLR0915"]
"src/fep_formal/output/release_bundle/_identity.py" = ["PLR0915"]
"src/fep_formal/output/reporter.py" = ["PLR0915"]
"src/fep_formal/verification/_subprocess.py" = ["PLR0915"]
"src/fep_formal/verification/formalism_audit.py" = ["PLR0915"]
"tests/test_distribution.py" = ["PLR0915"]
"tests/test_distribution_supplemental.py" = ["PLR0915"]
"tests/test_h3_reference_study.py" = ["PLR0915"]
"tests/test_h3_study_bundle.py" = ["PLR0915"]
