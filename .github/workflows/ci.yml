name: fep_lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_lean_cache:
        description: 'Skip restoring/saving the Lean build cache for a forced cold run'
        required: false
        type: boolean
        default: true
      run_lean:
        description: 'Skip the lean lane for fast iteration (render is skipped with it)'
        required: false
        type: boolean
        default: true
      run_render:
        description: 'Skip the end-to-end render lane (lean receipt prerequisite still applies when lean runs)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # Concurrency-group tradeoff: the group is workflow+ref, so a push to a PR
  # branch cancels the superseded PR run (saving runner minutes; a cancelled
  # near-complete lean run loses its minutes) while main runs never cancel,
  # protecting landing evidence.
  #
  # The dispatch inputs only toggle the lean and render lanes. The python and
  # render-deps jobs are the custody-gate carriers and are NOT toggleable:
  # every dispatch run still executes pin_audit --check-latest,
  # check_orphan_compiles, theorem_ref_audit, xref_audit, the frozen-custody
  # bridge checks, catalogue regeneration checks, mypy/ruff -- a cache hit
  # can never skip a custody gate, fail-closed.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - id: classify
        name: Classify documentation-only pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --no-project --python 3.14 python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          docs_only = False
          if os.environ["EVENT_NAME"] == "pull_request":
              base = os.environ["BASE_SHA"]
              if not re.fullmatch(r"[0-9a-f]{40}", base):
                  raise SystemExit("invalid pull-request base SHA")
              changed = subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "-z", base, "HEAD"]
              ).decode().split("\0")
              paths = [PurePosixPath(name) for name in changed if name]
              # An allowlist: publication inputs, generated scientific records,
              # receipts, fonts, workflows and unknown paths take the full gates.
              docs_only = bool(paths) and all(
                  path.suffix == ".md"
                  and (len(path.parts) == 1 or path.parts[0] == "docs")
                  and path.name not in {
                      "formalism-coverage.md", "theorem-maturity-audit.md",
                      "lean-landscape.md",
                  }
                  for path in paths
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"docs_only={str(docs_only).lower()}\n")
          print(f"documentation-only pull request: {docs_only}")
          PY

  documentation:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Materialize the generated manuscript inputs
        run: uv run fep-lean catalogue
      - name: Check documentation and committed publication evidence
        run: |
          uv run python scripts/_maint_build_topics_catalogue.py --check
          uv run python scripts/_maint_build_fep_all_lean.py --check
          uv run python scripts/_maint_build_formal_modules.py --check
          uv run python scripts/theorem_maturity_audit.py --check
          uv run python scripts/build_formalism_coverage.py --check
          uv run python scripts/_maint_build_lean_landscape.py --check
          uv run python scripts/build_formalism_atlas.py --check
          uv run python scripts/build_formal_kernel_dashboard.py --check
          uv run python scripts/build_render_fonts.py --check
          uv run python scripts/check_render_log.py --verify-receipt
          uv run python docs/theorem_ref_audit.py
          uv run python docs/citation_audit.py
          uv run python docs/check_links.py --strict --include-root
          uv run python docs/md_hygiene.py --strict
          uv run python docs/xref_audit.py
          git diff --check

  distribution:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # The harness remains a 3.14 validator. Only the fresh wheel environment
      # exercises the packaging floor; no Lean/provider evidence is claimed.
      - run: uv sync --locked --extra dev --python 3.14
      - run: uv python install ${{ matrix.python }}
      - name: Exercise the installed wheel outside the checkout
        env:
          FEP_DISTRIBUTION_PYTHON: ${{ matrix.python }}
        run: uv run --locked python -m pytest tests/test_distribution.py -q -s --no-cov

  python:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv lock --check && uv pip check
      - name: Check generated catalogue and formalism projections
        run: |
          uv run python scripts/_maint_build_topics_catalogue.py --check
          uv run python scripts/_maint_build_fep_all_lean.py --check
          uv run python scripts/_maint_build_formal_modules.py --check
          uv run python scripts/theorem_maturity_audit.py --check
          uv run python scripts/build_formalism_coverage.py --check
          uv run python scripts/_maint_build_lean_landscape.py --check
          uv run python scripts/build_formalism_atlas.py --check
          uv run python scripts/build_formal_kernel_dashboard.py --check
      # The frozen-custody bridge gates from AGENTS.md's required checks:
      # both are --check validation of committed artifacts and pass on a
      # fresh checkout without any sibling repo.
      - name: Check the frozen-custody bridge gates
        run: |
          uv run python specs/gnn-bridge-q5-artifact-proof/generate_probe.py --check
          uv run python specs/geo-infer-notation-bridge/check_geo_notation_bridge.py --check
      - name: Generate and validate publication inputs
        run: |
          uv run fep-lean catalogue
          # The glyph projection reads the generated appendix
          # (manuscript/09z_unified_formalism_catalogue.md, a gitignored build
          # product), so this check is only decidable after the catalogue has
          # materialized the manuscript inputs; earlier placement reported a
          # false STALE on every fresh checkout.
          uv run python scripts/build_render_fonts.py --check
          uv run python docs/theorem_ref_audit.py
          uv run python docs/citation_audit.py
      # The two atlas/dashboard PNGs the manuscript cites live under the
      # gitignored output/ tree, so a fresh checkout has none: `--check` alone
      # would fail on every run ("not produced from ..."). The write pass
      # rasterizes the committed SVG projections (needs rsvg-convert) and,
      # running after the catalogue step, guarantees the PNG mtimes postdate
      # their SVGs; the check then pins them as current.
      - name: Install the SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Rasterize the manuscript figures and check them
        run: |
          uv run python scripts/build_manuscript_figures.py
          uv run python scripts/build_manuscript_figures.py --check
      # The shipped artifact is a 350-page PDF, and the defects that reached it
      # -- 162 dropped glyphs, one false printed theorem, a diagram shipped as
      # its own source, chapters the render predated -- are all invisible to
      # the shared template's success test. `scripts/check_render_log.py` is
      # the acceptance that catches them. The `render` job in this workflow
      # produces the real render and re-runs the acceptance; this step
      # verifies the committed receipt over exactly these sources, so a
      # chapter edited without a fresh render fails here too.
      - name: Require the shipped render to have passed the acceptance
        run: uv run python scripts/check_render_log.py --verify-receipt
      - run: uv run pytest tests/ -q -n auto --dist loadgroup --cov=src --cov-report=xml --cov-fail-under=89 -m "not serial_lean"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - run: uv run python docs/check_links.py --strict --include-root
      - run: uv run python docs/md_hygiene.py --strict
      - name: Require the newest stable Lean-Mathlib release pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python docs/pin_audit.py --check-latest
      - run: uv run python docs/xref_audit.py
      - run: uv run mypy src
      - run: uv run ruff check src tests scripts docs
      - run: uv run ruff format --check src tests scripts docs
      - run: git diff --check

  # The figure assets the render consumes (atlas/dashboard SVG+HTML
  # projections under docs/ and the rasterized PNGs under output/figures/)
  # are pure Python work that needs no Lean output, so they are generated
  # here in parallel with lean and handed to render through an artifact.
  # Runner-local installs (apt, fonts, mermaid CLI, elan/toolchain/Mathlib)
  # cannot cross job boundaries, so they stay in the render job itself.
  render-deps:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install the SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: uv sync --locked --extra dev
      - name: Generate the catalogue publication inputs
        run: |
          # The catalogue figures (status_distribution.png, topics_by_area.png
          # and their seven siblings under output/figures/) are written by
          # write_all_catalogue_figures during `fep-lean catalogue`, and
          # scripts/build_manuscript_figures.py deliberately leaves them to
          # it. Without this step the render-figures artifact ships without
          # the roster pair and the lean job's serial renderer test fails
          # closed on "manuscript asset roster sources are missing".
          uv run fep-lean catalogue
      - name: Generate the publication figure assets
        run: |
          # Same roster the render lane previously generated inline: the
          # atlas/dashboard SVG+HTML projections under docs/, and the
          # rasterized PNGs under output/figures/.
          uv run python scripts/build_formalism_atlas.py
          uv run python scripts/build_formal_kernel_dashboard.py
          uv run python scripts/build_manuscript_figures.py
      - name: Verify the manuscript asset roster before upload
        run: |
          # Reuses the canonical roster (MANUSCRIPT_ASSETS, exactly what
          # render_manuscript fails closed on) instead of a hand-copied list:
          # an artifact containing some files is not proof of full coverage.
          uv run python - <<'PY'
          from pathlib import Path

          from fep_lean.output.rendering import MANUSCRIPT_ASSETS

          root = Path.cwd()
          missing = [
              str(source)
              for source, _destination in MANUSCRIPT_ASSETS.values()
              if not (root / source).is_file()
          ]
          if missing:
              print("manuscript asset roster sources are missing:")
              print("\n".join(missing))
              raise SystemExit(1)
          print(
              "render-figures inventory complete: all"
              f" {len(MANUSCRIPT_ASSETS)} manuscript asset roster sources"
              " present"
          )
          PY
      - name: Upload the publication figure assets
        uses: actions/upload-artifact@v7
        with:
          name: render-figures
          if-no-files-found: error
          path: |
            docs/formalism-atlas.svg
            docs/formalism-atlas.html
            docs/formal-kernel-dashboard.svg
            docs/formal-kernel-dashboard.html
            output/figures/

  # FEP-CI-RENDER: this lane renders end-to-end behind the lean job (the
  # manuscript fails closed without a claim-ready native receipt, and the lean
  # job uploads exactly that one) and validates both fail-closed receipts
  # against the same sources in the same run, so a defect the acceptance
  # exists to catch cannot reach main and manuscript drift cannot survive
  # between local renders.
  render:
    needs: [lean, render-deps]
    # Skipped lean (dispatch run_lean=false) propagates here because the
    # render lane fail-closes without the native receipt the lean job uploads.
    if: >-
      !cancelled()
      && needs.render-deps.result == 'success'
      && needs.lean.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.run_render)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Cache the elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        run: |
          # Pinned elan-init (leanprover/elan@0e36a07b, 2026-08-26); the
          # identifier audit verifies Mathlib citations against the pinned
          # checkout, so the render lane needs the same toolchain the lean
          # job compiles with.
          curl https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: elan toolchain install "$(cat lean/lean-toolchain)"
      - name: Fetch pinned Mathlib cache for the identifier audit
        working-directory: lean
        shell: bash
        run: |
          if ! lake exe cache get; then
            echo "Mathlib cache fetch failed; the identifier audit fails closed without the pinned checkout" >&2
            exit 1
          fi
      - name: Download the native receipt the lean job produced
        uses: actions/download-artifact@v7
        with:
          name: native-formal-evidence
          path: output
      - name: Download the publication figure assets the render-deps job produced
        uses: actions/download-artifact@v7
        with:
          name: render-figures
          path: .
      - name: Check out the shared rendering template at its pinned ref
        uses: actions/checkout@v7
        with:
          # render_publication.py resolves the template through
          # FEP_LEAN_TEMPLATE_DIR and needs scripts/pipeline/stage_03_render.py
          # in it. The template is a separate repository this project does not
          # pin programmatically, so the ref is pinned here instead and must be
          # re-pinned (and the committed render receipts refreshed) after a
          # fresh local render whenever the template moves.
          repository: docxology/template
          ref: 5b3c0f43940f0322fbc6205b3be4c2854f99329d
          path: render-template
      - name: Register this repository as the template's active project
        run: |
          # The template's render stage resolves projects/active/<name>
          # (else projects/working/<name>); that directory is a machine-local
          # symlink in real checkouts and is gitignored in the template, so
          # CI must register this checkout the same way before the render
          # stage runs.
          mkdir -p render-template/projects/active
          ln -s "$GITHUB_WORKSPACE" render-template/projects/active/fep_lean
      - name: Install the XeLaTeX toolchain, pandoc, and the SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern fontconfig librsvg2-bin
          # The apt pandoc trails the pinned release this document renders
          # with; install the pinned upstream build instead.
          curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          rm -f /tmp/pandoc.deb
      - name: Install the two faces the preamble selects
        run: |
          # JuliaMono (the code face; no distribution package) and GNU
          # FreeSerif (the main and Lean-unicode face), at pinned versions,
          # into the user font directory fontconfig resolves under $HOME.
          mkdir -p "$HOME/.fonts"
          curl -fsSL -o /tmp/JuliaMono.tar.gz \
            https://github.com/cormullion/juliamono/releases/download/v0.63.2/JuliaMono-ttf.tar.gz
          tar -xzf /tmp/JuliaMono.tar.gz -C "$HOME/.fonts"
          curl -fsSL -o /tmp/freefont.zip \
            https://ftp.gnu.org/gnu/freefont/freefont-ttf-20120503.zip
          unzip -j /tmp/freefont.zip 'freefont-20120503/FreeSerif*' \
            -d "$HOME/.fonts"
          rm -f /tmp/JuliaMono.tar.gz /tmp/freefont.zip
          fc-cache -f
      - name: Install the mermaid CLI
        run: npm install -g "@mermaid-js/mermaid-cli@11.17.0"
      - run: uv sync --locked --extra dev
      # The glyph projection and the manuscript hydration both read the
      # generated appendix (a gitignored build product), so the catalogue
      # materializes it before anything below runs.
      - run: uv run fep-lean catalogue
      - name: Render the publication and accept it fail-closed
        env:
          FEP_LEAN_TEMPLATE_DIR: ${{ github.workspace }}/render-template
        run: uv run python scripts/render_publication.py
      - name: Validate the fresh render receipts against the same sources
        run: |
          uv run python scripts/build_render_fonts.py
          uv run python scripts/build_render_fonts.py --check
          uv run python scripts/check_render_log.py --verify-receipt


      - name: Stage accepted render evidence with exact source and tool provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path

          from fep_lean.output.evidence import validate_native_lean_receipt
          from fep_lean.output.release_bundle._core import _capture_parent_fd, _capture_regular_file
          from fep_lean.output.render_fonts import declared_fonts
          from fep_lean.output.render_log import receipt_defects, rendered_manuscript_sources
          from fep_lean.output.rendering import MANUSCRIPT_ASSETS
          from fep_lean.verification.formalism_audit import validate_formalism_audit_receipt

          root = Path.cwd().resolve()
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["EXPECTED_SHA"]:
              raise SystemExit("render checkout differs from workflow SHA")
          # Only acceptance outputs may differ from committed bytes. Renderer
          # input drift must never be labeled evidence for the workflow SHA.
          allowed_outputs = {"docs/render-acceptance.json", "docs/render-fonts.json"}

          def validate_evidence():
              if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != sha:
                  raise SystemExit("render checkout changed during evidence staging")
              defects = receipt_defects(root / "docs/render-acceptance.json", root / "manuscript")
              if defects:
                  raise SystemExit("\n".join(defects))
              native = validate_native_lean_receipt(root / "output/native-verification.json", project_root=root)
              if not native["native_claim_ready"]:
                  raise SystemExit("native evidence is not claim-ready at the render sources")
              audit_errors = validate_formalism_audit_receipt(root / "output/formalism-audit.json", root)
              if audit_errors:
                  raise SystemExit("\n".join(audit_errors))
              changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD", "-z"]).decode().split("\0")
              if set(changed) - allowed_outputs - {""}:
                  raise SystemExit("tracked render inputs changed during acceptance")

          files = [
              "output/pdf/fep_lean_combined.pdf",
              "output/pdf/_combined_manuscript.tex",
              "output/pdf/_combined_manuscript.md",
              "output/pdf/_combined_manuscript.log",
              "output/pdf/_latex_stdout.log",
              "output/native-verification.json",
              "output/formalism-audit.json",
              "docs/render-acceptance.json",
              "docs/render-fonts.json",
          ]
          def artifact_bytes():
              result = {}
              for name in files:
                  path = root / name
                  if not path.is_file() or not path.stat().st_size:
                      raise SystemExit(f"accepted render evidence is missing: {name}")
                  result[name] = _capture_regular_file(path)
              return result

          accepted_bytes = artifact_bytes()
          if not accepted_bytes[files[0]].startswith(b"%PDF-"):
              raise SystemExit("accepted render PDF has no PDF signature")

          tracked = set(filter(None, subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "-z", "HEAD"]).decode().split("\0")))
          generated = {"manuscript/manuscript_vars.yaml", "manuscript/09z_unified_formalism_catalogue.md"}
          source_names = tracked - allowed_outputs
          source_names.update({"manuscript/manuscript_vars.yaml", "manuscript/09z_unified_formalism_catalogue.md"})
          source_names.update(source.as_posix() for source, _destination in MANUSCRIPT_ASSETS.values())
          def source_manifest():
              for path in (*rendered_manuscript_sources(root / "manuscript"), root / "manuscript/preamble.md"):
                  name = path.relative_to(root).as_posix()
                  if name not in tracked and name not in generated:
                      raise SystemExit(f"authored manuscript source is not tracked at workflow SHA: {name}")
              result = {}
              for name in sorted(source_names):
                  path = root / name
                  if not path.is_file() or path.is_symlink():
                      raise SystemExit(f"source manifest input is absent or a symlink: {name}")
                  result[name] = hashlib.sha256(_capture_regular_file(path)).hexdigest()
              # Membership is rechecked after reading the last named input.
              for path in (*rendered_manuscript_sources(root / "manuscript"), root / "manuscript/preamble.md"):
                  name = path.relative_to(root).as_posix()
                  if name not in tracked and name not in generated:
                      raise SystemExit(f"authored manuscript source is not tracked at workflow SHA: {name}")
              return result

          sources = source_manifest()
          template = root / "render-template"
          template_sha = subprocess.check_output(["git", "-C", str(template), "rev-parse", "HEAD"], text=True).strip()

          def template_file_identity(value):
              return (value.st_dev, value.st_ino, value.st_mode, value.st_size, value.st_mtime_ns, value.st_ctime_ns)

          def template_manifest():
              if subprocess.check_output(["git", "-C", str(template), "rev-parse", "HEAD"], text=True).strip() != template_sha:
                  raise SystemExit("template checkout changed during evidence staging")
              changed = subprocess.check_output(["git", "-C", str(template), "diff", "--name-only", "HEAD", "-z"])
              untracked = subprocess.check_output(["git", "-C", str(template), "ls-files", "--others", "--exclude-standard", "-z"])
              if changed or untracked:
                  raise SystemExit("template authored inputs differ from its recorded commit")
              object_format = subprocess.check_output(["git", "-C", str(template), "rev-parse", "--show-object-format"], text=True).strip()
              if object_format not in {"sha1", "sha256"}:
                  raise SystemExit("unsupported template Git object format")
              tree = subprocess.check_output(["git", "-C", str(template), "ls-tree", "-r", "-z", "HEAD"])
              entries = {}
              for raw_entry in filter(None, tree.split(b"\0")):
                  header, raw_name = raw_entry.split(b"\t", 1)
                  mode, kind, oid = header.decode("ascii").split()
                  name = os.fsdecode(raw_name)
                  relative = Path(name)
                  if relative.is_absolute() or any(part in {".", ".."} for part in relative.parts):
                      raise SystemExit("unsafe template tree path")
                  path = template / relative
                  entry = {"mode": mode, "type": kind, "git_oid": oid}
                  if (mode, kind) in {("100644", "blob"), ("100755", "blob")}:
                      parent_fd = _capture_parent_fd(path)
                      try:
                          before = os.stat(path.name, dir_fd=parent_fd, follow_symlinks=False)
                          if not stat.S_ISREG(before.st_mode) or bool(before.st_mode & stat.S_IXUSR) != (mode == "100755"):
                              raise SystemExit(f"template regular-file mode differs from its Git tree: {name}")
                          data = _capture_regular_file(path)
                          after = os.stat(path.name, dir_fd=parent_fd, follow_symlinks=False)
                          if template_file_identity(before) != template_file_identity(after):
                              raise SystemExit(f"template regular file changed while reading: {name}")
                      finally:
                          os.close(parent_fd)
                  elif (mode, kind) == ("120000", "blob"):
                      parent_fd = _capture_parent_fd(path)
                      try:
                          before = os.stat(path.name, dir_fd=parent_fd, follow_symlinks=False)
                          if not stat.S_ISLNK(before.st_mode):
                              raise SystemExit(f"template symlink was replaced: {name}")
                          data = os.readlink(os.fsencode(path.name), dir_fd=parent_fd)
                          after = os.stat(path.name, dir_fd=parent_fd, follow_symlinks=False)
                          if template_file_identity(before) != template_file_identity(after):
                              raise SystemExit(f"template symlink changed while reading: {name}")
                      finally:
                          os.close(parent_fd)
                      entry["target_hex"] = data.hex()
                  elif (mode, kind) == ("160000", "commit"):
                      parent_fd = _capture_parent_fd(path)
                      directory_fd = None
                      try:
                          before = os.stat(path.name, dir_fd=parent_fd, follow_symlinks=False)
                          if not stat.S_ISDIR(before.st_mode):
                              raise SystemExit(f"template gitlink was replaced: {name}")
                          directory_fd = os.open(path.name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent_fd)
                          opened = os.fstat(directory_fd)
                          if (before.st_dev, before.st_ino) != (opened.st_dev, opened.st_ino) or os.listdir(directory_fd):
                              raise SystemExit(f"template gitlink has unbound checkout content: {name}")
                          after = os.stat(path.name, dir_fd=parent_fd, follow_symlinks=False)
                          if template_file_identity(before) != template_file_identity(after):
                              raise SystemExit(f"template gitlink changed while reading: {name}")
                          entry["checkout_state"] = "uninitialized-empty"
                      finally:
                          if directory_fd is not None:
                              os.close(directory_fd)
                          os.close(parent_fd)
                      entries[name] = entry
                      continue
                  else:
                      raise SystemExit(f"unsupported template tree mode/type: {mode} {kind} {name}")
                  blob = b"blob " + str(len(data)).encode("ascii") + b"\0" + data
                  if hashlib.new(object_format, blob).hexdigest() != oid:
                      raise SystemExit(f"template captured bytes differ from its recorded Git object: {name}")
                  entry["sha256"] = hashlib.sha256(data).hexdigest()
                  entries[name] = entry
              return entries

          template_tree = template_manifest()
          template_sources = {name: entry["sha256"] for name, entry in template_tree.items() if entry["mode"] in {"100644", "100755"}}
          validate_evidence()
          versions = {}
          for command in ("xelatex", "pandoc", "rsvg-convert", "mmdc"):
              versions[command] = subprocess.check_output([command, "--version"], text=True, timeout=30).strip()
          fonts = {}
          font_files = {}
          for role, family in declared_fonts(root / "manuscript/preamble.md").items():
              names = subprocess.check_output(["fc-match", "--format=%{file}\n", family], text=True, timeout=30).splitlines()
              if not names or not Path(names[0]).is_file():
                  raise SystemExit(f"selected font is absent: {family}")
              font = Path(names[0])
              font_files[role] = font.resolve()
              fonts[role] = {"family": family, "file": font.name, "sha256": hashlib.sha256(_capture_regular_file(font_files[role])).hexdigest()}
          provenance = {
              "schema_version": 1, "commit": sha,
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "template_commit": template_sha, "template_sources": template_sources, "template_tree": template_tree,
              "python": sys.version, "tools": versions, "fonts": fonts,
          }
          def require_stable_snapshot():
              try:
                  stable = source_manifest() == sources and artifact_bytes() == accepted_bytes and template_manifest() == template_tree and all(hashlib.sha256(_capture_regular_file(path)).hexdigest() == fonts[role]["sha256"] for role, path in font_files.items())
              except SystemExit as error:
                  raise SystemExit(f"inputs changed during evidence staging: {error}") from error
              if not stable:
                  raise SystemExit("inputs or accepted outputs changed during evidence staging")

          # Version/font discovery is executable work. Neither it nor receipt
          # validation may change the source/output snapshot being retained.
          require_stable_snapshot()
          validate_evidence()
          require_stable_snapshot()
          staging = root / "output/render-evidence"
          staging.mkdir(parents=True, exist_ok=False)
          try:
              retained = {
                  **accepted_bytes,
                  "renderer-provenance.json": (json.dumps(provenance, indent=2, sort_keys=True) + "\n").encode(),
                  "source-manifest.json": (json.dumps({"schema_version": 1, "commit": sha, "sources": sources}, indent=2, sort_keys=True) + "\n").encode(),
              }
              for name, data in retained.items():
                  destination = staging / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
              require_stable_snapshot()
              validate_evidence()
              require_stable_snapshot()
              artifacts = {name: hashlib.sha256(data).hexdigest() for name, data in retained.items()}
              retained["artifact-manifest.json"] = (json.dumps({"schema_version": 1, "commit": sha, "files": artifacts}, indent=2, sort_keys=True) + "\n").encode()
              (staging / "artifact-manifest.json").write_bytes(retained["artifact-manifest.json"])
              require_stable_snapshot()
              actual = set()
              for path in staging.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit("retained artifact changed during evidence staging")
                  if path.is_file():
                      actual.add(path.relative_to(staging).as_posix())
              if actual != set(retained) or any(_capture_regular_file(staging / name) != data for name, data in retained.items()):
                  raise SystemExit("retained artifact changed during evidence staging")
              require_stable_snapshot()
              validate_evidence()
              require_stable_snapshot()
          except BaseException:
              # A rejected partial snapshot must not become an accepted upload.
              import shutil
              shutil.rmtree(staging)
              raise
          PY
      - name: Retain the accepted render and its source-bound evidence
        uses: actions/upload-artifact@v7
        with:
          name: accepted-render-${{ github.sha }}-${{ github.run_attempt }}
          path: output/render-evidence/
          if-no-files-found: error
          retention-days: 90

  lean:
    runs-on: ubuntu-latest
    needs: [changes, render-deps]
    # Pure documentation PRs stop at the read-only documentation lane.
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_lean)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Cache the elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        shell: bash
        run: |
          # Pinned elan-init (leanprover/elan@0e36a07b, 2026-08-26); the
          # unpinned master script is remote code executed on every lean run.
          curl https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: elan toolchain install "$(cat lean/lean-toolchain)"
      - name: Install Python package
        run: uv sync --locked --extra dev
      # Only the aggregate's build directory: .lake/packages is materialized
      # fresh by the Mathlib cache fetch below and must not be cached with it.
      #
      # The key is the stable pin-derived prefix plus a per-commit suffix: any
      # newer cache converges via the restore-keys prefix, while the exact
      # commit suffix keys the save. Content hashes of sources are
      # deliberately NOT in the key (the old fep_all.lean term is gone) --
      # any source change would bust the whole incremental cache; lake's own
      # content-hashed trace rebuilds changed leaves, so a restored stale
      # cache cannot mask source drift. The cache holds compiled build
      # outputs only, never custody receipts (output/ artifacts, seal state),
      # which are regenerated unconditionally each run.
      - name: Restore the Lean build cache
        id: lean-build-restore
        if: github.event_name != 'workflow_dispatch' || inputs.use_lean_cache == true
        uses: actions/cache/restore@v6
        with:
          path: lean/.lake/build
          key: lean-build-v2-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-build-v2-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean', 'lean/lake-manifest.json') }}-
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          # Fail closed, like the render lane: a cache miss forces a full
          # from-source Mathlib rebuild that cannot complete inside the
          # 180-minute budget, so tolerating the miss only converts a clear
          # failure into a masked timeout.
          if ! lake exe cache get; then
            echo "Mathlib cache is not published for this toolchain yet; failing closed" >&2
            exit 1
          fi
      - name: Compile warning-free aggregate
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          build_log="$(mktemp)"
          lake build FepSketches 2>&1 | tee "$build_log"
          if grep -F "warning:" "$build_log"; then
            echo "Lean aggregate emitted warnings"
            exit 1
          fi
      - name: Compile orphaned formal modules
        run: |
          # b5e6a9d reached main with a broken orphaned formal module while
          # the lean job never evaluated the tip (the runs at the adjacent
          # commits were cancelled), and no CI step compiles the canonical
          # src/fep_lean/formal/*.lean bytes: lake builds only the
          # lean/FepSketches/ projections, and the serial_lean probes below
          # compile a topic-driven subset. This gate enumerates the formal
          # modules outside fep_all's import closure and recompiles their
          # canonical sources from scratch (no incremental build state), so
          # an import-narrowing break in an orphan (the b85cfe0 fix class)
          # fails closed here.
          uv run python docs/check_orphan_compiles.py
      # The serial_lean lane never runs in the python job (-m "not
      # serial_lean"), so it runs here on the already-warm environment: the
      # aggregate build above leaves lean/.lake fully populated (Mathlib
      # cache + built FepSketches modules), which is exactly what these
      # compile probes read. The gates below un-skip the opt-in compile
      # tests (catalogue, slice04, slice05) that would otherwise silently
      # skip; FEP_HEAVY_LEAN_PROBES stays off by design. No coverage here:
      # the 89% gate stays with the python job.
      - name: Download the publication figure assets the render-deps job produced
        uses: actions/download-artifact@v7
        with:
          name: render-figures
          path: .
      - name: Run the serial_lean acceptance lane
        env:
          FEP_LEAN_CATALOGUE_COMPILE_TEST: "1"
          FEP_LEAN_SLICE04_COMPILE_TEST: "1"
          FEP_LEAN_SLICE05_COMPILE_TEST: "1"
        run: uv run pytest tests/ -q -m serial_lean -n 1 --no-cov
      - name: Verify exact sealed-roster native receipt
        run: |
          uv run fep-lean verify \
            --fail-on-warnings \
            --receipt output/native-verification.json
          uv run python - <<'PY'
          from pathlib import Path
          from fep_lean.output import validate_native_lean_receipt

          result = validate_native_lean_receipt(
              Path("output/native-verification.json"),
              project_root=Path.cwd(),
          )
          print(result)
          raise SystemExit(0 if result["native_claim_ready"] else 1)
          PY
      # render_manuscript.py --check verifies the manuscript's Mathlib
      # citations against the pinned Mathlib checkout and fails closed when
      # it is absent, so it can only run in this job, after the cache fetch
      # has materialized lean/.lake/packages/mathlib — and after the receipt
      # step above, because its strict-default SC-19 gate fail-closes when
      # the claim-ready native receipt does not exist yet in a fresh
      # checkout (output/ is gitignored; the verify step writes it).
      - name: Verify the publication render path against the pinned Mathlib
        run: |
          uv run fep-lean catalogue
          uv run python scripts/render_manuscript.py --check
      - name: Audit formal declarations and axioms
        run: |
          uv run python scripts/audit_formalisms.py \
            --receipt output/formalism-audit.json
          uv run python - <<'PY'
          from pathlib import Path
          from fep_lean.verification.formalism_audit import (
              validate_formalism_audit_receipt,
          )

          root = Path.cwd()
          errors = validate_formalism_audit_receipt(
              root / "output/formalism-audit.json",
              root,
          )
          print({"valid": not errors, "errors": errors})
          raise SystemExit(0 if not errors else 1)
          PY
      # Refresh-save after every step that may write lean/.lake/build: it
      # converges the cache to the current leaves so the next run restores
      # near-fresh bytes. The always() saves partial-but-valid incremental
      # state on failures (lake traces only completed modules) without ever
      # saving custody artifacts; same-sha reruns hit "cache already exists",
      # which is a no-op, not a failure.
      - name: Save the Lean build cache
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.use_lean_cache == true)
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: lean/.lake/build
          key: lean-build-v2-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean', 'lean/lake-manifest.json') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-formal-evidence
          if-no-files-found: warn
          path: |
            output/native-verification.json
            output/formalism-audit.json
