name: Lean latest stable

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Require the newest stable Lean-Mathlib release pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 docs/pin_audit.py --check-latest
      # This scheduled run is the only early warning that a new stable
      # Lean/Mathlib pair exists (the push-triggered ci.yml gate only catches
      # a pin that was already stale at push time). Without a consumer its
      # failures are silent, so it opens one deduplicated tracking issue.
      - name: Open an issue when the scheduled pin audit fails
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "[lean-pin-audit]";
            const title = `${marker} Lean/Mathlib pin is no longer the newest stable pair`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (issues.some((issue) => issue.title.startsWith(marker))) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The scheduled \`docs/pin_audit.py --check-latest\` run failed: a newer stable Lean/Mathlib pair exists than the pinned \`lean/lean-toolchain\`. See ${runUrl}.\n\nScope the upgrade as a native-evidence refresh before bumping (see the \`FEP-LEAN-UPGRADE\` row in TODO.md).`,
            });
